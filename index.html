.pbox{flex:none;align-self:flex-end;width:58px;height:92px;margin-left:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:color-mix(in srgb,var(--c) 10%,var(--spine));border:1.25px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:3px;text-decoration:none;color:var(--ink);text-align:center;font-family:var(--f-ui);font-size:11px;line-height:1.3}
.pbox b{font-family:var(--f-display);font-size:22px;font-weight:900;color:var(--c)}
.pbox:hover{border-color:var(--ink)}
.bookend{flex:none;position:relative;width:9px;height:118px;margin-left:10px;background:var(--wood-2);border-radius:2px 2px 0 0}
.bookend::after{content:"";position:absolute;right:0;bottom:0;width:40px;height:5px;background:var(--wood-2)}
.bay.niche{flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:38px;background:radial-gradient(90% 90% at 50% -10%,var(--bay-hi) 0%,transparent 70%),color-mix(in srgb,var(--bay-bg) 92%,#000)}
.addbook{width:40px;height:176px;box-sizing:border-box;border:1.5px dashed var(--ink-3);border-radius:2px 2px 0 0;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;background:transparent;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.3em;color:var(--ink-2);cursor:pointer}
.addbook:hover{border-color:var(--ink);color:var(--ink)}
.bay.niche .meta{text-align:center;font-size:11.5px;line-height:1.4}
/* ===== 书架：英语一层（片盒、绘本、生词本） ===== */
.en-bay .bay-row{flex:1;gap:6px}
.fcase{position:relative;flex:none;box-sizing:border-box;width:46px;padding:14px 0 0 7px;border:0;border-radius:3px 3px 0 0;writing-mode:vertical-rl;display:flex;align-items:center;gap:9px;cursor:pointer;font:inherit;
  background:linear-gradient(90deg,rgba(255,255,255,.12) 0,rgba(255,255,255,0) 28%,rgba(0,0,0,.2) 100%),var(--case);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 10px 14px -10px rgba(36,33,30,.6);transition:transform .15s}
.fcase::before{content:"";position:absolute;left:3px;top:12px;bottom:10px;width:4px;background:repeating-linear-gradient(to bottom,var(--case-hole) 0 4px,transparent 4px 9px)}
.fcase::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c);border-radius:3px 3px 0 0}
.fcase:hover{transform:translateY(-4px)}
.fcase:focus-visible,.pbook:focus-visible,.vbox:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.fcase.dim,.pbook.dim{opacity:.28}
.fc-type{writing-mode:horizontal-tb;flex:none;font-family:var(--f-ui);font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--c)}
.fc-t{flex:none;white-space:nowrap;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;line-height:1.2;color:var(--case-ink)}
.fc-foot{writing-mode:horizontal-tb;margin-top:auto;margin-bottom:9px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;color:var(--case-ink-2)}
.fc-src{padding:1px 3px;border:1px solid currentColor;border-radius:2px;font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.02em;color:var(--case-ink-2)}
.fc-src.baba{color:var(--c)}
.fcase .sp-seal{margin:0 0 2px}
.fc-prog{position:absolute;right:4px;top:12px;bottom:10px;width:3px;border-radius:2px;background:linear-gradient(to top,var(--c) var(--p),rgba(242,234,214,.16) var(--p))}
.fcase.doing{transform:translateY(-18px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 14px 18px -12px rgba(36,33,30,.6)}
.fcase.doing:hover{transform:translateY(-22px)}
.fcase.done{box-shadow:inset 0 0 0 2px var(--c),0 10px 14px -10px rgba(36,33,30,.6)}
.fcase.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-14px)}
.fcase.doing.picked{transform:translateY(-24px)}
.fcase .sp-rib{left:55%;bottom:-30px;height:32px}
.pbook{position:relative;flex:none;align-self:flex-end;box-sizing:border-box;width:136px;height:172px;padding:16px 12px 11px 20px;border:0;border-radius:2px 6px 6px 2px;display:flex;flex-direction:column;cursor:pointer;font:inherit;text-align:left;color:#FFF6E2;
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0 7px,rgba(255,255,255,.14) 7px 9px,transparent 9px),radial-gradient(120% 80% at 70% 0%,rgba(255,255,255,.12),transparent 60%),var(--pk-cover);box-shadow:0 14px 18px -12px rgba(36,33,30,.65);transition:transform .15s}
.pbook:hover{transform:translateY(-4px)}
.pbook.doing{transform:translateY(-14px)}
.pbook.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-12px)}
.pk-sky{position:absolute;right:12px;top:12px;width:44px;height:30px}
.pk-sky i{position:absolute;border-radius:50%;background:#F4E3A8}
.pk-sky i:nth-child(1){right:0;top:0;width:18px;height:18px;box-shadow:inset -6px -2px 0 0 var(--pk-cover)}
.pk-sky i:nth-child(2){left:6px;top:4px;width:3px;height:3px}
.pk-sky i:nth-child(3){left:20px;top:20px;width:2px;height:2px}
.pk-type{font-family:var(--f-ui);font-size:10px;letter-spacing:.1em;opacity:.78}
.pk-en{margin-top:20px;font-family:var(--f-num);font-size:16px;font-weight:700;line-height:1.15}
.pk-t{margin-top:7px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.08em}
.pk-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,246,226,.78)}
.pk-foot .sp-seal{margin:0;width:22px;height:22px;font-size:12px}
.pbook .fc-src.baba{color:#F2B54A}
.pbook .sp-rib{left:auto;right:18px;bottom:-30px;height:32px}
.vbox{position:relative;flex:none;align-self:flex-end;width:96px;height:96px;margin-left:auto;text-decoration:none;color:var(--ink)}
.vb-cards i{position:absolute;bottom:44px;width:62px;height:40px;background:var(--card);border:1px solid var(--card-line);border-radius:2px;box-shadow:0 2px 3px -2px rgba(0,0,0,.3)}
.vb-cards i::before{content:"";position:absolute;left:7px;right:14px;top:9px;height:2px;background:var(--c);opacity:.7}
.vb-cards i:nth-child(1){left:10px;transform:rotate(-7deg)}
.vb-cards i:nth-child(2){left:20px;bottom:48px;transform:rotate(3deg)}
.vb-cards i:nth-child(3){left:26px;transform:rotate(9deg)}
.vb-body{position:absolute;left:0;right:0;bottom:0;height:54px;box-sizing:border-box;padding-top:9px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(90deg,#8D6A42 0,#A88052 50%,#8A6740 100%);border-radius:3px 3px 0 0;box-shadow:inset 0 0 0 1px rgba(60,40,15,.4),0 10px 14px -10px rgba(36,33,30,.6)}
.vb-body b{padding:1px 8px;background:#F4EAD0;border:1px solid #A8956A;font-family:var(--f-display);font-size:12.5px;letter-spacing:.12em;color:#24211E}
.vb-body small{font-family:var(--f-ui);font-size:10.5px;font-weight:700;color:#FBE6BC}
.vbox:hover .vb-cards i:nth-child(2){transform:translateY(-6px) rotate(3deg)}
.vb-cards i{transition:transform .15s}
.lg-f{position:relative;display:inline-block;width:18px;height:40px;background:var(--case);border-radius:2px 2px 0 0;box-shadow:inset 0 4px 0 var(--ln-en)}
.lg-f::before{content:"";position:absolute;left:2px;top:7px;bottom:4px;width:3px;background:repeating-linear-gradient(to bottom,var(--case-hole) 0 3px,transparent 3px 6px)}
.pb-en{margin:2px 0 0;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--ink-2)}
.pb-sub{margin:0 0 6px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.en-segs .fe-s + .fe-s{border-left:1px solid rgba(36,33,30,.08)}
/* ===== 书架：原木书墙 + 展台 ===== */
.wallv{--foil:#F0E2BE;--foil-line:rgba(240,226,190,.65);
  --shade:linear-gradient(90deg,rgba(0,0,0,.24) 0,rgba(0,0,0,0) 16%,rgba(255,255,255,.13) 42%,rgba(255,255,255,0) 64%,rgba(0,0,0,.2) 100%);
  --cloth-tx:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);
  --oak:repeating-linear-gradient(0deg,rgba(110,78,40,.07) 0 1px,transparent 1px 5px),linear-gradient(var(--oak-hi) 0,var(--oak-hi) 2px,var(--oak-1) 3px,var(--oak-2) 100%);
  --oak-v:repeating-linear-gradient(90deg,rgba(110,78,40,.08) 0 1px,transparent 1px 6px),linear-gradient(90deg,var(--oak-2),var(--oak-1) 50%,var(--oak-2));
  --linen-bg:repeating-linear-gradient(0deg,var(--linen-tx) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,var(--linen-tx) 0 1px,transparent 1px 3px);
  --rattan:repeating-linear-gradient(90deg,rgba(90,60,25,.28) 0 2px,transparent 2px 7px),repeating-linear-gradient(0deg,var(--rattan-1) 0 4px,var(--rattan-2) 4px 8px)}
.wallv .phead{margin-bottom:22px}
.hang{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-radius:24px;background:var(--leaf);border:1px solid var(--rule)}
.hang-h{padding:0 8px 0 10px;font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.hang-b{min-height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:0;border-radius:18px;background:transparent;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2);cursor:pointer}
.hang-b:hover{color:var(--ink)}
.hang-b[aria-checked="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.hang-b:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.hg{display:inline-block;width:18px;height:14px;box-sizing:border-box}
.hg-float{background:linear-gradient(currentColor,currentColor) 0 9px/100% 3px no-repeat}
.hg-peg{background:linear-gradient(currentColor,currentColor) 1px 0/3px 100% no-repeat,linear-gradient(currentColor,currentColor) 14px 0/3px 100% no-repeat,linear-gradient(currentColor,currentColor) 0 7px/100% 3px no-repeat}
.hg-rope{background:linear-gradient(currentColor,currentColor) 3px 0/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) 13px 0/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) 0 9px/100% 3px no-repeat}
.hg-niche{border:2px solid currentColor;border-bottom-width:3px;border-radius:9px 9px 1px 1px}
/* 书架页：一行工具条 + 书墙 | 展台 */
.w-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin:0 0 20px}
.w-head h1{margin:0;font-size:34px;letter-spacing:.1em;line-height:1.1}
.w-head .shelf-seg{margin-top:0}
.w-tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 14px}
.w-tools .chips{margin:0}
.w-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.w-left{min-width:0}
.wallv .wall{margin-top:0;border-radius:8px}
/* 展台：书墙右边一栏，滚动时停在屏幕上 */
.dais-col{position:sticky;top:78px;max-height:calc(100vh - 94px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;
  background:var(--leaf);border:1px solid var(--rule);border-radius:16px;box-shadow:0 24px 40px -30px rgba(36,33,30,.5)}
.dais{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:16px;padding:18px 16px 0;border-radius:15px 15px 0 0;
  background:radial-gradient(60% 80% at 50% 0%,var(--dais-light),transparent 72%),var(--linen-bg),var(--dais-bg)}
.stg-mid{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;margin-bottom:-6px}
.stg-scale{width:84px;height:118px}
.stg-zoom{width:250px;height:350px;transform:scale(.336);transform-origin:0 0}
.stg-stand{display:block;width:94px;height:7px;margin-top:-3px;background:var(--oak);border-radius:2px}
.stg-top{display:block;flex:1 0 100%;height:12px;margin:0 -16px;background:var(--oak);box-shadow:0 10px 12px -8px rgba(40,28,14,.5)}
.dais-col > .pulled{background:transparent;border:0;border-radius:0;box-shadow:none;padding:16px 18px 18px;gap:14px}
.dz-id{position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0 0 14px}

.dz-id .meta{font-size:12.5px;line-height:1.5}

.pb-acts .btn{min-height:36px;box-sizing:border-box}

.pb-more-in{display:flex;flex-direction:column;gap:14px;margin-top:10px}

.pb-links{margin:0;font-size:13px}
.eb-file{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.eb-file .eb-meta{flex:1 1 100%;overflow-wrap:anywhere}
.eb-file .eb-tools{gap:6px 14px}
label.linkbtn.eb-up{position:relative}
.prog .fe-block.sm{height:22px;border-top-width:3px;border-bottom-width:3px}
.fe-rib.sm{top:-5px;height:38px}
.stg-cover{position:relative;width:250px;height:350px;box-sizing:border-box;padding:28px 22px 22px 32px;border-radius:3px 8px 8px 3px;display:flex;flex-direction:column;gap:10px;color:var(--foil);
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0 10px,rgba(255,255,255,.15) 10px 13px,transparent 13px),radial-gradient(90% 60% at 60% 10%,rgba(255,255,255,.18),transparent 70%),var(--cloth-tx),var(--cl);
  box-shadow:0 40px 50px -26px rgba(40,28,14,.6),0 2px 3px rgba(0,0,0,.15);transform:perspective(900px) rotateX(5deg)}
.stg-cover.light{color:#2B2620}
.stg-cover[style*="--tx"]{color:var(--tx)}
.sc-rule{display:block;flex:none;height:4px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.55}
.sc-t{margin-top:16px;font-family:var(--f-display);font-weight:900;letter-spacing:.06em;line-height:1.22;overflow-wrap:anywhere}
.sc-t small{display:block;margin-top:8px;font-size:14px;font-weight:600;letter-spacing:.04em;line-height:1.4}
.sc-by{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.08em;opacity:.9}
.sc-foot{margin-top:auto;font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;opacity:.8}
.sc-kind{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.85}
.sc-en{font-family:var(--f-num);font-size:16px;font-weight:600;line-height:1.2}
.stg-cover.film{padding-left:30px}
.sc-holes{position:absolute;left:12px;top:14px;bottom:14px;width:5px;background:repeating-linear-gradient(to bottom,rgba(240,226,190,.32) 0 5px,transparent 5px 11px)}
.stg-cover.pic{--cl:#2C4170;color:#FFF6E2;padding-top:44px}
.stg-cover.pic .sc-t{margin-top:4px;font-size:18px}
.stg-box{position:relative;width:132px;height:300px;box-sizing:border-box;padding:26px 12px 0;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#A9844C 0,#C9A367 9%,#D3B077 50%,#C59E62 91%,#A27D46 100%);box-shadow:0 30px 40px -24px rgba(40,28,14,.6)}
.stg-box::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--c);border-radius:3px 3px 0 0}
.sb-label{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 6px 14px;background:#F7F1E2;border:1px solid #B79A63;color:#24211E;text-align:center}
.sb-no{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c)}
.sb-label b{writing-mode:vertical-rl;font-family:var(--f-display);font-size:18px;letter-spacing:.12em}
.sb-label > span:last-child{font-family:var(--f-ui);font-size:11px;color:#6E675E}
.sb-hole{position:absolute;left:50%;bottom:22px;margin-left:-9px;width:18px;height:18px;border-radius:50%;background:#3A2E22;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
@keyframes daisflip{from{transform:perspective(900px) rotateY(-80deg) translateY(40px);opacity:.25}to{transform:perspective(900px) rotateX(5deg);opacity:1}}
@keyframes daisrise{from{transform:translateY(60px);opacity:.2}to{transform:none;opacity:1}}
.stg-cover.flip{animation:daisflip .6s cubic-bezier(.2,.8,.2,1)}
.stg-box.flip{animation:daisrise .5s cubic-bezier(.2,.8,.2,1)}
/* 书墙 */
.wall{position:relative;display:flex;flex-direction:column;gap:46px;padding:46px 16px 30px;border-radius:0 0 8px 8px;
  background:radial-gradient(70% 40% at 50% 0%,var(--wall-light),transparent 70%),var(--linen-bg),var(--linen);box-shadow:inset 0 14px 16px -12px rgba(60,40,20,.35)}
.wall-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:52px 18px}
.wall.measuring .wall-row{flex-wrap:nowrap}
.wall.measuring .wm{flex:none;width:max-content}
.wm{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.wm-in{position:relative;z-index:3;display:flex;align-items:flex-end;gap:3px;min-height:250px;padding:40px 14px 0}
.wm-fill{flex:1 1 0;min-width:10px}
.wm-board{position:relative;z-index:2;display:flex;align-items:center;gap:12px;box-sizing:border-box;height:20px;padding:0 10px 0 16px;background:var(--oak);border-radius:2px;box-shadow:0 14px 16px -10px rgba(40,28,14,.45),0 2px 0 rgba(110,78,40,.25)}
.wm-lab{position:relative;min-width:0;display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:11px;letter-spacing:.04em;color:var(--oak-ink);white-space:nowrap;text-decoration:none}
.wm-lab b{font-family:var(--f-mono);font-weight:600}
a.wm-lab:hover{text-decoration:underline}
.wm-dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.wm.ghost .wm-in{align-items:center;justify-content:center;padding:20px;border:1.5px dashed var(--ghost-line);border-bottom:0;border-radius:6px 6px 0 0}
.wm.ghost .wm-board{background:transparent;box-shadow:none;border-top:1.5px dashed var(--ghost-line)}
.wm-add{min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 20px;border-radius:22px;border:1px solid var(--ghost-line);background:var(--leaf);font:inherit;font-family:var(--f-ui);font-size:14px;color:var(--ink-2);cursor:pointer}
.wm-add small{font-size:12px;color:var(--ink-3)}
.wm-add:hover{color:var(--ink);border-color:var(--ink-3)}
/* 挂法：木钉立柱 */
.hang-peg .wm:not(.ghost)::before,.hang-peg .wm:not(.ghost)::after{content:"";position:absolute;z-index:1;top:4px;bottom:-14px;width:16px;border-radius:8px;
  background:radial-gradient(circle,rgba(70,48,22,.5) 0 3px,transparent 3.5px) center 14px/16px 34px repeat-y,var(--oak-v);box-shadow:3px 0 6px -2px rgba(40,28,14,.35)}
.hang-peg .wm::before{left:-2px}.hang-peg .wm::after{right:-2px}
.hang-peg .wm:not(.ghost) .wm-in{padding-left:22px;padding-right:22px}
.hang-peg .wm:not(.ghost) .wm-board{margin:0 -8px}
.hang-peg .wm:not(.ghost) .wm-board::before,.hang-peg .wm:not(.ghost) .wm-board::after{content:"";position:absolute;top:100%;width:16px;height:9px;border-radius:0 0 8px 8px;background:#B08A55;box-shadow:0 3px 3px -1px rgba(40,28,14,.4)}
.hang-peg .wm-board::before{left:6px}.hang-peg .wm-board::after{right:6px}
/* 挂法：麻绳吊板 */
.hang-rope .wm:not(.ghost)::before,.hang-rope .wm:not(.ghost)::after{content:"";position:absolute;z-index:4;top:-34px;bottom:4px;width:6px;border-radius:3px;background:repeating-linear-gradient(160deg,var(--rope-1) 0 3px,var(--rope-2) 3px 6px)}
.hang-rope .wm::before{left:12px}.hang-rope .wm::after{right:12px}
.hang-rope .wm:not(.ghost) .wm-in::before,.hang-rope .wm:not(.ghost) .wm-in::after{content:"";position:absolute;top:-44px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2C99A,#A8844E);box-shadow:0 3px 4px rgba(40,28,14,.35)}
.hang-rope .wm-in::before{left:5px}.hang-rope .wm-in::after{right:5px}
.hang-rope .wm:not(.ghost) .wm-in{padding-left:26px;padding-right:26px}
.hang-rope .wm:not(.ghost) .wm-board::before,.hang-rope .wm:not(.ghost) .wm-board::after{content:"";position:absolute;z-index:5;top:100%;width:14px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#D5BC8C,#9E7F4C)}
.hang-rope .wm-board::before{left:8px}.hang-rope .wm-board::after{right:8px}
/* 挂法：拱形书龛 */
.hang-niche .wm:not(.ghost)::before{content:"";position:absolute;z-index:1;left:0;right:0;top:-6px;bottom:16px;border-radius:50% 50% 4px 4px/46px 46px 4px 4px;
  background:radial-gradient(60% 40% at 50% 0%,rgba(255,250,236,.3),transparent 70%),var(--linen-bg),var(--niche-bg);box-shadow:inset 0 16px 22px -8px rgba(60,40,20,.38),inset 12px 0 14px -10px rgba(60,40,20,.3),inset -12px 0 14px -10px rgba(60,40,20,.3)}
.hang-niche .wm:not(.ghost) .wm-board{margin:0 -10px}
/* 布面书 */
.cb{position:relative;flex:none;box-sizing:border-box;padding:0;border:0;border-radius:2px 2px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:inherit;
  background:var(--shade),var(--cloth-tx),var(--cl);box-shadow:3px 0 6px -2px rgba(45,30,14,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .18s}
.cb.v-foil{padding-top:24px}.cb.v-label{padding-top:18px}.cb.v-quarter,.cb.v-plain{padding-top:40px}
.cb-t{flex:none;display:flex;flex-direction:row-reverse;gap:2px}
.cb-t span{writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;line-height:1.18;color:var(--foil)}
.cb-t span.sub{font-weight:500}
.cb-t.lat span{font-family:var(--f-num);font-weight:600;letter-spacing:.03em}
.cb.light .cb-t span,.cb.v-quarter .cb-t span,.cb-lab .cb-t span{color:#2B2620}
.cb-lab{position:relative;flex:none;padding:8px 3px;background:var(--cloth-tx),var(--plab);border:1px solid var(--plab-line);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.cb-by{margin-top:auto;margin-bottom:22px;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-ui);font-size:10px;letter-spacing:.08em;color:rgba(240,226,190,.82)}
.cb.light .cb-by,.cb.v-quarter .cb-by{color:#55493D}
.cb[style*="--tx"]:not(.v-quarter) > .cb-t span{color:var(--tx)}
.cb[style*="--tx"]:not(.v-quarter) .cb-by{color:var(--tx);opacity:.85}
.cb.v-quarter .cb-by,.cb.v-quarter .cb-seal{margin-bottom:32px}
.cb-dots{margin-top:auto;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0}
.cb.v-quarter .cb-dots{margin-bottom:28px}
.cb-dots i{width:6px;height:6px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--foil);opacity:.8}
.cb-dots i.d{background:var(--foil);opacity:1}
.cb-dots i.c{width:9px;height:9px;border:2.5px solid #FFF6E0;opacity:1;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cb.light .cb-dots i{border-color:#2B2620}.cb.light .cb-dots i.d{background:#2B2620}
.cb-seal{margin-top:auto;margin-bottom:10px;flex:none;width:22px;height:22px;display:grid;place-items:center;background:var(--seal);color:#FFF8EE;font-family:var(--f-display);font-style:normal;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(255,248,238,.85);transform:rotate(-7deg)}
.cb-seal.sm{width:18px;height:18px;font-size:10px;margin-bottom:0}
.cb.light{--foil-line:rgba(43,38,32,.45)}
.cb.v-foil::before,.cb.v-foil::after{content:"";position:absolute;left:3px;right:3px;height:4px;border-top:1px solid var(--foil-line);border-bottom:1px solid var(--foil-line)}
.cb.v-foil::before{top:10px}.cb.v-foil::after{bottom:10px}
.cb.v-plain::before{content:"";position:absolute;left:0;right:0;top:18px;height:11px;background:rgba(0,0,0,.2);box-shadow:0 1px 0 rgba(240,226,190,.4),0 -1px 0 rgba(240,226,190,.4)}
.cb.v-label::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(0,0,0,.22);border-radius:2px 2px 0 0}
.cb.v-quarter{background:var(--shade),var(--cloth-tx),color-mix(in srgb,var(--cl) 16%,#EDE5D3)}
.cb.v-quarter::before,.cb.v-quarter::after{content:"";position:absolute;left:0;right:0;background:var(--shade),var(--cloth-tx),var(--cl)}
.cb.v-quarter::before{top:0;height:30px;border-bottom:1px solid rgba(240,226,190,.7);border-radius:2px 2px 0 0}
.cb.v-quarter::after{bottom:0;height:24px;border-top:1px solid rgba(240,226,190,.7)}
.cb:hover,.cv:hover{transform:translateY(-4px)}
.read-pull .cb.doing{transform:translateY(-20px)}.read-pull .cb.doing:hover{transform:translateY(-24px)}
.cb.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-14px)}
.read-pull .cb.doing.picked{transform:translateY(-26px)}
.cb.dim,.cv.dim,.wallv .fcase.dim,.wallv .pbook.dim{opacity:.28}
.cb:focus-visible,.cv:focus-visible,.basket:focus-visible,.inbox:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.cb .sp-rib{left:58%;bottom:-30px;height:32px}
.cb-eb{position:absolute;right:4px;top:-7px;width:7px;height:16px;background:var(--k-doc);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}
/* CFA 函套 */
.cfa-box{flex:none;align-self:flex-end;display:flex;flex-direction:column;gap:6px;margin-right:14px}
.cfa-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--cfa-ink)}
.cfa-tag{padding:2px 8px;border-radius:10px;border:1px solid currentColor;font-family:var(--f-ui);font-size:10.5px;font-weight:400;letter-spacing:0;white-space:nowrap;color:inherit;text-decoration:none}
.cfa-case{position:relative;padding:20px 9px 0;background:var(--linen-bg),#DCCFB3;border:5px solid #6B5577;border-bottom:0;border-radius:3px 3px 0 0;box-shadow:inset 0 8px 10px -8px rgba(0,0,0,.35),3px 0 8px -3px rgba(45,30,14,.45)}
.cfa-in{display:flex;align-items:flex-end;gap:3px}
.cv{position:relative;flex:none;width:23px;height:182px;box-sizing:border-box;padding:12px 0 8px;border:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;font:inherit;
  background:var(--shade),var(--cloth-tx),var(--cl);border-radius:2px 2px 0 0;box-shadow:2px 0 4px -2px rgba(30,20,10,.45);transition:transform .18s}
.cv.doing{transform:translateY(-14px)}
.cv.picked{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-10px)}
.cv-lab{flex:none;padding:6px 2px;background:var(--cloth-tx),var(--plab);border:1px solid var(--plab-line)}
.cv-lab span{display:block;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-display);font-weight:600;letter-spacing:.1em;line-height:1.15;color:#2B2620}
.cv-c{margin-top:auto;font-family:var(--f-mono);font-size:8.5px;color:var(--foil);opacity:.85}
.cv .cb-seal{margin-bottom:0}
.cv .sp-rib{left:50%;bottom:-24px;height:26px}
.cfa-cl{position:absolute;right:-14px;top:54px;width:9px;height:18px;border-radius:2px;background:#EFE6D2;border:1px solid #BBAA86;box-shadow:-4px 0 0 -1px #6B5577}
.cfa-cl.b{top:130px}
/* 藤筐、收件匣、小摆件 */
.basket{position:relative;flex:none;align-self:flex-end;width:74px;height:66px;margin-left:12px;text-decoration:none;isolation:isolate}
.basket::before{content:"";position:absolute;inset:0;border-radius:4px 4px 12px 12px;background:var(--rattan);box-shadow:inset 0 5px 0 var(--rattan-rim),inset 0 6px 0 rgba(255,255,255,.25),0 9px 12px -7px rgba(50,35,15,.55)}
.bk-p{position:absolute;z-index:-1;left:12px;top:-16px;width:34px;height:30px;background:#F7F1E3;border:1px solid #D5C8AC;transform:rotate(-9deg)}
.bk-p.b{left:26px;top:-20px;background:#FBF7EC;transform:rotate(6deg)}
.bk-tag{position:absolute;left:5px;right:5px;top:20px;padding:3px 0 4px;background:#F6EFDD;border:1px solid #BFAE88;border-radius:2px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 4px -2px rgba(0,0,0,.3);transform:rotate(-2deg);transition:transform .15s}
.bk-tag b{font-family:var(--f-display);font-size:15px;line-height:1;color:var(--cl)}
.bk-tag span{font-family:var(--f-ui);font-size:9.5px;color:#55493D;white-space:nowrap}
.basket:hover .bk-tag{transform:rotate(0) translateY(-2px)}
.wallv .abox{margin-right:6px}
.inbox{position:relative;flex:none;align-self:flex-end;width:120px;height:70px;margin-left:16px;text-decoration:none;isolation:isolate}
.ib-p{position:absolute;z-index:-1;left:8px;right:8px;top:4px;height:26px;background:#FBF7EC;border:1px solid #D5C8AC;transform:rotate(-3deg)}
.ib-body{position:absolute;left:0;right:0;bottom:0;height:48px;box-sizing:border-box;padding-top:6px;line-height:1.35;text-align:center;background:linear-gradient(#E9E6E0,#D8D4CC);border:1px solid #BDB8AE;border-radius:2px}
.ib-body b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:#2B2620}
.ib-body span{font-family:var(--f-ui);font-size:10.5px;color:#6E675E}
.inbox:hover .ib-p{transform:rotate(-1deg) translateY(-3px)}
/* 英语：布面片盒、绘本架、编织生词盒 */
.wallv .fcase{background:var(--shade),var(--cloth-tx),var(--case)}
.fc-lab{flex:none;padding:9px 3px;background:var(--cloth-tx),var(--plab);border:1px solid var(--plab-line)}
.fc-lab .fc-t{color:#2B2620}
.fc-lab .fc-t.two{display:block;line-height:1.15}
.easel{position:relative;flex:none;align-self:flex-end;display:flex;padding:0 8px 20px;margin-left:20px;isolation:isolate;background:linear-gradient(var(--oak-hi),var(--oak-2)) bottom/100% 20px no-repeat;border-radius:2px}
.easel::before,.easel::after{content:"";position:absolute;z-index:-1;top:16px;bottom:8px;width:4px;background:#9C7E52}

.wallv .vb-body{background:var(--rattan);box-shadow:inset 0 5px 0 var(--rattan-rim),0 9px 12px -7px rgba(50,35,15,.55)}
.wallv .vbox{margin-left:0}
/* 图例 */
.w-legend{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end;margin-top:20px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.w-legend span{display:inline-flex;align-items:flex-end;gap:6px}
.w-legend i{display:inline-block;flex:none}
.lg-b{position:relative;width:14px;height:36px;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 40%,rgba(0,0,0,.15)),#A9573F;border-radius:2px 2px 0 0}
.lg-b.doing{background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 40%,rgba(0,0,0,.15)),#B08A45;transform:translateY(-6px)}
.lg-b.doing::after{content:"";position:absolute;left:4px;bottom:-14px;width:6px;height:14px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}

.eb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:10px}

.rd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--leaf);border-bottom:3px solid var(--ink)}

.arch-q{display:flex;align-items:center;gap:8px;width:300px;max-width:100%;height:40px;padding:0 14px;box-sizing:border-box;border:1px solid var(--rule-strong);border-radius:20px;background:var(--leaf);font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}

.abox{position:relative;flex:none;height:252px;padding:0;border:0;border-radius:3px 3px 0 0;cursor:pointer;font:inherit;text-align:center;
  background:linear-gradient(90deg,#A9844C 0,#C9A367 9%,#D3B077 50%,#C59E62 91%,#A27D46 100%);box-shadow:inset 0 0 0 1px rgba(80,56,20,.35),0 10px 14px -10px rgba(36,33,30,.6);transition:transform .15s,opacity .15s}

.ab-slips i{position:absolute;width:9px;background:var(--k);border-radius:1px 1px 0 0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.ab-band{position:absolute;left:0;right:0;top:0;height:9px;background:var(--c);border-radius:3px 3px 0 0}

.ab-hole{position:absolute;left:50%;bottom:13px;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#3A2E22;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35)}

.bay.atray{flex-direction:column;align-items:stretch;justify-content:space-between;gap:12px;padding:22px 12px 26px;background:radial-gradient(90% 90% at 50% -10%,var(--bay-hi) 0%,transparent 70%),color-mix(in srgb,var(--bay-bg) 92%,#000)}

.asheet{position:absolute;left:4px;right:4px;height:62px;box-sizing:border-box;padding:8px 10px;background:#FBF7EC;border:1px solid #CFC3A6;box-shadow:0 6px 10px -8px rgba(0,0,0,.5);text-decoration:none;color:#24211E;text-align:left;transition:opacity .15s}

.pulled{scroll-margin-top:84px}
.apanel{gap:16px}

.ap-rel-h{margin:0 0 8px}
.arel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.ms{display:block;width:15px;padding:0;background:var(--spine);border:1.25px solid var(--c);border-radius:1px 1px 0 0;box-sizing:border-box;box-shadow:inset 0 4px 0 color-mix(in srgb,var(--c) 40%,transparent);cursor:pointer}

.add-dir.new{border-style:dashed}

.w-hidden{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:14px 0 0;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}

window.YXL_LIB = {

  home: "https://claude.ai/artifact/LpwLZchfacKZAnJs577MvM",

  kinds: { book: "书", topic: "科目", practice: "实践", concept: "专题" },

  /* 专题：独立页面。href 是 GitHub 版的相对路径，artifact 是 claude.ai 上的版本。
   * group 决定归到哪一组（见 reportGroups），不写就是数据专题。
   * 研究档案的三种关系分开写：
   *   origin 出处：从哪儿来（读哪本书、哪次讨论时做的）
   *   tracks 归属：属于哪个学习方向（决定它在线网图上放在哪个区域）

  reportGroups: [

    { id: "note", name: "知识专题", trackHead: "专题笔记" }

window.YXL_LESSONS = {"2026-10-11": "# 2026-10-11（周日）准备日\n\n> 第一阶段明天（10 月 12 日，周一）正式开课。今天只做一件事：把工具和材料备齐，明天打开讲义就能直接学。\n\n## 今天的安排\n\n| 时段 | 科目 | 分钟 | 内容 |\n|---|---|---|---|\n| 1 | 准备日 | 60 | 装好工具、备好书、建生词本、看一遍课表 |\n\n建议分配：DB Browser 15 分钟 → Jupyter 15 分钟 → 书 15 分钟 → 生词本 5 分钟 → 课表 10 分钟。哪一步卡住了就先跳过，晚上打卡时告诉我卡在哪。\n\n---\n\n## 一、装好 DB Browser for SQLite（约 15 分钟）\n\nSQL 课前半程都用它。它是一个免费的图形界面小软件，数据库就是电脑上的一个 `.db` 文件，不需要装服务器、不需要联网。\n\n**安装步骤**\n\n1. 打开 sqlitebrowser.org → Download，Windows 选 *Standard installer for 64-bit Windows*（Mac 选 .dmg）。\n2. 一路“下一步”安装。安装界面里如果有勾选项，勾上 *DB Browser (SQLite)* 的桌面快捷方式即可，SQLCipher 版本不用。\n3. 打开软件 → 左上角 **New Database（新建数据库）** → 存到一个固定文件夹，例如 `D:\\研习录\\sql\\practice.db`。\n4. 弹出“编辑表定义”窗口时直接点 **Cancel（取消）**，我们用 SQL 语句建表。\n\n**验收：跑通下面这段脚本**\n\n切到 **Execute SQL（执行 SQL）** 标签页，把下面整段粘进去，按 `Ctrl + Enter`（或点三角形“执行全部”）：\n\n```sql\n-- 准备日验收脚本：建一张小表，插入 3 行虚构数据，再查出来\nDROP TABLE IF EXISTS test_people;\n\nCREATE TABLE test_people (\n    id      INTEGER PRIMARY KEY,\n    name    TEXT,\n    city    TEXT,\n    amount  REAL\n);\n\nINSERT INTO test_people (id, name, city, amount) VALUES\n    (1, '甲某一', '虚构市', 1200.5),\n    (2, '乙某二', '样例县', 800),\n    (3, '丙某三', '虚构市', 1500);\n\nSELECT name, city, amount\nFROM test_people\nWHERE city = '虚构市';\n```\n\n下方结果区应该出现 2 行：甲某一、丙某三。看到了就算装好了。最后点 **Write Changes（写入更改）** 保存。\n\n**常见问题**\n\n- 结果区什么都没有：确认是在 *Execute SQL* 页执行的，而不是 *Browse Data* 页。\n- 报 `near \"，\": syntax error`：SQL 里的逗号、括号、引号必须是英文半角。中文输入法下打的 `，` `（` `‘` 都会报错——这是以后最常见的错误之一，今天先记住。\n- 关软件时提示“是否保存”：选保存。\n\n---\n\n## 二、打开 Jupyter Notebook（约 15 分钟）\n\n**步骤**\n\n1. 开始菜单搜 **Anaconda Navigator** 打开（第一次启动慢，等一两分钟）。\n2. 在 Jupyter Notebook 那一格点 **Launch**，浏览器会打开一个文件列表页。\n3. 进到你想放练习的文件夹（建议 `D:\\研习录\\python`，没有就先在资源管理器里建好）。\n4. 右上角 **New → Python 3 (ipykernel)**，新建笔记本，点左上角标题改名为 `00_准备日`。\n\n**验收：依次运行下面三个单元格**（光标放在单元格里，按 `Shift + Enter` 运行并跳到下一格）\n\n单元格 1——最简单的一行：\n\n```python\nprint(\"hello\")\n```\n\n单元格 2——看看 Python 和 pandas 的版本，确认环境齐全：\n\n```python\nimport sys\nimport pandas as pd\nimport openpyxl\n\nprint(\"Python 版本：\", sys.version.split()[0])\nprint(\"pandas 版本：\", pd.__version__)\nprint(\"openpyxl 版本：\", openpyxl.__version__)\n```\n\n单元格 3——用代码现场生成一个 Excel 再读回来（以后的 Python 课都这样，不依赖外部文件）：\n\n```python\nimport pandas as pd\n\ndf = pd.DataFrame({\n    \"姓名\": [\"甲某一\", \"乙某二\", \"丙某三\"],\n    \"城市\": [\"虚构市\", \"样例县\", \"虚构市\"],\n    \"金额\": [1200.5, 800, 1500],\n})\ndf.to_excel(\"准备日_测试.xlsx\", index=False)\n\nback = pd.read_excel(\"准备日_测试.xlsx\")\nprint(back)\nprint(\"虚构市合计金额：\", back.loc[back[\"城市\"] == \"虚构市\", \"金额\"].sum())\n```\n\n最后一行应输出 `虚构市合计金额： 2700.5`。回到 Jupyter 的文件列表页，能看到多出一个 `准备日_测试.xlsx`。\n\n**常见问题**\n\n- `ModuleNotFoundError: No module named 'openpyxl'`：在一个新单元格里运行 `%pip install openpyxl`，装完后点菜单 *Kernel → Restart*，再从头运行。\n- 浏览器没自动打开：Navigator 的黑色窗口里会有一行 `http://localhost:8888/...` 开头的地址，复制到浏览器打开。\n- 单元格左边一直是 `[*]`：表示还在运行，等几秒；一直不动就 *Kernel → Restart*。\n\n---\n\n## 三、备好《大国政治的悲剧》（约 15 分钟）\n\n地缘政治这门课第一阶段精读米尔斯海默的《大国政治的悲剧》（*The Tragedy of Great Power Politics*）。纸质、电子版都行，修订版（有讨论中国崛起的一章）更好。\n\n**今天读什么**：只读**目录**和**第一章的开头几页**，不求读懂，先建立一个地图。\n\n**读之前先知道这本书在吵什么**（下面是我的概括，不是原文）：\n\n- 国际关系里有一派叫**现实主义**（realism），认为国家之间没有“世界政府”管着，所以每个国家最终只能靠自己保证安全。\n- 现实主义内部又分两种看法：一种认为国家只要“够安全”就满足了（防御性现实主义）；作者主张另一种——**进攻性现实主义**（offensive realism）：在这种环境里，大国会不断寻找机会扩大自己相对于别国的实力，最理想的状态是成为所在地区的霸主。\n- 书名里的“悲剧”指的是：没有哪个大国是天生的恶棍，但结构逼着它们互相防范、互相竞争，冲突因此反复出现。\n\n**带着三个问题翻目录**（不用写答案，脑子里过一遍即可，下周六读第一章时会正式展开）：\n\n1. 全书大致分成哪几块？哪些章讲理论，哪些章讲历史案例？\n2. 有没有专门讨论中美关系或“中国能否和平崛起”的章节？在第几章？\n3. 第一章开头，作者用什么来解释“大国为什么会互相竞争”——是领导人的性格、国家的制度，还是别的东西？\n\n精读页入口：研习录 → 地缘政治 → 《大国政治的悲剧》（https://claude.ai/artifact/LpwLZchfacKZAnJs577MvM ）。\n\n---\n\n## 四、建一个英语生词本（约 5 分钟）\n\n以后每天英语时段会给 10 个 CFA 术语，并在 1、3、7 天后让你回想。生词本用什么形式都行，关键是**每天固定写在同一个地方**。\n\n如果想用 Excel，可以在刚才的 Jupyter 里多运行一个单元格，直接生成一个带好表头的生词本：\n\n```python\nimport pandas as pd\n\ncolumns = [\"日期\", \"英文\", \"音标\", \"中文\", \"例句\", \"第1天复习\", \"第3天复习\", \"第7天复习\"]\nsample = pd.DataFrame([{\n    \"日期\": \"2026-10-11\",\n    \"英文\": \"return\",\n    \"音标\": \"/rɪˈtɜːrn/\",\n    \"中文\": \"回报；收益\",\n    \"例句\": \"The fund earned a return of 8% last year.\",\n    \"第1天复习\": \"\", \"第3天复习\": \"\", \"第7天复习\": \"\",\n}], columns=columns)\n\nsample.to_excel(\"英语生词本.xlsx\", index=False)\nprint(\"已生成：英语生词本.xlsx\")\n```\n\n第一行 `return` 就是明天 CFA 第一课（Rates and Returns）会用到的词，算提前热身。\n\n---\n\n## 五、通读课表（约 10 分钟）\n\n第一阶段 12 周，每天 1.5–2 小时，课程按顺序推进，哪天没学完下次接着学。\n\n| 星期 | 时段安排 |\n|---|---|\n| 周一、三、五 | 英语 20 + SQL 45 + CFA 35 = 100 分钟 |\n| 周二、四 | 英语 20 + Python 45 + CFA 35 = 100 分钟 |\n| 周六 | 英语 20 + 地缘政治 60（读一章）+ CFA 35 = 115 分钟 |\n| 周日 | 英语词汇小测 20 + 地缘政治 30（时事分析）+ 周复盘 50 = 100 分钟 |\n\n各科进度：SQL 36 课、Python 24 课、CFA 一级第一阶段 64 课（数量方法 + 经济学）。\n\n**明天（周一）的课**\n\n- 英语 20 分钟：CFA 术语与短文——Rates and Returns\n- SQL 45 分钟：数据库、表、行和列，建第一张表（今天装好软件，明天直接用）\n- CFA 35 分钟：Q1 收益率与回报（1/4）\n\n看完如果觉得哪天量太大、时间段不合适、或者想换顺序，今晚打卡时直接说，我来调。\n\n---\n\n## 六、热身小练习（可选，5 分钟）\n\n不算正式内容，装好软件后有余力就做。\n\n1. 在 DB Browser 里，把验收脚本最后的查询改成只查金额大于 1000 的人，应该出来几行？\n2. 在 Jupyter 里，把单元格 3 的最后一行改成计算**所有人**的金额合计，结果是多少？\n3. 假设年初存入 10,000 元，年末变成 10,800 元，这一年的收益率（return）是多少？\n\n<details>\n<summary>答案<\/summary>\n\n1. 把 `WHERE city = '虚构市'` 改成 `WHERE amount > 1000`，出来 2 行：甲某一（1200.5）、丙某三（1500）。\n2. `print(back[\"金额\"].sum())`，结果 `3500.5`。\n3. 收益率 = (期末 − 期初) ÷ 期初 = (10,800 − 10,000) ÷ 10,000 = 8%。这就是明天 CFA 第一课的起点——holding period return（持有期收益率）。\n\n<\/details>\n\n---\n\n## 今晚 9 点打卡要回答的三个问题\n\n1. 五件事完成了哪几件？（DB Browser、Jupyter、书、生词本、课表）\n2. 大概用了多久？哪一步卡住了，报错信息是什么？\n3. 看完课表，有没有想调整的地方（每天的量、时段、顺序）？\n", "2026-10-12": "# 2026-10-12（周一）第 1 周 · 第一天\n\n> 第一阶段正式开课。今天三个时段共 100 分钟：英语 → SQL → CFA。按顺序学，哪段卡住了先跳过，晚上打卡时说。\n\n## 今天的路线\n\n| 时段 | 科目 | 分钟 | 课 |\n|---|---|---|---|\n| 1 | 英语 | 20 | [CFA 术语与短文：Rates and Returns（见 CFA 第 1 课末尾“英文术语”）](../lessons/cfa/01.md) |\n| 2 | SQL | 45 | [第 1/36 课 · 数据库、表、行和列：装好 DB Browser，建第一张表](../lessons/sql/01.md) |\n| 3 | CFA 一级 | 35 | [第 1/64 课 · Q1 收益率与回报（1/4）：利率的含义与构成、持有期收益率](../lessons/cfa/01.md) |\n\n**关于昨天**：昨天的准备日没有打卡。如果 DB Browser、Jupyter 还没装好，今天 SQL 时段先花 10 分钟装 DB n | 45 | [第 1/24 课 · 环境：Anaconda 与 Jupyter，第一个程序](../lessons/py/01.md) |\n| 3 | CFA 一级 | 35 | [第 1/64 课 · Q1 收益率与回报（1/4）](../lessons/cfa/01.md) |\n\n**关于昨天**：昨天（10/19）没有打卡，按没学处理——电影还是第 1 段，Python、CFA 都还是第 1 课，同一个讲义文件接着学。如果其实学完了，回复一句，我来补记。\n\n到今天已经九天没有打上卡了。不用补，也不用一口气走完三站：今天只要做成一件小事就算重新起步——比如只走电影第 1 段，或者只把 Anaconda 装好、在 Jupyter 里跑出第一行 `print`。晚上打卡时哪怕只说一句“只做了 XX”，我也照实记上。\n\n## 今晚 9 点打卡要回答的三个问题\n\n1. 三站完成了哪几站？电影第 1 段学完没有，背熟了大概几句，有没有听不懂的句子（可以把那句贴过来）？\n2. Python：Anaconda 装好、Jupyter 打开了吗？第一个程序跑通没有，有报错就把报错信息贴过来。\n3. 每天 170 分钟排不开的话，想定成多少分钟？比如“电影 + 一门课”约 125 分钟，或先只走电影 90 分钟，我按你说的调。\n", "cfa-01": "# CFA 第 1 课 · Q1 收益率与回报（1/4）\n\n> 35 分钟 · CFA 一级第 1 / 64 课 · Rates and Returns\n\n**模块**：Quantitative Methods → Rates and Returns（共 4 次课，今天第 1 次）\n\n## 学习目标\n\n- 从三个角度解释利率：要求回报率、折现率、机会成本。\n- 把利率拆成实际无风险利率加各项溢价。\n- 计算单期和多期的持有期收益率（HPR）。\n\n## 讲解一：利率的三种解读\n\n假设一年期定期存款利率是 4%：\n\n1. **Required rate of return（要求回报率）**：你把 1 万元存一年，至少要 4% 才愿意——这是你“要求”的最低回报。\n2. **Discount rate（折现率）**：一年后到手的 10,400 元，按 4% 折回今天，值 10,000 元。把“未来的钱”换算成“今天的钱”。\n3. **Opportunity cost（机会成本）**：如果你把这 1 万元放在不计息的活期里，就放弃了 4%——这就是你为“随时能用钱”付出的代价。\n\n做题看关键词：*minimum / require* → 要求回报率；*worth today / present value* → 折现率；*forgo / give up / sacrifice* → 机会成本。\n\n## 讲解二：利率的构成\n\n$$\nr = \\underbrace{\\text{实际无风险利率} + \\text{通胀溢价}}_{\\text{名义无风险利率}} + \\text{违约风险溢价} + \\text{流动性溢价} + \\text{期限溢价}\n$$\n\n一个记法：出借人问自己五个问题——\n\n| 问题 | 对应部分 |\n|---|---|\n| 我得等多久才能花这笔钱？（纯等待） | Real risk-free interest rate |\n| 等的这段时间，钱会不会贬值？ | Inflation premium |\n| 对方会不会不还？ | Default risk premium |\n| 我想提前卖掉时，能不能按公道价卖出去？ | Liquidity premium |\n| 期限越长，利率一变价格晃得越厉害，我愿不愿扛？ | Maturity premium |\n\n短期国库券（T-bill）只回答了前两个问题（后三项接近 0），所以它的收益率近似**名义无风险利率**。严格关系是 (1 + 名义) = (1 + 实际)(1 + 通胀)，一级题目一般直接相加近似。\n\n**例题 1**：实际无风险利率 2.5%，预期通胀 3%。某 15 年期公司债：违约风险溢价 1.8%，流动性溢价 0.7%，期限溢价 1.2%。\n\n- 名义无风险利率 ≈ 2.5% + 3% = **5.5%**（严格：1.025 × 1.03 − 1 = 5.575%）\n- 公司债要求回报率 ≈ 5.5% + 1.8% + 0.7% + 1.2% = **9.2%**\n\n**例题 2**：同一家公司又发了一只 15 年期债券，条款一样，但交易非常活跃，要求回报率是 8.7%。哪一项溢价不同？差多少？\n\n- 发行人、期限都一样，违约和期限溢价相同；差别只能来自流动性：9.2% − 8.7% = **0.5%**，活跃债券的流动性溢价只有 0.2%。\n\n## 讲解三：持有期收益率（HPR）\n\n**单期**：\n\n$$\nHPR = \\frac{P_1 - P_0 + D_1}{P_0} = \\underbrace{\\frac{P_1 - P_0}{P_0}}_{\\text{资本利得率}} + \\underbrace{\\frac{D_1}{P_0}}_{\\text{收入回报率}}\n$$\n\n**例题 3（股票）**：60 元买入，持有期间分红 1.8 元，以 63.2 元卖出。\n\nHPR = (63.2 − 60 + 1.8) ÷ 60 = 5 ÷ 60 = **8.33%**（资本利得 5.33% + 股息收益 3%）\n\n计算器（BA II Plus）：`63.2 − 60 + 1.8 =` → `÷ 60 =` → 显示 `0.0833`\n\n**例题 4（债券）**：面值 100 的债券按 100 买入，一年收到票息 4，年末以 106.5 卖出。\n\nHPR = (106.5 − 100 + 4) ÷ 100 = **10.5%**——票息只有 4%，另外 6.5% 来自价格上涨（比如期间市场利率下降）。\n\n**多期**：每期“1 + 收益率”连乘，再减 1。\n\n$$\nHPR = (1 + R_1)(1 + R_2)\\cdots(1 + R_n) - 1\n$$\n\n**例题 5**：某基金三年收益率 15%、−12%、6%。\n\n(1.15)(0.88)(1.06) − 1 = 1.07272 − 1 = **7.27%**\n\n计算器：`1.15 × 0.88 × 1.06 − 1 =` → 显示 `0.0727`\n\n直觉检查：只看前两年，涨 15% 再跌 12%，1.15 × 0.88 = 1.012，只赚了 1.2%，不是 3%。跌的那 12% 是从更高的基数上跌的——这就是不能直接相加的原因。\n\n## 练习：仿一级考试三选一\n\n**1.** \"To find what a payment of $1,000 due in two years is worth today, the analyst uses a rate of 7%.\" The 7% is best described as a:\n\nA. discount rate.\nB. required rate of return.\nC. opportunity cost.\n\n**2.** Which premium compensates investors for the increased sensitivity of a bond's market value to changes in interest rates as its time to repayment is extended?\n\nA. Liquidity premium\nB. Maturity premium\nC. Inflation premium\n\n**3.** The nominal risk-free rate is 5.2%, and the real risk-free rate is 2.0%. Using the additive approximation, the inflation premium is closest to:\n\nA. 2.0%\nB. 3.2%\nC. 7.2%\n\n**4.** An investor buys a share at $20.00, receives a dividend of $0.60, and sells the share at $18.40. The holding period return is closest to:\n\nA. −8.0%\nB. −5.0%\nC. 3.0%\n\n**5.** A portfolio earns 7%, 12%, −5%, and 4% in four consecutive years. The four-year holding period return is closest to:\n\nA. 18.00%\nB. 18.40%\nC. 4.60%\n\n<details>\n<summary>CFA 答案与解析<\/summary>\n\n1. **A**。关键词 *worth today*——把未来的钱换算到今天，这是折现率的角度。\n2. **B**。期限越长，利率变动对价格的影响越大，补偿这一点的是期限溢价。流动性溢价补偿“不好卖”，通胀溢价补偿购买力下降。\n3. **B**。5.2% − 2.0% = 3.2%。C 是把两者相加的错误。\n4. **B**。(18.40 − 20.00 + 0.60) ÷ 20.00 = −1.00 ÷ 20 = −5.0%。A 漏了股息（−1.60 ÷ 20 = −8%）；C 只算了股息收益率（0.60 ÷ 20 = 3%）。\n5. **B**。1.07 × 1.12 × 0.95 × 1.04 − 1 = 1.18402 − 1 = 18.40%。A 是直接相加；C 是把 18.40% 除以 4——年均收益率要用几何平均（开四次方），第 2 次课讲。\n\n<\/details>\n\n---\n\n## 加练一\n\n> 同一课另一套仿真题，正课的练习做完还有余力再做。\n\n**1.** An analyst states: \"The 6% rate is the minimum return investors require before they agree to lend.\" This statement best describes the interest rate as a:\n\nA. discount rate.\nB. required rate of return.\nC. opportunity cost.\n\n**2.** Which component of an interest rate compensates investors for the risk that a security cannot be sold quickly at close to its fair value?\n\nA. Maturity premium\nB. Default risk premium\nC. Liquidity premium\n\n**3.** Given: real risk-free rate 1.5%, inflation premium 2.5%, default risk premium 2.0%, liquidity premium 0.8%, maturity premium 1.2%. The required return on the bond is closest to:\n\nA. 6.0%\nB. 7.2%\nC. 8.0%\n\n**4.** An investor buys a share at $40, receives a dividend of $0.80, and sells the share at $37. The holding period return is closest to:\n\nA. −7.5%\nB. −5.5%\nC. −2.0%\n\n**5.** A portfolio returns 12%, −8%, and 5% in three consecutive years. The three-year holding period return is closest to:\n\nA. 9.00%\nB. 8.19%\nC. 2.73%\n\n<details>\n<summary>CFA 答案与解析<\/summary>\n\n1. **B**。关键词 *minimum return investors require*。折现率强调把未来价值换算到今天；机会成本强调放弃的收益。\n2. **C**。流动性溢价补偿“难以快速按公允价卖出”。期限溢价补偿长期限下的利率风险；违约风险溢价补偿可能不还钱。\n3. **C**。1.5 + 2.5 + 2.0 + 0.8 + 1.2 = 8.0%。A 只加了前三项，漏了流动性和期限溢价（1.5 + 2.5 + 2.0 = 6.0%）。\n4. **B**。(37 − 40 + 0.80) ÷ 40 = −2.20 ÷ 40 = −5.5%。A 漏掉了股息（−3 ÷ 40 = −7.5%）。\n5. **B**。1.12 × 0.92 × 1.05 − 1 = 1.08192 − 1 = 8.19%。A 是直接相加的错误做法；C 是 8.19% 除以 3 的错误“年均”做法（年均收益率要开三次方，第 2 次课讲几何平均）。\n\n<\/details>\n\n---\n\n## 加练二\n\n> 同一课另一套仿真题，正课的练习做完还有余力再做。\n\n**1.** \"By keeping $10,000 in a non-interest-bearing account, Wen gives up the 3% she could earn on a one-year deposit.\" The 3% is best described as a(n):\n\nA. discount rate.\nB. opportunity cost.\nC. required rate of return.\n\n**2.** The nominal risk-free interest rate is best approximated by the sum of the:\n\nA. real risk-free rate and the inflation premium.\nB. real risk-free rate and the default risk premium.\nC. inflation premium and the maturity premium.\n\n**3.** A 3-month Treasury bill yields 4.6%, and the real risk-free rate is 1.9%. The inflation premium is closest to:\n\nA. 1.9%\nB. 2.7%\nC. 6.5%\n\n**4.** An investor buys a share for $25.00, receives a dividend of $0.50, and sells the share for $27.50 one year later. The holding period return is closest to:\n\nA. 2.0%\nB. 10.0%\nC. 12.0%\n\n**5.** A fund returns 6%, 9%, and −4% in three consecutive years. The three-year holding period return is closest to:\n\nA. 3.64%\nB. 10.92%\nC. 11.00%\n\n<details>\n<summary>CFA 答案与解析<\/summary>\n\n1. **B**。关键词 *gives up*：放弃了本可以赚到的 3%，是机会成本。没有“最低要求”的意思（排除 C），也没有把未来价值折到今天（排除 A）。\n2. **A**。名义无风险利率 = 实际无风险利率 + 通胀溢价。违约、流动性、期限溢价是具体证券才有的风险补偿，无风险利率里不含。\n3. **B**。T-bill 收益率近似名义无风险利率：4.6% − 1.9% = 2.7%。C 是错误地把两者相加。\n4. **C**。(27.50 − 25.00 + 0.50) ÷ 25.00 = 3.00 ÷ 25.00 = 12.0%。B 漏掉了股息（2.50 ÷ 25 = 10%）；A 只算了股息收益率（0.50 ÷ 25 = 2%）。\n5. **B**。1.06 × 1.09 × 0.96 − 1 = 1.1092 − 1 = 10.92%。C 是直接相加（6 + 9 − 4 = 11%）；A 是把 10.92% 除以 3 的错误“年均”算法——年均收益率要用几何平均开三次方，第 2 次课讲。\n\n<\/details>\n\n---\n\n## 英文术语\n\n> 这一课相关的 30 个 CFA 英文术语，分三组。先遮住中文说一遍，再抄进生词本；它们会进复习卡。\n\n### 第一组\n\n| # | 英文 | 音标 | 中文 |\n|---|---|---|---|\n| 1 | interest rate | /ˈɪntrəst reɪt/ | 利率 |\n| 2 | required rate of return | /rɪˈkwaɪərd reɪt əv rɪˈtɜːrn/ | 要求回报率 |\n| 3 | discount rate | /ˈdɪskaʊnt reɪt/ | 折现率 |\n| 4 | opportunity cost | /ˌɑːpərˈtuːnəti kɔːst/ | 机会成本 |\n| 5 | real risk-free interest rate | /ˈriːəl ˌrɪsk ˈfriː/ | 实际无风险利率 |\n| 6 | inflation premium | /ɪnˈfleɪʃn ˈpriːmiəm/ | 通胀溢价 |\n| 7 | default risk premium | /dɪˈfɔːlt rɪsk ˈpriːmiəm/ | 违约风险溢价 |\n| 8 | liquidity premium | /lɪˈkwɪdəti ˈpriːmiəm/ | 流动性溢价 |\n| 9 | maturity premium | /məˈtʃʊrəti ˈpriːmiəm/ | 期限溢价 |\n| 10 | holding period return (HPR) | /ˈhoʊldɪŋ ˈpɪriəd rɪˈtɜːrn/ | 持有期收益率 |\n\n**例句**\n\n1. The central bank raised the **interest rate** by 0.25%. —— 央行把利率上调了 0.25 个百分点。\n2. Investors set a **required rate of return** of 9% for this project. —— 投资者对这个项目设定了 9% 的要求回报率。\n3. A higher **discount rate** makes future cash flows worth less today. —— 折现率越高，未来现金流的现值越低。\n4. The **opportunity cost** of holding cash is the interest you give up. —— 持有现金的机会成本就是放弃的利息。\n5. The **real risk-free interest rate** is the return for pure waiting, with no inflation. —— 实际无风险利率是在没有通胀时单纯“等待”所得的回报。\n6. When prices rise faster, lenders demand a larger **inflation premium**. —— 物价涨得越快，出借人要求的通胀溢价越高。\n7. Bonds from weaker companies carry a higher **default risk premium**. —— 实力较弱公司的债券违约风险溢价更高。\n8. Thinly traded bonds must offer a **liquidity premium**. —— 交易清淡的债券必须提供流动性溢价。\n9. A 30-year bond usually includes a bigger **maturity premium** than a 2-year bond. —— 30 年期债券的期限溢价通常比 2 年期大。\n10. The stock's **holding period return** was 11% including dividends. —— 算上分红，这只股票的持有期收益率是 11%。\n\n### 第二组\n\n| # | 英文 | 音标 | 中文 |\n|---|---|---|---|\n| 1 | nominal risk-free rate | /ˈnɑːmɪnl ˌrɪsk ˈfriː reɪt/ | 名义无风险利率 |\n| 2 | Treasury bill (T-bill) | /ˈtreʒəri bɪl/ | 短期国库券 |\n| 3 | premium | /ˈpriːmiəm/ | 溢价；额外补偿 |\n| 4 | creditworthiness | /ˈkredɪtwɜːrðinəs/ | 信用状况、偿债能力 |\n| 5 | capital gain | /ˈkæpɪtl ɡeɪn/ | 资本利得（价差收益） |\n| 6 | dividend yield | /ˈdɪvɪdend jiːld/ | 股息收益率 |\n| 7 | coupon | /ˈkuːpɑːn/ | （债券）票息 |\n| 8 | compounding | /kəmˈpaʊndɪŋ/ | 复利、复合计算 |\n| 9 | present value | /ˈpreznt ˈvæljuː/ | 现值 |\n| 10 | fair value | /fer ˈvæljuː/ | 公允价值 |\n\n**例句**\n\n1. The yield on a 3-month T-bill is a good proxy for the **nominal risk-free rate**. —— 3 个月期国库券的收益率可以很好地近似名义无风险利率。\n2. A **Treasury bill** matures in one year or less. —— 短期国库券的期限不超过一年。\n3. Investors demand a **premium** for every extra risk they take. —— 每多承担一种风险，投资者就要求多一份溢价。\n4. Rating agencies assess the **creditworthiness** of bond issuers. —— 评级机构评估债券发行人的信用状况。\n5. She sold the shares at a higher price and realized a **capital gain**. —— 她以更高的价格卖出股票，实现了资本利得。\n6. A stock priced at 50 that pays 2 a year has a **dividend yield** of 4%. —— 股价 50、每年分红 2 的股票，股息收益率是 4%。\n7. The bond pays a **coupon** of 5% once a year. —— 这只债券每年付一次 5% 的票息。\n8. Because of **compounding**, returns earned each year also earn returns later. —— 由于复利，每年赚到的收益之后还会继续生息。\n9. The **present value** of 110 received next year at 10% is 100. —— 按 10% 折算，明年收到的 110 的现值是 100。\n10. In an illiquid market, you may have to sell well below **fair value**. —— 在流动性差的市场里，你可能得远低于公允价值卖出。\n\n### 第三组\n\n| # | 英文 | 音标 | 中文 |\n|---|---|---|---|\n| 1 | lender | /ˈlendər/ | 出借人、贷款方 |\n| 2 | borrower | /ˈbɑːroʊər/ | 借款人 |\n| 3 | purchasing power | /ˈpɜːrtʃəsɪŋ ˈpaʊər/ | 购买力 |\n| 4 | nominal return | /ˈnɑːmɪnl rɪˈtɜːrn/ | 名义回报 |\n| 5 | real return | /ˈriːəl rɪˈtɜːrn/ | 实际回报（扣除通胀后） |\n| 6 | yield | /jiːld/ | 收益率 |\n| 7 | maturity | /məˈtʃʊrəti/ | 到期日；期限 |\n| 8 | credit risk | /ˈkredɪt rɪsk/ | 信用风险 |\n| 9 | marketable | /ˈmɑːrkɪtəbl/ | 可在市场上交易的 |\n| 10 | income return | /ˈɪnkʌm rɪˈtɜːrn/ | 收入回报（利息、股息部分） |\n\n**例句**\n\n1. The **lender** expects to be paid back with interest. —— 出借人期望连本带息收回。\n2. A **borrower** with a weak balance sheet pays a higher rate. —— 资产负债表较弱的借款人要付更高的利率。\n3. Inflation reduces the **purchasing power** of money. —— 通胀会削弱货币的购买力。\n4. The fund's **nominal return** was 7% last year. —— 这只基金去年的名义回报是 7%。\n5. With 3% inflation, the **real return** was only about 4%. —— 扣除 3% 的通胀后，实际回报只有约 4%。\n6. The **yield** on the 10-year bond rose to 4.5%. —— 10 年期债券的收益率升到了 4.5%。\n7. The bond reaches **maturity** in 2036. —— 这只债券在 2036 年到期。\n8. Rating agencies try to measure **credit risk**. —— 评级机构试图衡量信用风险。\n9. Government bonds are highly **marketable**. —— 国债非常容易在市场上买卖。\n10. The coupon you receive is the **income return** of a bond. —— 收到的票息就是债券的收入回报。\n\n### 短文阅读\n\n**What Is an Interest Rate?**\n\nAn interest rate can be read in three ways. First, it is a required rate of return: the minimum return an investor needs before agreeing to lend money. Second, it is a discount rate, which tells us how much a payment in the future is worth today. Third, it is an opportunity cost, because money spent today gives up the interest it could have earned.\n\nInterest rates are also built from several parts. The real risk-free interest rate rewards investors simply for waiting. An inflation premium protects them against rising prices. Riskier securities add more premiums: a default risk premium if the borrower might not pay, a liquidity premium if the security is hard to sell quickly at a fair price, and a maturity premium if the money is tied up for many years.\n\nAfter an investment is made, we measure the result with the holding period return, which counts both the price change and any income received.\n\n**理解题**\n\n1. According to the passage, what are the three ways to read an interest rate?\n2. Which premium is added when a security is hard to sell quickly at a fair price?\n3. What two things does the holding period return count?\n\n<details>\n<summary>答案<\/summary>\n\n1. A required rate of return, a discount rate, and an opportunity cost.（要求回报率、折现率、机会成本）\n2. The liquidity premium.（流动性溢价）\n3. The price change and any income received (e.g., dividends or interest).（价格变动和期间收到的收入）\n\n<\/details>\n", "geo-01": "# 地缘政治 第 1 课 · 第一章 导论：读原书与精读页\n\n> 60 分钟 · 地缘政治第 1 / 24 课 · 《大国政治的悲剧》（米尔斯海默）\n\n## 本课目标\n\n- 读完原书第一章（导论），说清作者要用一个理论解释什么问题。\n- 能用自己的话讲出“悲剧”二字指的是什么。\n- 分清现实主义内部的三条路线：人性现实主义、防御性现实主义、进攻性现实主义，各自对“国家想要多少权力”给出什么回答。\n- 记住全书的论证链条（假设 → 行为 → 目标 → 手段 → 结果），为下周第二章的五个基本假设打底。\n\n## 时间安排（共 60 分钟）\n\n| 分钟 | 做什么 |\n|---|---|\n| 5 | 先看下面“读前导览”，带着问题读 |\n| 35 | 读原书第一章 |\n| 10 | 打开研习录精读模块，过一遍第一章导读和 4 张概念卡 |\n| 10 | 想下面 3 道思考题，各写两三句（打卡时可以贴过来） |\n\n## 读什么\n\n- **书**：《大国政治的悲剧》修订版，中译本（王义桅、唐小松 译，上海人民出版社）。英文原版是 *The Tragedy of Great Power Politics*，第 1 章 *Introduction*。\n- **范围**：第一章全章。篇幅不长，按顺序读完即可。\n- **怎么分段读**：第一章大致可以分成四块，读的时候留意每块回答了什么问题（小节标题以你手上的版本为准）：\n  1. **开篇**：冷战结束后流行一种乐观看法，认为大国之间的安全竞争已成过去。作者要反驳的就是这种看法。\n  2. **进攻性现实主义的核心主张**：大国为什么追求权力、最终想要什么（地区霸权），以及“大国”和“权力”怎么界定。\n  3. **现实主义与自由主义的对照**：两派对国际政治的基本判断有什么不同；作者顺带讨论了为什么现实主义在美国舆论里不受欢迎。\n  4. **全书路线图**：后面各章分别做什么。读这一块时，把章节和下面的论证链条对上号。\n\n## 读前导览：用自己的话概括这一章\n\n**作者要解释的问题**：大国之间为什么总在争夺权力？为什么这种竞争在冷战结束后也不会消失？\n\n**作者的回答（概括）**：原因不在领导人好坏、政体如何，而在国际体系的结构。国家之上没有更高的权威可以求助，各国又看不清彼此的意图，于是每个大国只能靠扩大自己的相对权力来求安全。最稳妥的处境是成为本地区唯一的强国——地区霸主。\n\n**“悲剧”指什么**：这不是好人和坏人的故事。即便一个大国本身没有侵略的念头，体系结构也会逼它去争权力；别国看到它变强，又不得不防范和反制。人人都在为自保做理性的事，合起来却是反复出现的冲突。悲剧感就来自这种“没有恶人，结局照样不好”。\n\n**三条现实主义路线**（这是本章最容易考的概念对比）：\n\n| 路线 | 代表人物 | 国家为什么追求权力 | 想要多少权力 |\n|---|---|---|---|\n| 人性现实主义 | 摩根索 | 人天生有权力欲，国家也一样 | 越多越好，出自本性 |\n| 防御性现实主义 | 华尔兹 | 体系结构逼国家求安全 | 适度即可，扩张过头会招来制衡，反而不安全 |\n| 进攻性现实主义 | 米尔斯海默 | 体系结构逼国家求安全 | 尽可能多，直到成为地区霸主 |\n\n注意：后两者都从体系结构出发，分歧在“多少权力才够”。这一点下周读第二章时会展开。\n\n**全书论证链条**（先记个轮廓，后面各章逐一填实）：\n\n1. **前提**：五个基本假设（第二章）。\n2. **行为**：恐惧、自助、权力最大化（第二章）。\n3. **目标**：称霸本地区，阻止别的地区出现霸主（第二章）。\n4. **手段**：权力怎么衡量（第三、四章），大国用哪些战略扩张或自保（第五、八章）。\n5. **检验与预测**：用历史检验（第六、七章），体系结构与战争风险（第九章），中国能否和平崛起（第十章）。\n\n**作者的一个特点**：他坚持理论不只解释过去，还要敢于预测未来。这让全书观点鲜明，也招来不少批评（第 21 课专门讨论各派的批评）。\n\n## 精读页入口\n\n打开研习录：https://claude.ai/artifact/LpwLZchfacKZAnJs577MvM\n\n路径：书架 →《大国政治的悲剧》（或地址栏末尾直接用 `#b-tragedy`）→ 章节列表里点开“第一章 导论”，看导读要点、大国的定义和 4 张概念卡。第一章没有单独的精读稿，第二章的精读稿已经写好，可以先扫一眼它的“五个基本假设”单元，下周读起来会快很多。\n\n## 思考题（每题写两三句即可）\n\n1. **一句话复述**：不看书，用一句话说出作者心中“大国政治的悲剧”是什么意思。说不出来，回头再读开篇和核心主张两块。\n2. **三条路线**：用一句话分别概括人性现实主义、防御性现实主义、进攻性现实主义对“国家想要多少权力”的回答。再想一想：防御性现实主义和进攻性现实主义的出发点相同，为什么结论不同？\n3. **检验前提**：作者说冲突源于结构而不是恶意。找一个你熟悉的历史冲突（哪个时代都行），问自己：如果换一位更温和的领导人，冲突会不会避免？你的答案是支持还是削弱作者的前提？\n\n<details>\n<summary>思路提示（自己写完再看）<\/summary>\n\n1. 参考说法：在没有上级权威、又看不清彼此意图的世界里，大国为了生存只能不断扩大相对权力，结果即使谁都不想打仗，冲突也会反复发生。关键词是“结构”“生存”“无恶意也会冲突”。\n2. 人性现实主义：权力欲出自人性，所以要权力。防御性现实主义：要够用的安全就停，扩张太多会被制衡。进攻性现实主义：能多就多，最好成为地区霸主。两者分歧在于对“扩张代价”的估计：防御性现实主义认为体系会惩罚过度扩张；进攻性现实主义认为相对权力多一分就安全一分，机会合适时扩张是划算的。\n3. 没有标准答案。思路是区分两类因素：如果换了领导人，冲突的根源（实力消长、互相猜疑、无处求助）依然存在，冲突大概率只是推迟或换个形式，这支持作者；如果冲突主要来自某个领导人的个人野心或国内政治，换人就能避免，这就削弱作者的前提。第 21 课讨论自由主义、建构主义的批评时会再回到这个问题。\n\n<\/details>\n\n## 学完自查\n\n- [ ] 能用一句话说出“悲剧”的含义\n- [ ] 能画出三条现实主义路线的对比表\n- [ ] 能按顺序说出论证链条的五环\n- [ ] 3 道思考题各写了两三句\n", "py-01": "# Python 第 1 课 · 环境：Anaconda 与 Jupyter，第一个程序\n\n> 45 分钟 · Python 第 1 / 24 课\n\n## 本课目标\n\n1. 会从 Anaconda 打开 Jupyter Notebook，新建、改名、保存一个笔记本。\n2. 分清两种单元格：**Code**（代码）和 **Markdown**（文字说明），会用快捷键运行。\n3. 会用 `print()` 输出、用 `#` 写注释、把 Python 当计算器用。\n4. 看得懂最常见的报错，知道从哪一行找问题。\n\n## 讲解一：Anaconda、Jupyter、Python 是什么关系\n\n- **Python**：编程语言本身。\n- **Anaconda**：一个“工具大礼包”，装好了 Python 和几百个常用库（pandas 处理表格、openpyxl 读写 Excel 等），省得一个个装。\n- **Jupyter Notebook**：在浏览器里写 Python 的“笔记本”。一份笔记本（`.ipynb` 文件）由很多**单元格**组成，每格可以单独运行、马上看到结果——很适合边学边试，也适合一步步处理一份 Excel：读进来 → 看一眼 → 清洗 → 再看一眼 → 导出。\n\n可以这样类比：Python 是发动机，Anaconda 是整辆车，Jupyter 是驾驶座。\n\n## 讲解二：打开并建好今天的笔记本（约 8 分钟）\n\n1. 开始菜单搜 **Anaconda Navigator** → 在 Jupyter Notebook 那格点 **Launch**（也可以开始菜单直接搜 *Jupyter Notebook*）。浏览器会打开一个文件列表页，背后还有一个黑色窗口——**别关它**，关了 Jupyter 就停了。\n2. 进到练习文件夹（建议 `D:\\研习录\\python`）。\n3. 右上角 **New → Python 3 (ipykernel)**，点左上角的 *Untitled*，改名为 `01_第一个程序`。\n4. 保存：`Ctrl + S`。Jupyter 也会每隔几分钟自动保存。\n\n**两种模式**（Jupyter 最容易困惑的地方）：\n\n| 模式 | 怎么进入 | 单元格左边框 | 这时按键的作用 |\n|---|---|---|---|\n| 编辑模式 | 在单元格里点一下，或按 `Enter` | 绿色（新版为蓝色、有光标） | 打字 |\n| 命令模式 | 按 `Esc` | 蓝色、没有光标 | 按单个字母操作整个单元格 |\n\n**常用快捷键**（先记前四个）：\n\n| 快捷键 | 作用 |\n|---|---|\n| `Shift + Enter` | 运行当前格，跳到下一格（最常用） |\n| `Ctrl + Enter` | 运行当前格，停在原地 |\n| `Esc` 然后 `B` | 在下方插入新单元格（Below） |\n| `Esc` 然后 `M` / `Y` | 把单元格切换成 Markdown / Code |\n| `Esc` 然后 `D D` | 删除单元格（按两次 D） |\n| `Esc` 然后 `Z` | 撤销删除 |\n\n单元格左边的 `In [3]:` 表示这是第 3 个被运行的格；正在运行时显示 `In [*]:`。\n\n## 讲解三：第一个程序\n\n依次把下面每段放进一个单独的单元格，`Shift + Enter` 运行。\n\n**单元格 1：输出一句话**\n\n```python\nprint(\"hello, 研习录\")\n```\n\n- `print()` 是一个**函数**：括号里放什么，就把什么显示出来。\n- 文字要用**英文引号**包起来，单引号 `'...'` 和双引号 `\"...\"` 都行，前后要一致。被引号包起来的文字叫**字符串**（string）。\n\n**单元格 2：注释和多行输出**\n\n```python\n# 井号后面是注释，Python 不执行，用来写说明\nprint(\"第一行\")\nprint(\"第二行\")   # 注释也可以写在代码后面\nprint(\"姓名：\", \"赵小一\", \"金额：\", 1200)\n```\n\n输出：\n\n```\n第一行\n第二行\n姓名： 赵小一 金额： 1200\n```\n\n`print()` 里可以放好几样东西，用逗号隔开，输出时自动用空格连起来。注意 `1200` 没加引号——它是数字，不是文字。\n\n**单元格 3：把 Python 当计算器**\n\n```python\nprint(1200 + 800)        # 加\nprint(1500 - 600.5)      # 减\nprint(950 * 12)          # 乘：用 * 不是 ×\nprint(6250.5 / 6)        # 除：用 / 不是 ÷，结果总是小数\nprint(17 // 5, 17 % 5)   # 整除取商、取余数\nprint(1.05 ** 3)         # 乘方：1.05 的 3 次方\n```\n\n输出：\n\n```\n2000\n899.5\n11400\n1041.75\n3 2\n1.157625\n```\n\n**单元格 4：单元格最后一行的值会自动显示**\n\n```python\n1.10 * 0.95 * 1.08 - 1\n```\n\n不写 `print`，Jupyter 也会显示 `0.12860000000000005`。末尾那串 `0000000005` 是计算机存小数的正常误差，不是算错了。想要整齐，用 `round(数字, 位数)`：\n\n```python\nround(1.10 * 0.95 * 1.08 - 1, 4)\n```\n\n结果 `0.1286`——正好是今天 CFA 课里多期持有期收益率的算法，以后算 CFA 题可以直接用 Jupyter 验算。\n\n**单元格 5：Markdown 单元格写笔记**\n\n新建一格，按 `Esc` 再按 `M` 切成 Markdown，输入：\n\n```markdown\n# 第 1 课：第一个程序\n- `print()` 输出\n- `#` 写注释\n- **Shift + Enter** 运行\n```\n\n运行后变成排好版的标题和列表。双击可以再改。养成习惯：每个笔记本开头写一格 Markdown，说明这个笔记本是干什么的。\n\n**单元格 6：先尝一口——三行代码生成并读回一个 Excel**\n\n```python\nimport pandas as pd\n\ndf = pd.DataFrame({\"姓名\": [\"赵小一\", \"钱小二\", \"孙小三\"], \"金额\": [1200, 800, 1500]})\ndf.to_excel(\"01_试一试.xlsx\", index=False)\npd.read_excel(\"01_试一试.xlsx\")\n```\n\n运行后显示一张三行的小表，文件列表页里多了 `01_试一试.xlsx`，可以用 Excel 打开看看。今天**不要求看懂**这几行——第 13 课左右学 pandas 时会逐行讲。先知道：以后成千上万行的 Excel 清洗、比对，就是这样几行代码完成的。\n\n（如果报 `No module named 'openpyxl'`：新建一格运行 `%pip install openpyxl`，然后菜单 *Kernel → Restart*，再从单元格 6 重新运行。）\n\n## 讲解四：看懂报错\n\n故意运行下面这格：\n\n```python\nprint(\"hello)\n```\n\n会看到类似：\n\n```\n  Cell In[7], line 1\n    print(\"hello)\n          ^\nSyntaxError: unterminated string literal (detected at line 1)\n```\n\n读报错的顺序：**先看最后一行**（错误类型 + 说明），**再看 line 几和 `^` 指的位置**。`SyntaxError` 是语法错误，`unterminated string literal` 的意思是“字符串没有结束”——少了后半个引号。\n\n最常见的三种：\n\n| 报错 | 原因 | 例子 |\n|---|---|---|\n| `SyntaxError` | 语法写错：少引号、少括号、用了中文标点 | `print（\"hi\"）` |\n| `NameError: name 'xxx' is not defined` | 用了一个 Python 不认识的名字：拼错、大小写错、文字忘加引号 | `Print(\"hi\")`、`print(hello)` |\n| `TypeError` | 类型不对，比如文字和数字直接相加 | `\"金额\" + 1200` |\n\nPython **区分大小写**：`print` 对，`Print` 错。\n\n## 练习（由易到难）\n\n1. 新建一格，输出两行：第一行是你的名字（随便写个昵称也行），第二行是 `今天开始学 Python`。\n2. 一份虚构补贴名单的 6 笔金额是 1200、800、1500、600.5、1200、950。用一个单元格算出**合计**和**平均**（平均 = 合计 ÷ 6），分别输出。\n3. 在笔记本最上方插入一个 Markdown 单元格，写一个一级标题“第 1 课练习”，下面用列表写出今天学到的三个快捷键。（提示：先点第一格，`Esc` 后按 `A` 是在**上方**插入。）\n4. 下面三格各有一个错误，先运行看报错，说出错误类型，再改对：\n   ```python\n   print（\"第一题\"）\n   ```\n   ```python\n   Print(\"第二题\")\n   ```\n   ```python\n   print(\"合计：\" + 6250.5)\n   ```\n5. 贴近实际：某项补贴按人头发放，每人每月 450 元。青石镇 36 人发 12 个月，白沙乡 28 人发 10 个月。用一个单元格分别算出两个乡镇的发放总额和两地合计，输出成这样的三行（数字自己算出来，不要手打）：\n   ```\n   青石镇： ……\n   白沙乡： ……\n   合计： ……\n   ```\n   再想一想：如果有 300 个乡镇，这样一行行写还行得通吗？（后面学列表、循环和 pandas 就是为了解决这个。）\n\n## 常见错误\n\n- **关掉了黑色窗口**：Jupyter 停止运行，网页上出现 *Kernel 连接断开*。重新从 Anaconda 打开即可，笔记本已保存的内容还在。\n- **中文标点**：`（）`、`“”`、`，` 都会导致 `SyntaxError`。代码里的符号一律英文半角，引号**里面**的中文没关系。\n- **在命令模式下打字**：按了一串字母却没输入进去，反而插入、删除了单元格。先 `Esc` 再按 `Z` 撤销，然后点进单元格再打字。\n- **单元格停在 `In [*]` 不动**：上一格还没跑完或卡住。点工具栏的 ■（Interrupt），不行就 *Kernel → Restart*。\n- **重启后报 `NameError`**：重启会清空内存，前面单元格定义过的东西没了。从上往下重新运行一遍（菜单 *Run → Run All Cells*，旧版是 *Cell → Run All*）。\n\n<details>\n<summary>Python 练习答案<\/summary>\n\n1.\n```python\nprint(\"小明\")   # 换成你自己的名字或昵称\nprint(\"今天开始学 Python\")\n```\n\n2.\n```python\nprint(\"合计：\", 1200 + 800 + 1500 + 600.5 + 1200 + 950)\nprint(\"平均：\", (1200 + 800 + 1500 + 600.5 + 1200 + 950) / 6)\n```\n输出 `合计： 6250.5`、`平均： 1041.75`。注意第二行要加括号：先加再除。不加括号写成 `1200 + 800 + ... + 950 / 6`，只有最后的 950 被除以 6。\n\n3. Markdown 单元格内容示例：\n```markdown\n# 第 1 课练习\n- Shift + Enter：运行并跳到下一格\n- Esc 然后 B：在下方插入单元格\n- Esc 然后 M：切换成 Markdown\n```\n\n4.\n- 第一格：`SyntaxError`（中文括号）。改为 `print(\"第一题\")`。\n- 第二格：`NameError: name 'Print' is not defined`（大小写）。改为 `print(\"第二题\")`。\n- 第三格：`TypeError: can only concatenate str (not \"float\") to str`（文字和数字不能用 `+` 拼）。改为 `print(\"合计：\", 6250.5)`，用逗号隔开。\n\n5.\n```python\nprint(\"青石镇：\", 450 * 36 * 12)\nprint(\"白沙乡：\", 450 * 28 * 10)\nprint(\"合计：\", 450 * 36 * 12 + 450 * 28 * 10)\n```\n输出：\n```\n青石镇： 194400\n白沙乡： 126000\n合计： 320400\n```\n300 个乡镇一行行写，既费时又容易抄错数字。下一课（周四）学**变量**，可以先把 450 存成 `per_month = 450`，标准一改，所有结果跟着变；再往后用列表和循环，300 行也只要几行代码。\n\n<\/details>\n", "rev-01": "# 周复盘 第 1 课 · 第 1 周复盘\n\n> 50 分钟 · 周复盘第 1 / 12 课\n\n## 本课目标\n\n1. 看清第 1 周实际走了多少，哪些课还欠着。\n2. 用 15 道小测检查 SQL 第 1 课、Python 第 1 课、CFA 第 1 课的核心内容；10 道术语题检查 CFA 第 1 课的英文术语。\n3. 做一个 25 分钟的小实战：用 SQL 建两张表、数笔数、目测比对，再用 Python 算出疑点金额和占比。\n\n> 这一周的课如果还没学，小测就当“预习测验”：做不出来的题，翻到对应讲义的那一节看完再做，答案对一对就算过了。\n\n## 时间安排（共 50 分钟）\n\n| 分钟 | 做什么 |\n|---|---|\n| 5 | 看下面的打卡统计，在“本周没完成的课”里勾出要补的 |\n| 15 | SQL、Python、CFA 小测各 5 题 |\n| 5 | CFA 英文术语小测 10 题 |\n| 25 | 小实战：培训费报销和签到表比对 |\n\n## 本周打卡统计\n\n第 1 周是 10 月 12 日（周一）到 10 月 17 日（周六），每天早上都推送了讲义，但**六天都没有打卡**，按规则全部记为“没学”，进度都还停在第 1 课。\n\n| 日期 | 安排 | 打卡 |\n|---|---|---|\n| 10/12 周一 | 旧英语时段、SQL 1、CFA 1 | 无 |\n| 10/13 周二 | 旧英语时段、Python 1、CFA 1 | 无 |\n| 10/14 周三 | 旧英语时段、SQL 1、CFA 1 | 无 |\n| 10/15 周四 | 电影第 1 段、Python 1、CFA 1 | 无 |\n| 10/16 周五 | 电影第 1 段、SQL 1、CFA 1 | 无 |\n| 10/17 周六 | 电影第 1 段、地缘政治 1、CFA 1 | 无 |\n\n没打卡不一定是没学。如果其中哪天其实学了，晚上打卡时说一句“10/16 SQL 学完了”这样，就能补记，进度会跟着往前走。\n\n## 本周没完成的课\n\n- [ ] 英语·电影 第 1 段（跟读播放器，90 分钟）\n- [ ] [SQL 第 1 课 · 数据库、表、行和列](../sql/01.md)\n- [ ] [Python 第 1 课 · Anaconda 与 Jupyter，第一个程序](../py/01.md)\n- [ ] [CFA 第 1 课 · Q1 收益率与回报（1/4）](../cfa/01.md)\n- [ ] [地缘政治 第 1 课 · 第一章 导论](../geo/01.md)\n\n这些课不需要专门找时间“补”：课表按顺序推进，下一次排到这一科，打开的还是同一个讲义。真正要做的只有一件事——学完当天晚上打卡。\n\n---\n\n## SQL 小测（5 题）\n\n1. 把下面四样东西和 Excel 里的概念对上：数据库、表、行、列。\n2. 报销金额这一列，建表时应该用哪种类型？日期在 SQLite 里通常怎么存？\n3. 下面这句为什么会报错？\n\n   ```sql\n   CREATE TABLE meal_claims (\n       claim_no INTEGER PRIMARY KEY,\n       name     TEXT,\n       amount   REAL,\n   );\n   ```\n\n4. 写一句查询：从 `travel_claims` 里只取姓名和金额两列，结果里列名显示为“姓名”“金额”。\n5. 插入一行时报 `UNIQUE constraint failed: travel_claims.claim_no`，说明发生了什么？这在核查工作里有什么用？\n\n<details>\n<summary>SQL 小测答案<\/summary>\n\n1. 数据库 ↔ 整个工作簿（SQLite 里是一个 `.db` 文件）；表 ↔ 一个工作表；行 ↔ 一行记录；列 ↔ 一列加列标题。\n2. 金额用 `REAL`（小数）。日期用 `TEXT`，写成 `'2026-04-08'` 这种“年-月-日”格式，排序和比较都不会乱。\n3. 最后一列 `amount REAL` 后面多了一个逗号。最后一列后面不加逗号。\n4.\n   ```sql\n   SELECT name AS 姓名, amount AS 金额 FROM travel_claims;\n   ```\n5. 插入的报销单号已经存在。单号是主键，不能重复，所以“同一张单子登两次”在录入时就被挡住了，不用等人眼发现。\n\n<\/details>\n\n## Python 小测（5 题）\n\n1. 在 Jupyter 里，`Shift + Enter` 和 `Ctrl + Enter` 有什么区别？\n2. 下面这格输出什么？\n\n   ```python\n   print(\"合计：\", 300 + 450)\n   ```\n\n3. `17 // 5` 和 `17 % 5` 分别等于多少？\n4. 运行 `Print(\"hi\")` 会报哪种错？为什么？\n5. 下面这格的结果是多少？（先心算，再到 Jupyter 里验证）\n\n   ```python\n   round(1.08 * 0.95 - 1, 4)\n   ```\n\n<details>\n<summary>Python 小测答案<\/summary>\n\n1. 两者都运行当前单元格；`Shift + Enter` 运行后跳到下一格，`Ctrl + Enter` 运行后停在原地。\n2. `合计： 750`。逗号隔开的两样东西之间自动加一个空格。\n3. `3` 和 `2`。`//` 是整除取商，`%` 是取余数（17 = 5 × 3 + 2）。\n4. `NameError: name 'Print' is not defined`。Python 区分大小写，函数名是小写的 `print`。\n5. `0.026`。1.08 × 0.95 = 1.026，减 1 得 0.026——这正是“先涨 8% 再跌 5%”的两期持有期收益率 2.6%。\n\n<\/details>\n\n## CFA 小测（5 题，仿一级三选一）\n\n**1.** \"Lin could earn 5% by putting her savings in a one-year deposit, but she keeps the cash at home instead.\" The 5% is best described as a(n):\n\nA. required rate of return.\nB. opportunity cost.\nC. discount rate.\n\n**2.** Given: real risk-free rate 1.8%, inflation premium 2.4%, default risk premium 1.5%, liquidity premium 0.6%, maturity premium 0.9%. The required return on the bond is closest to:\n\nA. 4.2%\nB. 5.7%\nC. 7.2%\n\n**3.** Two bonds from the same issuer have the same maturity and the same terms. The heavily traded bond yields 6.1%, and the thinly traded bond yields 6.6%. The difference is most likely explained by the:\n\nA. liquidity premium.\nB. maturity premium.\nC. default risk premium.\n\n**4.** An investor buys a share at $50.00, receives a dividend of $1.50, and sells the share at $53.00. The holding period return is closest to:\n\nA. 3.0%\nB. 6.0%\nC. 9.0%\n\n**5.** A fund returns 10%, −10%, and 8% in three consecutive years. The three-year holding period return is closest to:\n\nA. 8.00%\nB. 6.92%\nC. 2.31%\n\n<details>\n<summary>CFA 小测答案与解析<\/summary>\n\n1. **B**。关键词 *could earn … instead*：把钱放在家里，放弃了本可以赚的 5%，是机会成本。\n2. **C**。1.8 + 2.4 + 1.5 + 0.6 + 0.9 = 7.2%。B 只加了前三项，漏了流动性和期限溢价；A 只是名义无风险利率（1.8 + 2.4）。\n3. **A**。发行人相同（违约风险一样）、期限相同（期限溢价一样），差别只能来自“好不好卖”——流动性溢价，差 0.5%。\n4. **C**。(53.00 − 50.00 + 1.50) ÷ 50.00 = 4.50 ÷ 50 = 9.0%。B 漏了股息（3 ÷ 50 = 6%）；A 只算了股息收益率（1.5 ÷ 50 = 3%）。\n   计算器：`53 − 50 + 1.5 =` → `÷ 50 =` → `0.09`\n5. **B**。1.10 × 0.90 × 1.08 − 1 = 1.0692 − 1 = 6.92%。A 是直接相加（10 − 10 + 8）；C 是把 6.92% 除以 3 的错误“年均”算法。\n   计算器：`1.1 × 0.9 × 1.08 − 1 =` → `0.0692`\n   直觉检查：先涨 10% 再跌 10% 不是回到原点，而是 1.1 × 0.9 = 0.99，亏了 1%。\n\n<\/details>\n\n## CFA 英文术语小测（10 题）\n\n**A. 看中文说英文（1—5）**\n\n1. 机会成本\n2. 流动性溢价\n3. 持有期收益率\n4. 短期国库券\n5. 购买力\n\n**B. 填空：每句填一个术语（6—10）**\n\n可选：*discount rate · maturity premium · coupon · real return · default risk premium*\n\n6. With 7% nominal return and 3% inflation, the ______ was only about 4%.\n7. A higher ______ makes future cash flows worth less today.\n8. A 30-year bond usually carries a bigger ______ than a 2-year bond.\n9. The bond pays a ______ of 5% once a year.\n10. Bonds from weaker companies carry a higher ______.\n\n<details>\n<summary>术语小测答案<\/summary>\n\n1. opportunity cost /ˌɑːpərˈtuːnəti kɔːst/\n2. liquidity premium /lɪˈkwɪdəti ˈpriːmiəm/\n3. holding period return（HPR）/ˈhoʊldɪŋ ˈpɪriəd rɪˈtɜːrn/\n4. Treasury bill（T-bill）/ˈtreʒəri bɪl/\n5. purchasing power /ˈpɜːrtʃəsɪŋ ˈpaʊər/\n6. real return —— 名义回报 7%、通胀 3%，实际回报只有约 4%。\n7. discount rate —— 折现率越高，未来现金流的现值越低。\n8. maturity premium —— 30 年期债券的期限溢价通常比 2 年期大。\n9. coupon —— 这只债券每年付一次 5% 的票息。\n10. default risk premium —— 实力较弱公司的债券违约风险溢价更高。\n\n错了的词，回到 [CFA 第 1 课的“英文术语”一节](../cfa/01.md) 把例句再读一遍。\n\n<\/details>\n\n---\n\n## 小实战：培训费报销和签到表比对（25 分钟）\n\n**场景**：一个虚构单位开了三期内部培训，每期按人收培训费，由个人先垫付、再报销。你手上有两份材料：《培训费报销台账》（8 笔）和《培训签到表》（6 条）。要找出“报了这一期的培训费，这一期却没有签到”的记录，算出涉及金额和占比。\n\n只用本周学过的东西：`CREATE TABLE`、`INSERT`、`SELECT`、`COUNT(*)`、`AS`，加上 Python 的 `print` 和四则运算。\n\n### 第一步：建表加数据（SQL，DB Browser 里运行）\n\n打开 `practice.db` → **Execute SQL** → 粘贴整段 → `Ctrl + Enter` → **Write Changes**。\n\n```sql\n-- 周复盘 1：培训费报销台账与签到表（数据全部虚构）\nDROP TABLE IF EXISTS training_claims;\nDROP TABLE IF EXISTS sign_in;\n\nCREATE TABLE training_claims (\n    claim_no     INTEGER PRIMARY KEY,   -- 报销单号\n    emp_no       TEXT,                  -- 工号（虚构格式）\n    name         TEXT,                  -- 姓名\n    course_date  TEXT,                  -- 培训日期（哪一期）\n    fee          REAL                   -- 报销的培训费（元）\n);\n\nINSERT INTO training_claims (claim_no, emp_no, name, course_date, fee) VALUES\n    (3001, 'E-0201', '甲小禾', '2026-05-06', 800),\n    (3002, 'E-0202', '乙小苗', '2026-05-06', 800),\n    (3003, 'E-0203', '丙小松', '2026-05-06', 800),\n    (3004, 'E-0204', '丁小竹', '2026-05-13', 1200),\n    (3005, 'E-0202', '乙小苗', '2026-05-13', 1200),\n    (3006, 'E-0205', '戊小梅', '2026-05-20', 650),\n    (3007, 'E-0203', '丙小松', '2026-05-20', 650),\n    (3008, 'E-0206', '己小兰', '2026-05-20', 650);\n\nCREATE TABLE sign_in (\n    sign_id      INTEGER PRIMARY KEY,   -- 签到序号\n    emp_no       TEXT,\n    name         TEXT,\n    course_date  TEXT\n);\n\nINSERT INTO sign_in (sign_id, emp_no, name, course_date) VALUES\n    (1, 'E-0201', '甲小禾', '2026-05-06'),\n    (2, 'E-0203', '丙小松', '2026-05-06'),\n    (3, 'E-0204', '丁小竹', '2026-05-13'),\n    (4, 'E-0202', '乙小苗', '2026-05-13'),\n    (5, 'E-0205', '戊小梅', '2026-05-20'),\n    (6, 'E-0206', '己小兰', '2026-05-20');\n```\n\n### 第二步：按顺序完成 5 个任务\n\n1. **先数笔数**：分别数出两张表各有几行。台账应为 8 笔，签到应为 6 条。对不上就先检查脚本有没有完整运行。\n2. **取出比对用的列**：从台账取 `emp_no, name, course_date, fee`，列名显示为“工号”“姓名”“培训日期”“培训费”；从签到表取 `emp_no, name, course_date`，列名同样用中文。\n3. **试一试主键**：有人说 3005 这笔“漏登了”，要求再登一次（3005，E-0202，乙小苗，2026-05-13，1200）。执行这句 `INSERT`，看会发生什么，用一句话写下结论。\n4. **目测比对**：把第 2 题的两个结果并排看，逐笔核对台账里的每一笔，**工号和培训日期都对得上**的才算签到了。找出没有对应签到的报销单号。注意：只看名字的话会漏掉谁、错判谁？\n5. **算金额和占比（Python，Jupyter 里运行）**：用 `print` 输出三行——台账培训费合计、疑点金额合计、疑点金额占合计的百分比（保留两位小数）。数字从第 4 题的结果来，算式让 Python 算，不要手算后再抄。\n\n### 常见错误\n\n- 两张表都叫 `course_date`，取列时别把签到表的日期当成台账的日期——分开两句查询，先跑一句看清楚再跑下一句。\n- 第 3 题报错后，别以为是自己写错了：读一读报错最后一行。\n- 第 5 题百分比要先除再乘 100，括号别漏：`(疑点) / 合计 * 100`。\n\n<details>\n<summary>小实战答案<\/summary>\n\n**1.**\n\n```sql\nSELECT COUNT(*) FROM training_claims;   -- 8\nSELECT COUNT(*) FROM sign_in;           -- 6\n```\n\n**2.**\n\n```sql\nSELECT emp_no AS 工号, name AS 姓名, course_date AS 培训日期, fee AS 培训费\nFROM training_claims;\n\nSELECT emp_no AS 工号, name AS 姓名, course_date AS 培训日期\nFROM sign_in;\n```\n\n**3.** 报错 `UNIQUE constraint failed: training_claims.claim_no`。3005 已经登过了，“漏登”的说法不成立；主键直接挡住了一单两报。\n\n**4.** 逐笔核对：\n\n| 单号 | 工号 | 姓名 | 培训日期 | 有没有对应签到 |\n|---|---|---|---|---|\n| 3001 | E-0201 | 甲小禾 | 05-06 | 有（签到 1） |\n| 3002 | E-0202 | 乙小苗 | 05-06 | **没有**——她只在 05-13 签了到 |\n| 3003 | E-0203 | 丙小松 | 05-06 | 有（签到 2） |\n| 3004 | E-0204 | 丁小竹 | 05-13 | 有（签到 3） |\n| 3005 | E-0202 | 乙小苗 | 05-13 | 有（签到 4） |\n| 3006 | E-0205 | 戊小梅 | 05-20 | 有（签到 5） |\n| 3007 | E-0203 | 丙小松 | 05-20 | **没有**——他只在 05-06 签了到 |\n| 3008 | E-0206 | 己小兰 | 05-20 | 有（签到 6） |\n\n疑点：**3002（乙小苗，800 元）和 3007（丙小松，650 元）**。\n\n只看名字会出问题：乙小苗、丙小松的名字都出现在签到表里，只比名字会把他们判成“都签了到”，两笔疑点全漏掉。要“工号 + 日期”一起对，才是“同一个人、同一期”。\n\n**5.**\n\n```python\ntotal = 800 * 3 + 1200 * 2 + 650 * 3\nsuspect = 800 + 650\nprint(\"台账合计：\", total)\nprint(\"疑点金额：\", suspect)\nprint(\"疑点占比：\", round(suspect / total * 100, 2), \"%\")\n```\n\n输出：\n\n```\n台账合计： 6750\n疑点金额： 1450\n疑点占比： 21.48 %\n```\n\n这里用了 `total = ...` 把结果先存起来再用——这叫**变量**，是 Python 第 2 课的内容，提前用一下。\n\n**预告**：学到 JOIN 以后，第 4 题一句话就能筛出来（现在不要求看懂）：\n\n```sql\nSELECT t.claim_no, t.name, t.course_date, t.fee\nFROM training_claims t\nLEFT JOIN sign_in s\n  ON t.emp_no = s.emp_no AND t.course_date = s.course_date\nWHERE s.sign_id IS NULL;\n```\n\n<\/details>\n\n## 下周怎么走\n\n- 每天只要做两件事：照路线单走，晚上 9 点回一句打卡。打卡比学多少更重要——不打卡，进度就不会往前走。\n- 每天的量排不开，就先只走电影一站（首页“保底”），或者回复一句，把每天的量调小。\n", "sql-01": "# SQL 第 1 课 · 数据库、表、行和列：装好 DB Browser，建第一张表\n\n> 45 分钟 · SQL 第 1 / 36 课\n\n> 还没装 DB Browser 的话，先花 10 分钟按 [准备日讲义](../../daily/2026-10-11.md) 第一节装好，建一个 `practice.db`。\n\n## 本课目标\n\n1. 说清楚数据库、表、行、列分别是什么。\n2. 会用 `CREATE TABLE` 建表，知道 SQLite 常用的三种类型 `INTEGER`、`REAL`、`TEXT`，知道主键是干什么的。\n3. 会用 `INSERT INTO` 插入数据，用 `SELECT ... FROM` 把表查出来。\n\n## 讲解：一张报销台账就是一张表\n\n设想你在核查一个虚构单位的《差旅报销台账》，要和《请假登记表》对照，看有没有人“请假那天却报了出差”。\n\n| Excel 里 | 数据库里 | 说明 |\n|---|---|---|\n| 整个工作簿 | **数据库**（database，SQLite 里就是一个 `.db` 文件） | 装很多张表 |\n| 一个工作表 | **表**（table） | 一类事物一张：报销一张，请假一张 |\n| 一行 | **行**（row / record） | 一笔报销、一次请假 |\n| 一列 + 列标题 | **列**（column / field） | 姓名、工号、金额、日期…… |\n\n和 Excel 的关键区别：**每一列在建表时就定好类型**。\n\n- `INTEGER`：整数（编号、天数）\n- `REAL`：小数（金额）\n- `TEXT`：文本（姓名、工号、日期。SQLite 的日期统一写成 `'2026-04-08'` 这样的文本，按这个格式排序、比较都不会乱）\n\n**主键**（`PRIMARY KEY`）是每一行的“身份证”，不能重复。台账里的报销单号天然适合当主键：同一张单子不可能登两次——如果真登了两次，数据库会直接报错，这本身就是一道核查关口。\n\n## 建表加数据脚本\n\n打开 DB Browser → 打开 `practice.db` → **Execute SQL** → 粘贴整段 → `Ctrl + Enter` → 点 **Write Changes** 保存。\n\n```sql\n-- 第 1 课：差旅报销台账（数据全部虚构）\nDROP TABLE IF EXISTS travel_claims;\n\nCREATE TABLE travel_claims (\n    claim_no   INTEGER PRIMARY KEY,   -- 报销单号，主键\n    name       TEXT,                  -- 姓名\n    emp_no     TEXT,                  -- 工号（虚构格式）\n    dept       TEXT,                  -- 科室\n    trip_date  TEXT,                  -- 出差日期\n    city       TEXT,                  -- 出差地（虚构地名）\n    amount     REAL                   -- 报销金额（元）\n);\n\nINSERT INTO travel_claims (claim_no, name, emp_no, dept, trip_date, city, amount) VALUES\n    (2001, '甲一明', 'E-0101', '综合科', '2026-04-08', '云溪市', 1320.0),\n    (2002, '乙二红', 'E-0102', '财务科', '2026-04-08', '云溪市', 980.5),\n    (2003, '丙三华', 'E-0103', '项目科', '2026-04-10', '石桥县', 2150.0),\n    (2004, '丁四强', 'E-0104', '项目科', '2026-04-15', '北岭市', 760.0),\n    (2005, '戊五芳', 'E-0105', '综合科', '2026-04-15', '北岭市', 1890.0),\n    (2006, '丙三华', 'E-0103', '项目科', '2026-04-22', '云溪市', 1405.0),\n    (2007, '己六军', 'E-0106', '财务科', '2026-04-23', '石桥县', 640.0);\n```\n\n切到 **Browse Data**，选 `travel_claims`，能看到 7 行。\n\n逐句看：\n\n- `DROP TABLE IF EXISTS ...;`——有同名表先删掉，脚本可以反复跑，不会报“表已存在”。\n- `CREATE TABLE 表名 ( 列名 类型, ... );`——列之间逗号隔开，**最后一列后面不加逗号**。`--` 后面是注释，不执行。\n- `INSERT INTO 表名 (列1, 列2, ...) VALUES (...), (...);`——值和列一一对应；文本用**单引号**，数字不加引号；多行之间逗号，整句末尾分号。\n\n## 示例查询\n\n选中某一句再按 `Ctrl + Enter`，就只执行那一句。\n\n**查询 1：看整张表**\n\n```sql\nSELECT * FROM travel_claims;\n```\n\n`SELECT` = 取数据；`*` = 所有列；`FROM travel_claims` = 从这张表取。结果 7 行 7 列。\n\n**查询 2：只看需要的列，并按自己想要的顺序排列**\n\n```sql\nSELECT trip_date, name, amount FROM travel_claims;\n```\n\n列的顺序就是你写的顺序。核查时常把日期放最前，方便和别的表对日期。\n\n**查询 3：数行数**\n\n```sql\nSELECT COUNT(*) FROM travel_claims;\n```\n\n结果 `7`。拿到台账先数笔数，和对方报的“共 7 笔”对得上，再往下做。\n\n**查询 4：给结果列起个中文名**\n\n```sql\nSELECT name AS 姓名, amount AS 金额 FROM travel_claims;\n```\n\n`AS` 只改结果里显示的列名，不改表本身。导出给别人看时很方便。\n\n**查询 5：看表结构**\n\n```sql\nPRAGMA table_info(travel_claims);\n```\n\n列出每一列的名字和类型，`pk = 1` 的是主键。忘了列名时用它查。\n\n## 练习（由易到难）\n\n1. 查出 `travel_claims` 的全部内容。\n2. 只查报销单号、姓名、金额三列，并把这三列显示为“单号”“姓名”“金额”。\n3. 补登一笔：单号 2008，庚七兰，工号 `E-0107`，综合科，2026-04-28，北岭市，1120 元。插入后数一数，应为 8 笔。\n4. 再执行一次第 3 题的 `INSERT`，会发生什么？读一读报错信息，用一句话说明它为什么是“好事”。\n5. 贴近实际：新建 `leave_records`（请假登记表），四列：`leave_id`（整数，主键）、`emp_no`（文本）、`name`（文本）、`leave_date`（文本），插入下面 3 行：\n   - 1，`E-0102`，乙二红，2026-04-08\n   - 2，`E-0104`，丁四强，2026-04-16\n   - 3，`E-0103`，丙三华，2026-04-22\n\n   然后分别查出报销台账的 `emp_no, name, trip_date` 和请假表的 `emp_no, name, leave_date`，**用眼睛比对**：谁在请假当天报了出差？丁四强算不算？为什么比对时要“工号 + 日期”两样都对上？\n\n## 常见错误\n\n- **中文标点**：`，` `（` `‘` 会报 `syntax error`。SQL 里的符号一律英文半角，引号里面的中文内容没关系。\n- **最后一列后面多逗号**：`amount REAL,)` 报错。\n- **文本没加引号**：`VALUES (2008, 庚七兰, ...)` 会报 `no such column: 庚七兰`——没加引号的字被当成了列名。\n- **列数和值数对不上**：7 个列名配 6 个值，报 `7 columns but 6 values were supplied`，数一数逗号。\n- **主键重复**：报 `UNIQUE constraint failed`。\n- **忘了 Write Changes**：关掉软件，数据就没了。\n\n<details>\n<summary>SQL 练习答案<\/summary>\n\n1.\n```sql\nSELECT * FROM travel_claims;\n```\n\n2.\n```sql\nSELECT claim_no AS 单号, name AS 姓名, amount AS 金额 FROM travel_claims;\n```\n\n3.\n```sql\nINSERT INTO travel_claims (claim_no, name, emp_no, dept, trip_date, city, amount) VALUES\n    (2008, '庚七兰', 'E-0107', '综合科', '2026-04-28', '北岭市', 1120);\n\nSELECT COUNT(*) FROM travel_claims;   -- 结果 8\n```\n\n4. 报错 `UNIQUE constraint failed: travel_claims.claim_no`。单号是主键，不允许重复，所以同一张单子登两次会被直接挡住。手工 Excel 台账里“一单两报”要靠人眼去发现，数据库在录入时就拦住了。\n\n5.\n```sql\nDROP TABLE IF EXISTS leave_records;\n\nCREATE TABLE leave_records (\n    leave_id    INTEGER PRIMARY KEY,\n    emp_no      TEXT,\n    name        TEXT,\n    leave_date  TEXT\n);\n\nINSERT INTO leave_records (leave_id, emp_no, name, leave_date) VALUES\n    (1, 'E-0102', '乙二红', '2026-04-08'),\n    (2, 'E-0104', '丁四强', '2026-04-16'),\n    (3, 'E-0103', '丙三华', '2026-04-22');\n\nSELECT emp_no, name, trip_date FROM travel_claims;\nSELECT emp_no, name, leave_date FROM leave_records;\n```\n\n比对结果：\n\n- **乙二红**（E-0102）：4 月 8 日请假，同一天报了云溪市出差 980.5 元（单号 2002）——疑点。\n- **丙三华**（E-0103）：4 月 22 日请假，同一天报了云溪市出差 1405 元（单号 2006）——疑点。注意他 4 月 10 日那笔没问题，所以不能只看“名字出现在两张表里”。\n- **丁四强**（E-0104）：出差 4 月 15 日，请假 4 月 16 日，日期不同，**不算**。\n\n为什么要“工号 + 日期”：只比工号，丙三华的两笔会被一起标出来，误伤正常的那笔，丁四强也会被误标；只比日期，会把同一天请假和出差的不同人凑到一起。两样都对上才是同一个人、同一天。\n\n预告：以后一句话就能筛出来（今天不要求看懂）：\n\n```sql\nSELECT t.name, t.trip_date, t.amount\nFROM travel_claims t\nJOIN leave_records l\n  ON t.emp_no = l.emp_no AND t.trip_date = l.leave_date;\n```\n\n<\/details>\n\n---\n\n## 加练：换一个场景再做一遍（补贴名单比对）\n\n> 同一课的另一套讲解和练习，场景是补贴发放名单和在职人员名单。正课学完还有余力再做。\n\n### 本课目标\n\n1. 说清楚数据库、表、行、列分别是什么。\n2. 会用 `CREATE TABLE` 建表，知道 SQLite 常用的三种类型 `INTEGER`、`REAL`、`TEXT`。\n3. 会用 `INSERT INTO` 插入数据，用 `SELECT * FROM` 把表查出来。\n\n### 讲解：用 Excel 来类比\n\n设想你手上有一份《补贴发放名单》Excel，要和另一份《在职人员名单》核对，看有没有人“既领补贴又在编”。\n\n| Excel 里 | 数据库里 | 说明 |\n|---|---|---|\n| 整个工作簿（.xlsx 文件） | **数据库**（database，SQLite 里就是一个 `.db` 文件） | 装很多张表 |\n| 一个工作表（sheet） | **表**（table） | 一类事物一张表：补贴名单一张、在职名单一张 |\n| 一行 | **行**（row / record，记录） | 一个人、一笔发放 |\n| 一列 + 列标题 | **列**（column / field，字段） | 姓名、证件号、金额…… |\n\n和 Excel 最大的区别：**数据库的每一列在建表时就规定好类型**。“金额”列规定是数字，就不会混进“一千二”这样的文字；“证件号”规定是文本，开头的 0 不会被吃掉——这两件事在 Excel 里都是核查时的常见坑。\n\nSQLite 最常用三种类型：\n\n- `INTEGER`：整数（序号、人数）\n- `REAL`：小数（金额）\n- `TEXT`：文本（姓名、证件号、日期——SQLite 的日期统一写成 `'2026-03-05'` 这种文本）\n\n**主键**（`PRIMARY KEY`）：每张表挑一列当“身份证”，每行的值都不同、不能重复。今天用一个简单的序号 `id` 当主键。\n\n### 建表加数据脚本\n\n打开 DB Browser → 打开昨天建的 `practice.db`（没有就 *New Database* 新建一个）→ 切到 **Execute SQL** → 粘贴整段 → `Ctrl + Enter`。\n\n```sql\n-- 第 1 课：补贴发放名单（数据全部虚构）\nDROP TABLE IF EXISTS subsidy_list;\n\nCREATE TABLE subsidy_list (\n    id        INTEGER PRIMARY KEY,   -- 序号，主键\n    name      TEXT,                  -- 姓名\n    id_no     TEXT,                  -- 证件号（虚构格式）\n    town      TEXT,                  -- 乡镇\n    amount    REAL,                  -- 发放金额（元）\n    pay_date  TEXT                   -- 发放日期\n);\n\nINSERT INTO subsidy_list (id, name, id_no, town, amount, pay_date) VALUES\n    (1, '赵小一', 'XN-0000-0001', '青石镇', 1200,  '2026-03-05'),\n    (2, '钱小二', 'XN-0000-0002', '青石镇', 800,   '2026-03-05'),\n    (3, '孙小三', 'XN-0000-0003', '白沙乡', 1500,  '2026-03-06'),\n    (4, '李小四', 'XN-0000-0004', '白沙乡', 600.5, '2026-03-06'),\n    (5, '周小五', 'XN-0000-0005', '红柳镇', 1200,  '2026-03-07'),\n    (6, '吴小六', 'XN-0000-0006', '红柳镇', 950,   '2026-03-07');\n```\n\n执行后点 **Write Changes** 保存。切到 **Browse Data** 页，选 `subsidy_list`，能看到 6 行，像一张 Excel 表。\n\n逐句看：\n\n- `DROP TABLE IF EXISTS subsidy_list;`——如果已有同名表就先删掉。这样脚本可以反复运行，不会报“表已存在”。\n- `CREATE TABLE 表名 ( 列名 类型, ... );`——建表。列之间用逗号隔开，**最后一列后面不加逗号**。\n- `INSERT INTO 表名 (列1, 列2, ...) VALUES (值1, 值2, ...), (...);`——插入数据。值的顺序和前面列的顺序一一对应；文本用**单引号**，数字不加引号；多行之间用逗号，整句最后一个分号。\n- `--` 后面是注释，SQL 不执行，用来写说明。\n\n### 示例查询\n\n在 Execute SQL 页，**选中某一句再按 `Ctrl + Enter`**，就只执行选中的那句。\n\n**查询 1：看整张表**\n\n```sql\nSELECT * FROM subsidy_list;\n```\n\n`SELECT` 表示“我要取数据”，`*` 表示“所有列”，`FROM subsidy_list` 表示“从这张表取”。结果：6 行 6 列。\n\n**查询 2：只看几列**\n\n```sql\nSELECT name, town, amount FROM subsidy_list;\n```\n\n把 `*` 换成列名，列名之间逗号隔开。结果只有姓名、乡镇、金额三列，顺序就按你写的顺序。（下一课专门讲 SELECT。）\n\n**查询 3：数一数有几行**\n\n```sql\nSELECT COUNT(*) FROM subsidy_list;\n```\n\n`COUNT(*)` 数行数，结果是 `6`。拿到一份新名单，先数行数是核查的第一步——和对方说的人数对不上，后面就不用往下做了。\n\n**查询 4：看表结构**\n\n```sql\nPRAGMA table_info(subsidy_list);\n```\n\n`PRAGMA` 是 SQLite 特有的命令，列出每一列的名字和类型（`pk` 为 1 的那列是主键）。忘了列名叫什么时用它查。\n\n### 练习（由易到难）\n\n1. 查出 `subsidy_list` 的全部内容。\n2. 只查姓名和证件号两列。\n3. 青石镇新增一人：序号 7，郑小七，证件号 `XN-0000-0007`，金额 700，发放日期 2026-03-08。写 `INSERT` 插进去，再查姓名和金额，确认一共 7 行。\n4. 新建一张 `staff_list`（在职人员名单），四列：`staff_no`（整数，主键）、`name`（文本）、`id_no`（文本）、`dept`（文本），插入下面 3 行：\n   - 101，冯甲，`XN-0000-0101`，虚构局办公室\n   - 102，孙小三，`XN-0000-0003`，虚构局财务科\n   - 103，陈乙，`XN-0000-0103`，虚构局综合科\n5. 贴近实际：现在库里有两张表——补贴名单和在职名单。分别查出两张表的姓名和证件号，**用眼睛比对**：谁既在补贴名单上、又在在职名单上？想一想：为什么要用证件号比，而不是用姓名比？（几十行可以用眼睛，几万行就得靠 SQL——第 15 课左右的 JOIN 会教一句话搞定。）\n\n### 常见错误\n\n- **中文标点**：`，` `（` `‘` 会报 `syntax error`。SQL 符号一律英文半角，文本内容里的中文没关系。\n- **最后一列后面多了逗号**：`pay_date TEXT,)` 会报错。\n- **文本忘了加引号**：`VALUES (7, 郑小七, ...)` 会报 `no such column: 郑小七`——SQL 把没加引号的字当成了列名。\n- **用了双引号包文本**：SQLite 有时能容忍，但标准写法是单引号，养成习惯。\n- **主键重复**：再插一次 `id = 1` 会报 `UNIQUE constraint failed`。这正是主键的作用。\n- **忘了 Write Changes**：关掉软件后数据没了。\n\n<details>\n<summary>SQL 练习答案<\/summary>\n\n1.\n```sql\nSELECT * FROM subsidy_list;\n```\n\n2.\n```sql\nSELECT name, id_no FROM subsidy_list;\n```\n\n3.\n```sql\nINSERT INTO subsidy_list (id, name, id_no, town, amount, pay_date) VALUES\n    (7, '郑小七', 'XN-0000-0007', '青石镇', 700, '2026-03-08');\n\nSELECT name, amount FROM subsidy_list;\n```\n结果 7 行，最后一行是 郑小七 700.0。\n\n4.\n```sql\nDROP TABLE IF EXISTS staff_list;\n\nCREATE TABLE staff_list (\n    staff_no  INTEGER PRIMARY KEY,\n    name      TEXT,\n    id_no     TEXT,\n    dept      TEXT\n);\n\nINSERT INTO staff_list (staff_no, name, id_no, dept) VALUES\n    (101, '冯甲',   'XN-0000-0101', '虚构局办公室'),\n    (102, '孙小三', 'XN-0000-0003', '虚构局财务科'),\n    (103, '陈乙',   'XN-0000-0103', '虚构局综合科');\n```\n\n5.\n```sql\nSELECT name, id_no FROM subsidy_list;\nSELECT name, id_no FROM staff_list;\n```\n**孙小三**（`XN-0000-0003`）两边都有：在白沙乡领了 1500 元补贴，同时在虚构局财务科在职。\n用证件号比，是因为**姓名会重名、也会写错字**，而证件号对每个人唯一。实际工作中两份名单的姓名往往一样、证件号却不同（重名的两个人），或者姓名有出入、证件号相同（同一人录入时写错了字）——只看姓名两种情况都会判错。\n\n预告：以后一句话就能直接筛出来——\n\n```sql\nSELECT name FROM subsidy_list\nWHERE id_no IN (SELECT id_no FROM staff_list);\n```\n\n今天不要求看懂。\n\n<\/details>\n"};
</script>
<script>
(function () {
