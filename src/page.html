<meta name="theme-color" content="#F2EEE5">
<style>
/* 布局：顶部三个入口（线网 · 书架 · 足迹，手机上是底部标签栏）+ 居中的主栏；首页是全宽的线网图。
   字体：标题用思源宋体，正文思源黑体，数字 Barlow；颜色：纸色底、墨色字，每条学习线一种颜色，区域底色表示学习方向。 */
:root{
  --paper:#F2EEE5; --leaf:#FBF9F4; --ink:#24211E; --ink-2:#4A443D; --ink-3:#6E675E; --rule:#DED6C6; --rule-strong:#BCAF93;

  --spine:#FBF8F1; --plate:#EFE5CA; --plate-line:#A8966A; --plate-ink:#3A332B; --wood:#2E2925; --wood-2:#3A322C; --wood-hi:#6A5B4F;
  --bay-bg:#E7DFCD; --bay-hi:rgba(255,250,236,.95); --stamp-bg:#FFFDF6; --cover:#233046; --fold-paper:#F7F1E3; --fold-pg:#F5EEDD; --fold-pg2:#EFE6D2; --card:#FBF8EE; --card-line:#D9D2BC;
  --oak-hi:#E8D5B2; --oak-1:#D6BB94; --oak-2:#C9AB81; --oak-ink:#4A3820; --linen:#E9E2D3; --linen-tx:rgba(110,90,60,.06); --wall-light:rgba(255,250,238,.7); --dais-bg:#E2D9C6; --dais-light:rgba(255,250,236,.95);
  --plab:#F3ECDB; --plab-line:rgba(60,40,20,.28); --rope-1:#C9AE7D; --rope-2:#B0915C; --niche-bg:#DCD3C1; --ghost-line:#B9AD94; --rattan-1:#C9A266; --rattan-2:#B08A50; --rattan-rim:#957040; --cfa-ink:#5A4466;
  --case:#33475F; --case-ink:#F2EAD6; --case-ink-2:rgba(242,234,214,.62); --case-hole:rgba(242,234,214,.26); --pk-cover:#22345A;
  --f-display:"Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong",serif;
  --f-brush:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-ui:"Barlow","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;

  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
  /* 纸模（paper craft）：五种纸 + 两层颗粒 + 影色。量自参考样张（docs/shelf-design-review.md 六之四、六之七）：一个色相、八层明度。
   * 2026-11-10 精修 1：实色按样张渲染后的色定（底 #956B43 亮 112、奶油面其实是茶色 #CFA97C 亮 173、淡纸 #D8BB9C 给读字的页），纹理滤镜改 sRGB 插值后实色与渲出来的色一比一（之前 linearRGB 把噪点均值抬到 .73，整站发白两档就是这个） */
  --pp-kraft:#956B43; --pp-kraft-2:#BF9265; --pp-kraft-3:#7E5A36; --pp-kraft-dk:#5C4120; --pp-kraft-bk:#3E2B14;
  --pp-cream:#CFA97C; --pp-cream-2:#D8BB9C; --pp-terra:#AC5626; --pp-terra-dk:#8B4319; --pp-olive:#725F2F; --pp-olive-dk:#54461F;
  --pp-ink:#3E1D00; --pp-ink-2:#5A2A0A; --pp-ink-3:#7A4A28; --pp-black:#3B2416; --pp-black-dk:color-mix(in srgb,var(--pp-black),#000 40%); --pp-black-lt:color-mix(in srgb,var(--pp-black),#FFF4E0 7%); --pp-copper:#C4763A; --pp-shade:60,42,14;
  --pp-pulp:url(vendor/paper/pulp-1x.webp); --pp-pulp-s:256px; --pp-hi:#E6D0A8; --pp-well:#B88F62; --pp-sheet:#DCC2A4;
  --pp-pillow:linear-gradient(165deg,rgba(255,255,255,.07),rgba(0,0,0,.05));
  --pp-sink:inset 2px 3px 4px rgba(var(--pp-shade),.62),inset 0 0 0 1px rgba(var(--pp-shade),.3),1px 1px 0 rgba(255,240,216,.5);
  --pp-up:-1px -1px 0 rgba(255,247,228,.45),1px 1px 0 rgba(50,32,8,.6),2px 3px 3px rgba(50,32,8,.45);
  --pp-up-zh:1px 1px 0 rgba(50,32,8,.6),1px 2px 3px rgba(50,32,8,.4);
  --pp-in:0 1px 0 rgba(255,240,216,.55);
}

    --bay-bg:#26221E; --bay-hi:rgba(255,240,210,.07); --stamp-bg:#25221E; --cover:#0E131C; --fold-paper:#211E1A; --fold-pg:#2A2622; --fold-pg2:#24201C; --card:#25221E; --card-line:#45403A; --oak-hi:#8A7052; --oak-1:#6E573E; --oak-2:#5A4632; --oak-ink:#F2E4C6; --linen:#24201C; --linen-tx:rgba(255,240,210,.035); --wall-light:rgba(255,236,200,.06); --dais-bg:#2B2621; --dais-light:rgba(255,226,170,.12); --plab:#E4DAC5; --plab-line:rgba(0,0,0,.35); --rope-1:#A08A62; --rope-2:#7E6A48; --niche-bg:#1B1815; --ghost-line:#6A5F4E; --rattan-1:#A58552; --rattan-2:#8A6D42; --rattan-rim:#6A5232; --cfa-ink:#CDB8DA; --case:#3B5270; --case-ink:#F2EAD6; --case-ink-2:rgba(242,234,214,.62); --case-hole:rgba(242,234,214,.24); --pk-cover:#2C4170;
    --pp-sheet:#4A351F; --pp-well:#3A2916; --pp-hi:#D9C29A; --pp-kraft:#4A351F; --pp-kraft-2:#5E4529; --pp-kraft-3:#3F2D18; --pp-kraft-dk:#2C1E0F; --pp-kraft-bk:#1C1308; --pp-cream:#B08C62; --pp-cream-2:#BFA07C; --pp-olive:#5A4B24; --pp-terra:#9A4A1F; --pp-shade:0,0,0;
    color-scheme:dark;
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
a{color:var(--indigo);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--leaf);border-bottom:3px solid var(--ink)}
.tb-in{max-width:1400px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:12px 28px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.06em}
.roundel{position:relative;display:block;width:30px;height:30px;border-radius:50%;border:5px solid var(--seal);box-sizing:border-box}
.roundel i{position:absolute;left:-7px;right:-7px;top:6px;height:8px;background:var(--ink);border-radius:1px}
.mainnav{display:flex;gap:4px;flex:1 1 auto}
.mainnav a{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:20px;color:var(--ink);text-decoration:none;font-family:var(--f-ui);font-size:15px;font-weight:500;position:relative}
.mainnav a:hover{background:var(--paper)}
.mainnav a[aria-current="page"]{background:var(--ink);color:var(--leaf);font-weight:700}
.mainnav svg{width:18px;height:18px;flex:none}
.mainnav .nb{font-family:var(--f-num);font-size:13px;font-weight:600;line-height:1;color:#FFFFFF;background:var(--seal);border-radius:9px;padding:2px 6px}
.topbar .mode{display:flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.topbar .mode i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.topbar .mode.db i{background:var(--ln-sql)}
.topbar .mode.local i{background:var(--seal)}

main{display:block;min-width:0;max-width:1400px;margin:0 auto;padding:32px 28px 96px}
.view{max-width:760px;margin-inline:auto}
.view.home{max-width:none}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--ink-3);margin:0 0 8px}
.eyebrow a{color:inherit}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,5vw,46px);line-height:1.15;letter-spacing:.01em;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.3;letter-spacing:.01em;margin:0 0 14px}
h2 a{color:inherit;text-decoration:none}
h2 a:hover{color:var(--indigo)}
h3{font-size:17px;font-weight:700;margin:0}
section{margin-top:52px}
.lede{font-size:18px;color:var(--ink-2);max-width:36em;margin:14px 0 0}
.sub{font-family:var(--f-ui);color:var(--ink-3);font-size:14px;margin:10px 0 0}
.meta{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;font-family:var(--f-ui);font-size:13px;color:var(--ink-3);margin-top:18px}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:16px;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.empty-line{color:var(--ink-3);font-size:15px}
.more{font-family:var(--f-ui);font-size:14px;margin:12px 0 0}

.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:14px;line-height:1.4;padding:8px 16px;border:1px solid var(--ink);border-radius:var(--r);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3);opacity:1}
.btn.small{font-size:13px;padding:4px 12px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.linkbtn{background:none;border:0;padding:0;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--seal)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);background:var(--seal-wash);border-radius:6px;padding:10px 14px;margin-bottom:28px}
.banner span{flex:1 1 260px;min-width:0}

/* 正在精读 */
.focus{margin-top:40px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:22px 24px 24px;display:grid;gap:14px}
.focus h2{font-size:30px;margin:0}
.focus .eyebrow{margin:0}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cell{height:30px;padding:0;border:1px solid var(--rule);border-radius:2px;background:transparent;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);cursor:pointer;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--ink-3)}
.cell.doing{background:var(--indigo-wash);border-color:var(--indigo);color:var(--indigo)}
.cell.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cell.review{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}

/* 方向索引 */
.tracks{border-top:1px solid var(--ink)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:4px 28px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.tname{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;line-height:1.35}
.trow:hover .tname{color:var(--indigo)}
.tgoal{grid-column:1;font-size:14px;color:var(--ink-2);line-height:1.65}
.tprog{grid-column:2;grid-row:1 / span 2;align-self:center;display:grid;gap:7px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{display:block;height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--indigo)}

/* 数据专题 */
.reports{border-top:1px solid var(--ink)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 28px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.rname{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;line-height:1.35}
.rname .ext{font-family:var(--f-ui);font-size:14px;color:var(--ink-3);margin-left:8px}
.rrow:hover .rname{color:var(--indigo)}
.rdesc{grid-column:1;font-size:14px;color:var(--ink-2);line-height:1.65}
.rmeta{grid-column:2;grid-row:1 / span 2;align-self:center;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);white-space:nowrap}

.pair{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px}
.pair .col{min-width:0}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;border-top:1px solid var(--ink)}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:13px;color:var(--seal);padding-top:1px}
.steps b{display:block;color:var(--ink);font-weight:600}

/* 学习足迹 */
.jlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.jlist li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.jdate{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:4px;font-variant-numeric:tabular-nums}
.jbody{min-width:0}
.jmeta{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--f-ui);font-size:12.5px}
.jmin{color:var(--ink-3)}
.jtext{margin:2px 0 0;font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.jdel{display:inline-flex;gap:10px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2)}
.month h2{font-size:20px}
.jform{margin-top:36px;display:grid;gap:14px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:20px}
.jform h2{font-size:20px;margin:0}
.jform .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field span{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;min-width:0;font-family:var(--f-ui);font-size:14px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px}
.field textarea{font-family:var(--f-body);font-size:15px;line-height:1.7;resize:vertical}

/* 方向页 */
.goal{font-size:18px;color:var(--ink-2);max-width:36em;margin:14px 0 0}
.goal b{color:var(--seal);font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;font-weight:600}
.stage{margin-top:48px}
.stage h2{margin-bottom:4px}
.stage h2 .no{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--seal);margin-bottom:2px;font-variant-numeric:tabular-nums}
.stage .desc{font-family:var(--f-ui);font-size:13.5px;color:var(--ink-3);margin:0 0 14px}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:start;padding:15px 0;border-bottom:1px solid var(--rule)}
.main-col{min-width:0}
.kind{display:inline-block;font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--rule);border-radius:2px;padding:0 5px;margin-right:8px;vertical-align:2px;line-height:1.6}
.item .t{font-weight:600;font-size:16.5px}
.item .by{font-size:14px;color:var(--ink-3);margin-left:6px}
.item .why{margin:4px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.item .links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-family:var(--f-ui);font-size:13px}
.also{color:var(--ink-3)}
.also a{color:var(--ink-2)}
.side-col{padding-top:2px}

/* 进度控件 */
.stw{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:12.5px;white-space:nowrap}
.st{appearance:none;-webkit-appearance:none;font-family:var(--f-ui);font-size:12.5px;line-height:1.5;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;background:transparent;color:var(--ink-3)}
select.st{cursor:pointer;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select.st option{color:var(--ink);background:var(--leaf)}
.s-doing .st{background-color:var(--indigo-wash);border-color:transparent;color:var(--indigo)}
.s-done .st{border-color:var(--ink-3);color:var(--ink)}
.s-review .st{border-color:var(--seal);color:var(--seal)}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--seal);color:var(--seal-ink);font-style:normal;font-family:var(--f-display);font-size:13px;border-radius:2px;line-height:1}

/* 精读页 */
.book-prog{display:grid;gap:10px;margin-top:24px}
.whole{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:2px;margin-top:32px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 13px;font-family:var(--f-ui);font-size:14px;color:var(--ink-3);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:600}
.tabbody > section:first-child{margin-top:32px}
.thesis{margin:32px 0 0;font-size:19px;line-height:1.9;padding:22px 0;border-block:1px solid var(--rule)}
.thesis .k,.chain .k,.note-lab,.note label{font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:600}
.thesis .k{display:block;margin-bottom:6px}
.facts{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:10px 18px;margin:0;font-size:15px;line-height:1.75}
.facts dt{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);padding-top:2px}
.facts dd{margin:0;min-width:0}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding-bottom:16px;position:relative}
.chain li .k{padding-top:3px}
.chain li:not(:last-child)::after{content:"";position:absolute;left:14px;top:30px;bottom:4px;width:1px;background:var(--rule)}
.order{margin:0;padding-left:1.4em;display:grid;gap:6px}
.note{display:grid;gap:7px;margin-top:4px}
.note textarea{width:100%;min-height:104px;font-family:var(--f-body);font-size:15px;line-height:1.75;background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;resize:vertical}
.note textarea::placeholder{color:var(--ink-3)}
.ns{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.note-ro{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-ro.empty{color:var(--ink-3);font-size:14px}

.chs{margin-top:28px;border-top:1px solid var(--ink)}
details.ch{border-bottom:1px solid var(--rule)}
details.ch summary{list-style:none;display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;cursor:pointer}
details.ch summary::-webkit-details-marker{display:none}
details.ch summary:hover .ttl{color:var(--indigo)}
.ch .no{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.ch .ttl{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;line-height:1.4;min-width:0}
.ch .depth{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:var(--ink-3);margin-left:10px;vertical-align:3px}
.ch-body{display:grid;gap:18px;padding:2px 0 26px}
.ch-body h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:600;margin:0 0 6px}
.ch-body ol,.ch-body ul{margin:0;padding-left:1.3em;display:grid;gap:7px}
.ch-body p{margin:0}
.q{font-size:17px}
.tip{background:var(--seal-wash);border-radius:var(--r);padding:10px 14px;font-size:14.5px;line-height:1.7;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-ui);font-size:13px;background:var(--leaf);border:1px solid var(--rule);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--indigo);color:var(--indigo)}

.cards-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:28px 0 18px}
.cards-head p{margin:0;font-size:14.5px;color:var(--ink-2);flex:1 1 300px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;min-height:160px;text-align:left;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:16px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--ink-3)}
.card .front{font-family:var(--f-display);font-size:19px;letter-spacing:.03em;line-height:1.4}
.card .back{font-size:14px;line-height:1.75;color:var(--ink-2)}
.card .hint{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.card.flipped{border-color:var(--indigo)}
.card.hl{box-shadow:0 0 0 2px var(--seal)}

.views{border-top:1px solid var(--ink)}
.v{padding:16px 0;border-bottom:1px solid var(--rule)}
.v h3{display:inline;margin-right:10px}
.v .who{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.v p{margin:6px 0 0;font-size:15px;line-height:1.75;color:var(--ink-2)}
.plain{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:15px}
.further{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.further li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.further b{font-weight:600;margin-right:6px}
.further .why{display:block;font-size:14px;color:var(--ink-3)}

.fw-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-top:32px}
.fw-head h2{margin:0 0 4px}
.fw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 32px;margin-top:22px;border-top:1px solid var(--ink);padding-top:20px}
.fwp{min-width:0}
.fwp h3{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.16em;color:var(--seal);margin-bottom:6px}
.fwp ol{margin:0;padding-left:1.6em;display:grid;gap:6px;font-size:15px;line-height:1.7}
.fwp ol li::marker{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.fw-foot{margin-top:24px}

/* 复习 */
.boxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.bx{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--f-ui);font-size:12px;color:var(--ink-3);border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.bx b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.rv{margin-top:20px;display:grid;gap:16px;align-content:start;min-height:300px;background:var(--leaf);border:1px solid var(--rule);border-radius:8px;padding:24px 26px}
.rv-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
.rv .front{font-family:var(--f-display);font-size:clamp(26px,5vw,34px);letter-spacing:.04em;line-height:1.3;margin:12px 0 0}
.rv .back{margin:0;font-size:17px;line-height:1.9;border-top:1px dashed var(--rule);padding-top:16px}
.rv.rest p{margin:0}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
.btn.again{background:transparent;color:var(--seal);border-color:var(--seal)}
.btn.hard{background:transparent;color:var(--ink);border-color:var(--ink-3)}
.btn.good{background:var(--indigo);border-color:var(--indigo);color:var(--leaf)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:96;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:13px;padding:9px 16px;border-radius:999px}

/* 每日课表 */
.today{margin-top:40px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:22px 24px 24px;display:grid;gap:14px}
.today .eyebrow{margin:0}
.today h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0}
.today h2 .tot{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);letter-spacing:0}
.slots{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.slots>li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule)}
.slots .subj{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.06em;color:var(--indigo)}
.slots b{font-weight:600;font-size:15.5px}
.slots .mins{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.slots li.ok b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--seal)}
.slots li.ok .mins{color:var(--seal)}
.check{margin:6px 0 0;padding-left:1.3em;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.wk{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:14px;border-top:1px solid var(--ink)}
.wk th,.wk td{text-align:left;padding:9px 8px 9px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
.wk thead th{font-size:12px;letter-spacing:.1em;color:var(--ink-3);font-weight:400}
.wk tbody th{font-weight:600;white-space:nowrap;width:4.5em}
.wk td{color:var(--ink-2)}
.wk .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-right:0}
.dst{font-family:var(--f-ui);font-size:12px;border-radius:2px;padding:0 6px;line-height:1.7}
.dst.done{background:var(--seal);color:var(--seal-ink)}
.dst.partial{background:var(--indigo-wash);color:var(--indigo)}
.dst.missed{border:1px solid var(--rule);color:var(--ink-3)}
.dst.pushed{border:1px dashed var(--ink-3);color:var(--ink-3)}
.lsq{border-top:1px solid var(--rule);padding:12px 0}
.lsq:last-child{border-bottom:1px solid var(--rule)}
.lsq summary{cursor:pointer;display:flex;align-items:baseline;gap:12px;list-style:none}
.lsq summary::-webkit-details-marker{display:none}
.lsq summary::before{content:"＋";font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.lsq[open] summary::before{content:"－"}
.lsq .why{font-size:14.5px;color:var(--ink-2);margin:8px 0 6px}
.lsq ol{margin:0;padding-left:2.2em;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.lsq li.ok{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}
.lsq li.cur{color:var(--ink);font-weight:600}
.lsq li.cur::after{content:"  ← 下一课";font-family:var(--f-ui);font-size:12px;font-weight:400;color:var(--seal)}
@media (max-width:560px){
  .today{padding:18px 16px 20px}
  .slots>li{grid-template-columns:minmax(0,1fr) auto}
  .slots .subj{grid-column:1/-1}
}
@media (max-width:880px){
  .pair{grid-template-columns:minmax(0,1fr);gap:0}
  .fw{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .trow{grid-template-columns:minmax(0,1fr)}
  .rrow{grid-template-columns:minmax(0,1fr)}
  .rmeta{grid-column:1;grid-row:auto}
  .tprog{grid-column:1;grid-row:auto}
  .item{grid-template-columns:minmax(0,1fr)}
  .jform .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .jform .row .ref{grid-column:1 / -1}
  .jlist li{grid-template-columns:minmax(0,1fr)}
  details.ch summary{grid-template-columns:minmax(0,1fr) auto}
  details.ch summary .no{grid-column:1 / -1}
  .facts{grid-template-columns:minmax(0,1fr);gap:2px}
  .facts dd{margin-bottom:10px}
  .focus{padding:18px}
  .strip{gap:3px}
}
/* 通用：分段按钮、跳转链接 */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--leaf);border:1px solid var(--rule);border-radius:999px}
.seg button{font-family:var(--f-ui);font-size:13px;border:0;background:transparent;color:var(--ink-3);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.xref{font-family:var(--f-ui);font-size:12.5px;background:none;border:0;padding:0;color:var(--indigo);cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.deep-tag{display:inline-block;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;color:var(--seal);background:var(--seal-wash);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:3px}
.ch-st{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.deep-line{margin:18px 0 0;font-size:15px;color:var(--ink-2)}
.deep-line .k{font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:600;margin-right:10px}
.practice{margin-top:28px}
.practice > .cards-head,.practice > .fw-head{margin-top:24px}

/* 精读稿 */
.reader-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.reader-note{margin-top:14px;line-height:1.7}
.reader-body{margin-top:30px;border-top:1px solid var(--ink)}
.oneline{font-family:var(--f-display);font-size:24px;line-height:1.65;letter-spacing:.02em;margin:26px 0 0}
.oneline.small{font-family:var(--f-body);font-size:17px;line-height:1.85;color:var(--ink-2);margin:20px 0 6px}
.oneline .k,.pq .k,.qa .k,.chk .k,.sw-result .k{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:600;margin-bottom:4px}
.toc{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--rule)}
.toc li{border-bottom:1px solid var(--rule)}
.toc button{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;padding:11px 0;font-family:var(--f-body);font-size:16px;cursor:pointer}
.toc button:hover{color:var(--indigo)}
.secno{font-family:var(--f-mono);font-size:13px;color:var(--seal);min-width:2.4em;font-variant-numeric:tabular-nums}
.sec{padding:22px 0 20px;border-bottom:1px solid var(--rule);scroll-margin-top:16px}
.sec-head{display:flex;align-items:baseline;gap:10px}
.sec-head h2{font-size:22px;margin:0}
.gist{margin:6px 0 0;padding-left:calc(2.4em + 10px);font-size:16.5px;font-weight:600;line-height:1.75}
.more-btn{margin:10px 0 0 calc(2.4em + 10px);background:none;border:0;padding:0;font-family:var(--f-ui);font-size:13px;color:var(--indigo);cursor:pointer}
.more-btn::after{content:" ↓"}
.more-btn[aria-expanded="true"]::after{content:" ↑"}
.sec-body{padding-left:calc(2.4em + 10px);display:grid;gap:14px;margin-top:12px}
.sec-body > p{margin:0;font-size:16px;line-height:1.9}
.blk h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:600;margin:4px 0 6px}
.reason{margin:0;padding-left:1.4em;display:grid;gap:4px;font-size:15px;color:var(--ink-2)}
.reason li::marker{font-family:var(--f-mono);font-size:12px;color:var(--indigo)}
.evid{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evid li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:15px;line-height:1.75}
.evid li > span:last-child{flex:1 1 280px;min-width:0}
.etag,.esrc{font-family:var(--f-ui);font-size:11px;border-radius:2px;padding:0 6px;line-height:1.7}
.etag{border:1px solid var(--rule);color:var(--ink-2)}
.esrc.book{background:var(--indigo-wash);color:var(--indigo)}
.esrc.added{background:var(--leaf);color:var(--ink-3);border:1px dashed var(--rule)}
.qa{display:grid;gap:6px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.qa p{margin:0;font-size:15px;line-height:1.75}
.qa .ans .k{color:var(--indigo)}
.chk{font-size:14px;color:var(--ink-2);background:var(--seal-wash);border-radius:6px;padding:10px 14px}
.chk ul{margin:0;padding-left:1.2em}
.go-practice{margin:0}
.prs{display:grid;gap:10px;margin-top:4px}
.pr{border:1px dashed var(--ink-3);border-radius:6px;padding:12px 14px;display:grid;gap:8px}
.pq{margin:0;font-size:15.5px;font-weight:600;line-height:1.7}
.pa{margin:0;font-size:15px;line-height:1.75;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:8px}
.pr-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.reader-foot{margin-top:40px}
.reader-foot .btns{margin-top:22px}

/* 假设开关 */
.sw{margin-top:22px}
.sw-intro{margin:0 0 16px;font-size:15px;color:var(--ink-2);max-width:40em}
.asws{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.asw{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:12px;cursor:pointer;min-width:0}
.asw.off{background:transparent;border-style:dashed}
.asw-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.asw-no{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.tog{width:30px;height:17px;border-radius:999px;background:var(--rule);position:relative;flex:none}
.tog i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--leaf);transition:left .15s}
.asw.on .tog{background:var(--indigo)}
.asw.on .tog i{left:15px}
.asw-name{font-family:var(--f-display);font-size:18px;letter-spacing:.03em}
.asw.off .asw-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--seal)}
.asw-desc{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.asw-critic{font-family:var(--f-ui);font-size:11.5px;line-height:1.55;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:6px}
.chainx{margin-top:22px;display:grid;gap:0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.arrow{height:22px;position:relative}
.arrow::before{content:"";position:absolute;left:50%;top:3px;bottom:3px;border-left:1px solid var(--ink-3)}
.arrow::after{content:"";position:absolute;left:calc(50% - 4px);bottom:2px;border:4px solid transparent;border-top-color:var(--ink-3);border-bottom:0}
.cn{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--leaf);display:grid;gap:6px;min-width:0}
.cn.ok{border-color:var(--indigo)}
.cn.broken{background:transparent;border-color:var(--seal);border-style:dashed}
.cn-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cn-name{font-family:var(--f-display);font-size:19px;letter-spacing:.03em}
.cn-st{font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--indigo)}
.cn.broken .cn-st{color:var(--seal)}
.cn.broken .cn-name{color:var(--ink-3)}
.cn-needs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.need{border:1px solid var(--rule);border-radius:2px;padding:0 6px;color:var(--ink-2)}
.need.miss{border-color:var(--seal);color:var(--seal);text-decoration:line-through}
.cn-why{margin:0;padding-left:1.2em;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.cn-critic{margin:0;font-family:var(--f-ui);font-size:12px;line-height:1.55;color:var(--ink-3)}
.sw-result{margin-top:20px;border-top:1px solid var(--ink);padding-top:14px;display:grid;gap:10px;justify-items:start}
.sw-result p{margin:0;font-size:16px;line-height:1.8}

/* 论证地图 */
.map-head{display:grid;gap:12px;margin-top:24px}
.map-head p{margin:0;font-size:15px;color:var(--ink-2);max-width:40em}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.map-head .seg{justify-self:start}
.mapwrap{margin-top:20px;overflow-x:auto;border-top:1px solid var(--ink);padding-top:14px}
.mtree,.mtree ul{list-style:none;margin:0;padding:0}
.mtree ul{margin-left:11px;padding-left:18px;border-left:1px solid var(--rule)}
.mn{position:relative}
.mtree ul > .mn::before{content:"";position:absolute;left:-18px;top:19px;width:14px;border-top:1px solid var(--rule)}
.mrow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;min-width:0}
.mtog{flex:none;width:22px;height:22px;margin-top:2px;border:1px solid var(--rule);border-radius:3px;background:var(--leaf);cursor:pointer;position:relative;padding:0}
.mtog i{position:absolute;left:7px;top:6px;border:5px solid transparent;border-left-color:var(--ink-2);border-right:0}
.mtog[aria-expanded="true"] i{left:5px;top:8px;border:5px solid transparent;border-top-color:var(--ink-2);border-bottom:0}
.mtog.leaf{border:0;background:transparent;cursor:default}
.mtype{flex:none;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;border-radius:2px;padding:1px 6px;margin-top:3px;line-height:1.6}
.t-claim .mtype{background:var(--ink);color:var(--paper)}
.t-premise .mtype{background:var(--indigo-wash);color:var(--indigo)}
.t-evidence .mtype{border:1px solid var(--ink-3);color:var(--ink-2)}
.t-objection .mtype{background:var(--seal-wash);color:var(--seal)}
.mtext{flex:1 1 auto;min-width:0;font-size:15.5px;line-height:1.65}
.mtree > .mn > .mrow .mtext{font-family:var(--f-display);font-size:20px;line-height:1.5}
.t-objection > .mrow .mtext{color:var(--ink-2)}
.mcount{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:8px}
.mrow .xref{margin-top:4px}

/* 正在精读：可以同时有几本书 */
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fb{display:grid;gap:12px}
.fb + .fb{border-top:1px solid var(--rule);padding-top:20px;margin-top:4px}
.focus .fb h2{font-size:28px}

/* 康波时间轴：上为长周期全景，下为全书覆盖年份的放大 */
.kw{position:relative;margin-top:4px}
.kw-main{position:relative;height:58px;border:1px solid var(--rule);border-radius:var(--r);background:var(--leaf);overflow:hidden}
.kw-ph{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 8px;border-left:1px solid var(--paper);font-family:var(--f-ui);line-height:1.3;overflow:hidden;white-space:nowrap}
.kw-ph b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.06em}
.kw-ph span{font-family:var(--f-mono);font-size:10.5px;opacity:.85}
.kw-ph.p0{background:var(--leaf);color:var(--ink-2)}
.kw-ph.p1{background:var(--indigo-wash);color:var(--indigo)}
.kw-ph.p2{background:var(--seal-wash);color:var(--seal)}
.kw-ph.p3{background:var(--ink);color:var(--paper)}
.kw-zoomband{position:absolute;bottom:0;height:4px;background:var(--indigo);pointer-events:none}
.kw-now{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--seal);pointer-events:none}
.kw-now span{position:absolute;top:4px;right:4px;font-family:var(--f-ui);font-size:11px;line-height:1.5;color:var(--seal);background:var(--paper);border-radius:2px;padding:0 4px;white-space:nowrap}
.kw-axis{position:relative;height:20px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.kw-axis span{position:absolute;top:3px;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.kw-axis span:first-child{transform:none}
.kw-axis span:last-child{transform:translateX(-100%)}
.kw-axis.small{font-size:10px}
.kw-link{height:20px;background:var(--indigo-wash);opacity:.75}
.kw-zoom{position:relative;height:46px;border:1px solid var(--indigo);border-radius:var(--r);background:var(--leaf)}
.kw-ch{position:absolute;top:4px;bottom:4px;padding:0;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-family:var(--f-display);font-size:18px;line-height:1;color:var(--ink);cursor:pointer}
.kw-ch:hover{border-color:var(--ink-3)}
.kw-ch.doing{background:var(--indigo-wash);border-color:var(--indigo);color:var(--indigo)}
.kw-ch.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.kw-ch.review{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.kw-gap{position:absolute;top:4px;bottom:4px;border-radius:3px;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--rule) 4px 5px)}
.kw-cap{margin-top:2px}
.kw-ev{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.kw-ev li{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.6}
.kw-ev .y{font-family:var(--f-mono);font-size:13px;color:var(--seal);padding-top:1px;font-variant-numeric:tabular-nums}
.kw-note{margin-top:14px}

/* 四周期嵌套 */
.nest-hint{margin:-4px 0 12px}
.nrows{border-top:1px solid var(--rule)}
.nr{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.nl{display:flex;align-items:flex-start;gap:10px;text-align:left;background:none;border:0;padding:0;font-family:var(--f-ui);cursor:pointer;min-width:0}
div.nl{cursor:default}
.nchk{flex:none;width:14px;height:14px;margin-top:5px;border:1.5px solid var(--indigo);border-radius:2px;background:var(--indigo);box-shadow:inset 0 0 0 2px var(--paper)}
.nr.off .nchk{background:transparent;border-color:var(--ink-3)}
.ntx{display:grid;gap:1px;min-width:0}
.ntx b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.04em;color:var(--ink)}
.ntx span{font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.ntx .nd{color:var(--ink-2)}
.nw{display:block;width:100%;height:44px;overflow:visible}
.nw path{fill:none;stroke:var(--indigo);stroke-width:1.6}
.nw .nz{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 3}
.nr.off .nw path{stroke:var(--ink-3);opacity:.35}
.nr.off .ntx b{color:var(--ink-3)}
.nr.sum{border-bottom:0}
.nw.sum{height:64px}
.nw.sum path{stroke:var(--seal);stroke-width:2.2}
.nscale{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-left:216px;font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.nscale span{height:1px;background:var(--ink-3)}
.nscale em{font-style:normal}
.nest-note{margin-top:12px}

/* 报告清单 */
.reps li{line-height:1.6}
.reps .rt{font-weight:600}
.reps .ry{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-left:8px}
.reps .rh{display:block;font-size:14px;color:var(--ink-2)}

/* 判断对照表 */
.sc-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.vd{display:inline-block;font-family:var(--f-ui);font-size:12px;line-height:1.6;padding:1px 8px;border-radius:2px;white-space:nowrap}
.vd.ok{background:var(--indigo-wash);color:var(--indigo)}
.vd.part{background:var(--leaf);color:var(--ink-2);border:1px solid var(--rule)}
.vd.miss{background:var(--seal-wash);color:var(--seal)}
.sc{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.sc li{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.sc-when{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.sc-body p{margin:0;font-size:15px;line-height:1.7}
.sc-body .k{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:var(--ink-3);margin-right:8px}
.sc-then{color:var(--ink-2)}
.sc li > .vd{margin-top:3px}
.sc-note{margin-top:12px}
.esrc.talk{background:var(--seal-wash);color:var(--seal)}

@media (max-width:560px){
  .kw-ph{padding:0 4px}
  .kw-ph b{font-size:14px}
  .kw-ph span{display:none}
  .kw-ev{grid-template-columns:minmax(0,1fr)}
  .nr{grid-template-columns:minmax(0,1fr);gap:6px}
  .nscale{margin-left:0}
  .sc li{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .sc-when{grid-column:1/-1;padding:0}
}

details.ch,.card{scroll-margin-top:16px}
@media (max-width:880px){details.ch,.card,.sec{scroll-margin-top:118px}}
@media (max-width:560px){
  .gist,.sec-body{padding-left:0}
  .more-btn{margin-left:0}
  .row2{grid-template-columns:minmax(0,1fr);gap:0}
  .row2 .cn + .cn{margin-top:10px}
  .oneline{font-size:20px}
  .mrow{flex-wrap:wrap}
  .mrow .xref{margin-left:30px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
/* 讲义阅读 */
.lesson .lnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 16px}
.lesson .src{margin-top:24px;font-size:13px;color:var(--ink-3)}
.md{font-size:16px;line-height:1.8;overflow-wrap:anywhere}
.md h2{font-family:var(--f-display);font-size:28px;line-height:1.3;margin:8px 0 12px}
.md h3{font-family:var(--f-display);font-size:22px;margin:32px 0 10px;padding-top:8px;border-top:2px solid var(--ink)}
.md h4{font-size:18px;margin:24px 0 8px}
.md h5{font-size:16px;margin:18px 0 6px}
.md p{margin:10px 0}
.md ul,.md ol{padding-left:1.6em;margin:8px 0}
.md li{margin:4px 0}
.md hr{border:0;border-top:1px solid var(--rule);margin:28px 0}
.md blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--seal);background:var(--seal-wash);border-radius:0 var(--r) var(--r) 0}
.md a{color:var(--indigo)}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--leaf);border:1px solid var(--rule);border-radius:3px;padding:0 4px}
.md .mdcode{position:relative;margin:12px 0;background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r)}
.md .mdcode .lang{position:absolute;left:12px;top:8px;font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.md .mdcode .btn{position:absolute;right:8px;top:6px}
.md pre{margin:0;padding:38px 14px 14px;overflow-x:auto;font-size:13.5px;line-height:1.6}
.md pre code{background:none;border:0;padding:0;font-size:inherit}
.md .mdtbl{overflow-x:auto;margin:12px 0}
.md table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.md th,.md td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--leaf);font-family:var(--f-ui);font-weight:600}
.md details{margin:14px 0;border:1px solid var(--rule);border-radius:var(--r);padding:4px 14px;background:var(--leaf)}
.md details[open]{padding-bottom:12px}
.md summary{cursor:pointer;font-family:var(--f-ui);font-weight:600;padding:6px 0;color:var(--indigo)}
.md .mblock{text-align:center;font-family:var(--f-mono);font-size:14.5px;background:var(--leaf);padding:10px;border-radius:var(--r);overflow-x:auto}
.md .mth{font-family:var(--f-mono);font-size:.92em}

/* 换字体后的标题字重（原来的展示字体只有一种字重） */
.tname,.rname,.ch .ttl,.card .front,.rv .front,.asw-name,.cn-name,.mtree > .mn > .mrow .mtext,.kw-ph b,.ntx b,.md h2,.md h3,.kw-ch{font-weight:600;letter-spacing:.01em}
.oneline{font-weight:500;letter-spacing:0}
.tname,.rname{font-size:19px}

/* 首页：今日路线 */
.tstrip{background:var(--leaf);border:1px solid var(--rule);border-radius:18px;padding:22px 26px 20px}
.ts-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.ts-top h1{font-size:32px;line-height:1.15;margin:0}
.ts-top .eyebrow{margin:0 0 6px}
.seg .segn{font-family:var(--f-num);font-weight:600;opacity:.75;margin-left:2px}
.ts-route{display:flex;align-items:flex-start;margin-top:22px}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-rows:28px auto;flex:1 1 0;min-width:0}
.stp-dot{grid-area:1/1;width:28px;height:28px;border-radius:50%;border:6px solid var(--ink);background:var(--leaf);box-sizing:border-box;position:relative;z-index:1}
.stp-bar{grid-area:1/2;align-self:center;height:12px;background:var(--c);margin-left:-2px}
.stp.extra .stp-bar{background:repeating-linear-gradient(90deg,var(--c) 0 14px,transparent 14px 20px)}
.stp-tx{grid-area:2/1/3/3;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 18px 0 0;min-width:0}
.stp-tag{display:flex;align-items:center;gap:8px}
.lbadge{display:inline-block;font-family:var(--f-ui);font-size:12.5px;font-weight:700;line-height:1.55;color:var(--bdg-on);background:var(--c);border-radius:4px;padding:0 7px;white-space:nowrap}
.lbadge.dk{color:var(--bdg-on-dk)}
.stp-min{font-family:var(--f-num);font-size:18px;font-weight:600;line-height:1.2}
.stp-title{font-size:16px;font-weight:600;line-height:1.5}
.stp-seq{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.stp.end{flex:0 0 auto;grid-template-columns:32px;grid-template-rows:28px auto}
.stp.end .stp-dot{width:32px;height:32px;margin-top:-2px;box-shadow:0 0 0 4px var(--leaf),0 0 0 7px var(--ink)}
.stp.end .stp-tx{grid-area:2/1;justify-self:end;align-items:flex-end;text-align:right;padding-right:0;white-space:nowrap}
.ts-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:20px}
.ts-note{flex:1 1 320px;min-width:0;margin:0;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.ts-warn{margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--rule-strong);font-size:14px;line-height:1.75;color:var(--ink-2)}
.ts-warn b{color:var(--seal)}

/* 首页：线网图 */
.mwrap{margin-top:30px}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:12px}
.mhead h2{margin:0;font-size:24px}
.mhead .meta{margin-top:4px}
.chipbtn{min-height:38px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:19px;background:var(--leaf);color:var(--ink);font-family:var(--f-ui);font-size:14px;cursor:pointer}
.chipbtn[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700}
.mscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:18px;background:var(--map-bg);-webkit-overflow-scrolling:touch}
.minner{position:relative;min-width:1040px}
svg.metro{display:block;width:100%;height:auto;font-family:var(--f-ui)}
.metro text{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:4px;stroke-linejoin:round}
.metro text.mut{fill:var(--ink-3)}
.metro text.mzl{font-size:13px;font-weight:700;letter-spacing:.06em;stroke:none}
.metro .mzone:hover text{text-decoration:underline}
.metro .mbdg text{stroke:none;font-size:12.5px;font-weight:700}
.metro .mlg text{stroke:none}
.metro .mlg text.h{font-size:15px;font-weight:700}
.metro .mst{cursor:pointer}
.metro .mst:focus{outline:none}
.metro .hit{fill:transparent}
.metro .mst:hover .hit{fill:var(--rule-strong);fill-opacity:.35}
.metro .mst:focus-visible .hit{stroke:var(--indigo);stroke-width:2.5}
.metro .mlm:hover text{text-decoration:underline}
.metro .mhalo{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:mpulse 2.4s ease-out infinite}
@keyframes mpulse{0%{transform:scale(.75);opacity:.75}100%{transform:scale(1.55);opacity:0}}
@media (prefers-reduced-motion: reduce){.metro .mhalo{animation:none;opacity:.35}}
.metro .mline{transition:opacity .2s}
.metro.today-only .mline:not(.is-today){opacity:.14}
.mpop{position:absolute;z-index:5;width:310px;max-width:calc(100% - 16px);background:var(--leaf);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:14.5px;line-height:1.65}
.mpop .mp-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-right:30px}
.mpop .mp-pos{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.mpop .mp-t{margin:8px 0 0;font-size:16px;font-weight:700;line-height:1.5}
.mpop .mp-s{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.mpop .btns{margin-top:12px;gap:8px}
.mpop .mp-x{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:16px;background:transparent;color:var(--ink-2);font-size:20px;line-height:1;cursor:pointer}
.mpop .mp-x:hover{background:var(--paper)}
.mpop ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.linkrow{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0;font:inherit;font-size:14px;line-height:1.6;color:var(--ink);cursor:pointer}
.linkrow:hover{color:var(--indigo)}
.mhint{margin-top:8px}

/* 首页：各线到站、地标、运行规则 */
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:28px;align-items:start}
.panel{background:var(--leaf);border:1px solid var(--rule);border-radius:18px;padding:20px 22px}
.panel h2{font-size:20px;margin:0 0 6px}
.brow{display:grid;grid-template-columns:112px minmax(0,1fr) 44px 84px;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--rule);font-size:14.5px}
.brow .bnext{min-width:0;line-height:1.55}
.brow .bwhen{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.pill{justify-self:end;display:inline-block;font-family:var(--f-ui);font-size:12.5px;font-weight:700;line-height:1.5;border-radius:11px;padding:1px 9px;white-space:nowrap;border:1.5px solid var(--ink);color:var(--ink)}
.pill.late{background:var(--late);border-color:var(--late);color:var(--on-signal)}
.pill.early{background:var(--early);border-color:var(--early);color:var(--on-signal)}
.pill.free{border-style:dashed;border-color:var(--rule-strong);color:var(--ink-2);font-weight:500}
.badvice{margin:12px 0 0;font-size:14px;line-height:1.75;color:var(--ink-2)}
.lmk-list{display:grid;margin-top:8px}
.lmk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-top:1px solid var(--rule);color:var(--ink);text-decoration:none}
.lmk-sq{grid-row:1/3;width:16px;height:16px;margin-top:4px;box-sizing:border-box;border:3px solid var(--ink);background:var(--leaf)}
.lmk-t{font-weight:700}
.lmk:hover .lmk-t{color:var(--indigo)}
.lmk-d{font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.rules{margin-top:22px;border-top:3px solid var(--ink);padding-top:10px}
.rules summary{cursor:pointer;font-family:var(--f-ui);font-size:16px;font-weight:700;padding:6px 0}
.rules ol{margin:8px 0 0;padding-left:1.4em;display:grid;gap:6px;font-size:15px;line-height:1.75;max-width:52em}

/* 今日路线的站可以点；各线到站一行可以点 */
a.stp{color:inherit;text-decoration:none}
button.stp{font:inherit;text-align:inherit;background:none;border:0;padding:0;color:inherit;cursor:pointer}
button.stp:hover .stp-title{text-decoration:underline;text-underline-offset:3px}
button.stp:focus-visible{outline:2px solid var(--indigo);outline-offset:4px;border-radius:6px}
button.stp .stp-tx{display:flex}
/* 晚间仪式：打卡 · 盖章 */
.rt-card{width:min(560px,100%)}
.rt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rt-s{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);transition:opacity .15s}
.rt-s:has(.rt-on:not(:checked)){opacity:.5}
.rt-tgl{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.rt-tgl input{position:absolute;opacity:0;pointer-events:none}
.rt-tgl i{flex:none;width:18px;height:18px;border-radius:50%;border:3px solid var(--c);background:transparent;box-sizing:border-box;transition:background .15s,box-shadow .15s}
.rt-tgl input:checked + i{background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.rt-tgl input:focus-visible + i{outline:2px solid var(--indigo);outline-offset:2px}
.rt-tx{display:flex;flex-direction:column;min-width:0}
.rt-tx b{font-size:15px;line-height:1.4}
.rt-tx span{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-min{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.rt-min input{width:3.4em;font:inherit;text-align:right;padding:5px 6px;border:1px solid var(--rule);border-radius:7px;background:var(--leaf);color:var(--ink)}
.rt-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rt-gap{flex:1}
.rt-seal{flex:none;width:78px;height:78px;border-radius:50%;border:0;background:var(--seal);color:#FFF;cursor:pointer;display:grid;place-items:center;
  box-shadow:inset 0 0 0 2.5px #FFF,inset 0 0 0 5px var(--seal),0 12px 20px -12px rgba(120,25,15,.85);transition:transform .12s}
.rt-seal i{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.3em;padding-top:.3em;writing-mode:vertical-rl}
.rt-seal:hover{transform:translateY(-2px)}
.rt-seal:active{transform:translateY(3px) scale(.96)}
.rt-seal:focus-visible{outline:2.5px solid var(--indigo);outline-offset:4px}
.rt-done{align-items:center;text-align:center}
.rt-sts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:4px 0}
.rt-st{display:inline-block;opacity:0;animation:rt-stamp .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes rt-stamp{0%{opacity:0;transform:scale(2.2) rotate(-14deg)}55%{opacity:1;transform:scale(.9) rotate(1deg)}78%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.rt-st{animation:none;opacity:1}}
/* 切页淡接 */
::view-transition-old(root){animation-duration:.14s}
::view-transition-new(root){animation-duration:.18s}
/* 剪报入夹的小纸条 */
.fly-slip{position:fixed;z-index:95;width:60px;height:34px;pointer-events:none;background:#FBF7EC;border:1px solid #CFC3A6;border-radius:2px;box-shadow:0 8px 14px -8px rgba(0,0,0,.5)}
.fly-slip::before{content:"";position:absolute;left:6px;top:6px;width:20px;height:3.5px;background:var(--k-clip,#7A4E9C)}
.fly-slip::after{content:"";position:absolute;left:6px;right:8px;top:13px;height:14px;background:repeating-linear-gradient(#CFC6B2 0 1px,transparent 1px 5px)}
/* 阅读器翻部分：新一页轻轻推进来，带一道页影 */
.rd-view{position:relative}
.rd-view.turn-r .rd-frame{animation:rd-in-r .26s cubic-bezier(.25,.7,.3,1)}
.rd-view.turn-l .rd-frame{animation:rd-in-l .26s cubic-bezier(.25,.7,.3,1)}
.rd-view.turn-r::after,.rd-view.turn-l::after{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none;animation:rd-sh .3s ease-out forwards}
.rd-view.turn-r::after{right:0;background:linear-gradient(270deg,rgba(40,30,15,.18),transparent)}
.rd-view.turn-l::after{left:0;background:linear-gradient(90deg,rgba(40,30,15,.18),transparent)}
@keyframes rd-in-r{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes rd-in-l{from{transform:translateX(-30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes rd-sh{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){.rd-view.turn-r .rd-frame,.rd-view.turn-l .rd-frame{animation:none}.rd-view.turn-r::after,.rd-view.turn-l::after{display:none}}
/* 快捷键单 */
.ks-card{width:min(460px,100%)}
.ks-t{border-collapse:collapse;width:100%;font-size:14px}
.ks-t td{padding:8px 10px 8px 0;border-top:1px solid var(--rule);vertical-align:top}
.ks-t tr:first-child td{border-top:0}
.ks-t kbd{display:inline-block;padding:2px 8px;border:1px solid var(--rule-strong);border-bottom-width:2.5px;border-radius:6px;background:var(--paper);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
/* 微立体与拖拽 */
.wall .deco{will-change:transform;transition:transform .2s ease-out}
.abox.picked .ab-band{transform:perspective(260px) rotateX(34deg);transform-origin:50% 0}
.ab-band{transition:transform .25s ease}
.stg-cover,.stg-box{transition:transform .3s ease}
.dais .stg-cover:hover,.dais .stg-box:hover{transform:perspective(900px) rotateY(-3.5deg) translateY(-2px)}
@media (prefers-reduced-motion: reduce){.dais .stg-cover:hover,.dais .stg-box:hover{transform:none}.abox.picked .ab-band{transform:none}}
body.drag-clip .abox:not([data-t^="cf:"]),body.drag-clip .afold,body.drag-clip .atray,body.drag-clip .apack,body.drag-clip .adeck,body.drag-clip .ainbox{outline:2px dashed color-mix(in srgb,var(--ink-3) 55%,transparent);outline-offset:3px}
.drop-ok{outline:3px solid var(--ink) !important;outline-offset:3px}
.abox.drop-ok,.afold.drop-ok{transform:translateY(-6px)}
.apack.drop-ok,.adeck.drop-ok{outline-offset:6px;border-radius:6px}
.cl-card[draggable="true"]{cursor:grab}
.cl-card[draggable="true"]:active{cursor:grabbing}
/* 书墙光阴：清晨微凉、黄昏偏暖、夜里暗下来 */
.wall::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;opacity:0;transition:opacity 1.2s,background 1.2s}
.wall.tod-dawn::after{opacity:1;background:linear-gradient(170deg,rgba(195,210,228,.10),rgba(248,224,200,.05) 45%,transparent 75%)}
.wall.tod-dusk::after{opacity:1;background:linear-gradient(115deg,rgba(242,180,106,.13),rgba(222,140,80,.05) 50%,transparent 80%)}
.wall.tod-night::after{opacity:1;background:linear-gradient(rgba(36,30,52,.16),rgba(36,30,52,.10) 60%,rgba(60,40,24,.05))}
.wall.tod-night{box-shadow:inset 0 14px 22px -12px rgba(25,18,10,.55)}
.wall.tod-night .d-candle{filter:brightness(1.15) drop-shadow(0 0 14px rgba(255,190,90,.55))}
@media (prefers-color-scheme: dark){
  .wall.tod-dawn::after,.wall.tod-dusk::after{opacity:.5}
  .wall.tod-night::after{background:linear-gradient(rgba(10,8,18,.22),rgba(10,8,18,.12) 60%,transparent)}
}
/* 学习年轮 */
.yearring{margin-top:26px}
.yr-wrap{display:flex;justify-content:center}
.yearring svg{width:min(380px,100%);height:auto}
.yr-base{fill:none;stroke:var(--rule);stroke-width:1}
.yearring line{stroke-linecap:round}
.yr-0{stroke:var(--rule);stroke-width:1.1}
.yr-f{stroke:var(--rule);stroke-width:.8;opacity:.45}
.yr-s{stroke:var(--ink-2);stroke-width:2.1}
.yr-r{stroke:#A97E4F;stroke-width:1.8}
.yr-tick{stroke:var(--rule-strong);stroke-width:1}
.yr-mo{font-family:var(--f-ui);font-size:10.5px;fill:var(--ink-3)}
.yr-td{stroke:var(--seal);stroke-width:2.6}
.yr-y{font-family:var(--f-num);font-size:26px;font-weight:600;fill:var(--ink)}
.yr-n{font-family:var(--f-ui);font-size:12px;fill:var(--ink-3)}
/* 全站搜索（Ctrl+K） */
.tb-srch{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--ink-2);cursor:pointer}
.tb-srch:hover{background:var(--paper);color:var(--ink)}
.tb-srch:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.ck{position:fixed;inset:0;z-index:92;background:rgba(28,24,20,.42);display:flex;justify-content:center;align-items:flex-start;padding:9vh 16px 16px}
.ck-panel{width:min(640px,100%);max-height:74vh;display:flex;flex-direction:column;background:var(--leaf);border-radius:14px;box-shadow:0 30px 60px -28px rgba(0,0,0,.6);overflow:hidden}
.ck-bar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.ck-ic{flex:none;font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.ck-in{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.ck-res{overflow:auto;padding:4px 8px 10px;overscroll-behavior:contain}
.ck-g{margin:10px 8px 3px;font-family:var(--f-ui);font-size:11.5px;letter-spacing:.14em;color:var(--ink-3)}
.ck-it{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;font:inherit;cursor:pointer}
.ck-it b{font-size:15px;font-weight:600;line-height:1.5}
.ck-it span{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ck-it[aria-selected="true"],.ck-it:hover{background:var(--paper)}
.ck-it[aria-selected="true"]{box-shadow:inset 2.5px 0 0 var(--seal)}
.ck-none{padding:22px 12px;font-family:var(--f-ui);font-size:14px;color:var(--ink-3)}
.ck-foot{margin:0;padding:9px 16px;border-top:1px solid var(--rule);font-family:var(--f-ui);font-size:11.5px;color:var(--ink-3)}
@media (max-width:640px){ .ck{padding:12px} .ck-foot{display:none} }
/* 摘抄册 */
.mkbook{--hy:#E5BB2E;--hg:#4FA35C;--hb:#3F86D6;--hp:#D45C86}
.mkbook .pstats{margin-top:16px}
.mkf-c{display:inline-flex;gap:8px;align-items:center;margin-left:10px}
.mkf-dot{width:24px;height:24px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--leaf)}
.mkf-dot.c-y{background:var(--hy)}.mkf-dot.c-g{background:var(--hg)}.mkf-dot.c-b{background:var(--hb)}.mkf-dot.c-p{background:var(--hp)}
.mkf-dot[aria-pressed="true"]{border-color:var(--ink)}
.mkb-src{margin-top:36px;padding-left:16px;border-left:3px solid var(--c);max-width:860px}
.mkb-src h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin:0 0 14px}
.mkb-src h2 small{font-family:var(--f-ui);font-size:12.5px;font-weight:500;color:var(--ink-3)}
.mkb-src ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.mkb-m{position:relative;padding:2px 0 2px 16px}
.mkb-m.c-y{--hl:var(--hy)}.mkb-m.c-g{--hl:var(--hg)}.mkb-m.c-b{--hl:var(--hb)}.mkb-m.c-p{--hl:var(--hp)}
.mkb-m::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:4.5px;border-radius:2px;background:var(--hl)}
.mkb-m blockquote{margin:0;font-family:var(--f-display);font-size:15.5px;line-height:1.9}
.mkb-n{margin:7px 0 0;font-size:14px;line-height:1.7;color:var(--ink-2);padding-left:10px;border-left:2px dashed var(--rule-strong)}
.mkb-meta{margin:5px 0 0;font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.mkb-print{margin-top:40px}
@media print{
  .topbar,.banner,.shelf-seg,.chips,.mkf-c,.mkb-print,.mkb-meta .linkbtn,#toast{display:none!important}
  body{background:#FFF}
  .mkb-m{break-inside:avoid}
}
/* 复习翻卡 */
.rv-card{width:min(520px,100%)}
.rv-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rv-top .eyebrow{margin:0}
.rv-cd{display:flex;flex-direction:column;gap:14px;min-height:240px;padding:26px 24px 18px;border:1px solid var(--rule-strong);border-radius:12px;background:var(--paper);font:inherit;text-align:left;cursor:pointer;box-shadow:0 10px 18px -16px rgba(40,30,15,.55)}
.rv-cd:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.rv-cd .front{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.6}
.rv-cd .back{font-size:15.5px;line-height:1.8;color:var(--ink-2);padding-top:12px;border-top:1px dashed var(--rule-strong)}
.rv-cd .hint{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.rv-cd .meta{margin-top:auto}
.rv-acts{justify-content:flex-end}
.rv-acts .btn.again{background:transparent;color:var(--seal);border:1.5px solid var(--seal)}
.rv-end{text-align:center;align-items:center}
/* 在读的书落灰 */
.cb.dusty{filter:saturate(.75) brightness(.97);transition:filter .7s}
.cb.dusty::after{content:"";position:absolute;left:0;right:0;top:0;height:44%;pointer-events:none;border-radius:inherit;opacity:1;transition:opacity .7s;
  background:linear-gradient(rgba(205,196,176,.58),rgba(205,196,176,.2) 55%,transparent),radial-gradient(5px 2px at 24% 7%,rgba(226,218,198,.8),transparent 70%),radial-gradient(4px 2px at 62% 4%,rgba(226,218,198,.75),transparent 70%),radial-gradient(6px 2px at 84% 10%,rgba(226,218,198,.6),transparent 70%)}
.cb.wiping{filter:none}
.cb.wiping::after{opacity:0}
/* 足迹册：还没翻到的日子印着淡章位 */
.fd-ghost{fill:none;stroke:var(--rule-strong);stroke-width:1;stroke-dasharray:2.5 3.5;opacity:.45}
a.stp:hover .stp-title{text-decoration:underline;text-underline-offset:3px}
a.stp:focus-visible{outline:2px solid var(--indigo);outline-offset:4px;border-radius:8px}
.brow-a{display:block;color:inherit;text-decoration:none}
.brow-a:hover .bnext{color:var(--indigo)}
.slot-a{color:inherit;text-decoration:none}
.slot-a:hover b{color:var(--indigo)}
.metro .mtick{font-size:11.5px}
.metro .mbdg-a{cursor:pointer}
.metro .mbdg-a:hover rect{filter:brightness(.92)}
.mpop .mp-uses{margin-top:10px}
.mpop .mp-uses a{color:var(--ink);text-decoration:none;font-weight:600}
.mpop .mp-uses a b{font-family:var(--f-ui);font-size:12px;color:var(--ink-3);margin-right:6px}
.mpop .mp-uses .meta{display:block;font-size:13px}
.mpop .mp-rel{display:grid;gap:3px;margin-top:8px}

/* 研究档案：问题、出处、用途、更新 */
.rrel{grid-column:1;display:block;font-family:var(--f-ui);font-size:13px;line-height:1.6;color:var(--ink-2)}
.rrel b{display:inline-block;min-width:3.4em;margin-right:6px;font-size:12px;color:var(--ink-3);font-weight:600}
.rrel a{color:inherit}
.lmk .rrel{grid-column:2}
.arch-h{font-size:15px;font-family:var(--f-ui);color:var(--ink-3);margin:22px 0 8px;letter-spacing:.04em}

/* 讲义页 */
.lst{display:inline-block;font-family:var(--f-ui);font-size:12px;font-weight:700;line-height:1.5;border-radius:10px;padding:0 8px;border:1.5px solid var(--rule-strong);color:var(--ink-2);margin-left:6px}
.lst.done{border-color:var(--ln-sql);color:var(--ln-sql)}
.lst.cur{border-color:var(--ink);color:var(--ink)}
.lesson .eyebrow a{text-decoration:none}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:6px 0 22px}
.lcard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--leaf);border:1px solid var(--rule);border-top:6px solid var(--c);border-radius:12px;color:var(--ink);text-decoration:none}
.lcard:hover{border-color:var(--ink-3);border-top-color:var(--c)}
.lcard.ok{opacity:.7}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lc-min{font-family:var(--f-num);font-size:17px;font-weight:600}
.lc-t{font-size:15px;font-weight:600;line-height:1.5}
.lc-go{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);margin-top:auto}

/* 课程页 */
.view.wide{max-width:1180px}
.ctitle{display:flex;align-items:center;gap:14px}
.cbar{flex:none;width:14px;align-self:stretch;min-height:36px;border-radius:7px;background:var(--c)}
.course .stats{align-items:center}
.cnow{margin-top:28px;background:var(--leaf);border:1px solid var(--rule);border-left:8px solid var(--c);border-radius:14px;padding:18px 20px}
.cnow h2{margin:4px 0 10px;font-size:22px}
.cnow .eyebrow{margin:0}
.clist{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--ink)}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.crow .cnum{font-family:var(--f-num);font-size:15px;color:var(--ink-3)}
.crow .ct{color:var(--ink);text-decoration:none;line-height:1.55}
.crow a.ct{font-weight:600}
.crow a.ct:hover{color:var(--indigo);text-decoration:underline;text-underline-offset:3px}
.crow.done .ct{color:var(--ink-3)}
.crow.cur{background:var(--leaf)}
.crow .cs{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 6px}
.ctag{font-family:var(--f-ui);font-size:12px;color:var(--ink-2);border:1px dashed var(--rule-strong);border-radius:10px;padding:0 8px;white-space:nowrap}
.cmod{padding:16px 0 6px;font-family:var(--f-ui);font-size:13px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.cmod .meta{margin-left:8px;font-weight:400}
.clinks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px;font-size:14.5px;line-height:1.7}
.clinks b{margin-right:8px}
.clinks a{color:var(--ink);text-decoration:none}

/* 电影跟读播放器 */
.fp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:26px;align-items:start}
.fp-main{position:sticky;top:76px;display:grid;gap:12px}
.fp-screen{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-height:44vh}
.fp-screen video{display:block;width:100%;height:100%;object-fit:contain}
.fp-screen.nomedia,.fp-screen.audio{background:var(--leaf);border:1px dashed var(--rule-strong);aspect-ratio:auto;min-height:150px}
.fp-screen.nomedia video,.fp-screen.audio video{position:absolute;width:1px;height:1px;opacity:0}
.fp-ph{display:none}
.fp-screen.nomedia .fp-ph,.fp-screen.audio .fp-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:16px 16px 56px;font-family:var(--f-ui);color:var(--ink-3);text-align:center}
.fp-ph b{color:var(--ink-2)}
.fp-sub{position:absolute;left:4%;right:4%;bottom:6%;text-align:center;font-size:clamp(16px,2.1vw,24px);line-height:1.45;font-weight:600;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);pointer-events:none}
.fp-screen.nomedia .fp-sub,.fp-screen.audio .fp-sub{color:var(--ink);text-shadow:none;bottom:14px}
.fp-sub .fh{opacity:.6}
.fp-load{background:var(--leaf);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;display:grid;gap:10px;justify-items:start}
.fp-load .meta{margin:0;line-height:1.7}
.fp-pick{position:relative;overflow:hidden;cursor:pointer}
.fp-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.fp-pick:focus-within{outline:2px solid var(--indigo);outline-offset:2px}
.fp-err{display:block;margin:6px 0 0;font-family:var(--f-ui);font-size:13.5px;line-height:1.6;color:var(--seal)}
.fp-seg{display:flex;align-items:center;gap:10px}
.fp-nav{flex:none;width:40px;height:40px;border:1.5px solid var(--rule-strong);border-radius:20px;background:var(--leaf);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.fp-nav:disabled{opacity:.35;cursor:default}
.fp-segt{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.fp-segt b{font-size:20px}
.fp-segt .meta{flex-basis:100%;margin:0}
.fp-play{display:flex;flex-wrap:wrap;gap:8px}
.fp-ctls{display:grid;gap:8px}
.fp-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fp-lab{width:4.6em;font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.fp-ctl .seg button{padding:5px 12px}
.fp-keys{margin:0;font-size:12.5px}
.fsteps{background:var(--leaf);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.fsteps .eyebrow{margin:0 0 6px}
.fsteps ol{list-style:none;margin:0;padding:0;display:grid}
.fsteps li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:2px 12px;padding:8px 0;border-top:1px solid var(--rule)}
.fs-b{display:flex;justify-content:space-between;align-items:baseline;gap:6px;background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.fs-b b{font-size:15px}
.fs-b:hover b{color:var(--indigo);text-decoration:underline}
.fs-m{font-family:var(--f-num);font-size:15px;color:var(--ink-3)}
.fs-d{font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.fs-x{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fcues{list-style:none;margin:14px 0 0;padding:0;border-top:2px solid var(--ink)}
.fc{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 8px;padding:8px 6px;border-bottom:1px solid var(--rule);scroll-margin:90px}
.fc.on{background:var(--leaf);box-shadow:inset 4px 0 0 var(--ln-en)}
.fc-n{font-family:var(--f-num);font-size:14px;color:var(--ink-3);padding-top:3px}
.fc.kn .fc-n{color:var(--ln-sql);font-weight:700}
.fc-tx{background:none;border:0;padding:0;text-align:left;font:inherit;font-size:16px;line-height:1.55;color:var(--ink);cursor:pointer}
.fc-tx .fz{color:var(--ink-2);font-size:15px}
.fc-tx .fh{color:var(--ink-3);letter-spacing:.2em}
.fc-b{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fc-b button{min-width:40px;height:30px;border:1px solid var(--rule-strong);border-radius:15px;background:transparent;color:var(--ink-2);font-family:var(--f-ui);font-size:13px;cursor:pointer;padding:0 10px}
.fc-b button:hover{border-color:var(--ink);color:var(--ink)}
.fc-b button[aria-pressed="true"]{background:var(--ln-sql);border-color:var(--ln-sql);color:#fff;font-weight:700}
.fc-b button.rec{background:var(--seal);border-color:var(--seal);color:#fff}
.fc-ex{grid-column:2;margin-top:6px;padding:10px 12px;background:var(--paper);border-left:3px solid var(--ln-en);border-radius:0 8px 8px 0;font-size:14px;line-height:1.75;white-space:pre-wrap}
.fsegs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px 24px;margin-top:12px}
.fwk{display:flex;align-items:center;gap:8px}
.fwk-b{display:flex;gap:6px}
.fseg{width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--ln-en);border-radius:10px;background:var(--leaf);color:var(--ink);font-family:var(--f-num);font-size:16px;cursor:pointer}
.fseg.done{background:var(--ln-en);color:var(--bdg-on-dk)}
.fseg.cur{border:3px solid var(--ink)}
.fseg-bar{display:block;width:28px;height:4px;border-radius:2px;background:var(--rule)}
.fseg-bar i{display:block;height:100%;border-radius:2px;background:var(--ln-sql)}
.fseg-wk{flex:none;width:3.4em;font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
@media (max-width:980px){
  .fp{grid-template-columns:minmax(0,1fr)}
  .fp-main{top:0;z-index:5;background:var(--paper);padding-bottom:8px}
  .fp-screen:not(.nomedia):not(.audio){max-height:34vh}
}
@media (max-width:640px){
  .fsteps li{grid-template-columns:minmax(0,1fr)}
  .fs-x{grid-column:1}
  .crow{grid-template-columns:30px minmax(0,1fr)}
  .crow .cs{grid-column:2;justify-content:flex-start}
  .fp-main{position:static}
  .fsegs{grid-template-columns:minmax(0,1fr)}
  .fwk-b{gap:5px}
  .fseg{width:40px;height:42px}
}

@media (max-width:980px){.hgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .topbar{position:static;border-bottom-width:2px}
  .tb-in{padding:10px 16px;justify-content:space-between}
  .mainnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--leaf);border-top:2px solid var(--ink);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
  .mainnav a{flex-direction:column;justify-content:center;gap:3px;min-height:50px;padding:0;border-radius:10px;font-size:12px}
  .mainnav a[aria-current="page"]{background:transparent;color:var(--ink);font-weight:700}
  .mainnav a[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--seal)}
  .mainnav .nb{position:absolute;top:2px;left:calc(50% + 6px);font-size:11px;padding:1px 5px}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  .tstrip{padding:18px 16px}
  .ts-top h1{font-size:26px}
  .ts-top .seg{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .ts-route{flex-direction:column}
  .stp{grid-template-columns:28px minmax(0,1fr);grid-template-rows:28px minmax(18px,auto);flex:none;width:100%}
  .stp-bar{grid-area:2/1;justify-self:center;align-self:stretch;width:8px;height:auto;margin:-2px 0 0}
  .stp-tx{grid-area:1/2/3/3;padding:2px 0 18px 14px}
  .stp.extra .stp-bar{background:repeating-linear-gradient(180deg,var(--c) 0 12px,transparent 12px 18px)}
  .stp.end{grid-template-columns:32px minmax(0,1fr);grid-template-rows:32px}
  .stp.end .stp-tx{grid-area:1/2;justify-self:start;text-align:left;flex-direction:row;align-items:baseline;gap:8px;padding:4px 0 0 14px}
  .mscroll{margin-inline:-16px;border-radius:0;border-inline:0}
  .panel{padding:18px 16px}
  .brow{grid-template-columns:minmax(0,1fr) auto}
  .brow .bline{grid-column:1;grid-row:1}
  .brow .pill{grid-column:2;grid-row:1}
  .brow .bnext{grid-column:1/-1;grid-row:2}
  .brow .bwhen{grid-column:1/-1;grid-row:3}
}

.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 40px;margin-bottom:26px}

/* ===== 线网图 ===== */
.tstrip{border-radius:16px}
.ts-top h2{font-size:26px;margin:0;letter-spacing:.06em}
.stp-line{font-family:var(--f-display);font-size:14px;font-weight:700;color:var(--c)}
.mwrap{margin-top:26px}
.mscroll{border-radius:16px;box-shadow:0 24px 40px -34px rgba(36,33,30,.55)}
.minner{min-width:1120px}
.metro text{font-size:12px;fill:var(--ink);stroke:none}
.metro .mzone-r{stroke:var(--ink);stroke-opacity:.1;stroke-width:1}
.metro .mzone-r.dashed{fill:none;stroke:var(--rule-strong);stroke-opacity:1;stroke-width:1.5;stroke-dasharray:6 5}
.metro text.mzl{font-family:var(--f-display);font-size:15px;font-weight:900;letter-spacing:2px}
.metro .mzone:hover text.mzl,.metro .mlink:hover text,.metro .mplate-a:hover .mpl-n{text-decoration:underline}
.metro text.mt-s{font-size:11.5px}
.metro text.mt-b{font-size:12px;font-weight:700}
.metro text.mt-tick{font-size:10.5px;fill:var(--zi-en)}
.metro text.mt-ft{font-family:var(--f-display);font-size:12.5px;font-weight:700}
.metro text.mt-gl{font-size:12px;font-weight:700}
.metro text.mt-h{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3)}
.metro text.mt-end{font-family:var(--f-display);font-size:13px;font-weight:900}
.metro text.mt-lm{font-family:var(--f-display);font-size:13px;font-weight:700}
.metro text.mt-lg{font-size:12px}
.metro .mg-out{fill:none;stroke-width:13;stroke-linejoin:round;stroke-linecap:round}

.metro .mend{fill:var(--leaf);stroke:var(--ink);stroke-width:3.5}

.mpop .mp-dl{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:4px 8px;margin:10px 0 0;font-size:13.5px;line-height:1.6}

.gsec{margin-top:34px;background:var(--leaf);border:1px solid var(--rule);border-radius:16px;padding:22px 26px 16px}

/* ===== 书架：博古架 ===== */
.shelf-main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:34px}
.cabinet{flex:none;width:947px;max-width:100%}
.cab-top{position:relative;height:54px;margin:0 -10px;background:linear-gradient(var(--wood-2),var(--wood));border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center}
.cab-top::before{content:"";position:absolute;inset:8px 22px;border:1px solid rgba(201,179,126,.45);border-radius:4px}
.cab-top span{font-family:var(--f-brush);font-size:28px;letter-spacing:.5em;padding-left:.5em;color:#E9DAB2}
.cab-body{background:var(--wood);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 50px -36px rgba(36,33,30,.7)}
.cab-feet{display:flex;justify-content:space-between;padding:0 26px}

.tier{display:flex;gap:12px}
.bay{position:relative;flex:0 0 var(--w);min-width:0;min-height:300px;padding:30px 16px 26px;display:flex;align-items:flex-end;
  background:radial-gradient(70% 120% at 50% -20%,var(--bay-hi) 0%,transparent 70%),linear-gradient(to top,rgba(36,33,30,.1),transparent 50px),var(--bay-bg);
  box-shadow:inset 0 8px 12px -8px rgba(0,0,0,.45),inset 6px 0 10px -8px rgba(0,0,0,.35),inset -6px 0 10px -8px rgba(0,0,0,.35)}

.plate{display:inline-flex;align-items:center;gap:9px;height:18px;padding:0 10px;background:var(--plate);border:1px solid var(--plate-line);border-radius:2px;font-family:var(--f-ui);font-size:11.5px;letter-spacing:.06em;color:var(--plate-ink);text-decoration:none;white-space:nowrap}

.spine{position:relative;flex:none;box-sizing:border-box;border-radius:2px 2px 0 0;writing-mode:vertical-rl;display:flex;align-items:center;gap:8px;padding:14px 0 0;
  background:var(--spine);border:1.25px solid color-mix(in srgb,var(--c) 85%,transparent);box-shadow:inset 0 0 0 3px var(--spine),inset 0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent);
  font:inherit;color:var(--ink);cursor:pointer;text-align:start;transition:transform .15s,opacity .15s}
.spine::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:color-mix(in srgb,var(--c) 40%,transparent)}
.spine:hover{transform:translateY(-4px)}
.spine:focus-visible,.vol:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.spine.dim,.vol.dim{opacity:.28}
.sp-t{flex:none;white-space:nowrap;font-family:var(--f-display);font-weight:600;letter-spacing:.12em;line-height:1.2;color:var(--ink)}
