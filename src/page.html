.sp-t.lat{font-family:var(--f-num);letter-spacing:.03em;line-height:1.15}
.sp-t.tight{letter-spacing:.04em;font-weight:700}
.sp-by{margin-top:auto;flex:none;white-space:nowrap;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.sp-no{writing-mode:horizontal-tb;flex:none;margin:7px 0 6px;width:calc(100% - 12px);min-width:22px;padding:2px 0 1px;background:var(--leaf);border:1px solid var(--rule-strong);font-family:var(--f-mono);font-size:9.5px;line-height:1.15;color:var(--ink-2);text-align:center}
.spine.doing{transform:translateY(-18px);border:2px solid var(--c);padding:12px 4px 0;gap:7px;box-shadow:0 10px 18px -12px rgba(36,33,30,.45);
  background:linear-gradient(to top,color-mix(in srgb,var(--c) 34%,var(--spine)) var(--p),var(--spine) var(--p))}
.spine.doing:hover{transform:translateY(-22px)}
.spine.doing::before{background:var(--c)}
.sp-label{flex:none;background:var(--leaf);border:1.25px solid var(--c);padding:7px 3px}
.sp-line{writing-mode:horizontal-tb;position:relative;flex:1;align-self:stretch;display:flex;flex-direction:column-reverse;align-items:center;justify-content:space-between;padding:10px 0 8px;min-height:0}
.sp-line::before{content:"";position:absolute;top:10px;bottom:8px;left:50%;width:3px;margin-left:-1.5px;background:var(--c)}
.sp-line i{position:relative;display:block;width:7px;height:7px;border-radius:50%;background:var(--leaf);border:2px solid var(--c);box-sizing:border-box}
.sp-line i.d{background:var(--c);border-color:var(--spine)}
.sp-line i.c{width:11px;height:11px;border:3px solid var(--ink)}
.sp-rib{position:absolute;bottom:-32px;left:60%;width:7px;height:34px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.spine.done{background:var(--c);border:2px solid var(--c);box-shadow:inset -4px 0 0 rgba(0,0,0,.1)}
.spine.done::before{background:rgba(255,255,255,.35)}
.spine.done .sp-t{color:var(--bdg-on)}
.sp-seal{writing-mode:horizontal-tb;margin:auto 0 12px;width:25px;height:25px;flex:none;display:grid;place-items:center;background:var(--seal);color:#FFF;border:2px solid #FFF;font-family:var(--f-display);font-style:normal;font-size:13px;font-weight:700;transform:rotate(-8deg)}
.spine.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-14px)}
.spine.picked:hover{transform:translateY(-18px)}
.spine.doing.picked{transform:translateY(-24px)}
.case{flex:none;display:flex;flex-direction:column;gap:8px;margin-right:22px}
.case-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--ln-cfa)}
.case-tag{font-family:var(--f-ui);font-size:11.5px;letter-spacing:.04em;font-weight:700;color:var(--bdg-on);background:var(--ln-cfa);border-radius:10px;padding:1px 8px;text-decoration:none}
.case-box{position:relative;padding:12px 10px 0;border-radius:4px 4px 0 0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 5px),#6C2B70;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 12px 20px -14px rgba(36,33,30,.6)}
.case-in{display:flex;align-items:flex-end;gap:3px;padding:20px 8px 0;background:color-mix(in srgb,var(--ln-cfa) 12%,var(--spine));box-shadow:inset 0 6px 10px -6px rgba(0,0,0,.35)}
.clasp{position:absolute;right:-15px;top:34%;width:15px;height:9px}
.clasp.b{top:66%}
.clasp::before{content:"";position:absolute;left:0;top:3px;width:8px;height:2px;background:#D9C9A0}
.clasp::after{content:"";position:absolute;right:0;top:0;width:9px;height:9px;border-radius:2px;background:#F1E8D2;border:1px solid #B9A982;box-sizing:border-box}
.vol{position:relative;flex:none;width:26px;height:196px;box-sizing:border-box;border:1.25px solid color-mix(in srgb,var(--ln-cfa) 80%,transparent);border-radius:2px 2px 0 0;background:var(--spine);
  box-shadow:inset 0 0 0 2px var(--spine),inset 0 0 0 3px color-mix(in srgb,var(--ln-cfa) 25%,transparent);writing-mode:vertical-rl;display:flex;align-items:center;gap:6px;padding:10px 0 0;font:inherit;cursor:pointer;transition:transform .15s}
.vol:hover{transform:translateY(-4px)}
.vol .sp-t{letter-spacing:.12em}
.vol-c{writing-mode:horizontal-tb;margin:auto 0 6px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3)}
.vol.doing{width:30px;border:2px solid var(--ln-cfa);transform:translateY(-14px);background:linear-gradient(to top,color-mix(in srgb,var(--ln-cfa) 34%,var(--spine)) var(--p),var(--spine) var(--p))}
.vol.doing .vol-c{color:var(--ln-cfa);font-weight:600}
.vol.doing .sp-rib{left:55%;height:26px;bottom:-24px}
.vol.done{background:var(--ln-cfa)}
.vol.done .sp-t,.vol.done .vol-c{color:var(--bdg-on)}
.vol.picked{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-10px)}
.vol.doing.picked{transform:translateY(-20px)}
.pbox{flex:none;align-self:flex-end;width:58px;height:92px;margin-left:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:color-mix(in srgb,var(--c) 10%,var(--spine));border:1.25px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:3px;text-decoration:none;color:var(--ink);text-align:center;font-family:var(--f-ui);font-size:11px;line-height:1.3}
.pbox b{font-family:var(--f-display);font-size:22px;font-weight:900;color:var(--c)}
.pbox:hover{border-color:var(--ink)}
.bookend{flex:none;position:relative;width:9px;height:118px;margin-left:10px;background:var(--wood-2);border-radius:2px 2px 0 0}
.bookend::after{content:"";position:absolute;right:0;bottom:0;width:40px;height:5px;background:var(--wood-2)}
.bay.niche{flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:38px;background:radial-gradient(90% 90% at 50% -10%,var(--bay-hi) 0%,transparent 70%),color-mix(in srgb,var(--bay-bg) 92%,#000)}
.addbook{width:40px;height:176px;box-sizing:border-box;border:1.5px dashed var(--ink-3);border-radius:2px 2px 0 0;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;background:transparent;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.3em;color:var(--ink-2);cursor:pointer}
.addbook:hover{border-color:var(--ink);color:var(--ink)}
.bay.niche .meta{text-align:center;font-size:11.5px;line-height:1.4}
/* ===== 书架：英语一层（片盒、绘本、生词本） ===== */
.en-bay .bay-row{flex:1;gap:6px}
.fcase{position:relative;flex:none;box-sizing:border-box;width:46px;padding:14px 0 0 7px;border:0;border-radius:3px 3px 0 0;writing-mode:vertical-rl;display:flex;align-items:center;gap:9px;cursor:pointer;font:inherit;
  background:linear-gradient(90deg,rgba(255,255,255,.12) 0,rgba(255,255,255,0) 28%,rgba(0,0,0,.2) 100%),var(--case);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 10px 14px -10px rgba(36,33,30,.6);transition:transform .15s}
.fcase::before{content:"";position:absolute;left:3px;top:12px;bottom:10px;width:4px;background:repeating-linear-gradient(to bottom,var(--case-hole) 0 4px,transparent 4px 9px)}
.fcase::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c);border-radius:3px 3px 0 0}
.fcase:hover{transform:translateY(-4px)}
.fcase:focus-visible,.pbook:focus-visible,.vbox:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.fcase.dim,.pbook.dim{opacity:.28}
.fc-type{writing-mode:horizontal-tb;flex:none;font-family:var(--f-ui);font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--c)}
.fc-t{flex:none;white-space:nowrap;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;line-height:1.2;color:var(--case-ink)}
.fc-foot{writing-mode:horizontal-tb;margin-top:auto;margin-bottom:9px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;color:var(--case-ink-2)}
.fc-src{padding:1px 3px;border:1px solid currentColor;border-radius:2px;font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.02em;color:var(--case-ink-2)}
.fc-src.baba{color:var(--c)}
.fcase .sp-seal{margin:0 0 2px}
.fc-prog{position:absolute;right:4px;top:12px;bottom:10px;width:3px;border-radius:2px;background:linear-gradient(to top,var(--c) var(--p),rgba(242,234,214,.16) var(--p))}
.fcase.doing{transform:translateY(-18px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 14px 18px -12px rgba(36,33,30,.6)}
.fcase.doing:hover{transform:translateY(-22px)}
.fcase.done{box-shadow:inset 0 0 0 2px var(--c),0 10px 14px -10px rgba(36,33,30,.6)}
.fcase.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-14px)}
.fcase.doing.picked{transform:translateY(-24px)}
.fcase .sp-rib{left:55%;bottom:-30px;height:32px}
.pbook{position:relative;flex:none;align-self:flex-end;box-sizing:border-box;width:136px;height:172px;padding:16px 12px 11px 20px;border:0;border-radius:2px 6px 6px 2px;display:flex;flex-direction:column;cursor:pointer;font:inherit;text-align:left;color:#FFF6E2;
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0 7px,rgba(255,255,255,.14) 7px 9px,transparent 9px),radial-gradient(120% 80% at 70% 0%,rgba(255,255,255,.12),transparent 60%),var(--pk-cover);box-shadow:0 14px 18px -12px rgba(36,33,30,.65);transition:transform .15s}
.pbook:hover{transform:translateY(-4px)}
.pbook.doing{transform:translateY(-14px)}
.pbook.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-12px)}
.pk-sky{position:absolute;right:12px;top:12px;width:44px;height:30px}
.pk-sky i{position:absolute;border-radius:50%;background:#F4E3A8}
.pk-sky i:nth-child(1){right:0;top:0;width:18px;height:18px;box-shadow:inset -6px -2px 0 0 var(--pk-cover)}
.pk-sky i:nth-child(2){left:6px;top:4px;width:3px;height:3px}
.pk-sky i:nth-child(3){left:20px;top:20px;width:2px;height:2px}
.pk-type{font-family:var(--f-ui);font-size:10px;letter-spacing:.1em;opacity:.78}
.pk-en{margin-top:20px;font-family:var(--f-num);font-size:16px;font-weight:700;line-height:1.15}
.pk-t{margin-top:7px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.08em}
.pk-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:9.5px;color:rgba(255,246,226,.78)}
.pk-foot .sp-seal{margin:0;width:22px;height:22px;font-size:12px}
.pbook .fc-src.baba{color:#F2B54A}
.pbook .sp-rib{left:auto;right:18px;bottom:-30px;height:32px}
.vbox{position:relative;flex:none;align-self:flex-end;width:96px;height:96px;margin-left:auto;text-decoration:none;color:var(--ink)}
.vb-cards i{position:absolute;bottom:44px;width:62px;height:40px;background:var(--card);border:1px solid var(--card-line);border-radius:2px;box-shadow:0 2px 3px -2px rgba(0,0,0,.3)}
.vb-cards i::before{content:"";position:absolute;left:7px;right:14px;top:9px;height:2px;background:var(--c);opacity:.7}
.vb-cards i:nth-child(1){left:10px;transform:rotate(-7deg)}
.vb-cards i:nth-child(2){left:20px;bottom:48px;transform:rotate(3deg)}
.vb-cards i:nth-child(3){left:26px;transform:rotate(9deg)}
.vb-body{position:absolute;left:0;right:0;bottom:0;height:54px;box-sizing:border-box;padding-top:9px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(90deg,#8D6A42 0,#A88052 50%,#8A6740 100%);border-radius:3px 3px 0 0;box-shadow:inset 0 0 0 1px rgba(60,40,15,.4),0 10px 14px -10px rgba(36,33,30,.6)}
.vb-body b{padding:1px 8px;background:#F4EAD0;border:1px solid #A8956A;font-family:var(--f-display);font-size:12.5px;letter-spacing:.12em;color:#24211E}
.vb-body small{font-family:var(--f-ui);font-size:10.5px;font-weight:700;color:#FBE6BC}
.vbox:hover .vb-cards i:nth-child(2){transform:translateY(-6px) rotate(3deg)}
.vb-cards i{transition:transform .15s}
.lg-f{position:relative;display:inline-block;width:18px;height:40px;background:var(--case);border-radius:2px 2px 0 0;box-shadow:inset 0 4px 0 var(--ln-en)}
.lg-f::before{content:"";position:absolute;left:2px;top:7px;bottom:4px;width:3px;background:repeating-linear-gradient(to bottom,var(--case-hole) 0 3px,transparent 3px 6px)}
.pb-en{margin:2px 0 0;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--ink-2)}
.pb-sub{margin:0 0 6px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.en-segs .fe-s + .fe-s{border-left:1px solid rgba(36,33,30,.08)}
/* ===== 书架：原木书墙 + 展台 ===== */
.wallv{--foil:#F0E2BE;--foil-line:rgba(240,226,190,.65);
  --shade:linear-gradient(90deg,rgba(0,0,0,.24) 0,rgba(0,0,0,0) 16%,rgba(255,255,255,.13) 42%,rgba(255,255,255,0) 64%,rgba(0,0,0,.2) 100%);
  --cloth-tx:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);
  --oak:repeating-linear-gradient(0deg,rgba(110,78,40,.07) 0 1px,transparent 1px 5px),linear-gradient(var(--oak-hi) 0,var(--oak-hi) 2px,var(--oak-1) 3px,var(--oak-2) 100%);
  --oak-v:repeating-linear-gradient(90deg,rgba(110,78,40,.08) 0 1px,transparent 1px 6px),linear-gradient(90deg,var(--oak-2),var(--oak-1) 50%,var(--oak-2));
  --linen-bg:repeating-linear-gradient(0deg,var(--linen-tx) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,var(--linen-tx) 0 1px,transparent 1px 3px);
  --rattan:repeating-linear-gradient(90deg,rgba(90,60,25,.28) 0 2px,transparent 2px 7px),repeating-linear-gradient(0deg,var(--rattan-1) 0 4px,var(--rattan-2) 4px 8px)}
.wallv .phead{margin-bottom:22px}
.hang{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-radius:24px;background:var(--leaf);border:1px solid var(--rule)}
.hang-h{padding:0 8px 0 10px;font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.hang-b{min-height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:0;border-radius:18px;background:transparent;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2);cursor:pointer}
.hang-b:hover{color:var(--ink)}
.hang-b[aria-checked="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.hang-b:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.hg{display:inline-block;width:18px;height:14px;box-sizing:border-box}
.hg-float{background:linear-gradient(currentColor,currentColor) 0 9px/100% 3px no-repeat}
.hg-peg{background:linear-gradient(currentColor,currentColor) 1px 0/3px 100% no-repeat,linear-gradient(currentColor,currentColor) 14px 0/3px 100% no-repeat,linear-gradient(currentColor,currentColor) 0 7px/100% 3px no-repeat}
.hg-rope{background:linear-gradient(currentColor,currentColor) 3px 0/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) 13px 0/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) 0 9px/100% 3px no-repeat}
.hg-niche{border:2px solid currentColor;border-bottom-width:3px;border-radius:9px 9px 1px 1px}
/* 书架页：一行工具条 + 书墙 | 展台 */
.w-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 16px}
.w-filt{position:relative}
.w-filt summary{list-style:none;cursor:pointer}
.w-filt summary::-webkit-details-marker{display:none}
.w-filt .segn{font-family:var(--f-num);font-size:13px;color:var(--ink-3)}
.w-filt[open] summary .lk-caret{transform:translateY(1px) rotate(225deg)}
.w-filt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;flex-direction:column;align-items:stretch;gap:4px;min-width:170px;padding:8px;background:var(--leaf);border:1px solid var(--rule);border-radius:12px;box-shadow:0 18px 36px -16px rgba(0,0,0,.35)}
.w-filt-pop .chipbtn{border:0;background:none;text-align:left;justify-content:space-between;display:flex;min-height:34px}
.w-filt-pop .chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.w-lg-d{margin-top:10px}
.w-lg-d summary{cursor:pointer;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);list-style:none;display:inline-block;padding:2px 0;border-bottom:1px dashed var(--rule-strong)}
.w-lg-d summary::-webkit-details-marker{display:none}
.w-lg-d[open] summary{margin-bottom:6px}
.w-head h1{margin:0;font-size:34px;letter-spacing:.1em;line-height:1.1}
.w-head .shelf-seg{margin-top:0}
.w-tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 14px}
.w-tools .chips{margin:0}
.w-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.w-left{min-width:0}
.wallv .wall{margin-top:0;border-radius:8px}
/* 展台：书墙右边一栏，滚动时停在屏幕上 */
.dais-col{position:sticky;top:78px;max-height:calc(100vh - 94px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;
  background:var(--leaf);border:1px solid var(--rule);border-radius:16px;box-shadow:0 24px 40px -30px rgba(36,33,30,.5)}
.dais{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:16px;padding:18px 16px 0;border-radius:15px 15px 0 0;
  background:radial-gradient(60% 80% at 50% 0%,var(--dais-light),transparent 72%),var(--linen-bg),var(--dais-bg)}
.stg-mid{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;margin-bottom:-6px}
.stg-scale{width:84px;height:118px}
.stg-zoom{width:250px;height:350px;transform:scale(.336);transform-origin:0 0}
.stg-stand{display:block;width:94px;height:7px;margin-top:-3px;background:var(--oak);border-radius:2px}
.stg-top{display:block;flex:1 0 100%;height:12px;margin:0 -16px;background:var(--oak);box-shadow:0 10px 12px -8px rgba(40,28,14,.5)}
.dais-col > .pulled{background:transparent;border:0;border-radius:0;box-shadow:none;padding:16px 18px 18px;gap:14px}
.dz-id{position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0 0 14px}
.dz-id h2{margin:0;font-size:21px;font-weight:900;line-height:1.25;letter-spacing:.03em;overflow-wrap:anywhere}
.dz-id .pb-en{margin:0;font-size:13.5px}
.dz-id .meta{font-size:12.5px;line-height:1.5}
.dz-id .pb-st{margin-top:6px}
.pb-acts .btn{min-height:36px;box-sizing:border-box}
.pb-mk{margin:-4px 0 0;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.pb-more{border-top:1px solid var(--rule);padding-top:10px}
.pb-more summary{display:flex;align-items:baseline;gap:10px;min-height:28px;cursor:pointer;list-style:none;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.pb-more summary::-webkit-details-marker{display:none}
.pb-more summary::before{content:"";flex:none;align-self:center;width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
.pb-more[open] summary::before{transform:rotate(45deg)}
.pb-more summary b{font-weight:700;color:var(--ink)}
.pb-more summary small{min-width:0;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-more summary:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.pb-more-in{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.pb-more-in .pb-why{font-size:14px;line-height:1.75}
.pb-more-in .note textarea{min-height:88px;font-size:14.5px}
.pb-links{margin:0;font-size:13px}
.eb-file{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.eb-file .eb-meta{flex:1 1 100%;overflow-wrap:anywhere}
.eb-file .eb-tools{gap:6px 14px}
label.linkbtn.eb-up{position:relative}
.prog .fe-block.sm{height:22px;border-top-width:3px;border-bottom-width:3px}
.fe-rib.sm{top:-5px;height:38px}
.stg-cover{position:relative;width:250px;height:350px;box-sizing:border-box;padding:28px 22px 22px 32px;border-radius:3px 8px 8px 3px;display:flex;flex-direction:column;gap:10px;color:var(--foil);
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0 10px,rgba(255,255,255,.15) 10px 13px,transparent 13px),radial-gradient(90% 60% at 60% 10%,rgba(255,255,255,.18),transparent 70%),var(--cloth-tx),var(--cl);
  box-shadow:0 40px 50px -26px rgba(40,28,14,.6),0 2px 3px rgba(0,0,0,.15);transform:perspective(900px) rotateX(5deg)}
.stg-cover.light{color:#2B2620}
.stg-cover[style*="--tx"]{color:var(--tx)}
.sc-rule{display:block;flex:none;height:4px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.55}
.sc-t{margin-top:16px;font-family:var(--f-display);font-weight:900;letter-spacing:.06em;line-height:1.22;overflow-wrap:anywhere}
.sc-t small{display:block;margin-top:8px;font-size:14px;font-weight:600;letter-spacing:.04em;line-height:1.4}
.sc-by{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.08em;opacity:.9}
.sc-foot{margin-top:auto;font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;opacity:.8}
.sc-kind{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.85}
.sc-en{font-family:var(--f-num);font-size:16px;font-weight:600;line-height:1.2}
.stg-cover.film{padding-left:30px}
.sc-holes{position:absolute;left:12px;top:14px;bottom:14px;width:5px;background:repeating-linear-gradient(to bottom,rgba(240,226,190,.32) 0 5px,transparent 5px 11px)}
.stg-cover.pic{--cl:#2C4170;color:#FFF6E2;padding-top:44px}
.stg-cover.pic .sc-t{margin-top:4px;font-size:18px}
.stg-box{position:relative;width:132px;height:300px;box-sizing:border-box;padding:26px 12px 0;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#A9844C 0,#C9A367 9%,#D3B077 50%,#C59E62 91%,#A27D46 100%);box-shadow:0 30px 40px -24px rgba(40,28,14,.6)}
.stg-box::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--c);border-radius:3px 3px 0 0}
.sb-label{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 6px 14px;background:#F7F1E2;border:1px solid #B79A63;color:#24211E;text-align:center}
.sb-no{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c)}
.sb-label b{writing-mode:vertical-rl;font-family:var(--f-display);font-size:18px;letter-spacing:.12em}
.sb-label > span:last-child{font-family:var(--f-ui);font-size:11px;color:#6E675E}
.sb-hole{position:absolute;left:50%;bottom:22px;margin-left:-9px;width:18px;height:18px;border-radius:50%;background:#3A2E22;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
@keyframes daisflip{from{transform:perspective(900px) rotateY(-80deg) translateY(40px);opacity:.25}to{transform:perspective(900px) rotateX(5deg);opacity:1}}
@keyframes daisrise{from{transform:translateY(60px);opacity:.2}to{transform:none;opacity:1}}
.stg-cover.flip{animation:daisflip .6s cubic-bezier(.2,.8,.2,1)}
.stg-box.flip{animation:daisrise .5s cubic-bezier(.2,.8,.2,1)}
/* 书墙 */
.wall{position:relative;display:flex;flex-direction:column;gap:24px;padding:22px 16px 24px;border-radius:0 0 8px 8px;
  background:radial-gradient(70% 40% at 50% 0%,var(--wall-light),transparent 70%),var(--linen-bg),var(--linen);box-shadow:inset 0 14px 16px -12px rgba(60,40,20,.35)}
.wall-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px 18px}
.wall .wm{margin-top:8px}
.wall.measuring .wall-row{flex-wrap:nowrap}
.wall.measuring .wm{flex:none;width:max-content}
.wm{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.wm-in{position:relative;z-index:3;display:flex;align-items:flex-end;gap:3px;min-height:0;padding:24px 14px 0}
.wm-fill{flex:1 1 0;min-width:10px}
.wm-board{position:relative;z-index:2;display:flex;align-items:center;gap:12px;box-sizing:border-box;height:20px;padding:0 10px 0 16px;background:var(--oak);border-radius:2px;box-shadow:0 14px 16px -10px rgba(40,28,14,.45),0 2px 0 rgba(110,78,40,.25)}
.wm-lab{position:relative;min-width:0;display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:11px;letter-spacing:.04em;color:var(--oak-ink);white-space:nowrap;text-decoration:none}
.wm-lab b{font-family:var(--f-mono);font-weight:600}
a.wm-lab:hover{text-decoration:underline}
.wm-dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.wm.ghost .wm-in{align-items:center;justify-content:center;padding:20px;border:1.5px dashed var(--ghost-line);border-bottom:0;border-radius:6px 6px 0 0}
.wm.ghost .wm-board{background:transparent;box-shadow:none;border-top:1.5px dashed var(--ghost-line)}
.wm-add{min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 20px;border-radius:22px;border:1px solid var(--ghost-line);background:var(--leaf);font:inherit;font-family:var(--f-ui);font-size:14px;color:var(--ink-2);cursor:pointer}
.wm-add small{font-size:12px;color:var(--ink-3)}
.wm-add:hover{color:var(--ink);border-color:var(--ink-3)}
/* 挂法：木钉立柱 */
.hang-peg .wm:not(.ghost)::before,.hang-peg .wm:not(.ghost)::after{content:"";position:absolute;z-index:1;top:4px;bottom:-14px;width:16px;border-radius:8px;
  background:radial-gradient(circle,rgba(70,48,22,.5) 0 3px,transparent 3.5px) center 14px/16px 34px repeat-y,var(--oak-v);box-shadow:3px 0 6px -2px rgba(40,28,14,.35)}
.hang-peg .wm::before{left:-2px}.hang-peg .wm::after{right:-2px}
.hang-peg .wm:not(.ghost) .wm-in{padding-left:22px;padding-right:22px}
.hang-peg .wm:not(.ghost) .wm-board{margin:0 -8px}
.hang-peg .wm:not(.ghost) .wm-board::before,.hang-peg .wm:not(.ghost) .wm-board::after{content:"";position:absolute;top:100%;width:16px;height:9px;border-radius:0 0 8px 8px;background:#B08A55;box-shadow:0 3px 3px -1px rgba(40,28,14,.4)}
.hang-peg .wm-board::before{left:6px}.hang-peg .wm-board::after{right:6px}
/* 挂法：麻绳吊板 */
.hang-rope .wm:not(.ghost)::before,.hang-rope .wm:not(.ghost)::after{content:"";position:absolute;z-index:4;top:-34px;bottom:4px;width:6px;border-radius:3px;background:repeating-linear-gradient(160deg,var(--rope-1) 0 3px,var(--rope-2) 3px 6px)}
.hang-rope .wm::before{left:12px}.hang-rope .wm::after{right:12px}
.hang-rope .wm:not(.ghost) .wm-in::before,.hang-rope .wm:not(.ghost) .wm-in::after{content:"";position:absolute;top:-44px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2C99A,#A8844E);box-shadow:0 3px 4px rgba(40,28,14,.35)}
.hang-rope .wm-in::before{left:5px}.hang-rope .wm-in::after{right:5px}
.hang-rope .wm:not(.ghost) .wm-in{padding-left:26px;padding-right:26px}
.hang-rope .wm:not(.ghost) .wm-board::before,.hang-rope .wm:not(.ghost) .wm-board::after{content:"";position:absolute;z-index:5;top:100%;width:14px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#D5BC8C,#9E7F4C)}
.hang-rope .wm-board::before{left:8px}.hang-rope .wm-board::after{right:8px}
/* 挂法：拱形书龛 */
.hang-niche .wm:not(.ghost)::before{content:"";position:absolute;z-index:1;left:0;right:0;top:-6px;bottom:16px;border-radius:50% 50% 4px 4px/46px 46px 4px 4px;
  background:radial-gradient(60% 40% at 50% 0%,rgba(255,250,236,.3),transparent 70%),var(--linen-bg),var(--niche-bg);box-shadow:inset 0 16px 22px -8px rgba(60,40,20,.38),inset 12px 0 14px -10px rgba(60,40,20,.3),inset -12px 0 14px -10px rgba(60,40,20,.3)}
.hang-niche .wm:not(.ghost) .wm-board{margin:0 -10px}
/* 布面书 */
.cb{position:relative;flex:none;box-sizing:border-box;padding:0;border:0;border-radius:2px 2px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:inherit;
  background:var(--shade),var(--cloth-tx),var(--cl);box-shadow:3px 0 6px -2px rgba(45,30,14,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .18s}
.cb.v-foil{padding-top:24px}.cb.v-label{padding-top:18px}.cb.v-quarter,.cb.v-plain{padding-top:40px}
.cb-t{flex:none;display:flex;flex-direction:row-reverse;gap:2px}
.cb-t span{writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;line-height:1.18;color:var(--foil)}
.cb-t span.sub{font-weight:500}
.cb-t.lat span{font-family:var(--f-num);font-weight:600;letter-spacing:.03em}
.cb.light .cb-t span,.cb.v-quarter .cb-t span,.cb-lab .cb-t span{color:#2B2620}
.cb-lab{position:relative;flex:none;padding:8px 3px;background:var(--cloth-tx),var(--plab);border:1px solid var(--plab-line);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.cb-by{margin-top:auto;margin-bottom:22px;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-ui);font-size:10px;letter-spacing:.08em;color:rgba(240,226,190,.82)}
.cb.light .cb-by,.cb.v-quarter .cb-by{color:#55493D}
.cb[style*="--tx"]:not(.v-quarter) > .cb-t span{color:var(--tx)}
.cb[style*="--tx"]:not(.v-quarter) .cb-by{color:var(--tx);opacity:.85}
.cb.v-quarter .cb-by,.cb.v-quarter .cb-seal{margin-bottom:32px}
.cb-dots{margin-top:auto;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0}
.cb.v-quarter .cb-dots{margin-bottom:28px}
.cb-dots i{width:6px;height:6px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--foil);opacity:.8}
.cb-dots i.d{background:var(--foil);opacity:1}
.cb-dots i.c{width:9px;height:9px;border:2.5px solid #FFF6E0;opacity:1;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cb.light .cb-dots i{border-color:#2B2620}.cb.light .cb-dots i.d{background:#2B2620}
.cb-seal{margin-top:auto;margin-bottom:10px;flex:none;width:22px;height:22px;display:grid;place-items:center;background:var(--seal);color:#FFF8EE;font-family:var(--f-display);font-style:normal;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(255,248,238,.85);transform:rotate(-7deg)}
.cb-seal.sm{width:18px;height:18px;font-size:10px;margin-bottom:0}
.cb.light{--foil-line:rgba(43,38,32,.45)}
.cb.v-foil::before,.cb.v-foil::after{content:"";position:absolute;left:3px;right:3px;height:4px;border-top:1px solid var(--foil-line);border-bottom:1px solid var(--foil-line)}
.cb.v-foil::before{top:10px}.cb.v-foil::after{bottom:10px}
.cb.v-plain::before{content:"";position:absolute;left:0;right:0;top:18px;height:11px;background:rgba(0,0,0,.2);box-shadow:0 1px 0 rgba(240,226,190,.4),0 -1px 0 rgba(240,226,190,.4)}
.cb.v-label::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(0,0,0,.22);border-radius:2px 2px 0 0}
.cb.v-quarter{background:var(--shade),var(--cloth-tx),color-mix(in srgb,var(--cl) 16%,#EDE5D3)}
.cb.v-quarter::before,.cb.v-quarter::after{content:"";position:absolute;left:0;right:0;background:var(--shade),var(--cloth-tx),var(--cl)}
.cb.v-quarter::before{top:0;height:30px;border-bottom:1px solid rgba(240,226,190,.7);border-radius:2px 2px 0 0}
.cb.v-quarter::after{bottom:0;height:24px;border-top:1px solid rgba(240,226,190,.7)}
.cb:hover,.cv:hover{transform:translateY(-4px)}
.read-pull .cb.doing{transform:translateY(-20px)}.read-pull .cb.doing:hover{transform:translateY(-24px)}
.cb.picked{outline:3px solid var(--ink);outline-offset:3px;transform:translateY(-14px)}
.read-pull .cb.doing.picked{transform:translateY(-26px)}
.cb.dim,.cv.dim,.wallv .fcase.dim,.wallv .pbook.dim{opacity:.28}
.cb:focus-visible,.cv:focus-visible,.basket:focus-visible,.inbox:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.cb .sp-rib{left:58%;bottom:-30px;height:32px}
.cb-eb{position:absolute;right:4px;top:-7px;width:7px;height:16px;background:var(--k-doc);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}
/* CFA 函套 */
.cfa-box{flex:none;align-self:flex-end;display:flex;flex-direction:column;gap:6px;margin-right:14px}
.cfa-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--cfa-ink)}
.cfa-tag{padding:2px 8px;border-radius:10px;border:1px solid currentColor;font-family:var(--f-ui);font-size:10.5px;font-weight:400;letter-spacing:0;white-space:nowrap;color:inherit;text-decoration:none}
.cfa-case{position:relative;padding:20px 9px 0;background:var(--linen-bg),#DCCFB3;border:5px solid #6B5577;border-bottom:0;border-radius:3px 3px 0 0;box-shadow:inset 0 8px 10px -8px rgba(0,0,0,.35),3px 0 8px -3px rgba(45,30,14,.45)}
.cfa-in{display:flex;align-items:flex-end;gap:3px}
.cv{position:relative;flex:none;width:23px;height:182px;box-sizing:border-box;padding:12px 0 8px;border:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;font:inherit;
  background:var(--shade),var(--cloth-tx),var(--cl);border-radius:2px 2px 0 0;box-shadow:2px 0 4px -2px rgba(30,20,10,.45);transition:transform .18s}
.cv.doing{transform:translateY(-14px)}
.cv.picked{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-10px)}
.cv-lab{flex:none;padding:6px 2px;background:var(--cloth-tx),var(--plab);border:1px solid var(--plab-line)}
.cv-lab span{display:block;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-display);font-weight:600;letter-spacing:.1em;line-height:1.15;color:#2B2620}
.cv-c{margin-top:auto;font-family:var(--f-mono);font-size:8.5px;color:var(--foil);opacity:.85}
.cv .cb-seal{margin-bottom:0}
.cv .sp-rib{left:50%;bottom:-24px;height:26px}
.cfa-cl{position:absolute;right:-14px;top:54px;width:9px;height:18px;border-radius:2px;background:#EFE6D2;border:1px solid #BBAA86;box-shadow:-4px 0 0 -1px #6B5577}
.cfa-cl.b{top:130px}
/* 藤筐、收件匣、小摆件 */
.basket{position:relative;flex:none;align-self:flex-end;width:74px;height:66px;margin-left:12px;text-decoration:none;isolation:isolate}
.basket::before{content:"";position:absolute;inset:0;border-radius:4px 4px 12px 12px;background:var(--rattan);box-shadow:inset 0 5px 0 var(--rattan-rim),inset 0 6px 0 rgba(255,255,255,.25),0 9px 12px -7px rgba(50,35,15,.55)}
.bk-p{position:absolute;z-index:-1;left:12px;top:-16px;width:34px;height:30px;background:#F7F1E3;border:1px solid #D5C8AC;transform:rotate(-9deg)}
.bk-p.b{left:26px;top:-20px;background:#FBF7EC;transform:rotate(6deg)}
.bk-tag{position:absolute;left:5px;right:5px;top:20px;padding:3px 0 4px;background:#F6EFDD;border:1px solid #BFAE88;border-radius:2px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 4px -2px rgba(0,0,0,.3);transform:rotate(-2deg);transition:transform .15s}
.bk-tag b{font-family:var(--f-display);font-size:15px;line-height:1;color:var(--cl)}
.bk-tag span{font-family:var(--f-ui);font-size:9.5px;color:#55493D;white-space:nowrap}
.basket:hover .bk-tag{transform:rotate(0) translateY(-2px)}
.wallv .abox{margin-right:6px}
.inbox{position:relative;flex:none;align-self:flex-end;width:120px;height:70px;margin-left:16px;text-decoration:none;isolation:isolate}
.ib-p{position:absolute;z-index:-1;left:8px;right:8px;top:4px;height:26px;background:#FBF7EC;border:1px solid #D5C8AC;transform:rotate(-3deg)}
.ib-body{position:absolute;left:0;right:0;bottom:0;height:48px;box-sizing:border-box;padding-top:6px;line-height:1.35;text-align:center;background:linear-gradient(#E9E6E0,#D8D4CC);border:1px solid #BDB8AE;border-radius:2px}
.ib-body b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:#2B2620}
.ib-body span{font-family:var(--f-ui);font-size:10.5px;color:#6E675E}
.inbox:hover .ib-p{transform:rotate(-1deg) translateY(-3px)}
/* 英语：布面片盒、绘本架、编织生词盒 */
.wallv .fcase{background:var(--shade),var(--cloth-tx),var(--case)}
.fc-lab{flex:none;padding:9px 3px;background:var(--cloth-tx),var(--plab);border:1px solid var(--plab-line)}
.fc-lab .fc-t{color:#2B2620}
.fc-lab .fc-t.two{display:block;line-height:1.15}
.easel{position:relative;flex:none;align-self:flex-end;display:flex;padding:0 8px 20px;margin-left:20px;isolation:isolate;background:linear-gradient(var(--oak-hi),var(--oak-2)) bottom/100% 20px no-repeat;border-radius:2px}
.easel::before,.easel::after{content:"";position:absolute;z-index:-1;top:16px;bottom:8px;width:4px;background:#9C7E52}
.easel::before{left:34px;transform:rotate(10deg)}.easel::after{right:34px;transform:rotate(-10deg)}
.wallv .vb-body{background:var(--rattan);box-shadow:inset 0 5px 0 var(--rattan-rim),0 9px 12px -7px rgba(50,35,15,.55)}
.wallv .vbox{margin-left:0}
/* 图例 */
.w-legend{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end;margin-top:20px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.w-legend span{display:inline-flex;align-items:flex-end;gap:6px}
.w-legend i{display:inline-block;flex:none}
.lg-b{position:relative;width:14px;height:36px;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 40%,rgba(0,0,0,.15)),#A9573F;border-radius:2px 2px 0 0}
.lg-b.doing{background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 40%,rgba(0,0,0,.15)),#B08A45;transform:translateY(-6px)}
.lg-b.doing::after{content:"";position:absolute;left:4px;bottom:-14px;width:6px;height:14px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.lg-b.thin{width:9px;background:#738189}.lg-b.thick{width:22px;background:#5E6B70}
.lg-b.done{background:#4B565B}
.lg-b.done::after{content:"";position:absolute;left:2px;bottom:4px;width:10px;height:10px;background:var(--seal);transform:rotate(-7deg)}
.lg-film{width:16px;height:36px;border-radius:2px 2px 0 0;background:repeating-linear-gradient(to bottom,rgba(240,226,190,.35) 0 3px,transparent 3px 7px) 2px 4px/3px 28px no-repeat,var(--case)}
.lg-bk{width:26px;height:20px;border-radius:2px 2px 6px 6px;background:var(--rattan)}
.pulled{flex:1 1 300px;min-width:0;background:var(--leaf);border:1px solid var(--rule);border-radius:16px;padding:24px 24px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 40px -30px rgba(36,33,30,.5)}
.pulled .eyebrow{margin:0}
.pb-h{display:flex;gap:14px;align-items:stretch;margin-top:-6px}
.pb-bar{flex:none;width:8px;background:var(--c);border-radius:2px}
.pb-h h2{margin:0;font-size:30px;font-weight:900;line-height:1.2;letter-spacing:.04em}
.pb-h .meta{margin-top:4px}
.pb-why{margin:0;font-size:15px;line-height:1.75;color:var(--ink-2)}
.fe-top{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.fe-wrap{position:relative}
.fe-block{display:flex;height:44px;border-top:5px solid var(--c);border-bottom:5px solid var(--c);border-radius:3px;overflow:hidden;box-shadow:0 8px 14px -10px rgba(36,33,30,.5)}
.fe-s{flex:1;background:repeating-linear-gradient(to bottom,rgba(36,33,30,.07) 0 1px,transparent 1px 3px),var(--spine)}
.fe-s + .fe-s{border-left:1px solid rgba(36,33,30,.22)}
.fe-s.r{background:repeating-linear-gradient(to bottom,rgba(120,92,40,.16) 0 1px,transparent 1px 3px),color-mix(in srgb,#C9A86A 32%,var(--spine))}
.fe-rib{position:absolute;top:-8px;width:8px;height:76px;margin-left:-4px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%)}
.fe-n{display:flex;margin-top:10px}
.fe-n span{flex:1;text-align:center;font-family:var(--f-display);font-size:12.5px;color:var(--ink-3)}
.fe-n span.cur{font-weight:900;color:var(--ink)}
.pb-cn{font-family:var(--f-display);margin-right:10px;color:var(--ink-3)}
.pb-st{display:flex;align-items:center;gap:10px}
/* ===== 电子书 ===== */
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.eb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:10px}
.eb-open{font-weight:700}

/* ===== 纸模（paper craft）材质：公用类 =====
 * 2026-11-10 按 Planfix 样张重画：一张烘好的纸浆纹理（--pp-pulp，vendor/paper/，脚本 tools/paper/bake_pulp.py）用 overlay 叠在实色上；
 * 每片纸只说自己的面色 --face，侧壁、亮边、凸起的影子都从面色算（文件末尾「一个房间」里的材质名单）。
 * .pp-paper 一片纸；.pp-slab 凸起的纸片（--raise：软边 + 同色暗侧壁 + 近黑接触线 + 软影；小件用 --raise-sm）；
 * .pp-emb 压进纸里的深字（底下一道亮沿）；.pp-emb-hi 凸出来的浅字（右下一道影）；.pp-cut 纸被挖掉的洞；凹槽用 --pp-sink。
 * .pp-pack 三维盒（正面、侧面、顶面）：一排同向 rotateY(-22°)，盒厚 = 正面宽 × .32 + 每张牌 1px，盒面哑光不加亮线，盒底一片平躺的接触影。 */
.pp-paper{--face:var(--pp-cream);color:var(--pp-ink)}
.pp-slab{border-radius:10px;position:relative;box-shadow:var(--raise)}
.pp-emb{text-shadow:var(--pp-in)}
.pp-emb-hi{text-shadow:var(--pp-up-zh)}
.pp-cut{border:1.5px dashed rgba(var(--pp-shade),.6);border-radius:8px;background:rgba(var(--pp-shade),.08);box-shadow:inset 2px 3px 5px rgba(var(--pp-shade),.3);display:grid;place-items:center;color:var(--pp-ink-2)}
.pp-stage{}
/* 盒子按正交投影画（参考 MYTHOS 盒的竖边是平行的）：正面 w × h 不做任何变换，侧面宽 = 盒厚 × .37（转 22°），顶面高 4px 偏到右边；
 * 盒面哑光：不加颗粒、不加滤镜，字和线都对齐像素。侧面压暗三成、顶面提亮两成用叠色做。盒底一片模糊的接触影 */
.pp-pack{--w:78px;--h:122px;--n:3;--d:calc(var(--w) * .32 + var(--n) * 1px);--s:calc(var(--d) * .37);--t:4px;--face:var(--pp-terra);--inkc:var(--pp-black);
  position:relative;display:block;width:calc(var(--w) + var(--s));height:calc(var(--h) + var(--t));flex:none;transition:transform .18s}
.pp-pack::before{content:"";position:absolute;left:3px;right:-8px;bottom:-5px;height:12px;border-radius:50%;background:rgba(var(--pp-shade),.55);filter:blur(5px)}
.pp-pack::after{content:"";position:absolute;left:10px;right:-14px;bottom:-4px;height:8px;border-radius:50%;background:rgba(var(--pp-shade),.3);filter:blur(7px)}
.pp-pack .f{position:absolute;display:block;background-color:var(--face);color:var(--inkc)}
.pp-pack .front{left:0;top:var(--t);width:var(--w);height:var(--h);z-index:2;border-radius:2px 0 0 2px;box-shadow:inset -1px 0 0 rgba(0,0,0,.18),inset 1px 0 0 rgba(255,255,255,.08)}
.pp-pack .side{left:var(--w);top:var(--t);width:var(--s);height:var(--h);z-index:2;border-radius:0 2px 2px 0;background-image:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3));display:flex;align-items:center;justify-content:center;overflow:hidden}
.pp-pack .side span{writing-mode:vertical-rl;font-family:var(--f-body);font-size:9px;font-weight:500;line-height:1;letter-spacing:.16em;opacity:.92;white-space:nowrap}
.pp-pack .top{left:0;top:0;width:calc(var(--w) + var(--s));height:var(--t);z-index:1;background-image:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22));clip-path:polygon(var(--s) 0,100% 0,var(--w) 100%,0 100%)}
.pp-pack.k{--face:var(--pp-black);--inkc:var(--pp-copper)}
.pp-pack .frame{position:absolute;inset:6px;border:1px solid currentColor;opacity:.75;border-radius:1px}
.pp-pack .frame::after{content:"";position:absolute;inset:3px;border:1px solid currentColor;opacity:.45}
.pp-pack .code{position:absolute;left:11px;top:10px;font-family:var(--f-mono);font-size:9px;font-weight:600;line-height:1;letter-spacing:.08em;opacity:.9;white-space:nowrap}
.pp-pack .g{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-display);font-size:44px;font-weight:900;line-height:1}
.pp-pack .n{position:absolute;left:11px;right:11px;bottom:11px;text-align:center;font-family:var(--f-display);font-size:10px;font-weight:600;line-height:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid currentColor;padding:5px 3px 4px}
@media (prefers-reduced-motion: reduce){.pp-pack{transition:none}}

/* ===== 书架：档案架（纸模）：一块牛皮纸板，层板按行重复；不分领域，盒子按顺序一排同向立满一层再换一层；
 * 没装盒的剪报是一叠牌跟在盒子后面，收件匣一叠牌在最后，再一个「＋ 新盒」的切口。层板画在板子的背景里（重复渐变），颗粒盖在上面 ===== */
.arack{--rh:200px;--pk:20px;margin-top:0;padding:8px;border-radius:12px;width:100%;box-sizing:border-box}
.agrid{--top:0px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:var(--rh);align-items:end;justify-items:center;padding:var(--top) 14px 0;gap:0 6px}
.agrid>*{margin-bottom:calc(var(--pk) + 2px)}
.agrid>.apack{margin-bottom:5px}
.apack{flex:none;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.apack:hover .pp-pack{transform:translateY(-6px)}
.apack.picked .pp-pack{transform:translateY(-10px)}
.apack.picked .pp-pack .front{box-shadow:inset 0 0 0 2px var(--pp-cream),inset -1px 0 0 rgba(0,0,0,.18)}
.apack:focus-visible{outline:2px solid var(--indigo);outline-offset:6px;border-radius:4px}
.apack.dim,.adeck.dim{opacity:.3}
.adeck{position:relative;display:block;width:88px;height:60px;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;text-decoration:none;text-align:left;-webkit-tap-highlight-color:transparent}
.adeck .cd{position:absolute;inset:0;display:block;--face:var(--pp-black);color:var(--pp-copper);border-radius:4px;background-color:var(--face);
  box-shadow:0 1px 0 var(--pp-black-dk),0 2px 0 var(--pp-black-lt),0 3px 0 var(--pp-black-dk),0 4px 0 var(--pp-black-lt),0 5px 0 var(--pp-black-dk),3px 9px 10px -3px rgba(40,25,10,.6)}
.adeck .cd::before{content:"";position:absolute;inset:5px;border:1px solid currentColor;opacity:.6;border-radius:2px}
.adeck .cd .g{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-display);font-size:24px;font-weight:900;line-height:1}
.adeck .cd.up{--face:var(--pp-cream-2);color:var(--pp-ink);transform:rotate(-5deg) translate(-3px,-6px);padding:8px 10px;font-family:var(--f-display);font-size:10px;font-weight:600;line-height:1.35;overflow:hidden;box-shadow:var(--raise-sm)}
.adeck .cd.up::before{display:none}
.adeck em{position:absolute;left:-10px;right:-10px;top:-24px;text-align:center;font-family:var(--f-ui);font-size:10px;line-height:1;letter-spacing:.14em;color:var(--pp-ink-2);font-style:normal;white-space:nowrap}
.adeck em .cls{font-family:var(--f-mono);font-weight:600;color:var(--pp-terra-dk);margin-right:4px}
.adeck:hover .cd.up{transform:rotate(-5deg) translate(-3px,-10px)}
.adeck:hover .cd:not(.up){transform:translateY(-3px)}
.adeck:focus-visible{outline:2px solid var(--indigo);outline-offset:6px;border-radius:4px}
.adeck.picked .cd.up{box-shadow:inset 0 0 0 2px var(--pp-terra),var(--raise-sm)}
.adeck.empty{display:grid;place-items:center;cursor:default;font-family:var(--f-body);font-size:11px;letter-spacing:.14em}
.arack .anew{width:72px;height:108px;margin:0;padding:0;gap:10px;border:1.5px dashed rgba(var(--pp-shade),.55);border-radius:6px;background:rgba(var(--pp-shade),.06);box-shadow:inset 2px 3px 5px rgba(var(--pp-shade),.28),inset 0 0 0 1px rgba(255,255,255,.12);color:var(--pp-ink-2);justify-content:center}
.arack .anew b{font-family:var(--f-display);font-size:30px;font-weight:300}
.arack .anew span{writing-mode:horizontal-tb;font-family:var(--f-body);font-size:10px;letter-spacing:.14em}
.arack .anew:hover{color:var(--pp-ink);border-color:rgba(var(--pp-shade),.8);background:rgba(var(--pp-shade),.1)}
.agrid>.anew{margin-bottom:calc(var(--pk) + 6px)}
@media (max-width:640px){
  .arack{--rh:156px;--pk:16px}
  .agrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));padding:0 8px 0;gap:0 4px}
  .arack .pp-pack{--w:66px;--h:102px}
  .arack .pp-pack .g{font-size:36px}
  .arack .pp-pack .n{font-size:9px;bottom:9px;left:9px;right:9px}
  .arack .pp-pack .code{font-size:8px;left:9px;top:9px}
  .adeck{width:78px;height:54px}
  .arack .anew{width:60px;height:92px}
}

/* ---------- 卡牌与卡包 ----------
 * 一篇文章一张牌：牌背是固定封面（圆光夜读小景）加题签，右上铜钱是用时，底边是来源和宝石。--dom 是领域色，一盒一种底色。 */
/* ---------- 牌（纸模）：一篇文章一张牌。没读的牌背朝上：黑卡、铜色双框、领域大字、卷号；读过的牌面朝上：米白卡纸，类型一字签、标题、来源与日期与分钟、为什么存。
 * 牌是一片有厚度的纸（切边亮、底下暗带），不加颗粒 ---------- */
.yc{--face:var(--pp-black);position:relative;display:block;flex:none;width:118px;height:170px;margin:0;padding:0;border:0;box-sizing:border-box;border-radius:8px;overflow:hidden;
  background:var(--face);color:var(--pp-copper);font:inherit;text-align:left;cursor:pointer;text-decoration:none;
  box-shadow:var(--raise-sm);transition:transform .18s,box-shadow .18s}
.yc.up{--face:var(--pp-cream-2);color:var(--pp-ink)}
.yc:hover,.yc:focus-visible{transform:translateY(-10px) rotate(0) !important;z-index:3;outline:none;box-shadow:inset 0 0 0 2px var(--pp-copper),var(--raise)}
.yc.up:hover,.yc.up:focus-visible{box-shadow:inset 0 0 0 2px var(--pp-terra),var(--raise)}
.yc.yc-wait{visibility:hidden}
.yc-bk,.yc-face{position:absolute;inset:0;display:block}
.yc-bk .frame{position:absolute;inset:7px;border:1.5px solid currentColor;border-radius:3px;opacity:.9}
.yc-bk .frame::after{content:"";position:absolute;inset:3px;border:1px solid currentColor;opacity:.45}
.yc-bk .code{position:absolute;left:14px;top:14px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;line-height:1;letter-spacing:.1em;white-space:nowrap}
.yc-bk .code.r{left:auto;right:14px;top:auto;bottom:14px;transform:rotate(180deg)}
.yc-bk .g{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-display);font-size:56px;font-weight:900;line-height:1}
.yc-face{padding:12px 12px 10px 16px;display:flex;flex-direction:column;gap:6px}
.yc-face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pp-terra)}
.yc-kind{align-self:flex-start;display:inline-block;padding:3px 6px 2px 7px;border-radius:2px;background:var(--pp-olive);color:var(--pp-cream);font-family:var(--f-display);font-size:10px;font-weight:700;line-height:1;letter-spacing:.14em;box-shadow:0 1px 0 var(--pp-olive-dk)}
.yc-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-family:var(--f-display);font-size:13px;font-weight:700;line-height:1.35;color:var(--pp-ink)}
.yc-meta{font-family:var(--f-ui);font-size:10px;line-height:1.45;color:var(--pp-ink-2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.yc-why{margin-top:auto;padding-top:6px;border-top:1px dashed rgba(var(--pp-shade),.3);font-family:var(--f-display);font-size:10.5px;line-height:1.5;color:var(--pp-ink);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.yc-mk{position:absolute;right:9px;top:9px;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--pp-copper);color:var(--pp-cream);font-family:var(--f-display);font-style:normal;font-size:9px;font-weight:700;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.25)}
/* 摊开的一把牌：一张压一张，略歪 */

/* 牌飞出来、翻开：盖在页面上的临时元素 */
.yc.yfly{position:fixed;z-index:1000;pointer-events:none;transition:none}
.yc.yfly:hover{transform:none}
.yflash{position:fixed;z-index:999;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,236,190,.95),rgba(255,227,160,.4) 30%,transparent 62%);animation:yflash .65s ease-out forwards}
@keyframes yflash{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.6);opacity:0}}
.yflip{position:fixed;z-index:1200;pointer-events:none;perspective:1400px}
.yf-in{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}

.cl-help{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;margin:18px 0 6px;padding:16px 18px;background:var(--paper);border-radius:var(--r);font-size:14.5px;line-height:1.7;color:var(--ink-2)}

.cl-bm{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border:1px dashed var(--seal);border-radius:16px;background:var(--seal-wash);color:var(--seal);font-family:var(--f-ui);font-size:14px;font-weight:700;text-decoration:none;cursor:grab}

.clg-h{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 8px}
.clg-h i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.clg-h small{font-family:var(--f-num);font-size:13px;color:var(--ink-3);font-weight:500}
.cl-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cl-card{position:relative;display:flex;flex-direction:column;gap:5px;padding:14px 16px 12px;background:var(--card);border:1px solid var(--card-line);border-radius:3px;box-shadow:0 2px 4px -3px rgba(40,30,15,.35)}
.cl-card::before{content:"";position:absolute;top:-6px;left:18px;width:34px;height:12px;background:rgba(214,190,140,.55);transform:rotate(-3deg)}
.cl-card.link{background:transparent;border-style:dashed}
.cl-t{align-self:flex-start;padding:0;border:0;background:none;text-align:left;font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.45;color:var(--ink);cursor:pointer;text-decoration:none}
.cl-t:hover{color:var(--indigo)}
.cl-wait{font-family:var(--f-ui);font-size:11.5px;font-weight:600;color:var(--seal);border:1px solid var(--seal);border-radius:9px;padding:0 6px;margin-left:4px;white-space:nowrap}
.cl-m{margin:0;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.cl-why,.cl-ex{margin:2px 0 0;font-size:14px;line-height:1.65;color:var(--ink-2)}

.cl-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:6px}

html.clip-mode .topbar,html.clip-mode .mainnav{display:none}
html.clip-mode main{padding:18px 18px 40px}
.clip-page{max-width:560px}
.cp-h{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:16px;border-bottom:3px solid var(--ink)}

.cp-to{margin-left:auto;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.cp-msg{font-size:15.5px;line-height:1.8;color:var(--ink-2)}
.cp-form{display:flex;flex-direction:column;gap:12px}
.cp-form .field{display:flex;flex-direction:column;gap:4px;font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.cp-form input,.cp-form select,.cp-form textarea{font-size:15px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--leaf);color:var(--ink);font-family:var(--f-body)}
.cp-form input[name=title]{font-family:var(--f-display);font-weight:700;font-size:16.5px}
.cp-meta,.cp-note{margin:-4px 0 0;font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.cp-note{color:var(--seal)}
.cp-prev{border:1px solid var(--rule);border-radius:5px;background:var(--paper)}
.cp-pm{margin:0;padding:7px 12px;border-bottom:1px solid var(--rule);font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}

/* 笔记本架：随手本一天一页；记一笔是一张纸条（设计稿 docs/notebook-design.md） */
.np-jot{gap:8px}.np-jot kbd{font:12px var(--f-num);border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px;color:var(--ink-3)}
.tb-jot{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:18px;background:none;color:var(--ink-2);font-family:var(--f-ui);font-size:13px;cursor:pointer}
.tb-jot:hover{color:var(--ink);border-color:var(--ink)}
/* 笔记本架（纸模）：一块牛皮纸板一层层板（画在背景里），本子封面朝外同向立着，右边露出书口，页越多越厚；最后是「＋ 新本子」切口 */
.nrack{--rh:214px;--pk:16px;margin:0 0 10px;padding:8px;border-radius:12px}
.nr-row{--top:0px;display:flex;align-items:flex-end;gap:24px;height:var(--rh);padding:0 26px calc(var(--pk) + 2px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.nr-row::-webkit-scrollbar{display:none}
.nbk-b{--w:92px;--h:134px;--s:calc(10px + var(--n,0) * .5px);--t:4px;position:relative;flex:none;width:calc(var(--w) + var(--s));height:calc(var(--h) + var(--t));margin:0;padding:0;border:0;background:none;font:inherit;color:var(--pp-ink);cursor:pointer;text-align:center;transition:transform .18s}
.nbk-b::before{content:"";position:absolute;left:4px;right:-6px;bottom:-5px;height:12px;border-radius:50%;background:rgba(var(--pp-shade),.55);filter:blur(5px)}
.nbk-b .nb-cv{position:absolute;left:0;top:var(--t);width:var(--w);height:var(--h);display:block;border-radius:5px 2px 2px 5px;background-color:var(--face);background-image:var(--pp-pulp);background-size:var(--pp-pulp-s);background-blend-mode:overlay;box-shadow:inset -1px 0 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.1),inset 7px 0 0 rgba(0,0,0,.14)}
.nbk-b .nb-cv::after{content:"";position:absolute;right:14px;top:0;bottom:0;width:5px;background:var(--pp-black);opacity:.75}
.nbk-b .lab{position:absolute;left:14px;right:24px;top:30px;padding:8px 4px 7px;display:flex;flex-direction:column;gap:3px;background-color:var(--pp-cream-2);background-image:var(--pp-pulp);background-size:var(--pp-pulp-s);background-blend-mode:overlay;border-radius:1px;box-shadow:1px 1px 0 rgba(0,0,0,.25);text-align:center}
.nbk-b.lt .lab{background-color:var(--pp-kraft)}
.nbk-b .lab b{font-family:var(--f-display);font-size:11.5px;font-weight:700;line-height:1.3;letter-spacing:.1em;color:var(--pp-ink);text-shadow:-1px -1px 0 rgba(50,30,12,.22),1px 1px 0 rgba(255,255,255,.55)}
.nbk-b .lab small{font-family:var(--f-ui);font-size:9px;letter-spacing:.12em;color:var(--pp-ink-2)}
.nbk-b .nb-pg{position:absolute;left:var(--w);top:var(--t);width:var(--s);height:var(--h);display:block;border-radius:0 2px 2px 0;background:var(--pp-cream);background-image:repeating-linear-gradient(90deg,rgba(60,40,20,.3) 0 1px,transparent 1px 3px)}
.nbk-b:hover,.nbk-b:focus-visible{transform:translateY(-6px);outline:none}
.nbk-b.cur{transform:translateY(-10px)}
.nbk-b.cur .lab{box-shadow:0 0 0 2px var(--pp-terra),1px 1px 0 rgba(0,0,0,.25)}
.nbk-b:focus-visible .nb-cv{box-shadow:inset 0 0 0 2px var(--indigo)}
.nbk-b.ghost{width:92px;height:134px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed rgba(var(--pp-shade),.55);border-radius:6px;background:rgba(var(--pp-shade),.06);box-shadow:inset 2px 3px 5px rgba(var(--pp-shade),.28),inset 0 0 0 1px rgba(255,255,255,.12);color:var(--pp-ink-2)}
.nbk-b.ghost::before{display:none}
.nbk-b.ghost b{font-family:var(--f-display);font-size:30px;font-weight:300;line-height:1}
.nbk-b.ghost span{font-family:var(--f-body);font-size:10.5px;letter-spacing:.14em}
.nbk-b.ghost:hover{color:var(--pp-ink);border-color:rgba(var(--pp-shade),.8);background:rgba(var(--pp-shade),.1)}
.nbk{--face:var(--pp-cream-2);margin-top:0;display:grid;grid-template-columns:1fr 1fr;position:relative;color:var(--pp-ink);border-radius:10px;box-shadow:var(--raise);min-height:520px}
.nbk::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:48px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.10) 46%,rgba(0,0,0,.16) 50%,rgba(0,0,0,.10) 54%,transparent);pointer-events:none}
.nbk-l,.nbk-r{padding:34px 44px 26px;min-width:0}
.nbk-l{border-right:1px solid rgba(var(--pp-shade),.18)}
.nbk .eyebrow{color:var(--pp-ink-2);margin:0 0 6px}
.nbk h1{font:600 28px/1.2 var(--f-display);margin:0 0 6px;letter-spacing:.06em;color:var(--pp-ink);text-shadow:var(--pp-in)}
.np-bk-h{font:600 24px/1.2 var(--f-display);margin:0 0 10px;letter-spacing:.06em;color:var(--pp-ink)}
.np-bk-h small{font-size:.6em;color:var(--pp-ink-2);font-weight:400;letter-spacing:.1em}
.np-ops{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.np-ops .btn{--face:var(--pp-terra)}
.np-title{display:block;width:100%;box-sizing:border-box;margin:0 0 6px;padding:4px 0;border:0;border-bottom:1px dashed rgba(var(--pp-shade),.3);background:none;font:600 26px/1.3 var(--f-display);letter-spacing:.06em;color:var(--pp-ink);outline:none}
.np-title::placeholder{color:var(--pp-ink-3);font-weight:400}
.np-title:focus{border-bottom-color:var(--pp-terra)}
.np-foot2{justify-content:flex-end;margin-top:8px}
.np-del{display:inline-flex;gap:10px;align-items:center}
.jot-nb{display:inline-flex;align-items:center;gap:6px}
.jot-nb select{font:12px var(--f-ui);border:1px solid rgba(var(--pp-shade),.4);border-radius:4px;background:var(--pp-cream-2);color:var(--pp-ink);padding:1px 4px}
.nbk h1 small{font-size:.6em;color:var(--pp-ink-2);font-weight:400;letter-spacing:.1em}
.np-eye{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.np-dnav{display:flex;gap:14px}.np-dnav .linkbtn:disabled{opacity:.4;cursor:default;text-decoration:none}
.nbk .linkbtn{color:var(--pp-ink-2)}
.np-mnav{display:flex;align-items:baseline;justify-content:space-between;margin:0}
.np-mnav h2 small{font:13px var(--f-ui);color:var(--pp-ink-3);letter-spacing:0;margin-left:6px}
.np-arr{display:flex;gap:6px;align-self:center}
.np-mnav h2{font:600 18px/1.2 var(--f-display);margin:0;letter-spacing:.08em;color:var(--pp-ink)}
.np-mb{width:24px;height:24px;padding:0;border:1px solid rgba(var(--pp-shade),.35);border-radius:50%;background:none;color:var(--pp-ink-2);font-size:14px;line-height:1;cursor:pointer}
.np-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:0 4px;font:13px var(--f-num);text-align:center;margin:6px 0 16px;color:var(--pp-ink-2)}
.np-cal b{font-weight:600;font-size:12px;color:var(--pp-ink-3);padding:2px 0 6px}
.np-cal span{padding:4px 0 7px}
.np-d{position:relative;padding:4px 0 7px;border:0;border-radius:5px;background:none;color:inherit;font:inherit;line-height:1.2;cursor:pointer}
.np-d:hover{background:rgba(255,236,210,.35)}
.np-d.np-dot::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--pp-terra);transform:translateX(-50%)}
.np-d.np-today{box-shadow:inset 0 0 0 1px rgba(var(--pp-shade),.5)}
.np-d.np-cur{background:var(--pp-terra);color:var(--pp-cream-2)}.np-d.np-cur.np-dot::after{background:var(--pp-cream-2)}
.np-toc{list-style:none;margin:0;padding:0;border-top:1px solid #E8DFC9}
.np-toc li{border-bottom:1px solid #E8DFC9}
.np-toc-b{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;width:100%;padding:9px 0;border:0;background:none;color:#2A2622;font:14px/1.6 var(--f-body);cursor:pointer;text-align:left}
.np-pv{grid-column:1 / -1;color:var(--pp-ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.np-toc-b em{font:13px var(--f-num);font-style:normal;color:var(--pp-ink-3)}
.np-toc-b.cur span{font-weight:700}
.np-none{color:var(--pp-ink-3)}
.np-paper{min-height:260px;cursor:text;border-radius:4px}
.np-paper.empty{display:grid;place-items:center;color:var(--pp-ink-3);text-align:center;padding:40px 20px;border:1px dashed rgba(var(--pp-shade),.35)}
.np-paper.empty p{margin:0;max-width:22em;line-height:1.9}
.np-paper kbd{font:12px var(--f-num);border:1px solid rgba(var(--pp-shade),.4);border-radius:3px;padding:0 5px}
.np-ent{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(var(--pp-shade),.35)}
.np-ent.bare{grid-template-columns:1fr}.np-ent.bare time{display:none}
.np-ent time{font:14px var(--f-num);color:var(--pp-ink-3);padding-top:4px}
.np-body{min-width:0;font-size:15px;line-height:1.75}
.np-body p{margin:0 0 6px}.np-body p:last-child{margin:0}
.np-body h2,.np-body h3,.np-body h4{font-family:var(--f-display);margin:4px 0 6px;letter-spacing:.04em;color:#2A2622}
.np-body h2{font-size:20px}.np-body h3{font-size:17px}.np-body h4{font-size:15px}
.np-body blockquote{margin:6px 0;padding-left:12px;border-left:3px solid #D2C7AF;color:#5A544B}
.np-body ul,.np-body ol{margin:4px 0;padding-left:1.4em}
.np-body code{font:13px var(--f-mono);background:#F1EADA;padding:1px 5px;border-radius:3px}
.np-ta{display:block;width:100%;box-sizing:border-box;min-height:300px;padding:10px 0;border:0;border-bottom:1px solid rgba(var(--pp-shade),.35);border-radius:0;resize:vertical;background:repeating-linear-gradient(180deg,transparent 0 27px,#EFE6D1 27px 28px);background-attachment:local;color:#2A2622;font:15px/28px var(--f-body);outline:none}
.np-foot{display:flex;justify-content:space-between;margin:18px 0 0;font:13px var(--f-ui);color:var(--pp-ink-3)}
.jot-wrap{position:fixed;right:28px;top:72px;z-index:75;pointer-events:none}
.jot{position:relative;pointer-events:auto;width:min(380px,calc(100vw - 32px));margin:0;background:var(--pp-cream-2);color:var(--pp-ink);padding:16px 18px 12px;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,236,210,.6),0 24px 40px -14px rgba(0,0,0,.55);transform:rotate(-.6deg);animation:jot-in .22s ease-out}
.jot::before{content:"";position:absolute;left:50%;top:-10px;width:70px;height:20px;transform:translateX(-50%) rotate(1.5deg);background:rgba(220,205,160,.6);border-left:1px solid rgba(0,0,0,.08);border-right:1px solid rgba(0,0,0,.08)}
@keyframes jot-in{from{opacity:0;transform:translateY(-12px) rotate(-.6deg)}to{opacity:1;transform:translateY(0) rotate(-.6deg)}}
.jot-to{display:flex;justify-content:space-between;margin:0;font:12px var(--f-ui);letter-spacing:.1em;color:var(--pp-ink-3)}
.jot-to b{color:#2A2622;font-family:var(--f-num);font-size:13px}
.jot textarea{display:block;width:100%;box-sizing:border-box;margin:10px 0 8px;padding:0;border:0;border-radius:0;resize:none;background:repeating-linear-gradient(180deg,transparent 0 25px,#EADFBE 25px 26px);background-attachment:local;color:#2A2622;font:15px/26px var(--f-body);outline:none;min-height:78px}
.jot-hint{display:flex;justify-content:space-between;align-items:center;margin:0;font:12px var(--f-ui);color:var(--pp-ink-3)}
.jot-hint kbd{font:11px var(--f-num);border:1px solid rgba(var(--pp-shade),.4);border-radius:3px;padding:0 4px}
@media (max-width:880px){
  .nrack{--rh:176px;--pk:13px;margin-bottom:18px}.nr-row{gap:14px;padding:0 14px calc(var(--pk) + 6px)}.nbk-b{--w:76px;--h:110px}.nbk-b .lab{left:11px;right:20px;top:22px;padding:6px 3px 5px}.nbk-b .lab b{font-size:10.5px}.nbk-b.ghost{width:76px;height:110px}
  .nbk{grid-template-columns:1fr;min-height:0}.nbk::before{display:none}
  .nbk-l{order:2;border-right:0;border-top:1px solid rgba(var(--pp-shade),.18)}.nbk-r{order:1}
  .nbk-l,.nbk-r{padding:22px 20px}
  .tb-jot span{display:none}.tb-jot{width:36px;padding:0;justify-content:center;border-radius:50%}.np-jot{display:none}
  .jot-wrap{right:0;left:0;top:auto;bottom:0;display:flex;justify-content:center;padding:0 12px 12px}
  .jot{width:100%;transform:none;animation:none}.jot::before{display:none}
}
@media (max-width:560px){.np-ent{grid-template-columns:44px 1fr;gap:8px}}

/* 场景：拱形书柜（vendor/scene/arch/）。图按 --sc-w 宽的像素比例拉伸到墙宽；行高 = 墙宽 × 格层比；书按 --bz 缩放进格层 */
.wall.scene-arch{gap:0;padding:0;border-radius:8px;overflow:hidden;background:url(vendor/scene/arch/wall.webp) center/cover #6b4a26;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.wall.scene-arch .sc-top{width:100%;aspect-ratio:var(--sc-w) / var(--sc-top);background:url(vendor/scene/arch/top.webp) center/100% 100% no-repeat}
.wall.scene-arch .sc-base{width:100%;aspect-ratio:var(--sc-w) / var(--sc-base);background:url(vendor/scene/arch/base.webp) center/100% 100% no-repeat}
.wall.scene-arch .wall-row{position:relative;box-sizing:border-box;width:100%;aspect-ratio:var(--sc-w) / var(--sc-bay);padding:0 var(--sc-pad);gap:0 14px;flex-wrap:nowrap;align-items:flex-end;overflow:visible;background:url(vendor/scene/arch/bay.webp) center/100% 100% no-repeat}
.wall.scene-arch.measuring .wall-row{aspect-ratio:auto}
.wall.scene-arch .wm{margin-top:0;min-width:0}
.wall.scene-arch .wm-in{zoom:var(--bz,.7);padding:8px 10px 0}
.wall.scene-arch .wm-board{height:0;padding:0;background:none;box-shadow:none;border-radius:0}
.wall.scene-arch .wm-lab{position:absolute;left:12px;bottom:-15px;z-index:4;color:#E6D2A0;font-size:10px;letter-spacing:.06em;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.wall.scene-arch .wm-lab b{color:#F0DFB0}
.wall.scene-arch .wm-plus{position:absolute;right:10px;bottom:-16px;z-index:4;background:rgba(230,210,160,.25);color:#F0DFB0}
.wall.scene-arch .wm.ghost .wm-in{border-color:rgba(230,210,160,.35)}
.wall.scene-arch .wm-add{background:rgba(0,0,0,.25);color:#E6D2A0;border-color:rgba(230,210,160,.4)}
.wall.scene-arch .wm-add small{color:#C9B482}
.wall.scene-arch .wm-empty{color:#C9B482}
.lk-rd.rd-arch{border-radius:7px 7px 0 0;border-width:2px 1.5px 1.5px}

/* 手机场景：窄高单格柜（vendor/scene/arch-m/），每个领域格子就是一个格层，书在格层里横向滑 */
.wall.scene-arch-m{gap:0;padding:0;border-radius:8px;overflow:hidden;background:url(vendor/scene/arch/wall.webp) center/cover #6b4a26}
.wall.scene-arch-m .sc-top{width:100%;aspect-ratio:var(--sc-w) / var(--sc-top);background:url(vendor/scene/arch-m/top.webp) center/100% 100% no-repeat}

.yx-fan.arc .yx-card-btn:hover,.yx-fan.arc .yx-card-btn:focus-visible{transform:rotate(calc(var(--a) + var(--o,0deg))) translateY(-14px);z-index:3}

/* 舞台上的字按屏幕尺寸画：世界缩小时字不跟着缩（--s 是镜头比例，--L 是屏幕上的基准字号） */

.yx-stage .yx-world .yx-stone-s{font-size:calc(var(--L) * .85 / var(--s,1))}

/* ===== 一个房间（纸模；2026-11-10 按 Planfix 样张重画材质与版面）：全站底是牛皮纸，顶栏、数字砖、按钮、搜索框、表单、手机底栏都是纸片；
 * 线网、足迹、阅读器等页只换底色与顶栏，内容不动。
 * 版面：屏幕是一面拼起来的纸砖，牛皮纸底只当砖缝（缝 8 像素）。颜色分工：奶油 = 放内容的面，橄榄 = 没选中的数字砖，赤陶 = 品牌与主操作；
 *       选中与否靠明度（奶油面对橄榄面，差 70 级以上）和形状（压下去的坑、顶上的短条），不靠红绿。
 * 材质名单：下面第一条规则里的每一种纸片各自说面色 --face，侧壁 --side、亮边 --lite、细沿 --rim 和两个凸起配方 --raise / --raise-sm 都从面色算；
 *       第二条规则给它们上纸浆纹理（牌不上颗粒，所以 .yc 只在第一条里）。新做一种纸片：把选择器加进名单，写 --face，要凸起就 box-shadow:var(--raise)。 ===== */
@media (min-resolution:1.5dppx){:root{--pp-pulp:url(vendor/paper/pulp.webp)}}
.pp-paper,.pp-slab,.btn,.brand,html:not(.yx-app) .mainnav,html:not(.yx-app) .mainnav a[aria-current="page"],.tb-tools,.shelf-seg a,.arch-q,.clipbar,.add-card,.jot,.pspine,.yc,.adeck .cd,.nbk{
  --side:color-mix(in srgb,var(--face),#1E1204 46%);--lite:color-mix(in srgb,var(--face),#FFF4E0 50%);--rim:color-mix(in srgb,var(--face),#FFF4E0 18%);
  --raise:inset 0 0 0 1px var(--rim),inset 1.5px 2px 2.5px var(--lite),inset -2px -3px 4px rgba(var(--pp-shade),.4),1px 4px 0 var(--side),1px 5px 1px rgba(20,10,0,.6),4px 9px 11px rgba(var(--pp-shade),.62);
  --raise-sm:inset 0 0 0 1px var(--rim),inset 1px 1.5px 1px var(--lite),inset -1px -1.5px 2px rgba(var(--pp-shade),.38),1px 2px 0 var(--side),1px 3px 1px rgba(20,10,0,.5),2px 4px 5px rgba(var(--pp-shade),.55)}
.pp-paper,.btn,.brand,html:not(.yx-app) .mainnav,html:not(.yx-app) .mainnav a[aria-current="page"],.tb-tools,.shelf-seg a,.arch-q,.clipbar,.add-card,.jot,.pspine,.adeck .cd,.nbk{
  background-color:var(--face);background-image:var(--pp-pillow),var(--pp-pulp);background-size:auto,var(--pp-pulp-s);background-blend-mode:normal,overlay}
body,.topbar{background-color:var(--pp-kraft);background-image:var(--pp-pulp);background-size:var(--pp-pulp-s);background-blend-mode:overlay}
/* 书架三页之外（线网、足迹、课程、阅读）字直接印在底上，底用浅纸，顶栏那一条仍是牛皮纸 */
html:not(.yx-dark) body:not(:has(.view.shelf)){background-color:var(--pp-sheet)}
/* 三个架子的格层：奶油框里一块凹下去的浅牛皮纸背板，层板是奶油色的一条（上沿亮、下沿暗），书、盒、本子立在层板上沿 */
.pgrid,.agrid,.nr-row{border-radius:7px;box-shadow:var(--pp-sink);background-color:var(--pp-well);
  background-image:var(--pp-pulp),
    repeating-linear-gradient(to bottom,transparent 0 calc(var(--rh) - var(--pk)),rgba(255,246,230,.9) calc(var(--rh) - var(--pk)) calc(var(--rh) - var(--pk) + 1.5px),var(--pp-cream-2) calc(var(--rh) - var(--pk) + 1.5px) calc(var(--rh) - 3px),color-mix(in srgb,var(--pp-cream),#1E1204 55%) calc(var(--rh) - 3px) var(--rh)),
    repeating-linear-gradient(to bottom,rgba(var(--pp-shade),.62) 0 1px,rgba(var(--pp-shade),.34) 1px 6px,rgba(var(--pp-shade),0) 26px var(--rh));
  background-size:var(--pp-pulp-s),100% var(--rh),100% var(--rh);background-blend-mode:overlay,normal,normal;background-position:0 0,0 var(--top),0 var(--top)}
/* 顶栏：三块砖摆在牛皮纸底上：赤陶的牌子、奶油的导航、奶油的工具 */
.topbar{border-bottom:0;box-shadow:none}
.tb-in{padding:8px 28px;gap:8px;align-items:stretch}
.brand{--face:var(--pp-terra);height:48px;box-sizing:border-box;padding:0 20px 0 14px;border-radius:10px;box-shadow:var(--raise);color:var(--pp-hi)}
.brand b{color:var(--pp-hi);font-size:21px;font-weight:900;letter-spacing:.14em;text-shadow:var(--pp-up-zh)}
.roundel{border-color:var(--pp-hi);filter:drop-shadow(1px 1px 0 rgba(50,32,8,.55))}
.roundel i{background:var(--pp-ink)}
html:not(.yx-app) .mainnav{--face:var(--pp-cream-2);flex:0 1 auto;align-items:center;height:48px;box-sizing:border-box;padding:0 6px;border-radius:10px;box-shadow:var(--raise)}
html:not(.yx-app) .mainnav a{min-height:36px;color:var(--pp-ink-2);border-radius:7px;font-weight:600}
html:not(.yx-app) .mainnav a:hover{background:rgba(var(--pp-shade),.1);color:var(--pp-ink)}
