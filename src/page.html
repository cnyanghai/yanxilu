.bay-empty{align-self:center;margin:0 auto 90px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.abox{position:relative;flex:none;height:252px;padding:0;border:0;border-radius:3px 3px 0 0;cursor:pointer;font:inherit;text-align:center;
  background:linear-gradient(90deg,#A9844C 0,#C9A367 9%,#D3B077 50%,#C59E62 91%,#A27D46 100%);box-shadow:inset 0 0 0 1px rgba(80,56,20,.35),0 10px 14px -10px rgba(36,33,30,.6);transition:transform .15s,opacity .15s}
.abox:hover{transform:translateY(-4px)}
.abox.doing{transform:translateY(-16px)}
.abox.doing:hover{transform:translateY(-20px)}
.abox.picked{outline:3px solid var(--ink);outline-offset:3px}
.abox:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.abox.dim,.asheet.dim{opacity:.28}
.ab-slips i{position:absolute;width:9px;background:var(--k);border-radius:1px 1px 0 0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.ab-band{position:absolute;left:0;right:0;top:0;height:9px;background:var(--c);border-radius:3px 3px 0 0}
.ab-label{position:absolute;left:7px;right:7px;top:20px;bottom:44px;box-sizing:border-box;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#F7F1E2;border:1px solid #B79A63;color:#24211E}
.ab-no{font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:1.2;color:var(--c)}
.ab-no b{display:block;font-weight:600;color:#24211E}
.ab-t{display:flex;flex-direction:row-reverse;gap:2px}
.ab-t span{writing-mode:vertical-rl;white-space:nowrap;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;line-height:1.15;color:#24211E}
.ab-t span.sub{font-weight:600;letter-spacing:.08em;color:#4A443D}
.ab-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;color:#6E675E}
.ab-seal{width:22px;height:22px;display:grid;place-items:center;background:#C8372D;color:#FFF;font-family:var(--f-display);font-style:normal;font-size:12.5px;font-weight:900;transform:rotate(-8deg);box-shadow:inset 0 0 0 2px #C8372D,inset 0 0 0 3px rgba(255,255,255,.8)}
.ab-hole{position:absolute;left:50%;bottom:13px;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#3A2E22;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35)}
.ab-tag{position:absolute;z-index:2;right:-6px;top:2px;padding:2px 5px 3px 9px;background:#F4EAD0;border:1px solid #A8956A;border-radius:2px 7px 7px 2px;font-family:var(--f-ui);font-size:10.5px;font-weight:700;line-height:1.2;color:#C8372D;transform:rotate(9deg);box-shadow:0 3px 4px -2px rgba(0,0,0,.35)}
.ab-tag::before{content:"";position:absolute;left:3px;top:50%;margin-top:-2px;width:4px;height:4px;border-radius:50%;background:#8A7A5A}
.abox .sp-rib{left:50%;margin-left:-3px;bottom:-30px;height:32px}
.bay.atray{flex-direction:column;align-items:stretch;justify-content:space-between;gap:12px;padding:22px 12px 26px;background:radial-gradient(90% 90% at 50% -10%,var(--bay-hi) 0%,transparent 70%),color-mix(in srgb,var(--bay-bg) 92%,#000)}
.atray-h{text-align:center}
.atray-h b{display:block;font-family:var(--f-display);font-size:15px;letter-spacing:.2em;color:var(--ink)}
.atray-h span{display:block;margin-top:6px;font-family:var(--f-ui);font-size:12px;line-height:1.6;color:var(--ink-3)}
.atray-pile{position:relative;height:150px}
.atray-empty{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.asheet{position:absolute;left:4px;right:4px;height:62px;box-sizing:border-box;padding:8px 10px;background:#FBF7EC;border:1px solid #CFC3A6;box-shadow:0 6px 10px -8px rgba(0,0,0,.5);text-decoration:none;color:#24211E;text-align:left;transition:opacity .15s}
.asheet i{display:block;width:26px;height:4px;margin-bottom:5px;background:var(--k)}
.asheet b{display:block;font-family:var(--f-display);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asheet span{font-family:var(--f-mono);font-size:10px;color:#6E675E}
.asheet:hover b{text-decoration:underline}
.atray-base{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(#7A6650,#5A4A3B);border-radius:0 0 4px 4px;box-shadow:inset 0 3px 0 rgba(255,255,255,.15)}
.atray .lip{justify-content:center;padding-left:0}
button.plate{cursor:pointer;line-height:1}
button.plate:hover span,button.plate[aria-pressed="true"] span{text-decoration:underline;opacity:1}
button.asheet{font:inherit;cursor:pointer;appearance:none}
.arch-col{flex:none;width:900px;max-width:100%}
.arch-col .a-off{margin-top:12px}
.bay.grow{flex:1 1 0}
/* ---------- 卡牌与卡包 ----------
 * 一篇文章一张牌：牌背是固定封面（圆光夜读小景）加题签，右上铜钱是用时，底边是来源和宝石。--dom 是领域色，一盒一种底色。 */
.yc{--dom2:color-mix(in srgb,var(--dom) 68%,#fff);--domd:color-mix(in srgb,var(--dom) 48%,#000);position:relative;display:block;flex:none;width:112px;height:157px;margin:0;padding:0;border:0;box-sizing:border-box;border-radius:6px;overflow:hidden;
  background:var(--dom);color:#F3E2B8;font:inherit;text-align:left;cursor:pointer;text-decoration:none;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 16px -8px rgba(0,0,0,.8);transition:transform .18s,box-shadow .18s}
.yc:hover,.yc:focus-visible{transform:translateY(-8px) scale(1.03);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 2px rgba(242,193,78,.75),0 0 22px rgba(242,193,78,.4),0 18px 24px -10px rgba(0,0,0,.9);z-index:2;outline:none}
.yc.yc-wait{visibility:hidden}
.yc-silk{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px),radial-gradient(80% 60% at 50% 42%,rgba(255,255,255,.08),transparent 60%),radial-gradient(100% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%)}
.yc-rim{position:absolute;inset:4px;border:1px solid rgba(243,226,184,.7);border-radius:3px}
.yc-scene{position:absolute;left:50%;top:62px;width:68px;height:68px;transform:translateX(-50%);filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.yc-tag{position:absolute;left:7px;top:7px;max-height:116px;box-sizing:border-box;padding:5px 3px 4px;display:flex;background:linear-gradient(180deg,#F3E2B8,#E6CF9E);box-shadow:inset 0 0 0 2px #F3E2B8,inset 0 0 0 2.5px rgba(90,60,20,.6),1px 2px 3px rgba(0,0,0,.55)}
.yc-tag span{writing-mode:vertical-rl;max-height:107px;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",var(--f-display);font-size:9.5px;line-height:1.25;letter-spacing:.04em;font-weight:700;color:#1F1309}
.yc-coin{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-sizing:border-box;background:radial-gradient(circle at 35% 30%,#F3D98A,#C9A05A 55%,#8A5E1E);box-shadow:inset 0 0 0 1px rgba(90,60,20,.45),0 1px 2px rgba(0,0,0,.5);font-family:var(--f-num);font-size:10.5px;font-weight:700;line-height:1;color:#2A1408}
.yc-coin.k{background:var(--k);color:#FFFFFF;font-family:var(--f-display);font-size:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.5)}
.yc-band{position:absolute;left:7px;right:7px;bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--f-ui);font-size:9px;letter-spacing:.04em;color:rgba(243,226,184,.85)}
.yc-src{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}
.yc-src i{flex:none;width:9px;height:9px;border-radius:2px;background:#2F5DA8;box-shadow:0 0 0 1px rgba(243,226,184,.5)}
.yc-src.wx i{background:#2E7D4F}.yc-src.web i{background:#6E675E}.yc-src.me i{background:#E5BB2E}
.yc-gem{flex:none;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-style:normal;font-size:8px;font-weight:700;line-height:1;color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 0 0 1.5px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.5);background:radial-gradient(circle at 40% 35%,#B5AFA3,#6E675E)}
.yc-gem.g1{background:radial-gradient(circle at 40% 35%,#5FB0AA,#1F6360)}
.yc-gem.g2{background:radial-gradient(circle at 40% 35%,#F3D98A,#B98A3A 70%)}
.yc-gem.g3{background:radial-gradient(circle at 40% 35%,#D64A3C,#7E1911 75%)}
.yc-yin{position:absolute;right:9px;top:36px;width:20px;height:20px;display:grid;place-items:center;background:#A3231B;color:#F7E9C8;font-family:var(--f-display);font-style:normal;font-size:10px;font-weight:700;line-height:1;transform:rotate(-8deg);box-shadow:inset 0 0 0 1px #F3E2B8,inset 0 0 0 2px #A3231B;z-index:2}
.yhand{display:flex;flex-wrap:wrap;gap:14px 8px;padding:12px 2px 10px}
.ylegend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;font-family:var(--f-ui);font-size:12.5px}
.ylegend span{display:inline-flex;align-items:center;gap:5px}
.ylegend .yc-gem{width:11px;height:11px;font-size:0}
.ylist{border-top:1px dashed var(--rule);padding-top:10px}
.ylist summary{cursor:pointer;display:flex;align-items:baseline;gap:10px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.ylist summary b{font-family:var(--f-display);font-size:15px;color:var(--ink)}
.ylist summary small{color:var(--ink-3)}
.ylist[open] summary{margin-bottom:8px}
/* 牌飞出来、翻开：盖在页面上的临时元素 */
.yc.yfly{position:fixed;z-index:1000;pointer-events:none;transition:none}
.yc.yfly:hover{transform:none}
.yflash{position:fixed;z-index:999;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,236,190,.95),rgba(255,227,160,.4) 30%,transparent 62%);animation:yflash .65s ease-out forwards}
@keyframes yflash{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.6);opacity:0}}
.yflip{position:fixed;z-index:1200;pointer-events:none;perspective:1400px}
.yf-in{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.yf-back,.yf-front{position:absolute;inset:0;backface-visibility:hidden}
.yc.yf-back{width:100%;height:100%;transform:none;transition:none}
.yf-front{transform:rotateY(180deg);box-sizing:border-box;padding:12px 10px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#1F1309;background:radial-gradient(90% 70% at 50% 30%,#F3E2B8,#EDD8A6 60%,#E3C994);box-shadow:inset 0 0 0 1px rgba(90,60,20,.6),inset 0 0 0 5px #F3E2B8,inset 0 0 0 6px rgba(90,60,20,.35)}
.yf-front b{font-family:var(--f-display);font-size:11px;line-height:1.4;font-weight:700}
.yf-front span{font-family:var(--f-ui);font-size:8px;letter-spacing:.12em;color:#4A3218}
/* 档案袋：剪报夹是卡包。架子上一只小的；打开夹子时面板里一只大的，封着的点它拆封 */
.ybag{--dom2:color-mix(in srgb,var(--dom) 68%,#fff);--domd:color-mix(in srgb,var(--dom) 48%,#000);position:relative;flex:none;width:70px;height:200px;margin:0;padding:0;border:0;box-sizing:border-box;border-radius:3px;font:inherit;text-align:center;color:#3C2A14;cursor:pointer;
  background:radial-gradient(120% 90% at 30% 20%,rgba(255,240,200,.35),transparent 55%),linear-gradient(180deg,#C9A569,#C09C62 55%,#AE8A4E);box-shadow:0 0 0 1px rgba(60,40,15,.55),0 12px 16px -9px rgba(0,0,0,.8);transition:transform .15s,opacity .15s}
.ybag:hover{transform:translateY(-4px)}
.ybag.picked{outline:3px solid var(--ink);outline-offset:3px}
.ybag:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.ybag.dim{opacity:.28}
.yb-flap{position:absolute;left:0;right:0;top:0;height:44px;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);background:linear-gradient(180deg,#B8955A,#C9A569 40%,#B38F55);box-shadow:inset 0 -1px 0 rgba(60,40,15,.5);transition:transform .35s,height .35s}
.yb-flap::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--domd),var(--dom2) 50%,var(--domd));box-shadow:0 1px 0 rgba(0,0,0,.3)}
.yb-tie{position:absolute;left:50%;top:36px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F2E6CC,#C9B58C 60%,#8E7A52);box-shadow:0 1px 2px rgba(0,0,0,.5),0 26px 0 -1px #C9B58C}
.yb-tie::before{content:"";position:absolute;left:50%;top:5px;width:2px;height:26px;margin-left:-1px;background:#EFE4C8;box-shadow:0 0 0 .5px rgba(0,0,0,.3);transition:transform .35s,opacity .35s}
.yb-strip{position:absolute;left:50%;top:22px;width:15px;height:62px;margin-left:-7.5px;transform:rotate(-2deg);background:#F1E2BD;box-shadow:inset 0 0 0 1px rgba(163,35,27,.7),0 1px 3px rgba(0,0,0,.4);z-index:2;transition:clip-path .35s,transform .35s}
.yb-strip i{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;background:rgba(163,35,27,.92);color:#F7E9C8;font-family:var(--f-display);font-style:normal;font-size:9.5px;font-weight:700;line-height:15px;text-align:center}
.yb-strip small{display:none}
.yb-strip.b{clip-path:polygon(0 56%,20% 50%,40% 58%,60% 50%,80% 58%,100% 52%,100% 100%,0 100%);background:#F1E2BD;z-index:1;opacity:0}
.yb-label{position:absolute;left:8px;right:8px;bottom:14px;height:92px;box-sizing:border-box;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#F3E2B8;box-shadow:inset 0 0 0 2px #F3E2B8,inset 0 0 0 3px rgba(90,60,20,.6),1px 2px 3px rgba(0,0,0,.4)}
.yb-label b{writing-mode:vertical-rl;font-family:var(--f-display);font-size:13.5px;font-weight:700;letter-spacing:.2em;color:#1F1309}
.yb-label span{margin-top:auto;font-family:var(--f-num);font-size:10.5px;letter-spacing:.02em;color:#4A3218;white-space:nowrap}
.yb-badge{position:absolute;right:-9px;top:-9px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;display:grid;place-items:center;font-family:var(--f-num);font-size:12.5px;font-weight:700;color:#2A1408;background:radial-gradient(circle at 35% 30%,#F3D98A,#C9A05A 55%,#8A5E1E);box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 0 0 1px rgba(90,60,20,.45);z-index:3}
.ybag.opened .yb-flap{height:30px;transform:scaleY(.5);transform-origin:50% 0;background:linear-gradient(180deg,#A5844C,#B8955A)}
.ybag.opened .yb-tie::before{transform:translate(6px,10px) rotate(28deg);opacity:.8}
/* 面板里的大袋：架子上那只放大，斜着放 */
.ypack{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.ypack.sealed{min-height:480px;padding:0 0 30px;justify-content:center}
.ypack.sealed > .meta{position:absolute;left:0;right:0;bottom:0;margin:0}
.ypack.opened{flex-direction:row;align-items:flex-end;gap:16px;padding:0}
.ypack .meta{margin:0;text-align:center}
.ymat{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-165px 0 0 -150px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(242,193,78,.18),rgba(242,193,78,.05) 55%,transparent 72%);box-shadow:inset 0 0 0 1.5px rgba(201,160,90,.45),inset 0 0 0 9px transparent,inset 0 0 0 10px rgba(201,160,90,.22)}
.ymat span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-brush);font-size:20px;letter-spacing:.3em;white-space:nowrap;color:rgba(154,110,50,.45)}
.ybag.big{width:70px;height:200px;margin:0 0 30px;transform:perspective(1200px) scale(1.9) rotateY(-14deg);transform-origin:50% 50%;cursor:pointer;box-shadow:0 0 0 .5px rgba(60,40,15,.55),0 14px 18px -8px rgba(0,0,0,.85)}
.ybag.big:hover{transform:perspective(1200px) scale(1.94) rotateY(-9deg) translateY(-3px)}
.ybag.big .yb-badge{display:none}
.ybag.big .yb-label{height:112px;bottom:12px}
.ybag.big .yb-label b{font-size:12px;letter-spacing:.1em}
.ybag.big .yb-strip small{display:block;position:absolute;left:0;right:0;top:4px;font-family:var(--f-num);font-size:6px;letter-spacing:.04em;color:#A3231B}
.ybag.big.opened{width:56px;height:160px;margin:0 6px 0 2px;transform:none;cursor:default}
.ybag.big.opened .yb-label{height:72px;bottom:10px;padding:5px 0 4px}
.ybag.big.opened .yb-label b{font-size:11.5px}
.ybag.big.opened .yb-label span{font-size:9px}
.ybag.big.opened .yb-tie{top:28px}
.ypack.opened .ypk-txt{flex:1;margin:0 0 8px;font-family:var(--f-ui);font-size:12.5px;line-height:1.6;color:var(--ink-3)}
@keyframes yb-shake{0%,100%{transform:perspective(1200px) scale(1.9) rotateY(-14deg) rotate(0)}20%{transform:perspective(1200px) scale(1.9) rotateY(-14deg) rotate(-2.5deg)}45%{transform:perspective(1200px) scale(1.9) rotateY(-14deg) rotate(2.5deg)}70%{transform:perspective(1200px) scale(1.9) rotateY(-14deg) rotate(-1.5deg)}}
.ybag.big.tearing{animation:yb-shake .45s ease-in-out}
.ybag.tearing .yb-strip:not(.b){clip-path:polygon(0 0,100% 0,100% 44%,80% 50%,60% 42%,40% 50%,20% 44%,0 52%);transform:rotate(-5deg) translateY(-2px)}
.ybag.tearing .yb-strip.b{opacity:1;transform:rotate(4deg) translate(2px,5px)}
.ybag.tearing .yb-tie::before{transform:translate(6px,10px) rotate(28deg);opacity:.8}
body.drag-clip .afold.drop-ok,.ybag.drop-ok{transform:translateY(-6px)}
@media (max-width:640px){ .ypack.sealed{min-height:400px} .yc{width:104px;height:146px} .yc-scene{width:62px;height:62px;top:58px} .yc-tag{max-height:104px} .yc-tag span{max-height:95px} .ymat{width:240px;height:240px;margin-left:-120px} .ybag.big{transform:perspective(1200px) scale(1.5) rotateY(-14deg);margin:30px 0 50px} }
/* 桌面：点开一盒或一夹，整屏盖上一张深色木桌 */
body.desk-on{overflow:hidden}
.ydesk{position:fixed;inset:0;z-index:60;overflow:auto;overscroll-behavior:contain;padding:22px 24px 48px;box-sizing:border-box;color:#EDE0C4;
  --ink:#EDE0C4;--ink-2:#D9C08A;--ink-3:#B9A47C;--rule:rgba(233,218,178,.18);--rule-strong:rgba(233,218,178,.4);--paper:rgba(0,0,0,.22);--leaf:rgba(0,0,0,.18);--indigo:#F2C14E;--seal:#E86A5C;
  background:radial-gradient(70% 45% at 50% 18%,#4A3523 0%,#2E2118 45%,#17100A 100%)}
.ydesk::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(178deg,rgba(255,220,150,.035) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px,transparent 11px 23px);mix-blend-mode:overlay}
.yd-in{position:relative;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.yd-eye{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 4px}
.yd-eye .btn{border-color:rgba(233,218,178,.45);color:var(--ink);background:rgba(0,0,0,.25)}
.yd-eye .btn:hover{background:rgba(255,227,160,.14)}
.yd-eye kbd{margin-left:8px;padding:1px 6px;border:1px solid rgba(233,218,178,.4);border-radius:4px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.ydesk .pb-h h2,.ydesk .ap-q p,.ydesk .aitems a,.ydesk .aitems .ai-t,.ydesk .ylist summary b,.ydesk .arel,.ydesk .ap-note{color:var(--ink)}
.ydesk .ap-no{color:var(--ink);border-color:rgba(233,218,178,.45);background:rgba(0,0,0,.25)}
.ydesk .ap-q{background:rgba(0,0,0,.26);border-left-color:#F2C14E}
.ydesk .btn{background:#F2C14E;border-color:#F2C14E;color:#2A1408}
.ydesk .btn.ghost{background:rgba(0,0,0,.25);color:var(--ink);border-color:rgba(233,218,178,.45)}

.add-card{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--leaf);border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}

.pg-edge{position:relative;height:16px;margin:2px 0 14px;border-radius:2px 2px 3px 3px;background:repeating-linear-gradient(90deg,transparent 0 2px,rgba(120,98,62,.13) 2px 3px),linear-gradient(#FBF6EA,#E9DFC9);box-shadow:inset 0 0 0 1px rgba(120,98,62,.28),0 2px 0 rgba(120,98,62,.16),0 4px 0 rgba(120,98,62,.08)}

.rd [hidden]{display:none!important}

.rd-view.pdf{display:block;overflow:auto;padding:18px 18px 48px;background:#E4DED3;overscroll-behavior:contain}

.pg-no{position:absolute;right:6px;bottom:-15px;font-family:var(--f-num);font-size:11px;color:#8B8277}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;caret-color:CanvasText;z-index:0}

.rd-zoom{display:inline-flex;gap:4px}
.rd-tb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rs-ch{display:flex;flex-direction:column;gap:14px}
.rs-chsel{width:100%;font-family:var(--f-display);font-size:15px;font-weight:700;padding:7px 10px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--paper);color:var(--ink)}

.rs-btns{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:4px}

.rd-nbn{font-family:var(--f-num)}

/* 在读的书：封面朝外 */
.cb.face{width:138px;height:194px;margin:0 12px 0 6px;align-self:flex-end;background:none;box-shadow:none;transform-style:preserve-3d;transform:perspective(800px) rotateY(-12deg);transform-origin:50% 100%}
.cb.face:hover{transform:perspective(800px) rotateY(-4deg) translateY(-4px)}
.cb.face.picked{outline:none;transform:perspective(800px) rotateY(-4deg) translateY(-8px)}
.cb.face.picked .cf-cv{outline:3px solid var(--ink);outline-offset:3px}
.cf-cv{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;box-sizing:border-box;padding:16px 14px 12px 19px;border-radius:2px 5px 5px 2px;color:var(--foil);text-align:left;
  background:linear-gradient(90deg,rgba(0,0,0,.3) 0 6px,rgba(255,255,255,.14) 6px 8px,transparent 8px),radial-gradient(90% 60% at 60% 8%,rgba(255,255,255,.16),transparent 70%),var(--cloth-tx),var(--cl);
  box-shadow:0 22px 24px -14px rgba(40,28,14,.6),0 1px 2px rgba(0,0,0,.2)}
.cb.face.light .cf-cv{color:#2B2620}
.cb.face[style*="--tx"] .cf-cv{color:var(--tx)}
.cf-t{margin-top:4px;font-family:var(--f-display);font-weight:900;letter-spacing:.05em;line-height:1.24;overflow-wrap:anywhere}
.cf-t small{display:block;margin-top:5px;font-size:10.5px;font-weight:600;letter-spacing:.02em;line-height:1.35}
.cf-by{font-family:var(--f-ui);font-size:10px;letter-spacing:.06em;opacity:.88}
.cf-ft{margin-top:auto;font-family:var(--f-ui);font-size:10px;letter-spacing:.06em;opacity:.92}
.cf-bar{display:block;height:3px;border-radius:2px;background:linear-gradient(90deg,currentColor var(--p),rgba(255,255,255,.22) var(--p))}
.cb.face.light .cf-bar{background:linear-gradient(90deg,currentColor var(--p),rgba(0,0,0,.12) var(--p))}
.cf-ed{position:absolute;top:3px;bottom:2px;right:0;width:12px;transform-origin:100% 50%;transform:rotateY(-90deg);background:repeating-linear-gradient(90deg,#F6F0E2 0 1px,#DCD1BA 1px 2px);box-shadow:inset 0 0 0 1px rgba(90,70,40,.25)}
.cb.face .sp-rib{bottom:-28px}
.cb.face::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-3px;height:9px;border-radius:2px;background:linear-gradient(var(--oak-hi,#D9B47E),var(--oak-2,#A87C49));box-shadow:0 3px 4px -1px rgba(40,28,14,.45);transform:translateZ(14px)}
.cb.face .cb-eb{right:10px;top:-6px}
/* 立体：指到一本书，它从顶上往外倾；在读的书（往前倾）一直倾着，书顶露出书签 */
.cb-top{display:none}
.wall.fx-tilt .wm-in,.wall.read-tilt .wm-in{perspective:1400px;perspective-origin:50% 10%}
.wall.fx-tilt .cb:not(.face),.wall.read-tilt .cb:not(.face){transform-style:preserve-3d;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.wall.fx-tilt .cb-top,.wall.read-tilt .cb-top{display:block;position:absolute;left:0;right:0;top:0;height:96px;transform-origin:50% 0;transform:rotateX(-90deg);
  background:linear-gradient(90deg,var(--cl) 0 2px,transparent 2px calc(100% - 2px),var(--cl) calc(100% - 2px)),repeating-linear-gradient(90deg,#F4EEDF 0 1px,#E3D9C4 1px 2px);box-shadow:inset 0 -30px 30px -10px rgba(40,28,14,.35)}
.wall.fx-tilt .cb:not(.face):hover{transform:rotateX(-12deg)}
.wall.fx-tilt .cb.picked:not(.face){transform:translateY(-8px) rotateX(-8deg)}
/* 抽出半截的书（在读）指上去时保持抽出来的高度，只加动效，不往下掉（否则鼠标会来回进出、闪动） */
.wall.fx-tilt.read-pull .cb.doing:not(.face):hover{transform:translateY(-24px) rotateX(-12deg)}
.wall.fx-tilt.read-pull .cb.doing.picked:not(.face),.wall.fx-tilt.read-pull .cb.doing.picked:not(.face):hover{transform:translateY(-26px) rotateX(-8deg)}
.wall.read-tilt .cb.doing{transform:rotateX(-17deg)}
.wall.read-tilt .cb.doing:hover{transform:rotateX(-22deg)}
.wall.read-tilt .cb.doing.picked{transform:translateY(-6px) rotateX(-20deg)}
.wall.read-tilt .cb.doing .cb-top{background:linear-gradient(90deg,transparent calc(var(--rp) - 2px),var(--seal) calc(var(--rp) - 2px) calc(var(--rp) + 2px),transparent calc(var(--rp) + 2px)),linear-gradient(90deg,var(--cl) 0 2px,transparent 2px calc(100% - 2px),var(--cl) calc(100% - 2px)),repeating-linear-gradient(90deg,#F4EEDF 0 1px,#E3D9C4 1px 2px)}
.wall.read-tilt .cb.doing .sp-rib{bottom:-30px}

/* 摆件库里新的几件 */
.d-candle,.d-mug,.d-clock,.d-stones{margin-left:8px}.d-print{margin-left:10px}
/* 摆件的动静：沙在流、蒲苇和绿萝轻轻晃、烛火跳、热气往上冒、钟走真实时间、指着地球仪它会转 */
.d-globe{pointer-events:auto}
.d-globe .gf{opacity:0}
.d-globe .gf:first-of-type{opacity:1}
.mg-st{opacity:.45}
.wall:not(.still) .hg-st{animation:hgflow .5s linear infinite}
@keyframes hgflow{to{stroke-dashoffset:-2.6}}
.wall:not(.still) .pp{animation:ppsway 5.5s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -1.1s)}
@keyframes ppsway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.wall:not(.still) .pv{animation:pvsway 6.5s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -1.6s)}
@keyframes pvsway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.4deg)}}
.wall:not(.still) .d-globe:hover .gf{animation:gspin 1.8s steps(1,end) infinite;animation-delay:calc(var(--k) * .15s - 1.8s)}
@keyframes gspin{0%{opacity:1}8.3%,100%{opacity:0}}
.wall:not(.still) .cd-fl{animation:cdfl 2.6s ease-in-out infinite}
@keyframes cdfl{0%,100%{transform:none}12%{transform:scale(.95,1.06) skewX(-2deg)}24%{transform:scale(1.04,.94) skewX(1.5deg)}37%{transform:scale(.98,1.04) skewX(-1deg)}50%{transform:scale(1.02,.96) skewX(2deg)}63%{transform:scale(.96,1.07) skewX(-1.5deg)}76%{transform:scale(1.01,.97) skewX(1deg)}88%{transform:scale(.99,1.02) skewX(-.5deg)}}
.wall:not(.still) .cd-glow{animation:cdglow 3.1s ease-in-out infinite}
@keyframes cdglow{0%,100%{opacity:.85}30%{opacity:1}55%{opacity:.74}80%{opacity:.95}}
.wall:not(.still) .mg-st{animation:mgst 4.2s ease-in-out infinite;animation-delay:calc(var(--i) * -1.4s);transform-box:fill-box;transform-origin:50% 100%}
@keyframes mgst{0%{opacity:0;transform:translateY(5px) scaleY(.7)}25%{opacity:.75}70%{opacity:.35}100%{opacity:0;transform:translateY(-10px) scaleY(1.1)}}
.wall:not(.still) .ck-s{animation:ckrot 60s steps(60) infinite}
.wall:not(.still) .ck-m{animation:ckrot 3600s linear infinite}
.wall:not(.still) .ck-h{animation:ckrot 43200s linear infinite}
@keyframes ckrot{to{transform:rotate(360deg)}}

/* 点一本书：飞到展台 */
.fly{position:fixed;z-index:70;transform-origin:0 0;pointer-events:none;border-radius:2px 5px 5px 2px;
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0 8%,rgba(255,255,255,.14) 8% 10%,transparent 10%),radial-gradient(90% 60% at 60% 10%,rgba(255,255,255,.18),transparent 70%),var(--cl)}
/* 指到一本书时的几种动效 */
.cb-gl,.cb-sd{display:none}
/* 指上去以后，判定区比书往下多 8px：书浮起来，鼠标还算在书上，不会来回闪。没指着时不加，免得挡住下面搁板上的标签和按钮 */
.cb-hit{display:none;position:absolute;left:0;right:0;top:0;bottom:-8px}
.cb:hover .cb-hit{display:block}
.lk-sws{display:inline-flex;gap:0;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.lk-sws b{display:block;width:5px;height:16px}
/* 烫金反光：浮起一点，一道光扫过书脊 */
.fx-sheen .cb:not(.face){transition:transform .25s,box-shadow .25s}
.fx-sheen .cb.picked:not(.face):hover{transform:translateY(-14px)}
.fx-sheen.read-pull .cb.doing:not(.face):hover{transform:translateY(-24px)}
.fx-sheen.read-pull .cb.doing.picked:not(.face):hover{transform:translateY(-26px)}
.fx-sheen .cb:not(.face):hover{transform:translateY(-6px);box-shadow:3px 0 6px -2px rgba(45,30,14,.4),0 16px 18px -10px rgba(40,28,14,.55)}
.fx-sheen .cb-gl{display:block;position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.fx-sheen .cb-gl::before{content:"";position:absolute;top:-10%;bottom:-10%;left:-80%;width:60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,247,222,.6) 50%,rgba(255,255,255,0));opacity:0;transform:skewX(-14deg)}
.fx-sheen .cb:hover .cb-gl::before{animation:cbsheen 1.05s cubic-bezier(.3,.6,.3,1)}
@keyframes cbsheen{0%{opacity:0;transform:translateX(0) skewX(-14deg)}18%{opacity:1}100%{opacity:0;transform:translateX(340%) skewX(-14deg)}}
/* 抽出来：书朝你抽出来，露出两边的封皮 */
/* 抽出来：书朝你移出一截——从底边往前放大一点、浮起来，底下落一片投影，右边露出一窄条封面板的厚度；同一格别的书稍微暗下去，衬出这一本 */
.fx-pull .cb:not(.face){transform-origin:50% 100%;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,filter .28s}
.fx-pull .cb:not(.face):hover{transform:translateY(-3px) scale(1.07);z-index:6;filter:brightness(1.05);
  box-shadow:0 20px 22px -14px rgba(28,18,8,.62),0 6px 10px -6px rgba(28,18,8,.4)}
.fx-pull .cb.picked:not(.face):hover{transform:translateY(-14px) scale(1.07)}
.fx-pull.read-pull .cb.doing:not(.face):hover{transform:translateY(-22px) scale(1.07)}
.fx-pull.read-pull .cb.doing.picked:not(.face):hover{transform:translateY(-26px) scale(1.07)}
.fx-pull .cb-sd.l{display:none}
.fx-pull .cb-sd.r{display:block;position:absolute;top:1px;bottom:0;left:100%;width:5px;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.22) 70%,rgba(255,240,210,.18)),var(--cloth-tx),var(--cl);
  clip-path:polygon(0 0,100% 3px,100% calc(100% - 1px),0 100%);transform:scaleX(0);transform-origin:0 50%;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.fx-pull .cb:not(.face):hover .cb-sd.r{transform:scaleX(1)}
.fx-pull .wm-in:has(.cb:not(.face):hover) .cb:not(:hover){filter:brightness(.9) saturate(.82)}
@media (prefers-reduced-motion: reduce){.fx-pull .cb,.fx-sheen .cb{transition:none}.fx-sheen .cb:hover .cb-gl::before{animation:none}}
