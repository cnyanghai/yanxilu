<title>研习录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：顶部五个入口（手机上是底部标签栏）+ 居中的主栏；首页是全宽的线网图。
   字体：Barlow（数字、拉丁字母）配思源黑体；颜色：白底黑线，每条学习线一种颜色，区域底色表示学习方向。 */
:root{
  --paper:#F7F7F4; --leaf:#FFFFFF; --ink:#1A1A1A; --ink-2:#4A4F4C; --ink-3:#686D6A; --rule:#DDDDD6; --rule-strong:#B9BCB6;
  --indigo:#1F5FAE; --indigo-wash:#E4EDF8; --seal:#D4402F; --seal-wash:#FBE9E6; --seal-ink:#FFFFFF;
  --map-bg:#FFFFFF;
  --ln-en:#E09A1E; --ln-cfa:#8A3A8E; --ln-sql:#00897B; --ln-py:#2B5FAE; --ln-geo:#D4402F; --ln-tao:#9A5B2E; --ln-mm:#7C9A1E; --ln-rev:#727775;
  --z-en:#FDF4E1; --z-cycle:#FBF1E6; --z-geo:#FBEBE8; --z-fin:#F5EEF6; --z-data:#E7F3F1; --z-fut:#F1F4E2;
  --zi-en:#94600C; --zi-cycle:#8A5A2B; --zi-geo:#A8352A; --zi-fin:#6E3A73; --zi-data:#00695C; --zi-fut:#556E12; --zi-co:#686D6A;
  --bdg-on:#FFFFFF; --bdg-on-dk:#1A1A1A; --late:#F2B23E; --early:#7FD1E3; --on-signal:#1A1A1A;
  --f-display:"Barlow","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-ui:"Barlow","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Barlow Condensed","Barlow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121313; --leaf:#1B1C1C; --ink:#EDEDEA; --ink-2:#C2C6C3; --ink-3:#9DA19E; --rule:#2F3130; --rule-strong:#4A4D4B;
    --indigo:#8FB4E6; --indigo-wash:#1D2735; --seal:#F06A57; --seal-wash:#3A221E; --seal-ink:#121313;
    --map-bg:#161717;
    --ln-en:#F2B23E; --ln-cfa:#C688CB; --ln-sql:#2DB4A4; --ln-py:#6F9DE2; --ln-geo:#F06A57; --ln-tao:#CF925F; --ln-mm:#A9C443; --ln-rev:#A3A8A5;
    --z-en:#29230F; --z-cycle:#2A231B; --z-geo:#2D1F1C; --z-fin:#271F29; --z-data:#152826; --z-fut:#222716;
    --zi-en:#F2C46E; --zi-cycle:#E2B486; --zi-geo:#F29A8C; --zi-fin:#D9A6DD; --zi-data:#6FD3C4; --zi-fut:#C3DA6E; --zi-co:#9DA19E;
    --bdg-on:#121313; --bdg-on-dk:#121313; --late:#F2B23E; --early:#7FD1E3; --on-signal:#121313;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121313; --leaf:#1B1C1C; --ink:#EDEDEA; --ink-2:#C2C6C3; --ink-3:#9DA19E; --rule:#2F3130; --rule-strong:#4A4D4B;
  --indigo:#8FB4E6; --indigo-wash:#1D2735; --seal:#F06A57; --seal-wash:#3A221E; --seal-ink:#121313;
  --map-bg:#161717;
  --ln-en:#F2B23E; --ln-cfa:#C688CB; --ln-sql:#2DB4A4; --ln-py:#6F9DE2; --ln-geo:#F06A57; --ln-tao:#CF925F; --ln-mm:#A9C443; --ln-rev:#A3A8A5;
  --z-en:#29230F; --z-cycle:#2A231B; --z-geo:#2D1F1C; --z-fin:#271F29; --z-data:#152826; --z-fut:#222716;
  --zi-en:#F2C46E; --zi-cycle:#E2B486; --zi-geo:#F29A8C; --zi-fin:#D9A6DD; --zi-data:#6FD3C4; --zi-fut:#C3DA6E; --zi-co:#9DA19E;
  --bdg-on:#121313; --bdg-on-dk:#121313; --late:#F2B23E; --early:#7FD1E3; --on-signal:#121313;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
a{color:var(--indigo);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--leaf);border-bottom:3px solid var(--ink)}
.tb-in{max-width:1400px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:12px 28px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.06em}
.roundel{position:relative;display:block;width:30px;height:30px;border-radius:50%;border:5px solid var(--seal);box-sizing:border-box}
.roundel i{position:absolute;left:-7px;right:-7px;top:6px;height:8px;background:var(--ink);border-radius:1px}
.mainnav{display:flex;gap:4px;flex:1 1 auto}
.mainnav a{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:20px;color:var(--ink);text-decoration:none;font-family:var(--f-ui);font-size:15px;font-weight:500;position:relative}
.mainnav a:hover{background:var(--paper)}
.mainnav a[aria-current="page"]{background:var(--ink);color:var(--leaf);font-weight:700}
.mainnav svg{width:18px;height:18px;flex:none}
.mainnav .nb{font-family:var(--f-num);font-size:13px;font-weight:600;line-height:1;color:#FFFFFF;background:var(--seal);border-radius:9px;padding:2px 6px}
.topbar .mode{display:flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.topbar .mode i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.topbar .mode.db i{background:var(--ln-sql)}
.topbar .mode.local i{background:var(--seal)}

main{display:block;min-width:0;max-width:1400px;margin:0 auto;padding:32px 28px 96px}
.view{max-width:760px;margin-inline:auto}
.view.home{max-width:none}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--ink-3);margin:0 0 8px}
.eyebrow a{color:inherit}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,46px);line-height:1.15;letter-spacing:.01em;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.3;letter-spacing:.01em;margin:0 0 14px}
h2 a{color:inherit;text-decoration:none}
h2 a:hover{color:var(--indigo)}
h3{font-size:17px;font-weight:700;margin:0}
section{margin-top:52px}
.lede{font-size:18px;color:var(--ink-2);max-width:36em;margin:14px 0 0}
.sub{font-family:var(--f-ui);color:var(--ink-3);font-size:14px;margin:10px 0 0}
.meta{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;font-family:var(--f-ui);font-size:13px;color:var(--ink-3);margin-top:18px}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:16px;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.empty-line{color:var(--ink-3);font-size:15px}
.more{font-family:var(--f-ui);font-size:14px;margin:12px 0 0}

.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:14px;line-height:1.4;padding:8px 16px;border:1px solid var(--ink);border-radius:var(--r);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3);opacity:1}
.btn.small{font-size:13px;padding:4px 12px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.linkbtn{background:none;border:0;padding:0;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--seal)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);background:var(--seal-wash);border-radius:6px;padding:10px 14px;margin-bottom:28px}
.banner span{flex:1 1 260px;min-width:0}

/* 正在精读 */
.focus{margin-top:40px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:22px 24px 24px;display:grid;gap:14px}
.focus h2{font-size:30px;margin:0}
.focus .eyebrow{margin:0}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cell{height:30px;padding:0;border:1px solid var(--rule);border-radius:2px;background:transparent;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);cursor:pointer;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--ink-3)}
.cell.doing{background:var(--indigo-wash);border-color:var(--indigo);color:var(--indigo)}
.cell.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cell.review{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}

/* 方向索引 */
.tracks{border-top:1px solid var(--ink)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:4px 28px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.tname{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;line-height:1.35}
.trow:hover .tname{color:var(--indigo)}
.tgoal{grid-column:1;font-size:14px;color:var(--ink-2);line-height:1.65}
.tprog{grid-column:2;grid-row:1 / span 2;align-self:center;display:grid;gap:7px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{display:block;height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--indigo)}

/* 数据专题 */
.reports{border-top:1px solid var(--ink)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 28px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.rname{font-family:var(--f-display);font-size:21px;letter-spacing:.04em;line-height:1.35}
.rname .ext{font-family:var(--f-ui);font-size:14px;color:var(--ink-3);margin-left:8px}
.rrow:hover .rname{color:var(--indigo)}
.rdesc{grid-column:1;font-size:14px;color:var(--ink-2);line-height:1.65}
.rmeta{grid-column:2;grid-row:1 / span 2;align-self:center;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);white-space:nowrap}

.pair{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px}
.pair .col{min-width:0}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;border-top:1px solid var(--ink)}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:13px;color:var(--seal);padding-top:1px}
.steps b{display:block;color:var(--ink);font-weight:600}

/* 学习足迹 */
.jlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.jlist li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.jdate{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:4px;font-variant-numeric:tabular-nums}
.jbody{min-width:0}
.jmeta{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--f-ui);font-size:12.5px}
.jmin{color:var(--ink-3)}
.jtext{margin:2px 0 0;font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.jdel{display:inline-flex;gap:10px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2)}
.month h2{font-size:20px}
.jform{margin-top:36px;display:grid;gap:14px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:20px}
.jform h2{font-size:20px;margin:0}
.jform .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field span{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;min-width:0;font-family:var(--f-ui);font-size:14px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px}
.field textarea{font-family:var(--f-body);font-size:15px;line-height:1.7;resize:vertical}

/* 方向页 */
.goal{font-size:18px;color:var(--ink-2);max-width:36em;margin:14px 0 0}
.goal b{color:var(--seal);font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;font-weight:600}
.stage{margin-top:48px}
.stage h2{margin-bottom:4px}
.stage h2 .no{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--seal);margin-bottom:2px;font-variant-numeric:tabular-nums}
.stage .desc{font-family:var(--f-ui);font-size:13.5px;color:var(--ink-3);margin:0 0 14px}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:start;padding:15px 0;border-bottom:1px solid var(--rule)}
.main-col{min-width:0}
.kind{display:inline-block;font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--rule);border-radius:2px;padding:0 5px;margin-right:8px;vertical-align:2px;line-height:1.6}
.item .t{font-weight:600;font-size:16.5px}
.item .by{font-size:14px;color:var(--ink-3);margin-left:6px}
.item .why{margin:4px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.item .links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-family:var(--f-ui);font-size:13px}
.also{color:var(--ink-3)}
.also a{color:var(--ink-2)}
.side-col{padding-top:2px}

/* 进度控件 */
.stw{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:12.5px;white-space:nowrap}
.st{appearance:none;-webkit-appearance:none;font-family:var(--f-ui);font-size:12.5px;line-height:1.5;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;background:transparent;color:var(--ink-3)}
select.st{cursor:pointer;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select.st option{color:var(--ink);background:var(--leaf)}
.s-doing .st{background-color:var(--indigo-wash);border-color:transparent;color:var(--indigo)}
.s-done .st{border-color:var(--ink-3);color:var(--ink)}
.s-review .st{border-color:var(--seal);color:var(--seal)}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--seal);color:var(--seal-ink);font-style:normal;font-family:var(--f-display);font-size:13px;border-radius:2px;line-height:1}

/* 精读页 */
.book-prog{display:grid;gap:10px;margin-top:24px}
.whole{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:2px;margin-top:32px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 13px;font-family:var(--f-ui);font-size:14px;color:var(--ink-3);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:600}
.tabbody > section:first-child{margin-top:32px}
.thesis{margin:32px 0 0;font-size:19px;line-height:1.9;padding:22px 0;border-block:1px solid var(--rule)}
.thesis .k,.chain .k,.note-lab,.note label{font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:600}
.thesis .k{display:block;margin-bottom:6px}
.facts{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:10px 18px;margin:0;font-size:15px;line-height:1.75}
.facts dt{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);padding-top:2px}
.facts dd{margin:0;min-width:0}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding-bottom:16px;position:relative}
.chain li .k{padding-top:3px}
.chain li:not(:last-child)::after{content:"";position:absolute;left:14px;top:30px;bottom:4px;width:1px;background:var(--rule)}
.order{margin:0;padding-left:1.4em;display:grid;gap:6px}
.note{display:grid;gap:7px;margin-top:4px}
.note textarea{width:100%;min-height:104px;font-family:var(--f-body);font-size:15px;line-height:1.75;background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;resize:vertical}
.note textarea::placeholder{color:var(--ink-3)}
.ns{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.note-ro{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-ro.empty{color:var(--ink-3);font-size:14px}

.chs{margin-top:28px;border-top:1px solid var(--ink)}
details.ch{border-bottom:1px solid var(--rule)}
details.ch summary{list-style:none;display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;cursor:pointer}
details.ch summary::-webkit-details-marker{display:none}
details.ch summary:hover .ttl{color:var(--indigo)}
.ch .no{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.ch .ttl{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;line-height:1.4;min-width:0}
.ch .depth{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:var(--ink-3);margin-left:10px;vertical-align:3px}
.ch-body{display:grid;gap:18px;padding:2px 0 26px}
.ch-body h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:600;margin:0 0 6px}
.ch-body ol,.ch-body ul{margin:0;padding-left:1.3em;display:grid;gap:7px}
.ch-body p{margin:0}
.q{font-size:17px}
.tip{background:var(--seal-wash);border-radius:var(--r);padding:10px 14px;font-size:14.5px;line-height:1.7;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-ui);font-size:13px;background:var(--leaf);border:1px solid var(--rule);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--indigo);color:var(--indigo)}

.cards-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:28px 0 18px}
.cards-head p{margin:0;font-size:14.5px;color:var(--ink-2);flex:1 1 300px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;min-height:160px;text-align:left;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:16px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--ink-3)}
.card .front{font-family:var(--f-display);font-size:19px;letter-spacing:.03em;line-height:1.4}
.card .back{font-size:14px;line-height:1.75;color:var(--ink-2)}
.card .hint{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.card.flipped{border-color:var(--indigo)}
.card.hl{box-shadow:0 0 0 2px var(--seal)}

.views{border-top:1px solid var(--ink)}
.v{padding:16px 0;border-bottom:1px solid var(--rule)}
.v h3{display:inline;margin-right:10px}
.v .who{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
.v p{margin:6px 0 0;font-size:15px;line-height:1.75;color:var(--ink-2)}
.plain{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:15px}
.further{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.further li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.further b{font-weight:600;margin-right:6px}
.further .why{display:block;font-size:14px;color:var(--ink-3)}

.fw-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-top:32px}
.fw-head h2{margin:0 0 4px}
.fw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 32px;margin-top:22px;border-top:1px solid var(--ink);padding-top:20px}
.fwp{min-width:0}
.fwp h3{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.16em;color:var(--seal);margin-bottom:6px}
.fwp ol{margin:0;padding-left:1.6em;display:grid;gap:6px;font-size:15px;line-height:1.7}
.fwp ol li::marker{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.fw-foot{margin-top:24px}

/* 复习 */
.boxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.bx{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--f-ui);font-size:12px;color:var(--ink-3);border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.bx b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.rv{margin-top:20px;display:grid;gap:16px;align-content:start;min-height:300px;background:var(--leaf);border:1px solid var(--rule);border-radius:8px;padding:24px 26px}
.rv-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
.rv .front{font-family:var(--f-display);font-size:clamp(26px,5vw,34px);letter-spacing:.04em;line-height:1.3;margin:12px 0 0}
.rv .back{margin:0;font-size:17px;line-height:1.9;border-top:1px dashed var(--rule);padding-top:16px}
.rv.rest p{margin:0}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
.btn.again{background:transparent;color:var(--seal);border-color:var(--seal)}
.btn.hard{background:transparent;color:var(--ink);border-color:var(--ink-3)}
.btn.good{background:var(--indigo);border-color:var(--indigo);color:var(--leaf)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:13px;padding:9px 16px;border-radius:999px}

/* 每日课表 */
.today{margin-top:40px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:22px 24px 24px;display:grid;gap:14px}
.today .eyebrow{margin:0}
.today h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0}
.today h2 .tot{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);letter-spacing:0}
.slots{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.slots>li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule)}
.slots .subj{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.06em;color:var(--indigo)}
.slots b{font-weight:600;font-size:15.5px}
.slots .mins{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.slots li.ok b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--seal)}
.slots li.ok .mins{color:var(--seal)}
.check{margin:6px 0 0;padding-left:1.3em;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.wk{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:14px;border-top:1px solid var(--ink)}
.wk th,.wk td{text-align:left;padding:9px 8px 9px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
.wk thead th{font-size:12px;letter-spacing:.1em;color:var(--ink-3);font-weight:400}
.wk tbody th{font-weight:600;white-space:nowrap;width:4.5em}
.wk td{color:var(--ink-2)}
.wk .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-right:0}
.dst{font-family:var(--f-ui);font-size:12px;border-radius:2px;padding:0 6px;line-height:1.7}
.dst.done{background:var(--seal);color:var(--seal-ink)}
.dst.partial{background:var(--indigo-wash);color:var(--indigo)}
.dst.missed{border:1px solid var(--rule);color:var(--ink-3)}
.dst.pushed{border:1px dashed var(--ink-3);color:var(--ink-3)}
.lsq{border-top:1px solid var(--rule);padding:12px 0}
.lsq:last-child{border-bottom:1px solid var(--rule)}
.lsq summary{cursor:pointer;display:flex;align-items:baseline;gap:12px;list-style:none}
.lsq summary::-webkit-details-marker{display:none}
.lsq summary::before{content:"＋";font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.lsq[open] summary::before{content:"－"}
.lsq .why{font-size:14.5px;color:var(--ink-2);margin:8px 0 6px}
.lsq ol{margin:0;padding-left:2.2em;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.lsq li.ok{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}
.lsq li.cur{color:var(--ink);font-weight:600}
.lsq li.cur::after{content:"  ← 下一课";font-family:var(--f-ui);font-size:12px;font-weight:400;color:var(--seal)}
@media (max-width:560px){
  .today{padding:18px 16px 20px}
  .slots>li{grid-template-columns:minmax(0,1fr) auto}
  .slots .subj{grid-column:1/-1}
}
@media (max-width:880px){
  .pair{grid-template-columns:minmax(0,1fr);gap:0}
  .fw{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .trow{grid-template-columns:minmax(0,1fr)}
  .rrow{grid-template-columns:minmax(0,1fr)}
  .rmeta{grid-column:1;grid-row:auto}
  .tprog{grid-column:1;grid-row:auto}
  .item{grid-template-columns:minmax(0,1fr)}
  .jform .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .jform .row .ref{grid-column:1 / -1}
  .jlist li{grid-template-columns:minmax(0,1fr)}
  details.ch summary{grid-template-columns:minmax(0,1fr) auto}
  details.ch summary .no{grid-column:1 / -1}
  .facts{grid-template-columns:minmax(0,1fr);gap:2px}
  .facts dd{margin-bottom:10px}
  .focus{padding:18px}
  .strip{gap:3px}
}
/* 通用：分段按钮、跳转链接 */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--leaf);border:1px solid var(--rule);border-radius:999px}
.seg button{font-family:var(--f-ui);font-size:13px;border:0;background:transparent;color:var(--ink-3);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.xref{font-family:var(--f-ui);font-size:12.5px;background:none;border:0;padding:0;color:var(--indigo);cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.deep-tag{display:inline-block;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;color:var(--seal);background:var(--seal-wash);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:3px}
.ch-st{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.deep-line{margin:18px 0 0;font-size:15px;color:var(--ink-2)}
.deep-line .k{font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:600;margin-right:10px}
.practice{margin-top:28px}
.practice > .cards-head,.practice > .fw-head{margin-top:24px}

/* 精读稿 */
.reader-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.reader-note{margin-top:14px;line-height:1.7}
.reader-body{margin-top:30px;border-top:1px solid var(--ink)}
.oneline{font-family:var(--f-display);font-size:24px;line-height:1.65;letter-spacing:.02em;margin:26px 0 0}
.oneline.small{font-family:var(--f-body);font-size:17px;line-height:1.85;color:var(--ink-2);margin:20px 0 6px}
.oneline .k,.pq .k,.qa .k,.chk .k,.sw-result .k{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:600;margin-bottom:4px}
.toc{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--rule)}
.toc li{border-bottom:1px solid var(--rule)}
.toc button{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;padding:11px 0;font-family:var(--f-body);font-size:16px;cursor:pointer}
.toc button:hover{color:var(--indigo)}
.secno{font-family:var(--f-mono);font-size:13px;color:var(--seal);min-width:2.4em;font-variant-numeric:tabular-nums}
.sec{padding:22px 0 20px;border-bottom:1px solid var(--rule);scroll-margin-top:16px}
.sec-head{display:flex;align-items:baseline;gap:10px}
.sec-head h2{font-size:22px;margin:0}
.gist{margin:6px 0 0;padding-left:calc(2.4em + 10px);font-size:16.5px;font-weight:600;line-height:1.75}
.more-btn{margin:10px 0 0 calc(2.4em + 10px);background:none;border:0;padding:0;font-family:var(--f-ui);font-size:13px;color:var(--indigo);cursor:pointer}
.more-btn::after{content:" ↓"}
.more-btn[aria-expanded="true"]::after{content:" ↑"}
.sec-body{padding-left:calc(2.4em + 10px);display:grid;gap:14px;margin-top:12px}
.sec-body > p{margin:0;font-size:16px;line-height:1.9}
.blk h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:600;margin:4px 0 6px}
.reason{margin:0;padding-left:1.4em;display:grid;gap:4px;font-size:15px;color:var(--ink-2)}
.reason li::marker{font-family:var(--f-mono);font-size:12px;color:var(--indigo)}
.evid{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evid li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:15px;line-height:1.75}
.evid li > span:last-child{flex:1 1 280px;min-width:0}
.etag,.esrc{font-family:var(--f-ui);font-size:11px;border-radius:2px;padding:0 6px;line-height:1.7}
.etag{border:1px solid var(--rule);color:var(--ink-2)}
.esrc.book{background:var(--indigo-wash);color:var(--indigo)}
.esrc.added{background:var(--leaf);color:var(--ink-3);border:1px dashed var(--rule)}
.qa{display:grid;gap:6px;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.qa p{margin:0;font-size:15px;line-height:1.75}
.qa .ans .k{color:var(--indigo)}
.chk{font-size:14px;color:var(--ink-2);background:var(--seal-wash);border-radius:6px;padding:10px 14px}
.chk ul{margin:0;padding-left:1.2em}
.go-practice{margin:0}
.prs{display:grid;gap:10px;margin-top:4px}
.pr{border:1px dashed var(--ink-3);border-radius:6px;padding:12px 14px;display:grid;gap:8px}
.pq{margin:0;font-size:15.5px;font-weight:600;line-height:1.7}
.pa{margin:0;font-size:15px;line-height:1.75;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:8px}
.pr-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.reader-foot{margin-top:40px}
.reader-foot .btns{margin-top:22px}

/* 假设开关 */
.sw{margin-top:22px}
.sw-intro{margin:0 0 16px;font-size:15px;color:var(--ink-2);max-width:40em}
.asws{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.asw{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--leaf);border:1px solid var(--rule);border-radius:6px;padding:12px;cursor:pointer;min-width:0}
.asw.off{background:transparent;border-style:dashed}
.asw-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.asw-no{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.tog{width:30px;height:17px;border-radius:999px;background:var(--rule);position:relative;flex:none}
.tog i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--leaf);transition:left .15s}
.asw.on .tog{background:var(--indigo)}
.asw.on .tog i{left:15px}
.asw-name{font-family:var(--f-display);font-size:18px;letter-spacing:.03em}
.asw.off .asw-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--seal)}
.asw-desc{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.asw-critic{font-family:var(--f-ui);font-size:11.5px;line-height:1.55;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:6px}
.chainx{margin-top:22px;display:grid;gap:0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.arrow{height:22px;position:relative}
.arrow::before{content:"";position:absolute;left:50%;top:3px;bottom:3px;border-left:1px solid var(--ink-3)}
.arrow::after{content:"";position:absolute;left:calc(50% - 4px);bottom:2px;border:4px solid transparent;border-top-color:var(--ink-3);border-bottom:0}
.cn{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--leaf);display:grid;gap:6px;min-width:0}
.cn.ok{border-color:var(--indigo)}
.cn.broken{background:transparent;border-color:var(--seal);border-style:dashed}
.cn-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cn-name{font-family:var(--f-display);font-size:19px;letter-spacing:.03em}
.cn-st{font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--indigo)}
.cn.broken .cn-st{color:var(--seal)}
.cn.broken .cn-name{color:var(--ink-3)}
.cn-needs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.need{border:1px solid var(--rule);border-radius:2px;padding:0 6px;color:var(--ink-2)}
.need.miss{border-color:var(--seal);color:var(--seal);text-decoration:line-through}
.cn-why{margin:0;padding-left:1.2em;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.cn-critic{margin:0;font-family:var(--f-ui);font-size:12px;line-height:1.55;color:var(--ink-3)}
.sw-result{margin-top:20px;border-top:1px solid var(--ink);padding-top:14px;display:grid;gap:10px;justify-items:start}
.sw-result p{margin:0;font-size:16px;line-height:1.8}

/* 论证地图 */
.map-head{display:grid;gap:12px;margin-top:24px}
.map-head p{margin:0;font-size:15px;color:var(--ink-2);max-width:40em}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.map-head .seg{justify-self:start}
.mapwrap{margin-top:20px;overflow-x:auto;border-top:1px solid var(--ink);padding-top:14px}
.mtree,.mtree ul{list-style:none;margin:0;padding:0}
.mtree ul{margin-left:11px;padding-left:18px;border-left:1px solid var(--rule)}
.mn{position:relative}
.mtree ul > .mn::before{content:"";position:absolute;left:-18px;top:19px;width:14px;border-top:1px solid var(--rule)}
.mrow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;min-width:0}
.mtog{flex:none;width:22px;height:22px;margin-top:2px;border:1px solid var(--rule);border-radius:3px;background:var(--leaf);cursor:pointer;position:relative;padding:0}
.mtog i{position:absolute;left:7px;top:6px;border:5px solid transparent;border-left-color:var(--ink-2);border-right:0}
.mtog[aria-expanded="true"] i{left:5px;top:8px;border:5px solid transparent;border-top-color:var(--ink-2);border-bottom:0}
.mtog.leaf{border:0;background:transparent;cursor:default}
.mtype{flex:none;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;border-radius:2px;padding:1px 6px;margin-top:3px;line-height:1.6}
.t-claim .mtype{background:var(--ink);color:var(--paper)}
.t-premise .mtype{background:var(--indigo-wash);color:var(--indigo)}
.t-evidence .mtype{border:1px solid var(--ink-3);color:var(--ink-2)}
.t-objection .mtype{background:var(--seal-wash);color:var(--seal)}
.mtext{flex:1 1 auto;min-width:0;font-size:15.5px;line-height:1.65}
.mtree > .mn > .mrow .mtext{font-family:var(--f-display);font-size:20px;line-height:1.5}
.t-objection > .mrow .mtext{color:var(--ink-2)}
.mcount{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:8px}
.mrow .xref{margin-top:4px}

/* 正在精读：可以同时有几本书 */
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fb{display:grid;gap:12px}
.fb + .fb{border-top:1px solid var(--rule);padding-top:20px;margin-top:4px}
.focus .fb h2{font-size:28px}

/* 康波时间轴：上为长周期全景，下为全书覆盖年份的放大 */
.kw{position:relative;margin-top:4px}
.kw-main{position:relative;height:58px;border:1px solid var(--rule);border-radius:var(--r);background:var(--leaf);overflow:hidden}
.kw-ph{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 8px;border-left:1px solid var(--paper);font-family:var(--f-ui);line-height:1.3;overflow:hidden;white-space:nowrap}
.kw-ph b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.06em}
.kw-ph span{font-family:var(--f-mono);font-size:10.5px;opacity:.85}
.kw-ph.p0{background:var(--leaf);color:var(--ink-2)}
.kw-ph.p1{background:var(--indigo-wash);color:var(--indigo)}
.kw-ph.p2{background:var(--seal-wash);color:var(--seal)}
.kw-ph.p3{background:var(--ink);color:var(--paper)}
.kw-zoomband{position:absolute;bottom:0;height:4px;background:var(--indigo);pointer-events:none}
.kw-now{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--seal);pointer-events:none}
.kw-now span{position:absolute;top:4px;right:4px;font-family:var(--f-ui);font-size:11px;line-height:1.5;color:var(--seal);background:var(--paper);border-radius:2px;padding:0 4px;white-space:nowrap}
.kw-axis{position:relative;height:20px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.kw-axis span{position:absolute;top:3px;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.kw-axis span:first-child{transform:none}
.kw-axis span:last-child{transform:translateX(-100%)}
.kw-axis.small{font-size:10px}
.kw-link{height:20px;background:var(--indigo-wash);opacity:.75}
.kw-zoom{position:relative;height:46px;border:1px solid var(--indigo);border-radius:var(--r);background:var(--leaf)}
.kw-ch{position:absolute;top:4px;bottom:4px;padding:0;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-family:var(--f-display);font-size:18px;line-height:1;color:var(--ink);cursor:pointer}
.kw-ch:hover{border-color:var(--ink-3)}
.kw-ch.doing{background:var(--indigo-wash);border-color:var(--indigo);color:var(--indigo)}
.kw-ch.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.kw-ch.review{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.kw-gap{position:absolute;top:4px;bottom:4px;border-radius:3px;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--rule) 4px 5px)}
.kw-cap{margin-top:2px}
.kw-ev{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.kw-ev li{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.6}
.kw-ev .y{font-family:var(--f-mono);font-size:13px;color:var(--seal);padding-top:1px;font-variant-numeric:tabular-nums}
.kw-note{margin-top:14px}

window.YXL_LESSONS = {"2026-10-11": "# 2026-10-11（周日）准备日\n\n> 第一阶段明天（10 月 12 日，周一）正式开课。今天只做一件事：把工具和材料备齐，明天打开讲义就能直接学。\n\n## 今天的安排\n\n| 时段 | 科目 | 分钟 | 内容 |\n|---|---|---|---|\n| 1 | 准备日 | 60 | 装好工具、备好书、建生词本、看一遍课表 |\n\n建议分配：DB Browser 15 分钟 → Jupyter 15 分钟 → 书 15 分钟 → 生词本 5 分钟 → 课表 10 分钟。哪一步卡住了就先跳过，晚上打卡时告诉我卡在哪。\n\n---\n\n## 一、装好 DB Browser for SQLite（约 15 分钟）\n\nSQL 课前半程都用它。它是一个免费的图形界面小软件，数据库就是电脑上的一个 `.db` 文件，不需要装服务器、不需要联网。\n\n**安装步骤**\n\n1. 打开 sqlitebrowser.org → Download，Windows 选 *Standard installer for 64-bit Windows*（Mac 选 .dmg）。\n2. 一路“下一步”安装。安装界面里如果有勾选项，勾上 *DB Browser (SQLite)* 的桌面快捷方式即可，SQLCipher 版本不用。\n3. 打开软件 → 左上角 **New Database（新建数据库）** → 存到一个固定文件夹，例如 `D:\\研习录\\sql\\practice.db`。\n4. 弹出“编辑表定义”窗口时直接点 **Cancel（取消）**，我们用 SQL 语句建表。\n\n**验收：跑通下面这段脚本**\n\n切到 **Execute SQL（执行 SQL）** 标签页，把下面整段粘进去，按 `Ctrl + Enter`（或点三角形“执行全部”）：\n\n```sql\n-- 准备日验收脚本：建一张小表，插入 3 行虚构数据，再查出来\nDROP TABLE IF EXISTS test_people;\n\nCREATE TABLE test_people (\n    id      INTEGER PRIMARY KEY,\n    name    TEXT,\n    city    TEXT,\n    amount  REAL\n);\n\nINSERT INTO test_people (id, name, city, amount) VALUES\n    (1, '甲某一', '虚构市', 1200.5),\n    (2, '乙某二', '样例县', 800),\n    (3, '丙某三', '虚构市', 1500);\n\nSELECT name, city, amount\nFROM test_people\nWHERE city = '虚构市';\n```\n\n下方结果区应该出现 2 行：甲某一、丙某三。看到了就算装好了。最后点 **Write Changes（写入更改）** 保存。\n\n**常见问题**\n\n- 结果区什么都没有：确认是在 *Execute SQL* 页执行的，而不是 *Browse Data* 页。\n- 报 `near \"，\": syntax error`：SQL 里的逗号、括号、引号必须是英文半角。中文输入法下打的 `，` `（` `‘` 都会报错——这是以后最常见的错误之一，今天先记住。\n- 关软件时提示“是否保存”：选保存。\n\n---\n\n## 二、打开 Jupyter Notebook（约 15 分钟）\n\n**步骤**\n\n1. 开始菜单搜 **Anaconda Navigator** 打开（第一次启动慢，等一两分钟）。\n2. 在 Jupyter Notebook 那一格点 **Launch**，浏览器会打开一个文件列表页。\n3. 进到你想放练习的文件夹（建议 `D:\\研习录\\python`，没有就先在资源管理器里建好）。\n4. 右上角 **New → Python 3 (ipykernel)**，新建笔记本，点左上角标题改名为 `00_准备日`。\n\n**验收：依次运行下面三个单元格**（光标放在单元格里，按 `Shift + Enter` 运行并跳到下一格）\n\n单元格 1——最简单的一行：\n\n```python\nprint(\"hello\")\n```\n\n单元格 2——看看 Python 和 pandas 的版本，确认环境齐全：\n\n```python\nimport sys\nimport pandas as pd\nimport openpyxl\n\nprint(\"Python 版本：\", sys.version.split()[0])\nprint(\"pandas 版本：\", pd.__version__)\nprint(\"openpyxl 版本：\", openpyxl.__version__)\n```\n\n单元格 3——用代码现场生成一个 Excel 再读回来（以后的 Python 课都这样，不依赖外部文件）：\n\n```python\nimport pandas as pd\n\ndf = pd.DataFrame({\n    \"姓名\": [\"甲某一\", \"乙某二\", \"丙某三\"],\n    \"城市\": [\"虚构市\", \"样例县\", \"虚构市\"],\n    \"金额\": [1200.5, 800, 1500],\n})\ndf.to_excel(\"准备日_测试.xlsx\", index=False)\n\nback = pd.read_excel(\"准备日_测试.xlsx\")\nprint(back)\nprint(\"虚构市合计金额：\", back.loc[back[\"城市\"] == \"虚构市\", \"金额\"].sum())\n```\n\n最后一行应输出 `虚构市合计金额： 2700.5`。回到 Jupyter 的文件列表页，能看到多出一个 `准备日_测试.xlsx`。\n\n**常见问题**\n\n- `ModuleNotFoundError: No module named 'openpyxl'`：在一个新单元格里运行 `%pip install openpyxl`，装完后点菜单 *Kernel → Restart*，再从头运行。\n- 浏览器没自动打开：Navigator 的黑色窗口里会有一行 `http://localhost:8888/...` 开头的地址，复制到浏览器打开。\n- 单元格左边一直是 `[*]`：表示还在运行，等几秒；一直不动就 *Kernel → Restart*。\n\n---\n\n## 三、备好《大国政治的悲剧》（约 15 分钟）\n\n地缘政治这门课第一阶段精读米尔斯海默的《大国政治的悲剧》（*The Tragedy of Great Power Politics*）。纸质、电子版都行，修订版（有讨论中国崛起的一章）更好。\n\n**今天读什么**：只读**目录**和**第一章的开头几页**，不求读懂，先建立一个地图。\n\n**读之前先知道这本书在吵什么**（下面是我的概括，不是原文）：\n\n- 国际关系里有一派叫**现实主义**（realism），认为国家之间没有“世界政府”管着，所以每个国家最终只能靠自己保证安全。\n- 现实主义内部又分两种看法：一种认为国家只要“够安全”就满足了（防御性现实主义）；作者主张另一种——**进攻性现实主义**（offensive realism）：在这种环境里，大国会不断寻找机会扩大自己相对于别国的实力，最理想的状态是成为所在地区的霸主。\n- 书名里的“悲剧”指的是：没有哪个大国是天生的恶棍，但结构逼着它们互相防范、互相竞争，冲突因此反复出现。\n\n**带着三个问题翻目录**（不用写答案，脑子里过一遍即可，下周六读第一章时会正式展开）：\n\n1. 全书大致分成哪几块？哪些章讲理论，哪些章讲历史案例？\n2. 有没有专门讨论中美关系或“中国能否和平崛起”的章节？在第几章？\n3. 第一章开头，作者用什么来解释“大国为什么会互相竞争”——是领导人的性格、国家的制度，还是别的东西？\n\n精读页入口：研习录 → 地缘政治 → 《大国政治的悲剧》（https://claude.ai/artifact/LpwLZchfacKZAnJs577MvM ）。\n\n---\n\n## 四、建一个英语生词本（约 5 分钟）\n\n以后每天英语时段会给 10 个 CFA 术语，并在 1、3、7 天后让你回想。生词本用什么形式都行，关键是**每天固定写在同一个地方**。\n\n如果想用 Excel，可以在刚才的 Jupyter 里多运行一个单元格，直接生成一个带好表头的生词本：\n\n```python\nimport pandas as pd\n\ncolumns = [\"日期\", \"英文\", \"音标\", \"中文\", \"例句\", \"第1天复习\", \"第3天复习\", \"第7天复习\"]\nsample = pd.DataFrame([{\n    \"日期\": \"2026-10-11\",\n    \"英文\": \"return\",\n    \"音标\": \"/rɪˈtɜːrn/\",\n    \"中文\": \"回报；收益\",\n    \"例句\": \"The fund earned a return of 8% last year.\",\n    \"第1天复习\": \"\", \"第3天复习\": \"\", \"第7天复习\": \"\",\n}], columns=columns)\n\nsample.to_excel(\"英语生词本.xlsx\", index=False)\nprint(\"已生成：英语生词本.xlsx\")\n```\n\n第一行 `return` 就是明天 CFA 第一课（Rates and Returns）会用到的词，算提前热身。\n\n---\n\n## 五、通读课表（约 10 分钟）\n\n第一阶段 12 周，每天 1.5–2 小时，课程按顺序推进，哪天没学完下次接着学。\n\n| 星期 | 时段安排 |\n|---|---|\n| 周一、三、五 | 英语 20 + SQL 45 + CFA 35 = 100 分钟 |\n| 周二、四 | 英语 20 + Python 45 + CFA 35 = 100 分钟 |\n| 周六 | 英语 20 + 地缘政治 60（读一章）+ CFA 35 = 115 分钟 |\n| 周日 | 英语词汇小测 20 + 地缘政治 30（时事分析）+ 周复盘 50 = 100 分钟 |\n\n各科进度：SQL 36 课、Python 24 课、CFA 一级第一阶段 64 课（数量方法 + 经济学）。\n\n**明天（周一）的课**\n\n- 英语 20 分钟：CFA 术语与短文——Rates and Returns\n- SQL 45 分钟：数据库、表、行和列，建第一张表（今天装好软件，明天直接用）\n- CFA 35 分钟：Q1 收益率与回报（1/4）\n\n看完如果觉得哪天量太大、时间段不合适、或者想换顺序，今晚打卡时直接说，我来调。\n\n---\n\n## 六、热身小练习（可选，5 分钟）\n\n不算正式内容，装好软件后有余力就做。\n\n1. 在 DB Browser 里，把验收脚本最后的查询改成只查金额大于 1000 的人，应该出来几行？\n2. 在 Jupyter 里，把单元格 3 的最后一行改成计算**所有人**的金额合计，结果是多少？\n3. 假设年初存入 10,000 元，年末变成 10,800 元，这一年的收益率（return）是多少？\n\n<details>\n<summary>答案<\/summary>\n\n1. 把 `WHERE city = '虚构市'` 改成 `WHERE amount > 1000`，出来 2 行：甲某一（1200.5）、丙某三（1500）。\n2. `print(back[\"金额\"].sum())`，结果 `3500.5`。\n3. 收益率 = (期末 − 期初) ÷ 期初 = (10,800 − 10,000) ÷ 10,000 = 8%。这就是明天 CFA 第一课的起点——holding period return（持有期收益率）。\n\n<\/details>\n\n---\n\n## 今晚 9 点打卡要回答的三个问题\n\n1. 五件事完成了哪几件？（DB Browser、Jupyter、书、生词本、课表）\n2. 大概用了多久？哪一步卡住了，报错信息是什么？\n3. 看完课表，有没有想调整的地方（每天的量、时段、顺序）？\n", "2026-10-12": "# 2026-10-12（周一）第 1 周 · 第一天\n\n> 第一阶段正式开课。今天三个时段共 100 分钟：英语 → SQL → CFA。按顺序学，哪段卡住了先跳过，晚上打卡时说。\n\n## 今天的路线\n\n| 时段 | 科目 | 分钟 | 课 |\n|---|---|---|---|\n| 1 | 英语 | 20 | [CFA 术语与短文：Rates and Returns（见 CFA 第 1 课末尾“英文术语”）](../lessons/cfa/01.md) |\n| 2 | SQL | 45 | [第 1/36 课 · 数据库、表、行和列：装好 DB Browser，建第一张表](../lessons/sql/01.md) |\n| 3 | CFA 一级 | 35 | [第 1/64 课 · Q1 收益率与回报（1/4）：利率的含义与构成、持有期收益率](../lessons/cfa/01.md) |\n\n**关于昨天**：昨天的准备日没有打卡。如果 DB Browser、Jupyter 还没装好，今天 SQL 时段先花 10 分钟装 DB Browser 装好了吗？练习做到第几道，有没有报错，报错信息是什么？\n3. 这几天每天 100 分钟排得开吗？需不需要把每天的量调小？\n", "cfa-01": "# CFA 第 1 课 · Q1 收益率与回报（1/4）\n\n> 35 分钟 · CFA 一级第 1 / 64 课 · Rates and Returns\n\n**模块**：Quantitative Methods → Rates and Returns（共 4 次课，今天第 1 次）\n\n## 学习目标\n\n- 从三个角度解释利率：要求回报率、折现率、机会成本。\n- 把利率拆成实际无风险利率加各项溢价。\n- 计算单期和多期的持有期收益率（HPR）。\n\n## 讲解一：利率的三种解读\n\n假设一年期定期存款利率是 4%：\n\n1. **Required rate of return（要求回报率）**：你把 1 万元存一年，至少要 4% 才愿意——这是你“要求”的最低回报。\n2. **Discount rate（折现率）**：一年后到手的 10,400 元，按 4% 折回今天，值 10,000 元。把“未来的钱”换算成“今天的钱”。\n3. **Opportunity cost（机会成本）**：如果你把这 1 万元放在不计息的活期里，就放弃了 4%——这就是你为“随时能用钱”付出的代价。\n\n做题看关键词：*minimum / require* → 要求回报率；*worth today / present value* → 折现率；*forgo / give up / sacrifice* → 机会成本。\n\n## 讲解二：利率的构成\n\n$$\nr = \\underbrace{\\text{实际无风险利率} + \\text{通胀溢价}}_{\\text{名义无风险利率}} + \\text{违约风险溢价} + \\text{流动性溢价} + \\text{期限溢价}\n$$\n\n一个记法：出借人问自己五个问题——\n\n| 问题 | 对应部分 |\n|---|---|\n| 我得等多久才能花这笔钱？（纯等待） | Real risk-free interest rate |\n| 等的这段时间，钱会不会贬值？ | Inflation premium |\n| 对方会不会不还？ | Default risk premium |\n| 我想提前卖掉时，能不能按公道价卖出去？ | Liquidity premium |\n| 期限越长，利率一变价格晃得越厉害，我愿不愿扛？ | Maturity premium |\n\n短期国库券（T-bill）只回答了前两个问题（后三项接近 0），所以它的收益率近似**名义无风险利率**。严格关系是 (1 + 名义) = (1 + 实际)(1 + 通胀)，一级题目一般直接相加近似。\n\n**例题 1**：实际无风险利率 2.5%，预期通胀 3%。某 15 年期公司债：违约风险溢价 1.8%，流动性溢价 0.7%，期限溢价 1.2%。\n\n- 名义无风险利率 ≈ 2.5% + 3% = **5.5%**（严格：1.025 × 1.03 − 1 = 5.575%）\n- 公司债要求回报率 ≈ 5.5% + 1.8% + 0.7% + 1.2% = **9.2%**\n\n**例题 2**：同一家公司又发了一只 15 年期债券，条款一样，但交易非常活跃，要求回报率是 8.7%。哪一项溢价不同？差多少？\n\n- 发行人、期限都一样，违约和期限溢价相同；差别只能来自流动性：9.2% − 8.7% = **0.5%**，活跃债券的流动性溢价只有 0.2%。\n\n## 讲解三：持有期收益率（HPR）\n\n**单期**：\n\n$$\nHPR = \\frac{P_1 - P_0 + D_1}{P_0} = \\underbrace{\\frac{P_1 - P_0}{P_0}}_{\\text{资本利得率}} + \\underbrace{\\frac{D_1}{P_0}}_{\\text{收入回报率}}\n$$\n\n**例题 3（股票）**：60 元买入，持有期间分红 1.8 元，以 63.2 元卖出。\n\nHPR = (63.2 − 60 + 1.8) ÷ 60 = 5 ÷ 60 = **8.33%**（资本利得 5.33% + 股息收益 3%）\n\n计算器（BA II Plus）：`63.2 − 60 + 1.8 =` → `÷ 60 =` → 显示 `0.0833`\n\n**例题 4（债券）**：面值 100 的债券按 100 买入，一年收到票息 4，年末以 106.5 卖出。\n\nHPR = (106.5 − 100 + 4) ÷ 100 = **10.5%**——票息只有 4%，另外 6.5% 来自价格上涨（比如期间市场利率下降）。\n\n**多期**：每期“1 + 收益率”连乘，再减 1。\n\n$$\nHPR = (1 + R_1)(1 + R_2)\\cdots(1 + R_n) - 1\n$$\n\n**例题 5**：某基金三年收益率 15%、−12%、6%。\n\n(1.15)(0.88)(1.06) − 1 = 1.07272 − 1 = **7.27%**\n\n计算器：`1.15 × 0.88 × 1.06 − 1 =` → 显示 `0.0727`\n\n直觉检查：只看前两年，涨 15% 再跌 12%，1.15 × 0.88 = 1.012，只赚了 1.2%，不是 3%。跌的那 12% 是从更高的基数上跌的——这就是不能直接相加的原因。\n\n## 练习：仿一级考试三选一\n\n**1.** \"To find what a payment of $1,000 due in two years is worth today, the analyst uses a rate of 7%.\" The 7% is best described as a:\n\nA. discount rate.\nB. required rate of return.\nC. opportunity cost.\n\n**2.** Which premium compensates investors for the increased sensitivity of a bond's market value to changes in interest rates as its time to repayment is extended?\n\nA. Liquidity premium\nB. Maturity premium\nC. Inflation premium\n\n**3.** The nominal risk-free rate is 5.2%, and the real risk-free rate is 2.0%. Using the additive approximation, the inflation premium is closest to:\n\nA. 2.0%\nB. 3.2%\nC. 7.2%\n\n**4.** An investor buys a share at $20.00, receives a dividend of $0.60, and sells the share at $18.40. The holding period return is closest to:\n\nA. −8.0%\nB. −5.0%\nC. 3.0%\n\n**5.** A portfolio earns 7%, 12%, −5%, and 4% in four consecutive years. The four-year holding period return is closest to:\n\nA. 18.00%\nB. 18.40%\nC. 4.60%\n\n<details>\n<summary>CFA 答案与解析<\/summary>\n\n1. **A**。关键词 *worth today*——把未来的钱换算到今天，这是折现率的角度。\n2. **B**。期限越长，利率变动对价格的影响越大，补偿这一点的是期限溢价。流动性溢价补偿“不好卖”，通胀溢价补偿购买力下降。\n3. **B**。5.2% − 2.0% = 3.2%。C 是把两者相加的错误。\n4. **B**。(18.40 − 20.00 + 0.60) ÷ 20.00 = −1.00 ÷ 20 = −5.0%。A 漏了股息（−1.60 ÷ 20 = −8%）；C 只算了股息收益率（0.60 ÷ 20 = 3%）。\n5. **B**。1.07 × 1.12 × 0.95 × 1.04 − 1 = 1.18402 − 1 = 18.40%。A 是直接相加；C 是把 18.40% 除以 4——年均收益率要用几何平均（开四次方），第 2 次课讲。\n\n<\/details>\n\n---\n\n## 加练一\n\n> 同一课另一套仿真题，正课的练习做完还有余力再做。\n\n**1.** An analyst states: \"The 6% rate is the minimum return investors require before they agree to lend.\" This statement best describes the interest rate as a:\n\nA. discount rate.\nB. required rate of return.\nC. opportunity cost.\n\n**2.** Which component of an interest rate compensates investors for the risk that a security cannot be sold quickly at close to its fair value?\n\nA. Maturity premium\nB. Default risk premium\nC. Liquidity premium\n\n**3.** Given: real risk-free rate 1.5%, inflation premium 2.5%, default risk premium 2.0%, liquidity premium 0.8%, maturity premium 1.2%. The required return on the bond is closest to:\n\nA. 6.0%\nB. 7.2%\nC. 8.0%\n\n**4.** An investor buys a share at $40, receives a dividend of $0.80, and sells the share at $37. The holding period return is closest to:\n\nA. −7.5%\nB. −5.5%\nC. −2.0%\n\n**5.** A portfolio returns 12%, −8%, and 5% in three consecutive years. The three-year holding period return is closest to:\n\nA. 9.00%\nB. 8.19%\nC. 2.73%\n\n<details>\n<summary>CFA 答案与解析<\/summary>\n\n1. **B**。关键词 *minimum return investors require*。折现率强调把未来价值换算到今天；机会成本强调放弃的收益。\n2. **C**。流动性溢价补偿“难以快速按公允价卖出”。期限溢价补偿长期限下的利率风险；违约风险溢价补偿可能不还钱。\n3. **C**。1.5 + 2.5 + 2.0 + 0.8 + 1.2 = 8.0%。A 只加了前三项，漏了流动性和期限溢价（1.5 + 2.5 + 2.0 = 6.0%）。\n4. **B**。(37 − 40 + 0.80) ÷ 40 = −2.20 ÷ 40 = −5.5%。A 漏掉了股息（−3 ÷ 40 = −7.5%）。\n5. **B**。1.12 × 0.92 × 1.05 − 1 = 1.08192 − 1 = 8.19%。A 是直接相加的错误做法；C 是 8.19% 除以 3 的错误“年均”做法（年均收益率要开三次方，第 2 次课讲几何平均）。\n\n<\/details>\n\n---\n\n## 加练二\n\n> 同一课另一套仿真题，正课的练习做完还有余力再做。\n\n**1.** \"By keeping $10,000 in a non-interest-bearing account, Wen gives up the 3% she could earn on a one-year deposit.\" The 3% is best described as a(n):\n\nA. discount rate.\nB. opportunity cost.\nC. required rate of return.\n\n**2.** The nominal risk-free interest rate is best approximated by the sum of the:\n\nA. real risk-free rate and the inflation premium.\nB. real risk-free rate and the default risk premium.\nC. inflation premium and the maturity premium.\n\n**3.** A 3-month Treasury bill yields 4.6%, and the real risk-free rate is 1.9%. The inflation premium is closest to:\n\nA. 1.9%\nB. 2.7%\nC. 6.5%\n\n**4.** An investor buys a share for $25.00, receives a dividend of $0.50, and sells the share for $27.50 one year later. The holding period return is closest to:\n\nA. 2.0%\nB. 10.0%\nC. 12.0%\n\n**5.** A fund returns 6%, 9%, and −4% in three consecutive years. The three-year holding period return is closest to:\n\nA. 3.64%\nB. 10.92%\nC. 11.00%\n\n<details>\n<summary>CFA 答案与解析<\/summary>\n\n1. **B**。关键词 *gives up*：放弃了本可以赚到的 3%，是机会成本。没有“最低要求”的意思（排除 C），也没有把未来价值折到今天（排除 A）。\n2. **A**。名义无风险利率 = 实际无风险利率 + 通胀溢价。违约、流动性、期限溢价是具体证券才有的风险补偿，无风险利率里不含。\n3. **B**。T-bill 收益率近似名义无风险利率：4.6% − 1.9% = 2.7%。C 是错误地把两者相加。\n4. **C**。(27.50 − 25.00 + 0.50) ÷ 25.00 = 3.00 ÷ 25.00 = 12.0%。B 漏掉了股息（2.50 ÷ 25 = 10%）；A 只算了股息收益率（0.50 ÷ 25 = 2%）。\n5. **B**。1.06 × 1.09 × 0.96 − 1 = 1.1092 − 1 = 10.92%。C 是直接相加（6 + 9 − 4 = 11%）；A 是把 10.92% 除以 3 的错误“年均”算法——年均收益率要用几何平均开三次方，第 2 次课讲。\n\n<\/details>\n\n---\n\n## 英文术语\n\n> 这一课相关的 30 个 CFA 英文术语，分三组。先遮住中文说一遍，再抄进生词本；它们会进复习卡。\n\n### 第一组\n\n| # | 英文 | 音标 | 中文 |\n|---|---|---|---|\n| 1 | interest rate | /ˈɪntrəst reɪt/ | 利率 |\n| 2 | required rate of return | /rɪˈkwaɪərd reɪt əv rɪˈtɜːrn/ | 要求回报率 |\n| 3 | discount rate | /ˈdɪskaʊnt reɪt/ | 折现率 |\n| 4 | opportunity cost | /ˌɑːpərˈtuːnəti kɔːst/ | 机会成本 |\n| 5 | real risk-free interest rate | /ˈriːəl ˌrɪsk ˈfriː/ | 实际无风险利率 |\n| 6 | inflation premium | /ɪnˈfleɪʃn ˈpriːmiəm/ | 通胀溢价 |\n| 7 | default risk premium | /dɪˈfɔːlt rɪsk ˈpriːmiəm/ | 违约风险溢价 |\n| 8 | liquidity premium | /lɪˈkwɪdəti ˈpriːmiəm/ | 流动性溢价 |\n| 9 | maturity premium | /məˈtʃʊrəti ˈpriːmiəm/ | 期限溢价 |\n| 10 | holding period return (HPR) | /ˈhoʊldɪŋ ˈpɪriəd rɪˈtɜːrn/ | 持有期收益率 |\n\n**例句**\n\n1. The central bank raised the **interest rate** by 0.25%. —— 央行把利率上调了 0.25 个百分点。\n2. Investors set a **required rate of return** of 9% for this project. —— 投资者对这个项目设定了 9% 的要求回报率。\n3. A higher **discount rate** makes future cash flows worth less today. —— 折现率越高，未来现金流的现值越低。\n4. The **opportunity cost** of holding cash is the interest you give up. —— 持有现金的机会成本就是放弃的利息。\n5. The **real risk-free interest rate** is the return for pure waiting, with no inflation. —— 实际无风险利率是在没有通胀时单纯“等待”所得的回报。\n6. When prices rise faster, lenders demand a larger **inflation premium**. —— 物价涨得越快，出借人要求的通胀溢价越高。\n7. Bonds from weaker companies carry a higher **default risk premium**. —— 实力较弱公司的债券违约风险溢价更高。\n8. Thinly traded bonds must offer a **liquidity premium**. —— 交易清淡的债券必须提供流动性溢价。\n9. A 30-year bond usually includes a bigger **maturity premium** than a 2-year bond. —— 30 年期债券的期限溢价通常比 2 年期大。\n10. The stock's **holding period return** was 11% including dividends. —— 算上分红，这只股票的持有期收益率是 11%。\n\n### 第二组\n\n| # | 英文 | 音标 | 中文 |\n|---|---|---|---|\n| 1 | nominal risk-free rate | /ˈnɑːmɪnl ˌrɪsk ˈfriː reɪt/ | 名义无风险利率 |\n| 2 | Treasury bill (T-bill) | /ˈtreʒəri bɪl/ | 短期国库券 |\n| 3 | premium | /ˈpriːmiəm/ | 溢价；额外补偿 |\n| 4 | creditworthiness | /ˈkredɪtwɜːrðinəs/ | 信用状况、偿债能力 |\n| 5 | capital gain | /ˈkæpɪtl ɡeɪn/ | 资本利得（价差收益） |\n| 6 | dividend yield | /ˈdɪvɪdend jiːld/ | 股息收益率 |\n| 7 | coupon | /ˈkuːpɑːn/ | （债券）票息 |\n| 8 | compounding | /kəmˈpaʊndɪŋ/ | 复利、复合计算 |\n| 9 | present value | /ˈpreznt ˈvæljuː/ | 现值 |\n| 10 | fair value | /fer ˈvæljuː/ | 公允价值 |\n\n**例句**\n\n1. The yield on a 3-month T-bill is a good proxy for the **nominal risk-free rate**. —— 3 个月期国库券的收益率可以很好地近似名义无风险利率。\n2. A **Treasury bill** matures in one year or less. —— 短期国库券的期限不超过一年。\n3. Investors demand a **premium** for every extra risk they take. —— 每多承担一种风险，投资者就要求多一份溢价。\n4. Rating agencies assess the **creditworthiness** of bond issuers. —— 评级机构评估债券发行人的信用状况。\n5. She sold the shares at a higher price and realized a **capital gain**. —— 她以更高的价格卖出股票，实现了资本利得。\n6. A stock priced at 50 that pays 2 a year has a **dividend yield** of 4%. —— 股价 50、每年分红 2 的股票，股息收益率是 4%。\n7. The bond pays a **coupon** of 5% once a year. —— 这只债券每年付一次 5% 的票息。\n8. Because of **compounding**, returns earned each year also earn returns later. —— 由于复利，每年赚到的收益之后还会继续生息。\n9. The **present value** of 110 received next year at 10% is 100. —— 按 10% 折算，明年收到的 110 的现值是 100。\n10. In an illiquid market, you may have to sell well below **fair value**. —— 在流动性差的市场里，你可能得远低于公允价值卖出。\n\n### 第三组\n\n| # | 英文 | 音标 | 中文 |\n|---|---|---|---|\n| 1 | lender | /ˈlendər/ | 出借人、贷款方 |\n| 2 | borrower | /ˈbɑːroʊər/ | 借款人 |\n| 3 | purchasing power | /ˈpɜːrtʃəsɪŋ ˈpaʊər/ | 购买力 |\n| 4 | nominal return | /ˈnɑːmɪnl rɪˈtɜːrn/ | 名义回报 |\n| 5 | real return | /ˈriːəl rɪˈtɜːrn/ | 实际回报（扣除通胀后） |\n| 6 | yield | /jiːld/ | 收益率 |\n| 7 | maturity | /məˈtʃʊrəti/ | 到期日；期限 |\n| 8 | credit risk | /ˈkredɪt rɪsk/ | 信用风险 |\n| 9 | marketable | /ˈmɑːrkɪtəbl/ | 可在市场上交易的 |\n| 10 | income return | /ˈɪnkʌm rɪˈtɜːrn/ | 收入回报（利息、股息部分） |\n\n**例句**\n\n1. The **lender** expects to be paid back with interest. —— 出借人期望连本带息收回。\n2. A **borrower** with a weak balance sheet pays a higher rate. —— 资产负债表较弱的借款人要付更高的利率。\n3. Inflation reduces the **purchasing power** of money. —— 通胀会削弱货币的购买力。\n4. The fund's **nominal return** was 7% last year. —— 这只基金去年的名义回报是 7%。\n5. With 3% inflation, the **real return** was only about 4%. —— 扣除 3% 的通胀后，实际回报只有约 4%。\n6. The **yield** on the 10-year bond rose to 4.5%. —— 10 年期债券的收益率升到了 4.5%。\n7. The bond reaches **maturity** in 2036. —— 这只债券在 2036 年到期。\n8. Rating agencies try to measure **credit risk**. —— 评级机构试图衡量信用风险。\n9. Government bonds are highly **marketable**. —— 国债非常容易在市场上买卖。\n10. The coupon you receive is the **income return** of a bond. —— 收到的票息就是债券的收入回报。\n\n### 短文阅读\n\n**What Is an Interest Rate?**\n\nAn interest rate can be read in three ways. First, it is a required rate of return: the minimum return an investor needs before agreeing to lend money. Second, it is a discount rate, which tells us how much a payment in the future is worth today. Third, it is an opportunity cost, because money spent today gives up the interest it could have earned.\n\nInterest rates are also built from several parts. The real risk-free interest rate rewards investors simply for waiting. An inflation premium protects them against rising prices. Riskier securities add more premiums: a default risk premium if the borrower might not pay, a liquidity premium if the security is hard to sell quickly at a fair price, and a maturity premium if the money is tied up for many years.\n\nAfter an investment is made, we measure the result with the holding period return, which counts both the price change and any income received.\n\n**理解题**\n\n1. According to the passage, what are the three ways to read an interest rate?\n2. Which premium is added when a security is hard to sell quickly at a fair price?\n3. What two things does the holding period return count?\n\n<details>\n<summary>答案<\/summary>\n\n1. A required rate of return, a discount rate, and an opportunity cost.（要求回报率、折现率、机会成本）\n2. The liquidity premium.（流动性溢价）\n3. The price change and any income received (e.g., dividends or interest).（价格变动和期间收到的收入）\n\n<\/details>\n", "py-01": "# Python 第 1 课 · 环境：Anaconda 与 Jupyter，第一个程序\n\n> 45 分钟 · Python 第 1 / 24 课\n\n## 本课目标\n\n1. 会从 Anaconda 打开 Jupyter Notebook，新建、改名、保存一个笔记本。\n2. 分清两种单元格：**Code**（代码）和 **Markdown**（文字说明），会用快捷键运行。\n3. 会用 `print()` 输出、用 `#` 写注释、把 Python 当计算器用。\n4. 看得懂最常见的报错，知道从哪一行找问题。\n\n## 讲解一：Anaconda、Jupyter、Python 是什么关系\n\n- **Python**：编程语言本身。\n- **Anaconda**：一个“工具大礼包”，装好了 Python 和几百个常用库（pandas 处理表格、openpyxl 读写 Excel 等），省得一个个装。\n- **Jupyter Notebook**：在浏览器里写 Python 的“笔记本”。一份笔记本（`.ipynb` 文件）由很多**单元格**组成，每格可以单独运行、马上看到结果——很适合边学边试，也适合一步步处理一份 Excel：读进来 → 看一眼 → 清洗 → 再看一眼 → 导出。\n\n可以这样类比：Python 是发动机，Anaconda 是整辆车，Jupyter 是驾驶座。\n\n## 讲解二：打开并建好今天的笔记本（约 8 分钟）\n\n1. 开始菜单搜 **Anaconda Navigator** → 在 Jupyter Notebook 那格点 **Launch**（也可以开始菜单直接搜 *Jupyter Notebook*）。浏览器会打开一个文件列表页，背后还有一个黑色窗口——**别关它**，关了 Jupyter 就停了。\n2. 进到练习文件夹（建议 `D:\\研习录\\python`）。\n3. 右上角 **New → Python 3 (ipykernel)**，点左上角的 *Untitled*，改名为 `01_第一个程序`。\n4. 保存：`Ctrl + S`。Jupyter 也会每隔几分钟自动保存。\n\n**两种模式**（Jupyter 最容易困惑的地方）：\n\n| 模式 | 怎么进入 | 单元格左边框 | 这时按键的作用 |\n|---|---|---|---|\n| 编辑模式 | 在单元格里点一下，或按 `Enter` | 绿色（新版为蓝色、有光标） | 打字 |\n| 命令模式 | 按 `Esc` | 蓝色、没有光标 | 按单个字母操作整个单元格 |\n\n**常用快捷键**（先记前四个）：\n\n| 快捷键 | 作用 |\n|---|---|\n| `Shift + Enter` | 运行当前格，跳到下一格（最常用） |\n| `Ctrl + Enter` | 运行当前格，停在原地 |\n| `Esc` 然后 `B` | 在下方插入新单元格（Below） |\n| `Esc` 然后 `M` / `Y` | 把单元格切换成 Markdown / Code |\n| `Esc` 然后 `D D` | 删除单元格（按两次 D） |\n| `Esc` 然后 `Z` | 撤销删除 |\n\n单元格左边的 `In [3]:` 表示这是第 3 个被运行的格；正在运行时显示 `In [*]:`。\n\n## 讲解三：第一个程序\n\n依次把下面每段放进一个单独的单元格，`Shift + Enter` 运行。\n\n**单元格 1：输出一句话**\n\n```python\nprint(\"hello, 研习录\")\n```\n\n- `print()` 是一个**函数**：括号里放什么，就把什么显示出来。\n- 文字要用**英文引号**包起来，单引号 `'...'` 和双引号 `\"...\"` 都行，前后要一致。被引号包起来的文字叫**字符串**（string）。\n\n**单元格 2：注释和多行输出**\n\n```python\n# 井号后面是注释，Python 不执行，用来写说明\nprint(\"第一行\")\nprint(\"第二行\")   # 注释也可以写在代码后面\nprint(\"姓名：\", \"赵小一\", \"金额：\", 1200)\n```\n\n输出：\n\n```\n第一行\n第二行\n姓名： 赵小一 金额： 1200\n```\n\n`print()` 里可以放好几样东西，用逗号隔开，输出时自动用空格连起来。注意 `1200` 没加引号——它是数字，不是文字。\n\n**单元格 3：把 Python 当计算器**\n\n```python\nprint(1200 + 800)        # 加\nprint(1500 - 600.5)      # 减\nprint(950 * 12)          # 乘：用 * 不是 ×\nprint(6250.5 / 6)        # 除：用 / 不是 ÷，结果总是小数\nprint(17 // 5, 17 % 5)   # 整除取商、取余数\nprint(1.05 ** 3)         # 乘方：1.05 的 3 次方\n```\n\n输出：\n\n```\n2000\n899.5\n11400\n1041.75\n3 2\n1.157625\n```\n\n**单元格 4：单元格最后一行的值会自动显示**\n\n```python\n1.10 * 0.95 * 1.08 - 1\n```\n\n不写 `print`，Jupyter 也会显示 `0.12860000000000005`。末尾那串 `0000000005` 是计算机存小数的正常误差，不是算错了。想要整齐，用 `round(数字, 位数)`：\n\n```python\nround(1.10 * 0.95 * 1.08 - 1, 4)\n```\n\n结果 `0.1286`——正好是今天 CFA 课里多期持有期收益率的算法，以后算 CFA 题可以直接用 Jupyter 验算。\n\n**单元格 5：Markdown 单元格写笔记**\n\n新建一格，按 `Esc` 再按 `M` 切成 Markdown，输入：\n\n```markdown\n# 第 1 课：第一个程序\n- `print()` 输出\n- `#` 写注释\n- **Shift + Enter** 运行\n```\n\n运行后变成排好版的标题和列表。双击可以再改。养成习惯：每个笔记本开头写一格 Markdown，说明这个笔记本是干什么的。\n\n**单元格 6：先尝一口——三行代码生成并读回一个 Excel**\n\n```python\nimport pandas as pd\n\ndf = pd.DataFrame({\"姓名\": [\"赵小一\", \"钱小二\", \"孙小三\"], \"金额\": [1200, 800, 1500]})\ndf.to_excel(\"01_试一试.xlsx\", index=False)\npd.read_excel(\"01_试一试.xlsx\")\n```\n\n运行后显示一张三行的小表，文件列表页里多了 `01_试一试.xlsx`，可以用 Excel 打开看看。今天**不要求看懂**这几行——第 13 课左右学 pandas 时会逐行讲。先知道：以后成千上万行的 Excel 清洗、比对，就是这样几行代码完成的。\n\n（如果报 `No module named 'openpyxl'`：新建一格运行 `%pip install openpyxl`，然后菜单 *Kernel → Restart*，再从单元格 6 重新运行。）\n\n## 讲解四：看懂报错\n\n故意运行下面这格：\n\n```python\nprint(\"hello)\n```\n\n会看到类似：\n\n```\n  Cell In[7], line 1\n    print(\"hello)\n          ^\nSyntaxError: unterminated string literal (detected at line 1)\n```\n\n读报错的顺序：**先看最后一行**（错误类型 + 说明），**再看 line 几和 `^` 指的位置**。`SyntaxError` 是语法错误，`unterminated string literal` 的意思是“字符串没有结束”——少了后半个引号。\n\n最常见的三种：\n\n| 报错 | 原因 | 例子 |\n|---|---|---|\n| `SyntaxError` | 语法写错：少引号、少括号、用了中文标点 | `print（\"hi\"）` |\n| `NameError: name 'xxx' is not defined` | 用了一个 Python 不认识的名字：拼错、大小写错、文字忘加引号 | `Print(\"hi\")`、`print(hello)` |\n| `TypeError` | 类型不对，比如文字和数字直接相加 | `\"金额\" + 1200` |\n\nPython **区分大小写**：`print` 对，`Print` 错。\n\n## 练习（由易到难）\n\n1. 新建一格，输出两行：第一行是你的名字（随便写个昵称也行），第二行是 `今天开始学 Python`。\n2. 一份虚构补贴名单的 6 笔金额是 1200、800、1500、600.5、1200、950。用一个单元格算出**合计**和**平均**（平均 = 合计 ÷ 6），分别输出。\n3. 在笔记本最上方插入一个 Markdown 单元格，写一个一级标题“第 1 课练习”，下面用列表写出今天学到的三个快捷键。（提示：先点第一格，`Esc` 后按 `A` 是在**上方**插入。）\n4. 下面三格各有一个错误，先运行看报错，说出错误类型，再改对：\n   ```python\n   print（\"第一题\"）\n   ```\n   ```python\n   Print(\"第二题\")\n   ```\n   ```python\n   print(\"合计：\" + 6250.5)\n   ```\n5. 贴近实际：某项补贴按人头发放，每人每月 450 元。青石镇 36 人发 12 个月，白沙乡 28 人发 10 个月。用一个单元格分别算出两个乡镇的发放总额和两地合计，输出成这样的三行（数字自己算出来，不要手打）：\n   ```\n   青石镇： ……\n   白沙乡： ……\n   合计： ……\n   ```\n   再想一想：如果有 300 个乡镇，这样一行行写还行得通吗？（后面学列表、循环和 pandas 就是为了解决这个。）\n\n## 常见错误\n\n- **关掉了黑色窗口**：Jupyter 停止运行，网页上出现 *Kernel 连接断开*。重新从 Anaconda 打开即可，笔记本已保存的内容还在。\n- **中文标点**：`（）`、`“”`、`，` 都会导致 `SyntaxError`。代码里的符号一律英文半角，引号**里面**的中文没关系。\n- **在命令模式下打字**：按了一串字母却没输入进去，反而插入、删除了单元格。先 `Esc` 再按 `Z` 撤销，然后点进单元格再打字。\n- **单元格停在 `In [*]` 不动**：上一格还没跑完或卡住。点工具栏的 ■（Interrupt），不行就 *Kernel → Restart*。\n- **重启后报 `NameError`**：重启会清空内存，前面单元格定义过的东西没了。从上往下重新运行一遍（菜单 *Run → Run All Cells*，旧版是 *Cell → Run All*）。\n\n<details>\n<summary>Python 练习答案<\/summary>\n\n1.\n```python\nprint(\"小明\")   # 换成你自己的名字或昵称\nprint(\"今天开始学 Python\")\n```\n\n2.\n```python\nprint(\"合计：\", 1200 + 800 + 1500 + 600.5 + 1200 + 950)\nprint(\"平均：\", (1200 + 800 + 1500 + 600.5 + 1200 + 950) / 6)\n```\n输出 `合计： 6250.5`、`平均： 1041.75`。注意第二行要加括号：先加再除。不加括号写成 `1200 + 800 + ... + 950 / 6`，只有最后的 950 被除以 6。\n\n3. Markdown 单元格内容示例：\n```markdown\n# 第 1 课练习\n- Shift + Enter：运行并跳到下一格\n- Esc 然后 B：在下方插入单元格\n- Esc 然后 M：切换成 Markdown\n```\n\n4.\n- 第一格：`SyntaxError`（中文括号）。改为 `print(\"第一题\")`。\n- 第二格：`NameError: name 'Print' is not defined`（大小写）。改为 `print(\"第二题\")`。\n- 第三格：`TypeError: can only concatenate str (not \"float\") to str`（文字和数字不能用 `+` 拼）。改为 `print(\"合计：\", 6250.5)`，用逗号隔开。\n\n5.\n```python\nprint(\"青石镇：\", 450 * 36 * 12)\nprint(\"白沙乡：\", 450 * 28 * 10)\nprint(\"合计：\", 450 * 36 * 12 + 450 * 28 * 10)\n```\n输出：\n```\n青石镇： 194400\n白沙乡： 126000\n合计： 320400\n```\n300 个乡镇一行行写，既费时又容易抄错数字。下一课（周四）学**变量**，可以先把 450 存成 `per_month = 450`，标准一改，所有结果跟着变；再往后用列表和循环，300 行也只要几行代码。\n\n<\/details>\n", "sql-01": "# SQL 第 1 课 · 数据库、表、行和列：装好 DB Browser，建第一张表\n\n> 45 分钟 · SQL 第 1 / 36 课\n\n> 还没装 DB Browser 的话，先花 10 分钟按 [准备日讲义](../../daily/2026-10-11.md) 第一节装好，建一个 `practice.db`。\n\n## 本课目标\n\n1. 说清楚数据库、表、行、列分别是什么。\n2. 会用 `CREATE TABLE` 建表，知道 SQLite 常用的三种类型 `INTEGER`、`REAL`、`TEXT`，知道主键是干什么的。\n3. 会用 `INSERT INTO` 插入数据，用 `SELECT ... FROM` 把表查出来。\n\n## 讲解：一张报销台账就是一张表\n\n设想你在核查一个虚构单位的《差旅报销台账》，要和《请假登记表》对照，看有没有人“请假那天却报了出差”。\n\n| Excel 里 | 数据库里 | 说明 |\n|---|---|---|\n| 整个工作簿 | **数据库**（database，SQLite 里就是一个 `.db` 文件） | 装很多张表 |\n| 一个工作表 | **表**（table） | 一类事物一张：报销一张，请假一张 |\n| 一行 | **行**（row / record） | 一笔报销、一次请假 |\n| 一列 + 列标题 | **列**（column / field） | 姓名、工号、金额、日期…… |\n\n和 Excel 的关键区别：**每一列在建表时就定好类型**。\n\n- `INTEGER`：整数（编号、天数）\n- `REAL`：小数（金额）\n- `TEXT`：文本（姓名、工号、日期。SQLite 的日期统一写成 `'2026-04-08'` 这样的文本，按这个格式排序、比较都不会乱）\n\n**主键**（`PRIMARY KEY`）是每一行的“身份证”，不能重复。台账里的报销单号天然适合当主键：同一张单子不可能登两次——如果真登了两次，数据库会直接报错，这本身就是一道核查关口。\n\n## 建表加数据脚本\n\n打开 DB Browser → 打开 `practice.db` → **Execute SQL** → 粘贴整段 → `Ctrl + Enter` → 点 **Write Changes** 保存。\n\n```sql\n-- 第 1 课：差旅报销台账（数据全部虚构）\nDROP TABLE IF EXISTS travel_claims;\n\nCREATE TABLE travel_claims (\n    claim_no   INTEGER PRIMARY KEY,   -- 报销单号，主键\n    name       TEXT,                  -- 姓名\n    emp_no     TEXT,                  -- 工号（虚构格式）\n    dept       TEXT,                  -- 科室\n    trip_date  TEXT,                  -- 出差日期\n    city       TEXT,                  -- 出差地（虚构地名）\n    amount     REAL                   -- 报销金额（元）\n);\n\nINSERT INTO travel_claims (claim_no, name, emp_no, dept, trip_date, city, amount) VALUES\n    (2001, '甲一明', 'E-0101', '综合科', '2026-04-08', '云溪市', 1320.0),\n    (2002, '乙二红', 'E-0102', '财务科', '2026-04-08', '云溪市', 980.5),\n    (2003, '丙三华', 'E-0103', '项目科', '2026-04-10', '石桥县', 2150.0),\n    (2004, '丁四强', 'E-0104', '项目科', '2026-04-15', '北岭市', 760.0),\n    (2005, '戊五芳', 'E-0105', '综合科', '2026-04-15', '北岭市', 1890.0),\n    (2006, '丙三华', 'E-0103', '项目科', '2026-04-22', '云溪市', 1405.0),\n    (2007, '己六军', 'E-0106', '财务科', '2026-04-23', '石桥县', 640.0);\n```\n\n切到 **Browse Data**，选 `travel_claims`，能看到 7 行。\n\n逐句看：\n\n- `DROP TABLE IF EXISTS ...;`——有同名表先删掉，脚本可以反复跑，不会报“表已存在”。\n- `CREATE TABLE 表名 ( 列名 类型, ... );`——列之间逗号隔开，**最后一列后面不加逗号**。`--` 后面是注释，不执行。\n- `INSERT INTO 表名 (列1, 列2, ...) VALUES (...), (...);`——值和列一一对应；文本用**单引号**，数字不加引号；多行之间逗号，整句末尾分号。\n\n## 示例查询\n\n选中某一句再按 `Ctrl + Enter`，就只执行那一句。\n\n**查询 1：看整张表**\n\n```sql\nSELECT * FROM travel_claims;\n```\n\n`SELECT` = 取数据；`*` = 所有列；`FROM travel_claims` = 从这张表取。结果 7 行 7 列。\n\n**查询 2：只看需要的列，并按自己想要的顺序排列**\n\n```sql\nSELECT trip_date, name, amount FROM travel_claims;\n```\n\n列的顺序就是你写的顺序。核查时常把日期放最前，方便和别的表对日期。\n\n**查询 3：数行数**\n\n```sql\nSELECT COUNT(*) FROM travel_claims;\n```\n\n结果 `7`。拿到台账先数笔数，和对方报的“共 7 笔”对得上，再往下做。\n\n**查询 4：给结果列起个中文名**\n\n```sql\nSELECT name AS 姓名, amount AS 金额 FROM travel_claims;\n```\n\n`AS` 只改结果里显示的列名，不改表本身。导出给别人看时很方便。\n\n**查询 5：看表结构**\n\n```sql\nPRAGMA table_info(travel_claims);\n```\n\n列出每一列的名字和类型，`pk = 1` 的是主键。忘了列名时用它查。\n\n## 练习（由易到难）\n\n1. 查出 `travel_claims` 的全部内容。\n2. 只查报销单号、姓名、金额三列，并把这三列显示为“单号”“姓名”“金额”。\n3. 补登一笔：单号 2008，庚七兰，工号 `E-0107`，综合科，2026-04-28，北岭市，1120 元。插入后数一数，应为 8 笔。\n4. 再执行一次第 3 题的 `INSERT`，会发生什么？读一读报错信息，用一句话说明它为什么是“好事”。\n5. 贴近实际：新建 `leave_records`（请假登记表），四列：`leave_id`（整数，主键）、`emp_no`（文本）、`name`（文本）、`leave_date`（文本），插入下面 3 行：\n   - 1，`E-0102`，乙二红，2026-04-08\n   - 2，`E-0104`，丁四强，2026-04-16\n   - 3，`E-0103`，丙三华，2026-04-22\n\n   然后分别查出报销台账的 `emp_no, name, trip_date` 和请假表的 `emp_no, name, leave_date`，**用眼睛比对**：谁在请假当天报了出差？丁四强算不算？为什么比对时要“工号 + 日期”两样都对上？\n\n## 常见错误\n\n- **中文标点**：`，` `（` `‘` 会报 `syntax error`。SQL 里的符号一律英文半角，引号里面的中文内容没关系。\n- **最后一列后面多逗号**：`amount REAL,)` 报错。\n- **文本没加引号**：`VALUES (2008, 庚七兰, ...)` 会报 `no such column: 庚七兰`——没加引号的字被当成了列名。\n- **列数和值数对不上**：7 个列名配 6 个值，报 `7 columns but 6 values were supplied`，数一数逗号。\n- **主键重复**：报 `UNIQUE constraint failed`。\n- **忘了 Write Changes**：关掉软件，数据就没了。\n\n<details>\n<summary>SQL 练习答案<\/summary>\n\n1.\n```sql\nSELECT * FROM travel_claims;\n```\n\n2.\n```sql\nSELECT claim_no AS 单号, name AS 姓名, amount AS 金额 FROM travel_claims;\n```\n\n3.\n```sql\nINSERT INTO travel_claims (claim_no, name, emp_no, dept, trip_date, city, amount) VALUES\n    (2008, '庚七兰', 'E-0107', '综合科', '2026-04-28', '北岭市', 1120);\n\nSELECT COUNT(*) FROM travel_claims;   -- 结果 8\n```\n\n4. 报错 `UNIQUE constraint failed: travel_claims.claim_no`。单号是主键，不允许重复，所以同一张单子登两次会被直接挡住。手工 Excel 台账里“一单两报”要靠人眼去发现，数据库在录入时就拦住了。\n\n5.\n```sql\nDROP TABLE IF EXISTS leave_records;\n\nCREATE TABLE leave_records (\n    leave_id    INTEGER PRIMARY KEY,\n    emp_no      TEXT,\n    name        TEXT,\n    leave_date  TEXT\n);\n\nINSERT INTO leave_records (leave_id, emp_no, name, leave_date) VALUES\n    (1, 'E-0102', '乙二红', '2026-04-08'),\n    (2, 'E-0104', '丁四强', '2026-04-16'),\n    (3, 'E-0103', '丙三华', '2026-04-22');\n\nSELECT emp_no, name, trip_date FROM travel_claims;\nSELECT emp_no, name, leave_date FROM leave_records;\n```\n\n比对结果：\n\n- **乙二红**（E-0102）：4 月 8 日请假，同一天报了云溪市出差 980.5 元（单号 2002）——疑点。\n- **丙三华**（E-0103）：4 月 22 日请假，同一天报了云溪市出差 1405 元（单号 2006）——疑点。注意他 4 月 10 日那笔没问题，所以不能只看“名字出现在两张表里”。\n- **丁四强**（E-0104）：出差 4 月 15 日，请假 4 月 16 日，日期不同，**不算**。\n\n为什么要“工号 + 日期”：只比工号，丙三华的两笔会被一起标出来，误伤正常的那笔，丁四强也会被误标；只比日期，会把同一天请假和出差的不同人凑到一起。两样都对上才是同一个人、同一天。\n\n预告：以后一句话就能筛出来（今天不要求看懂）：\n\n```sql\nSELECT t.name, t.trip_date, t.amount\nFROM travel_claims t\nJOIN leave_records l\n  ON t.emp_no = l.emp_no AND t.trip_date = l.leave_date;\n```\n\n<\/details>\n\n---\n\n## 加练：换一个场景再做一遍（补贴名单比对）\n\n> 同一课的另一套讲解和练习，场景是补贴发放名单和在职人员名单。正课学完还有余力再做。\n\n### 本课目标\n\n1. 说清楚数据库、表、行、列分别是什么。\n2. 会用 `CREATE TABLE` 建表，知道 SQLite 常用的三种类型 `INTEGER`、`REAL`、`TEXT`。\n3. 会用 `INSERT INTO` 插入数据，用 `SELECT * FROM` 把表查出来。\n\n### 讲解：用 Excel 来类比\n\n设想你手上有一份《补贴发放名单》Excel，要和另一份《在职人员名单》核对，看有没有人“既领补贴又在编”。\n\n| Excel 里 | 数据库里 | 说明 |\n|---|---|---|\n| 整个工作簿（.xlsx 文件） | **数据库**（database，SQLite 里就是一个 `.db` 文件） | 装很多张表 |\n| 一个工作表（sheet） | **表**（table） | 一类事物一张表：补贴名单一张、在职名单一张 |\n| 一行 | **行**（row / record，记录） | 一个人、一笔发放 |\n| 一列 + 列标题 | **列**（column / field，字段） | 姓名、证件号、金额…… |\n\n和 Excel 最大的区别：**数据库的每一列在建表时就规定好类型**。“金额”列规定是数字，就不会混进“一千二”这样的文字；“证件号”规定是文本，开头的 0 不会被吃掉——这两件事在 Excel 里都是核查时的常见坑。\n\nSQLite 最常用三种类型：\n\n- `INTEGER`：整数（序号、人数）\n- `REAL`：小数（金额）\n- `TEXT`：文本（姓名、证件号、日期——SQLite 的日期统一写成 `'2026-03-05'` 这种文本）\n\n**主键**（`PRIMARY KEY`）：每张表挑一列当“身份证”，每行的值都不同、不能重复。今天用一个简单的序号 `id` 当主键。\n\n### 建表加数据脚本\n\n打开 DB Browser → 打开昨天建的 `practice.db`（没有就 *New Database* 新建一个）→ 切到 **Execute SQL** → 粘贴整段 → `Ctrl + Enter`。\n\n```sql\n-- 第 1 课：补贴发放名单（数据全部虚构）\nDROP TABLE IF EXISTS subsidy_list;\n\nCREATE TABLE subsidy_list (\n    id        INTEGER PRIMARY KEY,   -- 序号，主键\n    name      TEXT,                  -- 姓名\n    id_no     TEXT,                  -- 证件号（虚构格式）\n    town      TEXT,                  -- 乡镇\n    amount    REAL,                  -- 发放金额（元）\n    pay_date  TEXT                   -- 发放日期\n);\n\nINSERT INTO subsidy_list (id, name, id_no, town, amount, pay_date) VALUES\n    (1, '赵小一', 'XN-0000-0001', '青石镇', 1200,  '2026-03-05'),\n    (2, '钱小二', 'XN-0000-0002', '青石镇', 800,   '2026-03-05'),\n    (3, '孙小三', 'XN-0000-0003', '白沙乡', 1500,  '2026-03-06'),\n    (4, '李小四', 'XN-0000-0004', '白沙乡', 600.5, '2026-03-06'),\n    (5, '周小五', 'XN-0000-0005', '红柳镇', 1200,  '2026-03-07'),\n    (6, '吴小六', 'XN-0000-0006', '红柳镇', 950,   '2026-03-07');\n```\n\n执行后点 **Write Changes** 保存。切到 **Browse Data** 页，选 `subsidy_list`，能看到 6 行，像一张 Excel 表。\n\n逐句看：\n\n- `DROP TABLE IF EXISTS subsidy_list;`——如果已有同名表就先删掉。这样脚本可以反复运行，不会报“表已存在”。\n- `CREATE TABLE 表名 ( 列名 类型, ... );`——建表。列之间用逗号隔开，**最后一列后面不加逗号**。\n- `INSERT INTO 表名 (列1, 列2, ...) VALUES (值1, 值2, ...), (...);`——插入数据。值的顺序和前面列的顺序一一对应；文本用**单引号**，数字不加引号；多行之间用逗号，整句最后一个分号。\n- `--` 后面是注释，SQL 不执行，用来写说明。\n\n### 示例查询\n\n在 Execute SQL 页，**选中某一句再按 `Ctrl + Enter`**，就只执行选中的那句。\n\n**查询 1：看整张表**\n\n```sql\nSELECT * FROM subsidy_list;\n```\n\n`SELECT` 表示“我要取数据”，`*` 表示“所有列”，`FROM subsidy_list` 表示“从这张表取”。结果：6 行 6 列。\n\n**查询 2：只看几列**\n\n```sql\nSELECT name, town, amount FROM subsidy_list;\n```\n\n把 `*` 换成列名，列名之间逗号隔开。结果只有姓名、乡镇、金额三列，顺序就按你写的顺序。（下一课专门讲 SELECT。）\n\n**查询 3：数一数有几行**\n\n```sql\nSELECT COUNT(*) FROM subsidy_list;\n```\n\n`COUNT(*)` 数行数，结果是 `6`。拿到一份新名单，先数行数是核查的第一步——和对方说的人数对不上，后面就不用往下做了。\n\n**查询 4：看表结构**\n\n```sql\nPRAGMA table_info(subsidy_list);\n```\n\n`PRAGMA` 是 SQLite 特有的命令，列出每一列的名字和类型（`pk` 为 1 的那列是主键）。忘了列名叫什么时用它查。\n\n### 练习（由易到难）\n\n1. 查出 `subsidy_list` 的全部内容。\n2. 只查姓名和证件号两列。\n3. 青石镇新增一人：序号 7，郑小七，证件号 `XN-0000-0007`，金额 700，发放日期 2026-03-08。写 `INSERT` 插进去，再查姓名和金额，确认一共 7 行。\n4. 新建一张 `staff_list`（在职人员名单），四列：`staff_no`（整数，主键）、`name`（文本）、`id_no`（文本）、`dept`（文本），插入下面 3 行：\n   - 101，冯甲，`XN-0000-0101`，虚构局办公室\n   - 102，孙小三，`XN-0000-0003`，虚构局财务科\n   - 103，陈乙，`XN-0000-0103`，虚构局综合科\n5. 贴近实际：现在库里有两张表——补贴名单和在职名单。分别查出两张表的姓名和证件号，**用眼睛比对**：谁既在补贴名单上、又在在职名单上？想一想：为什么要用证件号比，而不是用姓名比？（几十行可以用眼睛，几万行就得靠 SQL——第 15 课左右的 JOIN 会教一句话搞定。）\n\n### 常见错误\n\n- **中文标点**：`，` `（` `‘` 会报 `syntax error`。SQL 符号一律英文半角，文本内容里的中文没关系。\n- **最后一列后面多了逗号**：`pay_date TEXT,)` 会报错。\n- **文本忘了加引号**：`VALUES (7, 郑小七, ...)` 会报 `no such column: 郑小七`——SQL 把没加引号的字当成了列名。\n- **用了双引号包文本**：SQLite 有时能容忍，但标准写法是单引号，养成习惯。\n- **主键重复**：再插一次 `id = 1` 会报 `UNIQUE constraint failed`。这正是主键的作用。\n- **忘了 Write Changes**：关掉软件后数据没了。\n\n<details>\n<summary>SQL 练习答案<\/summary>\n\n1.\n```sql\nSELECT * FROM subsidy_list;\n```\n\n2.\n```sql\nSELECT name, id_no FROM subsidy_list;\n```\n\n3.\n```sql\nINSERT INTO subsidy_list (id, name, id_no, town, amount, pay_date) VALUES\n    (7, '郑小七', 'XN-0000-0007', '青石镇', 700, '2026-03-08');\n\nSELECT name, amount FROM subsidy_list;\n```\n结果 7 行，最后一行是 郑小七 700.0。\n\n4.\n```sql\nDROP TABLE IF EXISTS staff_list;\n\nCREATE TABLE staff_list (\n    staff_no  INTEGER PRIMARY KEY,\n    name      TEXT,\n    id_no     TEXT,\n    dept      TEXT\n);\n\nINSERT INTO staff_list (staff_no, name, id_no, dept) VALUES\n    (101, '冯甲',   'XN-0000-0101', '虚构局办公室'),\n    (102, '孙小三', 'XN-0000-0003', '虚构局财务科'),\n    (103, '陈乙',   'XN-0000-0103', '虚构局综合科');\n```\n\n5.\n```sql\nSELECT name, id_no FROM subsidy_list;\nSELECT name, id_no FROM staff_list;\n```\n**孙小三**（`XN-0000-0003`）两边都有：在白沙乡领了 1500 元补贴，同时在虚构局财务科在职。\n用证件号比，是因为**姓名会重名、也会写错字**，而证件号对每个人唯一。实际工作中两份名单的姓名往往一样、证件号却不同（重名的两个人），或者姓名有出入、证件号相同（同一人录入时写错了字）——只看姓名两种情况都会判错。\n\n预告：以后一句话就能直接筛出来——\n\n```sql\nSELECT name FROM subsidy_list\nWHERE id_no IN (SELECT id_no FROM staff_list);\n```\n\n今天不要求看懂。\n\n<\/details>\n"};
</script>

  /* 四周期嵌套：按长度比例画四条波，点每一层可以决定是否计入最下面的叠加曲线 */

    }

    var rows = ns.rows.map(function (r, i) {

      return '<button type="button" class="xref" data-act="goto-sec" data-book="' + bid + '" data-n="' + m[1] + '" data-sec="' + m[2] + '">' + (label || ("第" + CN[+m[1]] + "章 §" + idx)) + "</button>";
    }
    if (/^\d+$/.test(ref)) return '<button type="button" class="xref" data-act="open-ch" data-book="' + bid + '" data-n="' + ref + '">' + (label || ("第" + CN[+ref] + "章")) + "</button>";
    return "";
  }
  function switchHTML(bid) {
    var sw = LIB.books[bid].switches, on = S.sw, NODE = {};

    function ok(id) { return id in on ? on[id] : NODE[id].needs.every(ok); }
    function label(id) { if (id in on) { var a = sw.assumptions.filter(function (x) { return x.id === id; })[0]; return a.name; } return NODE[id].name; }
    var cardsA = sw.assumptions.map(function (a, i) {
      var v = on[a.id];
      return '<button type="button" class="asw' + (v ? " on" : " off") + '" data-act="sw" data-id="' + a.id + '" aria-pressed="' + v + '">' +

    function nodeHTML(id) {

      return '<div class="cn' + (holds ? " ok" : " broken") + '"><div class="cn-head"><span class="cn-name">' + esc(x.name) + '</span><span class="cn-st">' + (holds ? "成立" : "断裂") + "</span></div>" +
        '<div class="cn-needs">需要：' + x.needs.map(function (k) { return '<span class="need' + (ok(k) ? "" : " miss") + '">' + esc(label(k)) + "</span>"; }).join("") + "</div>" +
        (fails.length ? '<ul class="cn-why">' + fails.map(function (k) { return "<li>" + esc(x.why[k] || "") + "</li>"; }).join("") + "</ul>" : "") +

      '<div class="asws">' + cardsA + "</div>" +

      nodeHTML("P") + '<div class="arrow" aria-hidden="true"></div><div class="row2">' + nodeHTML("H") + nodeHTML("C") + "</div></div>" +
      '<div class="sw-result"><span class="k">结果</span><p>' + esc(result) + "</p>" + (offs.length ? '<button type="button" class="btn small ghost" data-act="sw-reset">全部打开</button>' : "") + "</div></div>";
  }

  /* ---------- 论证地图 ---------- */
  var MAP_TYPE = { claim: "论点", premise: "前提", evidence: "证据", objection: "反驳" };
  function countNodes(x) { return 1 + x.kids.reduce(function (a, k) { return a + countNodes(k); }, 0); }
  function argmapTab(bid) {
    var root = LIB.books[bid].argmap;

        '<span class="mtype">' + MAP_TYPE[x.t] + '</span><span class="mtext">' + esc(x.text) + (has && !open ? '<span class="mcount">' + (countNodes(x) - 1) + "</span>" : "") + "</span>" + (x.ref ? secLink(bid, x.ref) : "") + "</div>";
      return '<li class="mn t-' + x.t + '">' + row + (has && open ? "<ul>" + x.kids.map(function (k, i) { return nodeHTML(k, key + "." + i, depth + 1); }).join("") + "</ul>" : "") + "</li>";

      (dn.length ? dn.join("、") + "的节点直接连到精读稿的对应单元，其他节点连到章节导读，精读稿写好后会接上。" : "节点连到章节导读。") + "</p>" +
      '<div class="legend">' + Object.keys(MAP_TYPE).map(function (t) { return '<span class="lg t-' + t + '"><span class="mtype">' + MAP_TYPE[t] + "</span></span>"; }).join("") + "</div>" +
      '<div class="seg" role="group" aria-label="展开程度"><button type="button" data-act="map-mode" data-m="trunk" aria-pressed="' + (S.mapMode === "trunk") + '">只看主干</button><button type="button" data-act="map-mode" data-m="all" aria-pressed="' + (S.mapMode === "all") + '">全部展开</button></div></div>' +
      '<div class="mapwrap"><ul class="mtree">' + nodeHTML(root, "r", 0) + "</ul></div>";
  }

  /* ---------- 精读稿（伸缩阅读 + 嵌入自测） ---------- */
  /* 例证来源：书中 / 作者演讲（书外，可对照） / 本页补充 */
  var ESRC = { "书": ["book", "书中"], "演讲": ["talk", "作者演讲"], "补": ["added", "补充"] };
  function secKey(bid, n, sid) { return bid + "-" + n + "-" + sid; }
  function promptHTML(c) {
    var s = S.data.cards[c.id], shown = S.prShown[c.id];
    var meta = s && s.box ? "已进入复习 · 第 " + s.box + " 盒 · 下次 " + s.due : "";
    var h = '<div class="pr" id="pr-' + c.id + '"><p class="pq"><span class="k">自测</span>' + esc(c.f) + "</p>";
    if (!shown) h += '<div class="pr-acts"><button type="button" class="btn small ghost" data-act="pr-show" data-card="' + c.id + '">想好了，看答案</button>' + (meta ? '<span class="meta">' + esc(meta) + "</span>" : "") + "</div>";
    else {
