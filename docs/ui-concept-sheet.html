<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>研习录奇幻界面 · 概念总表（自绘）</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
body{margin:0;background:#E8DCC0;font-family:"Noto Serif SC",serif;color:#241810}
.sheet{width:1600px;margin:0 auto;padding:24px 0 60px}
h1{font-size:30px;margin:0 20px 6px;font-weight:600;letter-spacing:.08em}
.sub{margin:0 20px 18px;font-size:14px;color:#5A4334}
section{margin:0 20px 26px;position:relative}
section h2{font-size:18px;margin:0 0 6px;font-weight:600;letter-spacing:.12em}
section h2 small{font-weight:400;font-size:12.5px;color:#5A4334;margin-left:12px;letter-spacing:0}
svg{display:block;background:#E8DCC0}
text{font-family:"Noto Serif SC",serif}
.hand{font-family:"Ma Shan Zheng","Noto Serif SC",serif}
</style></head><body><div class="sheet">
<h1>研习录奇幻界面 · 概念总表</h1>
<p class="sub">自己用 SVG 按圣经的规矩画的：深褐描边、固有色加暗部加高光三档、左上单一暖光、全张纸纹。目的是把要做的物件和风格一次摆齐给人看，不是成品；成品由这张表当样式图去生图再抠底。</p>
<div id="root"></div>
</div>
<script>
const P={paper:'#E8DCC0',paperL:'#F3EBD6',paperD:'#D4C4A0',olive:'#5E6B3A',oliveL:'#7C8A4E',oliveD:'#3F4A26',red:'#7A2E2A',redL:'#9A4038',redD:'#561E1C',brass:'#B8923E',brassL:'#D4B261',brassD:'#8A6A28',ink:'#3B2A1E',inkL:'#5A4334',inkD:'#241810',wood:'#8A5A32',woodL:'#A9773F',woodD:'#5A3A1E',wax:'#8E2F2B',waxL:'#B04A40',waxD:'#5E1D1A',glass:'#CFD8C8'};
const C={paper:[P.paper,P.paperL,P.paperD],olive:[P.olive,P.oliveL,P.oliveD],red:[P.red,P.redL,P.redD],brass:[P.brass,P.brassL,P.brassD],ink:[P.ink,P.inkL,P.inkD],wood:[P.wood,P.woodL,P.woodD],wax:[P.wax,P.waxL,P.waxD],kraft:['#C9A96E','#DCC08A','#A98650']};
let uid=0;const id=()=>'u'+(uid++);
const OL=(w=3,o=.88)=>`stroke="${P.inkD}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="${o}"`;
const HL=(w=3,o=.55)=>`stroke="${P.paperL}" stroke-width="${w}" stroke-linecap="round" stroke-opacity="${o}" fill="none"`;
function defs(){return `<defs>
<filter id="wob" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer></filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="woodg" width="90" height="14" patternUnits="userSpaceOnUse"><path d="M0 4q22 -4 45 0t45 0M0 11q30 3 60 -1t30 1" fill="none" stroke="${P.woodD}" stroke-width="1.3" opacity=".35"/><path d="M8 7q20 2 40 -1" fill="none" stroke="${P.woodL}" stroke-width="1" opacity=".35"/></pattern>
<pattern id="leath" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="${P.inkD}" opacity=".16"/><circle cx="6.5" cy="6.5" r=".9" fill="${P.paperL}" opacity=".14"/></pattern>
<pattern id="cloth" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 4h8M4 0v8" stroke="${P.inkD}" stroke-width=".8" opacity=".12"/></pattern>
<pattern id="paperf" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M5 20l18 -3M30 45l14 2M40 10l9 6M12 50l7 -6" stroke="${P.inkD}" stroke-width=".8" opacity=".08" stroke-linecap="round"/><circle cx="48" cy="30" r="1" fill="${P.inkD}" opacity=".07"/></pattern>
<linearGradient id="brassg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P.brassL}"/><stop offset=".45" stop-color="${P.brass}"/><stop offset="1" stop-color="${P.brassD}"/></linearGradient>
<radialGradient id="lampg"><stop offset="0" stop-color="#F4C76A" stop-opacity=".85"/><stop offset="1" stop-color="#F4C76A" stop-opacity="0"/></radialGradient>
<radialGradient id="glassg" cx=".35" cy=".3"><stop offset="0" stop-color="#FFF" stop-opacity=".55"/><stop offset=".5" stop-color="${P.glass}" stop-opacity=".25"/><stop offset="1" stop-color="${P.oliveD}" stop-opacity=".25"/></radialGradient>
</defs>`}
const TEX={wood:'url(#woodg)',leather:'url(#leath)',cloth:'url(#cloth)',paper:'url(#paperf)'};
// 三档厚涂盒：固有色 + 右下暗部 + 左上高光 + 描边；tex 叠材质
function box3(x,y,w,h,c,o={}){const r=o.r??6,b=o.b??Math.max(4,Math.min(w,h)*0.16),k=id();
return `<clipPath id="${k}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/></clipPath><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c[0]}"/><g clip-path="url(#${k})">${o.tex?`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.tex}"/>`:''}<rect x="${x+w-b}" y="${y}" width="${b}" height="${h}" fill="${c[2]}" opacity=".8"/><rect x="${x}" y="${y+h-b}" width="${w}" height="${b}" fill="${c[2]}" opacity=".8"/><rect x="${x}" y="${y}" width="${w}" height="${b*.45}" fill="${c[1]}" opacity=".75"/><rect x="${x}" y="${y}" width="${b*.4}" height="${h}" fill="${c[1]}" opacity=".5"/></g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" ${OL(o.sw??3)}/>`}
function rivet(x,y,r=4){return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#brassg)" ${OL(1.6)}/><circle cx="${x-r*.3}" cy="${y-r*.3}" r="${r*.3}" fill="${P.paperL}" opacity=".8"/>`}
function corner(x,y,s,q){const t=s*.42,p=`M0 0h${s}v${t}h${-(s-t)}v${s-t}h${-t}z`;return `<g transform="translate(${x} ${y}) rotate(${q*90})"><path d="${p}" fill="url(#brassg)" ${OL(2.2)}/><path d="M${t*.35} ${t*.35}h${s-t*.7-t*.3}" ${HL(1.6,.5)}/>${rivet(t*.5,t*.5,2.6)}${rivet(s-t*.7,t*.5,2.6)}${rivet(t*.5,s-t*.7,2.6)}</g>`}
function clasp(x,y,w=22,h=30){return `${box3(x,y,w,h,C.brass,{r:4,sw:2})}<rect x="${x+w*.3}" y="${y+h*.35}" width="${w*.4}" height="${h*.3}" rx="2" fill="${P.inkD}" opacity=".6"/>`}
function seal(x,y,r=16){const k=id();return `<path d="M${x-r} ${y}q${r*.1} ${-r*1.1} ${r} ${-r}t${r} ${r}q${-r*.2} ${r*1.15} ${-r} ${r}t${-r} ${-r}z" fill="${P.wax}" ${OL(2.4)}/><circle cx="${x}" cy="${y}" r="${r*.62}" fill="none" stroke="${P.waxD}" stroke-width="1.6"/><text x="${x}" y="${y+r*.3}" text-anchor="middle" font-size="${r*.9}" fill="${P.waxD}" class="hand">研</text><circle cx="${x-r*.45}" cy="${y-r*.5}" r="${r*.22}" fill="${P.waxL}" opacity=".9"/>`}
function hl(x1,y1,x2,y2,w=3,o=.55){return `<path d="M${x1} ${y1}L${x2} ${y2}" ${HL(w,o)}/>`}
function shadow(x,y,w,h){return `<ellipse cx="${x+w/2}" cy="${y+h}" rx="${w*.55}" ry="${h*.08+3}" fill="${P.inkD}" opacity=".18" filter="url(#soft)"/>`}
function label(x,y,t,s=12.5){return `<text x="${x}" y="${y}" font-size="${s}" fill="${P.inkL}" text-anchor="middle">${t}</text>`}
// 书：书脊（放架上）
function spine(x,y,w,h,c,bands=true,lean=0){const g=`${box3(x,y,w,h,c,{r:2,sw:2.2,b:Math.max(3,w*.22),tex:TEX.leather})}${bands?`<rect x="${x+1}" y="${y+h*.14}" width="${w-2}" height="${h*.05}" fill="url(#brassg)" opacity=".9"/><rect x="${x+1}" y="${y+h*.78}" width="${w-2}" height="${h*.05}" fill="url(#brassg)" opacity=".9"/><rect x="${x+w*.2}" y="${y+h*.28}" width="${w*.6}" height="${h*.3}" fill="${P.paper}" ${OL(1,.6)}/>`:''}`;return lean?`<g transform="rotate(${lean} ${x+w/2} ${y+h})">${g}</g>`:g}
// 书：正面封面
function cover(x,y,w,h,c,title){return `${box3(x,y,w,h,c,{r:5,sw:3,tex:TEX.leather})}<rect x="${x+6}" y="${y+6}" width="${w-12}" height="${h-12}" rx="3" fill="none" stroke="${P.brass}" stroke-width="1.6" opacity=".8"/>${corner(x,y,w*.22,0)}${corner(x+w,y,w*.22,1)}${corner(x+w,y+h,w*.22,2)}${corner(x,y+h,w*.22,3)}<rect x="${x+w*.22}" y="${y+h*.3}" width="${w*.56}" height="${h*.2}" rx="3" fill="${P.paper}" ${OL(1.8)}/><text x="${x+w/2}" y="${y+h*.44}" text-anchor="middle" font-size="${h*.09}" fill="${P.inkD}">${title}</text>${clasp(x+w-9,y+h*.42,16,h*.16)}`}
// 立起的一摞 + 平放
function bookStack(x,y){return `${box3(x,y+40,70,12,C.olive,{r:2,sw:2})}${box3(x+4,y+28,66,12,C.red,{r:2,sw:2})}${box3(x+2,y+16,62,12,C.kraft,{r:2,sw:2})}`}
// 档案夹：state = open | closed | sealed | ghost。背板带签、前板、纸签牌、右侧皮带与搭扣；封存时皮带上盖蜡封；待归位时前板翻开、纸角伸出
function folder(x,y,w,h,state,title,n,m){
if(state==='ghost')return `<rect x="${x}" y="${y+14}" width="${w}" height="${h-14}" rx="6" fill="none" stroke="${P.inkL}" stroke-width="2" stroke-dasharray="7 6" opacity=".6"/><text x="${x+w/2}" y="${y+h/2+8}" text-anchor="middle" font-size="13" fill="${P.inkL}" opacity=".7">还没立卷</text>`;
const tw=w*.4,th=14,open=state==='open';let s=shadow(x,y,w,h);
s+=`<path d="M${x+2} ${y+th+2}l4 -${th}h${tw-10}l4 ${th}z" fill="${C.kraft[1]}" ${OL(2.4)}/><text x="${x+tw/2}" y="${y+th-2}" text-anchor="middle" font-size="9.5" fill="${P.inkD}">${open?'待归位':'卷'}</text>`;
s+=box3(x,y+th,w,h-th,[C.kraft[2],C.kraft[0],P.woodD],{r:5,sw:2.6,b:8});
// 夹着的纸
const papers=open?3:2;for(let i=0;i<papers;i++)s+=`<rect x="${x+10+i*5}" y="${y+th+(open?-10-i*7:6+i*3)}" width="${w-26}" height="${h-th-10}" rx="2" fill="${i%2?P.paperL:P.paper}" ${OL(1.8)} transform="rotate(${open?-3+i*2:0} ${x+w/2} ${y+h})"/>`;
if(open)s+=`<path d="M${x+22} ${y+16}h40M${x+22} ${y+28}h26" stroke="${P.inkL}" stroke-width="2" opacity=".55"/>`;
// 前板
const fy=y+th+10,fh=h-th-10;const front=`${box3(x,fy,w,fh,C.kraft,{r:5,sw:2.8,b:9,tex:TEX.paper})}<rect x="${x+10}" y="${fy+fh*.26}" width="${w*.68}" height="${fh*.3}" rx="3" fill="${P.paper}" ${OL(1.8)}/><text x="${x+16}" y="${fy+fh*.26+17}" font-size="11" fill="${P.inkD}">${title}</text><text x="${x+16}" y="${fy+fh*.26+33}" font-size="10" fill="${P.inkL}">读了 ${n} / ${m}</text>`;
s+=open?`<g transform="rotate(-9 ${x} ${y+h})">${front}</g>`:front;
if(!open){s+=`<rect x="${x+w-20}" y="${fy-2}" width="14" height="${fh+4}" rx="3" fill="${P.red}" ${OL(2.2)}/><rect x="${x+w-20}" y="${fy-2}" width="14" height="${fh+4}" fill="url(#leath)" opacity=".6"/><path d="M${x+w-17} ${fy+4}v${fh-10}" ${HL(1.6,.35)}/>`;
 s+=state==='sealed'?`<path d="M${x+w-13} ${fy+fh*.2}q-${w*.45} ${fh*.3} 0 ${fh*.6}" fill="none" stroke="${P.red}" stroke-width="6"/>${seal(x+w-13,fy+fh*.5,15)}`:clasp(x+w-24,fy+fh*.44,22,26)}
return s}
// 抽屉柜
function cabinet(x,y,w,h,cols=2,rows=3){let s=`${shadow(x,y,w,h)}${box3(x,y,w,h,C.wood,{r:5,sw:3.5,tex:TEX.wood})}<rect x="${x-6}" y="${y-8}" width="${w+12}" height="12" rx="3" fill="${P.woodL}" ${OL(3)}/>`;const pw=(w-10*(cols+1))/cols,ph=(h-18-10*(rows+1))/rows;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const px=x+10+c*(pw+10),py=y+14+r*(ph+10);s+=`${box3(px,py,pw,ph,C.wood,{r:3,sw:2.2,b:5,tex:TEX.wood})}<rect x="${px+pw*.2}" y="${py+ph*.22}" width="${pw*.6}" height="${ph*.28}" rx="2" fill="${P.paper}" stroke="${P.brass}" stroke-width="2"/><rect x="${px+pw*.42}" y="${py+ph*.62}" width="${pw*.16}" height="${ph*.16}" rx="3" fill="url(#brassg)" ${OL(1.6)}/>`}
return s+`<rect x="${x+8}" y="${y+h}" width="12" height="10" fill="${P.woodD}" ${OL(2)}/><rect x="${x+w-20}" y="${y+h}" width="12" height="10" fill="${P.woodD}" ${OL(2)}/>`}
// 拱形书柜
function bookcase(x,y,w,h,shelves=4){const aw=w*.5,k=id();let s=`${shadow(x,y,w,h)}<path d="M${x} ${y+h}V${y+aw*.9}A${aw} ${aw*.9} 0 0 1 ${x+w} ${y+aw*.9}V${y+h}z" fill="${P.wood}" ${OL(4)}/><clipPath id="${k}"><path d="M${x} ${y+h}V${y+aw*.9}A${aw} ${aw*.9} 0 0 1 ${x+w} ${y+aw*.9}V${y+h}z"/></clipPath><g clip-path="url(#${k})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#woodg)"/><rect x="${x+w*.84}" y="${y}" width="${w*.16}" height="${h}" fill="${P.woodD}" opacity=".7"/><rect x="${x}" y="${y}" width="${w*.08}" height="${h}" fill="${P.woodL}" opacity=".5"/></g>`;
const ix=x+w*.1,iw=w*.8,iy=y+aw*.55,ih=h-aw*.55-w*.12;s+=`<path d="M${ix} ${iy+ih}V${iy+iw*.45}A${iw/2} ${iw*.45} 0 0 1 ${ix+iw} ${iy+iw*.45}V${iy+ih}z" fill="${P.woodD}" ${OL(3)}/>`;
const sh=ih/shelves;for(let i=1;i<=shelves;i++){const sy=iy+i*sh;s+=`<rect x="${ix-4}" y="${sy-8}" width="${iw+8}" height="9" rx="2" fill="${P.woodL}" ${OL(2.2)}/>`;// 每层放书
let bx=ix+8;const cols=[C.olive,C.red,C.kraft,C.ink,C.brass];let j=0;while(bx<ix+iw-20){const bw=9+((i*7+j*5)%9),bh=sh*.62+((j*13+i*5)%12);s+=spine(bx,sy-8-bh,bw,bh,cols[(i+j)%5],j%2==0,0);bx+=bw+2;j++;if(j%6==5)bx+=16}}
s+=`<path d="M${x+w/2-12} ${y+2}l12 -14l12 14z" fill="url(#brassg)" ${OL(2.2)}/><rect x="${x-8}" y="${y+h-10}" width="${w+16}" height="16" rx="3" fill="${P.woodD}" ${OL(3)}/>`;
s+=`<g transform="translate(${x+w*.08} ${y+h*.42})">${candle(0,0,.7)}</g><g transform="translate(${x+w*.92} ${y+h*.42})">${candle(0,0,.7)}</g>`;return s}
function candle(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-44" r="26" fill="url(#lampg)"/><path d="M-10 0h20v-34h-20z" fill="${P.paperL}" ${OL(2.5)}/><path d="M-7 -4v-26" ${HL(2.5,.7)}/><path d="M0 -36q-9 -12 0 -24q9 12 0 24z" fill="#F0B848" ${OL(1.8,.7)}/><path d="M0 -42q-3 -5 0 -10q3 5 0 10z" fill="${P.paperL}"/><path d="M-18 0h36l-4 8h-28z" fill="url(#brassg)" ${OL(2.2)}/></g>`}
function lamp(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-70" r="60" fill="url(#lampg)"/><ellipse cx="0" cy="0" rx="26" ry="7" fill="url(#brassg)" ${OL(2.4)}/><rect x="-5" y="-30" width="10" height="30" fill="url(#brassg)" ${OL(2)}/><path d="M-16 -30h32l-6 -14h-20z" fill="url(#brassg)" ${OL(2.2)}/><path d="M-14 -44q0 -40 14 -62q14 22 14 62z" fill="#F2C778" ${OL(2.6)} opacity=".95"/><path d="M-6 -50q0 -30 6 -46" ${HL(3,.65)}/><path d="M-20 -44h40l-4 6h-32z" fill="url(#brassg)" ${OL(2)}/><path d="M-8 -106q8 -10 16 0" fill="none" ${OL(2.4)}/></g>`}
function quill(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})">${box3(-16,-20,32,22,C.ink,{r:4,sw:2.4})}<rect x="-10" y="-28" width="20" height="10" rx="2" fill="url(#brassg)" ${OL(2)}/><path d="M2 -14l10 -70q22 -14 28 -40q-30 20 -40 48l-6 62z" fill="${P.paperL}" ${OL(2.6)}/><path d="M8 -20l16 -74" stroke="${P.inkL}" stroke-width="1.8" opacity=".6"/><path d="M4 -16l4 -20" stroke="${P.inkD}" stroke-width="3"/></g>`}
function stamp(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-10 -40q0 -30 10 -30t10 30q0 10 6 16h-32q6 -6 6 -16z" fill="${P.wood}" ${OL(2.6)}/><path d="M-3 -62q0 -8 3 -8" ${HL(2.4,.6)}/>${box3(-20,-24,40,14,C.brass,{r:3,sw:2.2})}<path d="M-18 -8q18 -8 36 0q-10 10 -18 10t-18 -10z" fill="${P.wax}" ${OL(2.2)}/><text x="0" y="0" text-anchor="middle" font-size="9" fill="${P.waxD}" class="hand">引</text></g>`}
function magnifier(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M18 18l26 30" stroke="${P.woodD}" stroke-width="12" stroke-linecap="round"/><path d="M18 18l26 30" stroke="${P.wood}" stroke-width="8" stroke-linecap="round"/><circle cx="0" cy="0" r="26" fill="url(#glassg)" stroke="url(#brassg)" stroke-width="8"/><circle cx="0" cy="0" r="30" fill="none" ${OL(2.2)}/><circle cx="0" cy="0" r="22" fill="none" ${OL(1.4,.5)}/><path d="M-14 -8q4 -10 14 -12" ${HL(3,.8)}/></g>`}
function hourglass(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-24" y="-60" width="48" height="8" rx="3" fill="url(#brassg)" ${OL(2.2)}/><rect x="-24" y="52" width="48" height="8" rx="3" fill="url(#brassg)" ${OL(2.2)}/><path d="M-18 -52q0 30 16 52q-16 22 -16 52h36q0 -30 -16 -52q16 -22 16 -52z" fill="url(#glassg)" ${OL(2.4)}/><path d="M-10 20q10 -6 20 0l6 32h-32z" fill="${P.brassL}" ${OL(1.4,.5)}/><path d="M-6 -46q0 20 6 36q6 -16 6 -36z" fill="${P.brassL}" opacity=".9"/><path d="M-20 -52v104M20 -52v104" stroke="url(#brassg)" stroke-width="4"/></g>`}
function globe(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="50" rx="26" ry="7" fill="url(#brassg)" ${OL(2.2)}/><rect x="-4" y="30" width="8" height="18" fill="url(#brassg)" ${OL(1.8)}/><path d="M-30 -10a32 32 0 1 0 60 0" fill="none" stroke="url(#brassg)" stroke-width="6"/><circle cx="0" cy="0" r="30" fill="${P.olive}" ${OL(2.6)}/><path d="M-20 -8q10 -14 24 -6t10 20q-14 10 -26 -2t-8 -12z" fill="${P.kraft?C.kraft[0]:P.paperD}" opacity=".9"/><path d="M-12 -22q10 -6 22 0" ${HL(3,.6)}/><circle cx="0" cy="0" r="30" fill="none" stroke="${P.oliveD}" stroke-width="7" opacity=".35" stroke-dasharray="0 120 60 0"/></g>`}
function fern(x,y,s=1){let l='';for(let i=0;i<7;i++){const a=-110+i*32;l+=`<path d="M0 0q${Math.cos(a*Math.PI/180)*30} ${Math.sin(a*Math.PI/180)*30-20} ${Math.cos(a*Math.PI/180)*60} ${Math.sin(a*Math.PI/180)*60-30}" fill="none" stroke="${i%2?P.oliveL:P.olive}" stroke-width="9" stroke-linecap="round"/><path d="M0 0q${Math.cos(a*Math.PI/180)*30} ${Math.sin(a*Math.PI/180)*30-20} ${Math.cos(a*Math.PI/180)*60} ${Math.sin(a*Math.PI/180)*60-30}" fill="none" ${OL(1.6,.7)}/>`}
return `<g transform="translate(${x} ${y}) scale(${s})">${l}<path d="M-22 0h44l-6 36h-32z" fill="${P.red}" ${OL(2.6)}/><path d="M-26 -4h52v10h-52z" fill="${P.redL}" ${OL(2.2)}/><path d="M-14 8v22" ${HL(3,.5)}/></g>`}
// 卡
