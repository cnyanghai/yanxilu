<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>进场动效灰盒原型</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1a1026; color: #d9d2e6; font: 14px/1.5 system-ui, "Noto Sans SC", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2e2240; }
  header b { margin-right: 8px; }
  button { background: #2a1c3d; color: #e8e2f2; border: 1px solid #4a3666; border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  button.on { background: #4a2e6b; border-color: #7a4fa6; }
  #t { font-variant-numeric: tabular-nums; margin-left: auto; opacity: .8; }
  main { padding: 12px 16px; }
  canvas { display: block; width: 100%; max-width: 960px; background: #000; border-radius: 8px; }
  p.note { max-width: 960px; opacity: .75; }
</style>
</head>
<body>
<header>
  <b>灰盒原型</b>
  <button data-seq="shelf">书架</button>
  <button data-seq="archive">档案柜</button>
  <button data-seq="notes">笔记本</button>
  <span style="width:12px"></span>
  <button id="replay">重放</button>
  <button id="short">短版 0.8 秒</button>
  <button id="half">半速</button>
  <span id="t">t = 0.00 s</span>
</header>
<main>
  <canvas id="c" width="960" height="540"></canvas>
  <p class="note">只有形状与时间，没有美术。点画面一下跳到终态；终态后：书架点一本书看打开，档案柜点一座碑看卡片圆弧摆开，笔记本点一只手看本子递上来。地址加 <code>?seq=archive&amp;t=1.2</code> 定格某一刻，<code>?board=1</code> 出分镜图。</p>
</main>
<script>
(() => {
const W = 960, H = 540, GROUND = 440;
const q = new URLSearchParams(location.search);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeInOutSine = u => -(Math.cos(Math.PI * u) - 1) / 2;
const easeOutBack = u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const seg = (t, a, d) => clamp((t - a) / d);
function rng(seed) { let s = seed >>> 0; return () => { s += 0x6D2B79F5; let r = Math.imul(s ^ (s >>> 15), 1 | s); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const GREEN = '#5cf08e', AMBER = '#f0b54a', BONE = '#e6dfc8', STONE = '#5c6382', STONE_D = '#3a3f58', WOOD = '#120c1a', WOOD_L = '#241a30';

// 固定的场景数据（有种子，截图可复现）
const R = rng(7);
const STARS = Array.from({ length: 40 }, () => ({ x: R() * W, y: R() * 260, r: R() * 1.1 + .3, a: R() * .5 + .2 }));
const FAR = Array.from({ length: 9 }, (_, i) => ({ x: 40 + i * 110 + R() * 40, w: 26 + R() * 14, h: 30 + R() * 26 }));
const NB = Number(q.get('n') || 21);
const BOOKS = Array.from({ length: NB }, (_, k) => ({ k, h: 46 + R() * 26, hue: [25, 150, 225][k % 3], sat: 22 + R() * 14, edge: R(), s2: R() }));
const NAMES = ['史料', '手艺', '游记', '札记', '杂'];
const TLAY = [[60, 0, 118, 176, -3], [236, 1, 90, 136, 5], [392, 0, 128, 200, 2], [586, 1, 82, 124, -6], [716, 0, 104, 156, 4]]; // x, 后排, 宽, 高, 倾斜度
const TOMBS = [6, 3, 9, 2, 5].map((n, i) => { const [x, back, w, h, tilt] = TLAY[i]; return { n, name: NAMES[i], x, w, h, back: !!back, sc: back ? .78 : 1, by: back ? GROUND - 22 : GROUND, tilt: tilt * Math.PI / 180, cards: Array.from({ length: n }, () => ({ e: R(), s: R() })) }; });
const ARMS = [['随手本', 190, 25, 1.18, -4, 0], ['摘抄册', 330, 150, .9, 7, 1], ['读书札记', 540, 225, 1.02, -8, 0], ['＋ 新本子', 720, -1, .84, 10, 1]].map(([n, x, hue, k, tilt, back], i) => ({ n, x, hue, k, tilt: tilt * Math.PI / 180, back: !!back, by: back ? GROUND - 18 : GROUND, j: R() }));

function edgePoint(e, s) { if (e < .33) return { x: -30, y: 80 + s * 300 }; if (e < .66) return { x: W + 30, y: 80 + s * 300 }; return { x: 60 + s * (W - 120), y: GROUND + 20 }; }

function background(ctx, t, shake) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a1840'); g.addColorStop(.55, '#4a2e6b'); g.addColorStop(1, '#1a1026');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(shake.x, shake.y);
  // 硬边的云块
  ctx.fillStyle = '#5a3a7e'; ctx.globalAlpha = .55;
  [[60, 90, 260, 70], [420, 40, 300, 60], [700, 120, 240, 50], [200, 180, 180, 40]].forEach(([x, y, w, h]) => { ctx.beginPath(); ctx.ellipse(x + w / 2 + Math.sin(t * .2) * 6, y + h / 2, w / 2, h / 2, 0, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  for (const s of STARS) { ctx.globalAlpha = s.a; ctx.fillStyle = '#e8ddff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // 压顶的枯枝（剪影）
  ctx.strokeStyle = WOOD; ctx.lineCap = 'round';
  const br = (x, y, a, l, w, d) => { if (d === 0 || l < 6) return; const x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke(); br(x2, y2, a + .5, l * .68, w * .65, d - 1); br(x2, y2, a - .45, l * .7, w * .65, d - 1); };
  br(-10, 20, .55, 120, 14, 5); br(W + 10, 10, 2.5, 130, 14, 5); br(W * .62, -10, 1.9, 70, 9, 4);
  // 远处的宅子与碑林剪影
  ctx.fillStyle = '#1e1430';
  ctx.beginPath(); ctx.moveTo(560, GROUND - 60); ctx.lineTo(560, GROUND - 150); ctx.lineTo(600, GROUND - 190); ctx.lineTo(640, GROUND - 150); ctx.lineTo(640, GROUND - 120); ctx.lineTo(700, GROUND - 120); ctx.lineTo(700, GROUND - 60); ctx.closePath(); ctx.fill();
  ctx.fillStyle = AMBER; ctx.globalAlpha = .8; [[575, GROUND - 130], [600, GROUND - 150], [625, GROUND - 130], [665, GROUND - 100]].forEach(([x, y]) => ctx.fillRect(x, y, 6, 9)); ctx.globalAlpha = 1;
  ctx.fillStyle = '#1e1430';
  for (const f of FAR) { ctx.beginPath(); ctx.moveTo(f.x, GROUND); ctx.lineTo(f.x, GROUND - f.h + f.w / 2); ctx.arc(f.x + f.w / 2, GROUND - f.h + f.w / 2, f.w / 2, Math.PI, 0); ctx.lineTo(f.x + f.w, GROUND); ctx.fill(); }
  // 绿雾
  for (let i = 0; i < 4; i++) { ctx.globalAlpha = .12; ctx.fillStyle = GREEN; ctx.beginPath(); ctx.ellipse(200 + i * 220 + Math.sin(t * .4 + i) * 30, GROUND - 8 - i * 6, 280, 24, 0, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#120c1a'; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.strokeStyle = '#2e2240'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-20, GROUND + 1); ctx.lineTo(W + 20, GROUND + 1); ctx.stroke();
  ctx.restore();
}

function dirt(ctx, t, t0, cx, cy, n, spread, seed) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const b = t0 + r() * .5, life = .7 + r() * .4, u = (t - b) / life; const vx = (r() - .5) * spread, vy = -(80 + r() * 160), x0 = cx + (r() - .5) * spread;
    if (u < 0 || u > 1) continue; const tt = u * life;
    ctx.globalAlpha = (1 - u) * .9; ctx.fillStyle = '#3a2a2a'; ctx.beginPath(); ctx.arc(x0 + vx * tt, cy + vy * tt + 420 * tt * tt, 2 + r() * 2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function tombShape(ctx, x, y, w, h) { ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + w / 2); ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); }
function gothicShape(ctx, x, y, w, h) { const k = w * .62; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + k); ctx.quadraticCurveTo(x + w * .08, y + k * .25, x + w / 2, y); ctx.quadraticCurveTo(x + w * .92, y + k * .25, x + w, y + k); ctx.lineTo(x + w, y + h); ctx.closePath(); }
function wisp(ctx, x, y, a, trail) {
  for (let i = trail.length - 1; i >= 0; i--) { const p = trail[i]; ctx.globalAlpha = a * (1 - i / trail.length) * .35; ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(p.x, p.y, 7 - i, 0, 7); ctx.fill(); }
  ctx.globalAlpha = a; const g = ctx.createRadialGradient(x, y, 0, x, y, 14); g.addColorStop(0, '#f2ffe8'); g.addColorStop(.4, GREEN); g.addColorStop(1, 'rgba(92,240,142,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}
function candle(ctx, x, y, lit) { ctx.fillStyle = WOOD_L; ctx.fillRect(x - 3, y - 26, 6, 26); if (!lit) return; const g = ctx.createRadialGradient(x, y - 32, 0, x, y - 32, 34); g.addColorStop(0, 'rgba(240,181,74,.9)'); g.addColorStop(1, 'rgba(240,181,74,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 32, 34, 0, 7); ctx.fill(); ctx.fillStyle = '#fff1c0'; ctx.beginPath(); ctx.ellipse(x, y - 31, 3, 6, 0, 0, 7); ctx.fill(); }
function eyes(ctx, x, y, open) { if (open <= 0) return; ctx.fillStyle = GREEN; ctx.globalAlpha = open; ctx.beginPath(); ctx.ellipse(x - 9, y, 5, 3 * open, 0, 0, 7); ctx.ellipse(x + 9, y, 5, 3 * open, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }

// —— 书架：哥特尖拱书架钻出，幽灵凝成书 ——
const SHELF = { x: 270, w: 420, h: 400, rows: 3, cols: 7 };
function slotOf(k) { const row = Math.floor(k / SHELF.cols), col = k % SHELF.cols; const innerX = SHELF.x + 30, innerW = SHELF.w - 60, cw = innerW / SHELF.cols; const rowY = GROUND - SHELF.h + 150 + row * 90 + 80; return { x: innerX + col * cw + cw / 2, y: rowY, cw }; }
function renderShelf(ctx, t, short) {
  const shake = (!short && t < .3) ? { x: Math.sin(t * 80) * 3 * (1 - t / .3), y: Math.cos(t * 70) * 2 * (1 - t / .3) } : { x: 0, y: 0 };
  background(ctx, t, shake);
  const p = short ? 1 : easeOutCubic(seg(t, .3, 1.3));
  const settle = (!short && t > 3.4) ? Math.sin((t - 3.4) * 18) * 3 * Math.max(0, 1 - (t - 3.4) / .4) : 0;
  const dy = (1 - p) * (SHELF.h + 10) + settle, tremble = short ? 0 : Math.sin(t * 60) * 7 * (1 - p);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GROUND); ctx.clip(); ctx.translate(tremble + shake.x, dy + shake.y);
  const top = GROUND - SHELF.h;
  ctx.fillStyle = WOOD; gothicShape(ctx, SHELF.x, top, SHELF.w, SHELF.h); ctx.fill(); ctx.strokeStyle = '#4a3666'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = '#3b2a52'; ctx.lineWidth = 2; gothicShape(ctx, SHELF.x + 16, top + 18, SHELF.w - 32, SHELF.h - 30); ctx.stroke();
  // 窗花格
  ctx.beginPath(); ctx.arc(SHELF.x + SHELF.w / 2, top + 110, 46, Math.PI, 0); ctx.moveTo(SHELF.x + SHELF.w / 2 - 46, top + 110); ctx.lineTo(SHELF.x + SHELF.w / 2 + 46, top + 110); ctx.moveTo(SHELF.x + SHELF.w / 2, top + 64); ctx.lineTo(SHELF.x + SHELF.w / 2, top + 110); ctx.stroke();
  ctx.fillStyle = '#0b0712'; ctx.fillRect(SHELF.x + 22, top + 150, SHELF.w - 44, SHELF.h - 170);
  ctx.fillStyle = WOOD_L; for (let r = 0; r < SHELF.rows; r++) ctx.fillRect(SHELF.x + 22, top + 150 + r * 90 + 80, SHELF.w - 44, 8);
  ctx.fillStyle = BONE; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('手艺', SHELF.x + SHELF.w / 2, top + 140);
  const lit = short ? 1 : seg(t, 1.5, .2); candle(ctx, SHELF.x - 14, top + 230, lit > .5); candle(ctx, SHELF.x + SHELF.w + 14, top + 230, lit > .5);
  // 书：到位后出现
  const ghostStart = short ? 0 : 1.6, gap = short ? .012 : .04, dur = short ? .5 : 1.0;
  for (const b of BOOKS) { const arrive = ghostStart + b.k * gap + dur, u = seg(t, arrive, .25); if (u <= 0) continue; const s = slotOf(b.k); ctx.globalAlpha = u; ctx.fillStyle = `hsl(${b.hue} ${b.sat}% 26%)`; ctx.fillRect(s.x - 10, s.y - b.h, 20, b.h); ctx.fillStyle = AMBER; ctx.globalAlpha = u * .7; ctx.fillRect(s.x - 10, s.y - b.h + 8, 20, 1.5); ctx.fillRect(s.x - 10, s.y - 10, 20, 1.5); ctx.globalAlpha = 1; const f = 1 - seg(t, arrive, .35); if (f > 0) { ctx.globalAlpha = f * .8; ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(s.x, s.y - b.h / 2, 16 * (1 + (1 - f)), 0, 7); ctx.fill(); ctx.globalAlpha = 1; } }
  // 乌鸦落顶
  const crow = short ? 1 : seg(t, 3.2, .3); if (crow > 0) { const cy = top - 6 - (1 - easeOutCubic(crow)) * 60; ctx.fillStyle = WOOD; ctx.beginPath(); ctx.ellipse(SHELF.x + SHELF.w / 2, cy, 10, 6, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(SHELF.x + SHELF.w / 2 + 9, cy - 5, 4, 0, 7); ctx.fill(); }
  ctx.restore();
  if (!short) dirt(ctx, t, .3, SHELF.x + SHELF.w / 2, GROUND, 60, SHELF.w + 40, 11);
  for (const b of BOOKS) { const dep = ghostStart + b.k * gap, u = (t - dep) / dur; if (u < 0 || u > 1) continue; const from = edgePoint(b.edge, b.s2), s = slotOf(b.k), to = { x: s.x, y: s.y - b.h / 2 + dy }; const trail = []; for (let i = 0; i < 6; i++) { const uu = clamp(u - i * .04), e = easeInOutSine(uu); const x = lerp(from.x, to.x, e), y = lerp(from.y, to.y, e) + Math.sin(uu * 9 + b.k) * 22 * (1 - uu); trail.push({ x, y }); } wisp(ctx, trail[0].x, trail[0].y, clamp(u * 4) * clamp((1 - u) * 6 + .2), trail.slice(1)); }
  return short ? .8 : 3.8;
}
function hitBook(x, y) { for (const b of BOOKS) { const s = slotOf(b.k); if (Math.abs(x - s.x) < 11 && y < s.y && y > s.y - b.h) return b; } return null; }
function renderOpen(ctx, b, u) {
  const s = slotOf(b.k); const e = easeOutCubic(clamp(u / .5)); const cx = lerp(s.x, W / 2, e), cy = lerp(s.y - b.h / 2, 250, e), sc = lerp(1, 3.2, e);
  ctx.fillStyle = `rgba(0,0,0,${.6 * e})`; ctx.fillRect(0, 0, W, H);
  const w = 20 * sc, h = b.h * sc; ctx.save(); ctx.translate(cx, cy);
  const o = clamp((u - .5) / .5);
  ctx.fillStyle = BONE; if (o > 0) { ctx.fillRect(-w * 2.2 * o, -h / 2, w * 2.2 * o, h); ctx.fillRect(0, -h / 2, w * 2.2 * o, h); ctx.strokeStyle = '#b9a98a'; ctx.strokeRect(-w * 2.2 * o, -h / 2, w * 4.4 * o, h); }
  ctx.fillStyle = `hsl(${b.hue} ${b.sat}% 26%)`; ctx.fillRect(-w / 2, -h / 2, w * (1 - o * .9) + 2, h);
  ctx.restore();
}

// —— 档案柜：碑林长出，卡飞入；点碑卡片圆弧摆开 ——
function cardAt(ctx, x, y, rot, a = 1, big = false) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a; const w = big ? 34 : 18, h = big ? 46 : 24; ctx.fillStyle = BONE; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.strokeStyle = '#6a5a3a'; ctx.lineWidth = 1; ctx.strokeRect(-w / 2, -h / 2, w, h); if (big) { ctx.strokeStyle = '#9a8a6a'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-w / 2 + 5, -h / 2 + 12 + i * 8); ctx.lineTo(w / 2 - 5, -h / 2 + 12 + i * 8); ctx.stroke(); } } ctx.restore(); ctx.globalAlpha = 1; }
function renderArchive(ctx, t, short, fan) {
  const shake = (!short && t < .3) ? { x: Math.sin(t * 80) * 3 * (1 - t / .3), y: 0 } : { x: 0, y: 0 };
  background(ctx, t, shake);
  const counts = TOMBS.map(() => 0);
  const order = [...TOMBS.keys()].sort((a, b) => (TOMBS[b].back ? 1 : 0) - (TOMBS[a].back ? 1 : 0));
  order.forEach(i => { const tb = TOMBS[i]; const st = short ? 0 : .3 + i * .25, g = short ? 1 : easeOutBack(seg(t, st, .7)); if (g <= 0) return; ctx.save(); ctx.translate(tb.x + tb.w / 2, tb.by); ctx.rotate(tb.tilt); ctx.scale(tb.sc, tb.sc * g); ctx.translate(-tb.w / 2, 0); if (tb.back) ctx.globalAlpha = .82; ctx.fillStyle = STONE_D; tombShape(ctx, 0, -tb.h, tb.w, tb.h); ctx.fill(); ctx.strokeStyle = WOOD; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = STONE; ctx.fillRect(12, -tb.h + tb.w / 2 + 2, tb.w - 24, tb.h - tb.w / 2 - 26); const nameU = short ? 1 : seg(t, st + .5, .6); ctx.fillStyle = BONE; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText(tb.name.slice(0, Math.ceil(tb.name.length * nameU)), tb.w / 2, -tb.h + tb.w / 2 + 24); eyes(ctx, tb.w / 2, -tb.h + 18, (fan && fan.i === i) ? 1 : (short ? 0 : clamp((t - 3.2) * 4) * (t < 3.5 ? 1 : 0))); ctx.restore(); if (tb.back) { ctx.globalAlpha = .16; ctx.fillStyle = GREEN; ctx.beginPath(); ctx.ellipse(tb.x + tb.w / 2, tb.by + 2, tb.w * .8, 10, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1; } if (!short) dirt(ctx, t, st, tb.x + tb.w / 2, tb.by, 24, tb.w + 30, 20 + i); });
  const start = short ? 0 : 1.8, dur = short ? .5 : .9; let idx = 0;
  TOMBS.forEach((tb, i) => tb.cards.forEach((c, j) => { const dep = start + idx * (short ? .012 : .045), u = (t - dep) / dur; idx++; if (u > 1) { counts[i]++; return; } if (u < 0) return; const from = c.e < .5 ? { x: 80 + c.s * (W - 160), y: -20 } : (c.e < .75 ? { x: -20, y: 60 + c.s * 200 } : { x: W + 20, y: 60 + c.s * 200 }); const to = { x: tb.x + tb.w / 2, y: tb.by - tb.h * tb.sc / 2 - 10 }; const e = easeInOutSine(u); cardAt(ctx, lerp(from.x, to.x, e) + Math.sin(u * 7 + j) * 30 * (1 - u), lerp(from.y, to.y, e), (1 - u) * 6 + j, clamp((1 - u) * 5)); }));
  TOMBS.forEach((tb, i) => { const st = short ? 0 : .3 + i * .25; if (t < st + .5) return; ctx.fillStyle = BONE; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.fillText(String(counts[i]), tb.x + tb.w / 2, tb.by - tb.h * tb.sc / 2 + 14); ctx.fillStyle = '#b8b0c8'; ctx.font = '11px system-ui'; ctx.fillText('篇', tb.x + tb.w / 2, tb.by - tb.h * tb.sc / 2 + 30); });
  // 圆弧摆开
  if (fan) { const tb = TOMBS[fan.i], u = easeOutBack(clamp(fan.u)); ctx.fillStyle = `rgba(0,0,0,${.35 * clamp(fan.u)})`; ctx.fillRect(0, 0, W, H); const cx = tb.x + tb.w / 2, cy = tb.by - 40, n = tb.cards.length, spread = Math.min(1.9, .32 * n), rad = 230; tb.cards.forEach((c, j) => { const a = -Math.PI / 2 + (n === 1 ? 0 : -spread / 2 + spread * j / (n - 1)); const x = lerp(cx, cx + Math.cos(a) * rad, u), y = lerp(cy - tb.h * tb.sc / 2, cy + Math.sin(a) * rad, u); cardAt(ctx, x, y, (a + Math.PI / 2) * u, 1, true); }); ctx.fillStyle = BONE; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('点一张放大，点空处收回', cx, 60); }
  return short ? .8 : 3.5;
}
function hitTomb(x, y) { const f = TOMBS.findIndex(tb => !tb.back && x > tb.x && x < tb.x + tb.w && y > tb.by - tb.h && y < tb.by); if (f >= 0) return f; return TOMBS.findIndex(tb => tb.back && x > tb.x && x < tb.x + tb.w * tb.sc && y > tb.by - tb.h * tb.sc && y < tb.by); }

// —— 笔记本：骷髅手臂伸出，抓着本子 ——
function arm(ctx, x, baseY, rise, sway, hue, label, lift, k = 1) {
  ctx.save(); if (!lift) { ctx.beginPath(); ctx.rect(0, 0, W, GROUND); ctx.clip(); }
  ctx.translate(x, baseY + 150 * k * (1 - rise)); ctx.rotate(sway); ctx.scale(k, k);
  ctx.strokeStyle = BONE; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, -70); ctx.stroke(); // 前臂
  ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(6, -70); ctx.lineTo(0, -120); ctx.stroke(); // 上臂（肘向前）
  ctx.fillStyle = BONE; ctx.beginPath(); ctx.arc(6, -70, 7, 0, 7); ctx.fill(); // 肘
  // 手指握本
  ctx.lineWidth = 4; [[-14, -138], [-6, -146], [4, -148], [12, -142]].forEach(([fx, fy]) => { ctx.beginPath(); ctx.moveTo(0, -120); ctx.quadraticCurveTo(fx * .6, fy + 6, fx, fy); ctx.stroke(); });
  if (hue >= 0) { ctx.fillStyle = `hsl(${hue} 35% 30%)`; ctx.fillRect(-22, -176, 44, 56); ctx.strokeStyle = AMBER; ctx.lineWidth = 1.5; ctx.strokeRect(-22, -176, 44, 56); ctx.fillStyle = BONE; ctx.fillRect(-14, -164, 28, 3); ctx.fillRect(-14, -156, 20, 3); }
  else { ctx.strokeStyle = BONE; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.strokeRect(-22, -176, 44, 56); ctx.setLineDash([]); }
  ctx.fillStyle = '#b8b0c8'; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, 0, 18);
  ctx.restore();
}
function renderNotes(ctx, t, short, lift) {
  background(ctx, t, { x: 0, y: 0 });
  [...ARMS.keys()].sort((p, q) => (ARMS[q].back ? 1 : 0) - (ARMS[p].back ? 1 : 0)).forEach(i => { const a = ARMS[i];
    const st = short ? 0 : .4 + i * .45, u = short ? 1 : seg(t, st, 1.0);
    if (!short && t > st - .25 && u <= 0) { const m = seg(t, st - .25, .25); ctx.fillStyle = '#2a1f28'; ctx.beginPath(); ctx.ellipse(a.x, a.by, 40 * a.k, 10 * m, 0, Math.PI, 0); ctx.fill(); }
    if (u <= 0) return;
    const rise = easeOutBack(u), sway = a.tilt + ((u >= 1) ? Math.sin(t * 1.6 + a.j * 6) * .04 : Math.sin(t * 30) * .05 * (1 - u));
    if (a.back) ctx.globalAlpha = .8;
    arm(ctx, a.x, a.by, Math.min(rise, 1.1), sway, a.hue, a.n, false, a.k); ctx.globalAlpha = 1;
    if (a.back) { ctx.globalAlpha = .16; ctx.fillStyle = GREEN; ctx.beginPath(); ctx.ellipse(a.x, a.by + 2, 60, 9, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    if (!short) dirt(ctx, t, st, a.x, a.by, 24, 90, 40 + i);
  });
  if (lift) { const a = ARMS[lift.i], u = easeOutCubic(clamp(lift.u)); ctx.fillStyle = `rgba(0,0,0,${.5 * u})`; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.translate(lerp(a.x, W / 2, u), lerp(GROUND, GROUND + 110, u)); ctx.scale(lerp(1, 1.7, u), lerp(1, 1.7, u)); arm(ctx, 0, 0, 1.1, 0, a.hue, '', true); ctx.restore(); const o = clamp((lift.u - .7) / .4); if (o > 0) { ctx.save(); ctx.translate(W / 2, 230); ctx.fillStyle = BONE; ctx.fillRect(-150 * o, -70, 150 * o, 140); ctx.fillRect(0, -70, 150 * o, 140); ctx.strokeStyle = '#b9a98a'; ctx.strokeRect(-150 * o, -70, 300 * o, 140); ctx.restore(); } ctx.fillStyle = BONE; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('手臂把本子举到前面，翻开成对开；点空处递回', W / 2, 60); }
  return short ? .8 : 3.5;
}
function hitArm(x, y) { return ARMS.findIndex(a => Math.abs(x - a.x) < 40 * a.k && y > a.by - 190 * a.k && y < a.by + 20); }

const SEQS = { shelf: renderShelf, archive: renderArchive, notes: renderNotes };
const SNAMES = { shelf: '书架', archive: '档案柜', notes: '笔记本' };

// —— 分镜图 ——
if (q.get('board')) {
  document.querySelector('header').style.display = 'none'; document.querySelector('p.note').style.display = 'none';
  const times = [0.15, 0.9, 1.6, 2.4, 3.8], cols = times.length + 1, cw = 320, ch = 180, pad = 10, cap = 22;
  const c = document.getElementById('c'); c.width = cols * (cw + pad) + pad; c.height = 3 * (ch + cap + pad) + pad + 30; const ctx = c.getContext('2d'); c.style.maxWidth = 'none'; c.style.width = c.width + 'px';
  ctx.fillStyle = '#1a1026'; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = '#d9d2e6'; ctx.font = 'bold 15px system-ui'; ctx.fillText('进场动效分镜（灰盒，全长约 3.5 到 3.8 秒；最后一格是终态后的点击交互）', pad, 22);
  const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');
  const extra = { shelf: (o) => { renderShelf(o, 99, false); renderOpen(o, BOOKS[9], 1); }, archive: (o) => renderArchive(o, 99, false, { i: 2, u: 1 }), notes: (o) => renderNotes(o, 99, false, { i: 0, u: 1 }) };
  Object.keys(SEQS).forEach((k, row) => { times.forEach((tt, col) => { octx.clearRect(0, 0, W, H); SEQS[k](octx, tt, false); const x = pad + col * (cw + pad), y = 34 + row * (ch + cap + pad); ctx.drawImage(off, x, y, cw, ch); ctx.strokeStyle = '#4a3666'; ctx.strokeRect(x + .5, y + .5, cw, ch); ctx.fillStyle = '#b8b0c8'; ctx.font = '12px system-ui'; ctx.fillText(`${SNAMES[k]} · ${tt.toFixed(1)} 秒`, x, y + ch + 15); }); octx.clearRect(0, 0, W, H); extra[k](octx); const x = pad + times.length * (cw + pad), y = 34 + row * (ch + cap + pad); ctx.drawImage(off, x, y, cw, ch); ctx.strokeStyle = AMBER; ctx.strokeRect(x + .5, y + .5, cw, ch); ctx.fillStyle = '#b8b0c8'; ctx.font = '12px system-ui'; ctx.fillText(`${SNAMES[k]} · 点击后`, x, y + ch + 15); });
  return;
}

// —— 播放 ——
const c = document.getElementById('c'), ctx = c.getContext('2d'); const tEl = document.getElementById('t');
let seq = q.get('seq') || 'shelf', short = q.get('short') === '1', speed = 1, t0 = performance.now(), frozen = q.has('t') ? Number(q.get('t')) : null, done = false, open = null, fan = null, lift = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function restart() { t0 = performance.now(); done = false; open = null; fan = null; lift = null; }
function frame(now) {
  let t = frozen !== null ? frozen : (now - t0) / 1000 * speed; if (reduce || done) t = 99;
  if (fan) fan.u = (now - fan.t0) / 1000 / .5; if (lift) lift.u = (now - lift.t0) / 1000 / 1.1;
  ctx.clearRect(0, 0, W, H); const len = SEQS[seq](ctx, t, short, seq === 'archive' ? fan : lift); if (t >= len) done = true;
  if (open) { const u = clamp((now - open.t0) / 1000 / .9); renderOpen(ctx, open.b, u); }
  tEl.textContent = `t = ${Math.min(t, len).toFixed(2)} s / ${len} s`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.querySelectorAll('[data-seq]').forEach(b => { b.classList.toggle('on', b.dataset.seq === seq); b.onclick = () => { seq = b.dataset.seq; document.querySelectorAll('[data-seq]').forEach(x => x.classList.toggle('on', x === b)); restart(); }; });
document.getElementById('replay').onclick = restart;
document.getElementById('short').onclick = e => { short = !short; e.target.classList.toggle('on', short); restart(); };
document.getElementById('half').onclick = e => { speed = speed === 1 ? .5 : 1; e.target.classList.toggle('on', speed !== 1); restart(); };
c.addEventListener('click', ev => { const r = c.getBoundingClientRect(); const x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height; if (!done) { done = true; return; }
  if (seq === 'shelf') { if (open) { open = null; return; } const b = hitBook(x, y); if (b) open = { b, t0: performance.now() }; }
  if (seq === 'archive') { if (fan) { fan = null; return; } const i = hitTomb(x, y); if (i >= 0) fan = { i, t0: performance.now(), u: 0 }; }
  if (seq === 'notes') { if (lift) { lift = null; return; } const i = hitArm(x, y); if (i >= 0 && ARMS[i].hue >= 0) lift = { i, t0: performance.now(), u: 0 }; } });
})();
</script>
