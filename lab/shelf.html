<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2A221C">
<title>书架样机 · 邮差</title>
<!-- 这页的地址以 .html 结尾（/lab/shelf.html），相对路径本来就按 /lab/ 算，不用像 index.html 那样补 base。 -->
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  :root{color-scheme:dark;--bg:#2A221C;--ink:#F3E7D3;--ink-2:rgba(243,231,211,.72);--pane:rgba(30,23,18,.78);--line:rgba(243,231,211,.28);--on:#2A221C;--halo:rgba(0,0,0,.8);--sheet:20,15,12;--lab:rgba(24,18,14,.88)}   /* 这些颜色跟着外观换，kit.js 里的外观表会改写 */
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  /* 2026-11-13 夜里用户定：进书架只看到书架，上面下面都不放字和按钮。原来顶栏、底栏上的东西收进底下一张工具纸，平时只留一道小把手 */
  .go,.snd{appearance:none;color:var(--ink-2);font:500 14px/1 inherit;font-family:inherit;padding:9px 11px;border-radius:999px;cursor:pointer;background:var(--pane);border:1px solid var(--line);white-space:nowrap;text-decoration:none}
  .snd[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
  .seg{display:flex;padding:3px;border-radius:999px;background:var(--pane);border:1px solid var(--line)}
  .seg button{appearance:none;border:0;background:none;color:var(--ink-2);font:500 14px/1 inherit;font-family:inherit;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  /* 选中：实心底、深字、加粗，不靠颜色区分 */
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--on);font-weight:700}
  .grab{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px));width:120px;height:26px;margin-left:-60px;padding:0;appearance:none;border:0;background:none;cursor:pointer;touch-action:none;transition:opacity .2s}
  .grab i{display:block;width:40px;height:4px;margin:0 auto;border-radius:2px;background:var(--ink);opacity:.34}
  .grab.off{opacity:0;pointer-events:none}
  /* 换家具的一排记号：书架、档案架、笔记本架。不写字，现在这一件亮着、底下一个点 */
  .marks{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;touch-action:none;transition:opacity .2s}
  .marks[hidden]{display:none}
  .marks.off{opacity:0;pointer-events:none}
  .marks button{appearance:none;border:0;background:none;color:var(--ink);opacity:.42;width:46px;height:36px;padding:3px 12px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .marks button svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .marks button::after{content:"";display:block;width:4px;height:4px;border-radius:2px;margin:3px auto 0;background:currentColor;opacity:0}
  .marks button[aria-pressed="true"]{opacity:1}
  .marks button[aria-pressed="true"]::after{opacity:1}
  .veil{position:fixed;z-index:7;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
  .veil.on{opacity:1;pointer-events:auto}
  .tools{position:fixed;z-index:8;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:rgba(var(--sheet),.96);border:1px solid var(--line);border-bottom:0;transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
  .tools.on{transform:none;visibility:visible;transition:transform .25s}
  .tools .grip{width:40px;height:4px;border-radius:2px;background:var(--ink);opacity:.34;margin:0 auto}
  .hint{margin:0;font-size:13px;line-height:1.6;color:var(--ink);text-align:center}
  .hint b{font-weight:700}
  .hint small{display:block;font-size:12px;color:var(--ink-2)}
  .trow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .trow>span{flex:0 0 5.2em;font-size:12px;line-height:1.3;color:var(--ink-2)}
  /* 手指上方的小签：现在碰到的是哪一本 */
  .tip{position:fixed;left:0;top:0;max-width:min(260px,72vw);padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--on);pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .08s;will-change:transform}
  .tip.on{opacity:1}
  .tip b{display:block;font:700 15px/1.3 "Noto Serif SC","Songti SC",serif}
  .tip span{display:block;margin-top:3px;font-size:12px;line-height:1.3;opacity:.78}
  /* 按读没读放时，层板边上的小签 */
  .lab{position:fixed;left:0;top:0;padding:3px 7px 3px 6px;border-radius:4px;background:var(--lab);border:1px solid var(--line);color:var(--ink);font:700 11px/1.2 inherit;font-family:inherit;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
  .lab.on{opacity:1}
  /* 抽出来以后底下的那张纸 */
  .sheet{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(var(--sheet),.94) 60%,rgba(var(--sheet),0));text-align:center;opacity:0;transform:translateY(24px);transition:opacity .2s,transform .25s;pointer-events:none}
  .sheet.on{opacity:1;transform:none}
  .sheet.on>*{pointer-events:auto}
  .sheet h2{margin:14px 0 0;font:700 20px/1.3 "Noto Serif SC","Songti SC",serif}
  .sheet p{margin:0;font-size:13px;color:var(--ink-2)}
  .sheet .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}
  .sheet .main{appearance:none;border:0;background:var(--ink);color:var(--on);font:700 15px/1 inherit;font-family:inherit;padding:13px 22px;border-radius:12px;cursor:pointer}
  .sheet .sub{appearance:none;border:1px solid var(--line);background:var(--pane);color:var(--ink);font:500 15px/1 inherit;font-family:inherit;padding:12px 20px;border-radius:12px;cursor:pointer}
  .sheet .lnk{appearance:none;border:0;background:none;color:var(--ink-2);font:400 13px/1 inherit;font-family:inherit;padding:8px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .sheet [hidden]{display:none}
  .sheet a.main{display:inline-block;text-decoration:none}
  .sheet a.main[hidden]{display:none}
  /* 开着盒的时候这张纸只留一行字和「合上」，屏幕让给牌 */
  .sheet.slim{gap:8px;padding-top:10px}
  .sheet.slim h2{display:none}
  .trow[hidden]{display:none}
  /* 读到哪了：一条细线，填了多少就是读了多少；只靠长短和明暗，不靠颜色 */
  .prog{width:min(240px,62vw);height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .prog i{display:block;height:100%;width:0;border-radius:2px;background:var(--ink);transition:width .35s}
  .dev{position:fixed;left:8px;top:8px;font:11px/1.4 "IBM Plex Mono",monospace;color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:4px;pointer-events:none;white-space:pre}
  .nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
  @media (max-width:420px){.seg button{padding:9px 10px;font-size:13px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="书架样机：一面书墙"></canvas>
<div id="labs" aria-hidden="true"></div>
<div class="tip" id="tip" aria-hidden="true"><b></b><span></span></div>
<!-- 平时屏幕上只有书架和这一道小把手：点它或者往上划，出来一张工具纸（排法、在读的记号、本数、声音、外观、去别的样机） -->
<nav class="marks" id="marks" aria-label="换一件家具">
  <button type="button" data-f="shelf" aria-label="书架" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6" width="4" height="14"/><rect x="10" y="3.5" width="4.4" height="16.5"/><rect x="15.9" y="8" width="3.8" height="12"/></svg></button>
  <button type="button" data-f="rack" aria-label="档案架" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="1"/><path d="M4 9.5h16"/><rect x="9" y="12" width="6" height="3.6"/></svg></button>
  <button type="button" data-f="notes" aria-label="笔记本架" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="3.5" width="13.5" height="17" rx="1.5"/><path d="M8.6 3.5v17"/><rect x="11" y="7" width="5.4" height="3.6"/></svg></button>
</nav>
<button type="button" class="grab" id="grab" aria-label="工具" aria-expanded="false" aria-controls="tools"><i></i></button>
<div class="veil" id="veil"></div>
<section class="tools" id="tools" aria-label="工具">
  <div class="grip" aria-hidden="true"></div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="trow" data-only="shelf"><span>排法</span>
    <div class="seg" id="seg-arr" role="group" aria-label="排法">
      <button type="button" data-arr="topic" aria-pressed="true">按类放</button>
      <button type="button" data-arr="state" aria-pressed="false">按读没读放</button>
    </div>
  </div>
  <div class="trow" data-only="shelf"><span>在读的记号</span>
    <div class="seg" id="seg-mark" role="group" aria-label="在读的记号">
      <button type="button" data-mark="ribbon" aria-pressed="true">丝带</button>
      <button type="button" data-mark="tab" aria-pressed="false">白签</button>
    </div>
  </div>
  <div class="trow" data-only="shelf" data-demo><span>本数</span>
    <div class="seg" id="seg-n" role="group" aria-label="本数">
      <button type="button" data-n="40" aria-pressed="true">40 本</button>
      <button type="button" data-n="120" aria-pressed="false">120</button>
      <button type="button" data-n="300" aria-pressed="false">300</button>
    </div>
  </div>
  <div class="trow" data-only="rack"><span>牌背</span>
    <div class="seg" id="seg-back" role="group" aria-label="牌背">
      <button type="button" data-back="family" aria-pressed="true">跟盒子</button>
      <button type="button" data-back="tulip" aria-pressed="false">红皮</button>
      <button type="button" data-back="calf" aria-pressed="false">老皮</button>
    </div>
  </div>
  <div class="trow"><span>声音与外观</span>
    <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="声音">声音</button>
    <button type="button" class="go" id="look" aria-haspopup="menu">外观</button>
  </div>
  <!-- 单独打开这一页是样品（书是编的）；嵌在主站的 #shufang 里才是账号里真的书、牌盒、本子 -->
  <div class="trow" id="t-demo"><span>这一页是样品，书是编的</span>
    <a class="go" href="../#shufang" target="_top">进我的书房</a>
  </div>
  <div class="trow" id="t-host" hidden><span id="t-who"></span>
    <button type="button" class="go" id="b-login" hidden>登录</button>
    <button type="button" class="go" id="b-paper">换到第一版</button>
  </div>
  <div class="trow" id="t-lab"><span>别的样机</span>
    <a class="go" href="./">拆包</a>
    <a class="go" href="./door.html">进门</a>
  </div>
</section>
<!-- 抽出来以后底下的那张纸。读没读不用手标：打开读了就自己变成在读，读完自己变成读过；在别处读完的才用底下那行小字补标 -->
<section class="sheet" id="sheet" aria-live="polite">
  <h2 id="s-title"></h2>
  <p id="s-meta"></p>
  <div class="prog" id="s-prog" role="progressbar" aria-label="读到哪了" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <div class="row">
    <button type="button" class="main" id="b-read">打开读</button>
    <a class="main" id="b-go" href="./" hidden>去拆这一包</a>
    <button type="button" class="sub" id="b-back">放回去</button>
    <button type="button" class="sub" id="b-close" hidden>合上</button>
  </div>
  <div class="row">
    <button type="button" class="lnk" id="b-done">在别处读完了</button>
    <button type="button" class="lnk" id="b-todo">当作没读过</button>
  </div>
</section>
<script type="module">import("./shelf.js");</script>
</body>
</html>
