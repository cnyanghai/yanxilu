<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2A221C">
<title>书架样机 · 邮差</title>
<!-- 这页的地址以 .html 结尾（/lab/shelf.html），相对路径本来就按 /lab/ 算，不用像 index.html 那样补 base。 -->
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  :root{color-scheme:dark;--ink:#F3E7D3;--ink-2:rgba(243,231,211,.72);--pane:rgba(30,23,18,.78);--line:rgba(243,231,211,.28)}
  html,body{height:100%;margin:0;background:#2A221C;overflow:hidden;overscroll-behavior:none}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;pointer-events:none}
  .bar>*{pointer-events:auto}
  .bar h1{margin:0 auto 0 0;font:700 15px/1 "Noto Serif SC","Songti SC",serif;letter-spacing:.08em;white-space:nowrap}
  .bar h1 small{display:block;margin-top:5px;font:400 11px/1 "Noto Sans SC",sans-serif;letter-spacing:0;color:var(--ink-2)}
  .go,.snd{appearance:none;color:var(--ink-2);font:500 14px/1 inherit;font-family:inherit;padding:9px 11px;border-radius:999px;cursor:pointer;background:var(--pane);border:1px solid var(--line);white-space:nowrap;text-decoration:none}
  .snd[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
  .seg{display:flex;padding:3px;border-radius:999px;background:var(--pane);border:1px solid var(--line)}
  .seg button{appearance:none;border:0;background:none;color:var(--ink-2);font:500 14px/1 inherit;font-family:inherit;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  /* 选中：实心底、深字、加粗，不靠颜色区分 */
  .seg button[aria-pressed="true"]{background:var(--ink);color:#2A221C;font-weight:700}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;text-align:center;transition:opacity .2s,transform .25s}
  .foot.off{opacity:0;transform:translateY(12px)}
  .foot.off *{pointer-events:none!important}
  .hint{margin:0;font-size:13px;line-height:1.55;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8);min-height:40px}
  .hint b{font-weight:700}
  .ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .ctl>*{pointer-events:auto}
  /* 手指上方的小签：现在碰到的是哪一本 */
  .tip{position:fixed;left:0;top:0;max-width:min(260px,72vw);padding:8px 12px;border-radius:10px;background:var(--ink);color:#2A221C;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .08s;will-change:transform}
  .tip.on{opacity:1}
  .tip b{display:block;font:700 15px/1.3 "Noto Serif SC","Songti SC",serif}
  .tip span{display:block;margin-top:3px;font-size:12px;line-height:1.3;opacity:.78}
  /* 按读没读放时，层板边上的小签 */
  .lab{position:fixed;left:0;top:0;padding:3px 7px 3px 6px;border-radius:4px;background:rgba(24,18,14,.86);border:1px solid var(--line);color:var(--ink);font:700 11px/1.2 inherit;font-family:inherit;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
  .lab.on{opacity:1}
  /* 抽出来以后底下的那张纸 */
  .sheet{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(20,15,12,.94) 60%,rgba(20,15,12,0));text-align:center;opacity:0;transform:translateY(24px);transition:opacity .2s,transform .25s;pointer-events:none}
  .sheet.on{opacity:1;transform:none}
  .sheet.on>*{pointer-events:auto}
  .sheet h2{margin:14px 0 0;font:700 20px/1.3 "Noto Serif SC","Songti SC",serif}
  .sheet p{margin:0;font-size:13px;color:var(--ink-2)}
  .sheet .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}
  .sheet .main{appearance:none;border:0;background:var(--ink);color:#2A221C;font:700 15px/1 inherit;font-family:inherit;padding:13px 22px;border-radius:12px;cursor:pointer}
  .dev{position:fixed;left:8px;top:64px;font:11px/1.4 "IBM Plex Mono",monospace;color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:4px;pointer-events:none;white-space:pre}
  .nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
  @media (max-width:420px){.bar h1 small{display:none}.seg button{padding:9px 10px;font-size:13px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="书架样机：一面书墙"></canvas>
<header class="bar">
  <h1>书架样机<small>灰盒：只看手感，不看外观</small></h1>
  <a class="go" href="./">拆包</a>
  <a class="go" href="./door.html">进门</a>
  <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="声音">声音</button>
</header>
<div id="labs" aria-hidden="true"></div>
<div class="tip" id="tip" aria-hidden="true"><b></b><span></span></div>
<footer class="foot" id="foot">
  <p class="hint" id="hint" aria-live="polite">正在上架…</p>
  <div class="ctl">
    <div class="seg" id="seg-arr" role="group" aria-label="排法">
      <button type="button" data-arr="topic" aria-pressed="true">按类放</button>
      <button type="button" data-arr="state" aria-pressed="false">按读没读放</button>
    </div>
    <div class="seg" id="seg-n" role="group" aria-label="本数">
      <button type="button" data-n="40" aria-pressed="false">40 本</button>
      <button type="button" data-n="120" aria-pressed="true">120</button>
      <button type="button" data-n="300" aria-pressed="false">300</button>
    </div>
  </div>
</footer>
<section class="sheet" id="sheet" aria-live="polite">
  <h2 id="s-title"></h2>
  <p id="s-meta"></p>
  <div class="row">
    <div class="seg" id="seg-st" role="group" aria-label="读到哪了">
      <button type="button" data-st="todo" aria-pressed="false">没读</button>
      <button type="button" data-st="doing" aria-pressed="false">在读</button>
      <button type="button" data-st="done" aria-pressed="false">读过</button>
    </div>
    <button type="button" class="main" id="b-back">放回去</button>
  </div>
  <p>左右拖动转着看，点空白处也能放回去</p>
</section>
<script type="module">import("./shelf.js");</script>
</body>
</html>
