<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2A221C">
<title>进门样机 · 邮差</title>
<!-- 这页的地址以 .html 结尾（/lab/door.html），相对路径本来就按 /lab/ 算，不用像 index.html 那样补 base。 -->
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  :root{color-scheme:dark;--bg:#2A221C;--ink:#F3E7D3;--ink-2:rgba(243,231,211,.72);--pane:rgba(30,23,18,.78);--line:rgba(243,231,211,.28);--on:#2A221C;--halo:rgba(0,0,0,.8);--sheet:20,15,12;--lab:rgba(24,18,14,.88)}   /* 这些颜色跟着外观换，kit.js 里的外观表会改写 */
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;pointer-events:none}
  .bar>*{pointer-events:auto}
  .bar h1{margin:0 auto 0 0;font:700 15px/1 "Noto Serif SC","Songti SC",serif;letter-spacing:.08em;white-space:nowrap}
  .bar h1 small{display:block;margin-top:5px;font:400 11px/1 "Noto Sans SC",sans-serif;letter-spacing:0;color:var(--ink-2)}
  .go,.snd,.mini{appearance:none;color:var(--ink-2);font:500 14px/1 inherit;font-family:inherit;padding:9px 11px;border-radius:999px;cursor:pointer;background:var(--pane);border:1px solid var(--line);white-space:nowrap;text-decoration:none}
  .snd[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
  /* 顶上的门牌：这是谁的书房、他自己写的一句话 */
  .owner{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));padding:0 16px;text-align:center;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .3s}
  .owner.on{opacity:1;transform:none}
  .owner b{display:block;font:700 19px/1.25 "Noto Serif SC","Songti SC",serif;letter-spacing:.04em}
  .owner span{display:block;margin-top:4px;font-size:13px;line-height:1.4;color:var(--ink-2)}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;text-align:center}
  .hint{margin:0;font-size:13px;line-height:1.55;color:var(--ink);text-shadow:0 1px 6px var(--halo);min-height:20px}
  .hint b{font-weight:700}
  .ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .ctl>*,.bag{pointer-events:auto}
  /* 邮包：带走的东西落在这里 */
  .bag{position:relative;appearance:none;border:1.5px solid var(--ink);background:var(--pane);color:var(--ink);font:700 15px/1 inherit;font-family:inherit;padding:13px 26px;border-radius:14px;cursor:pointer;min-width:190px;transition:transform .12s}
  .bag small{font:400 13px/1 inherit;font-family:inherit;margin-left:8px;color:var(--ink-2)}
  .bag.full{background:var(--ink);color:var(--on)}
  .bag.full small{color:var(--on);opacity:.75}
  .bag.aim{transform:scale(1.07)}
  .bag.bump{animation:bump .42s cubic-bezier(.2,1.6,.4,1)}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.2) translateY(4px)}100%{transform:scale(1)}}
  .plus{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font:700 18px/1 "IBM Plex Mono",monospace;color:var(--ink);text-shadow:0 2px 8px var(--halo);pointer-events:none;animation:plus .9s ease-out forwards}
  @keyframes plus{0%{opacity:0;transform:translate(-50%,-60%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
  .tip{position:fixed;left:0;top:0;max-width:min(260px,72vw);padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--on);pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .08s;will-change:transform}
  .tip.on{opacity:1}
  .tip b{display:block;font:700 15px/1.3 "Noto Serif SC","Songti SC",serif}
  .tip span{display:block;margin-top:3px;font-size:12px;line-height:1.3;opacity:.78}
  /* 层板边上的签：这一排是什么、多少本、读过多少；点它也能带走 */
  .lab{position:fixed;left:0;top:0;appearance:none;display:flex;align-items:center;gap:6px;padding:4px 5px 4px 8px;border-radius:6px;background:var(--lab);border:1px solid var(--line);color:var(--ink);font:400 12px/1.2 inherit;font-family:inherit;white-space:nowrap;cursor:pointer;opacity:0;transition:opacity .18s;will-change:transform}
  .lab.on{opacity:1}
  .lab b{font:700 13px/1.2 "Noto Serif SC","Songti SC",serif}
  .lab i{font-style:normal;font-weight:700;padding:3px 7px;border-radius:4px;background:var(--ink);color:var(--on)}
  .lab.taken i,.lab.plain i{display:none}
  .lab.taken{opacity:.75}
  .lab.plain{cursor:default;padding-right:8px}
  /* 邮包里有什么 */
  .sheet{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(var(--sheet),.96);border-top:1px solid var(--line);text-align:center;opacity:0;transform:translateY(100%);transition:opacity .2s,transform .25s;pointer-events:none}
  .sheet.on{opacity:1;transform:none;pointer-events:auto}
  .sheet h2{margin:0;font:700 18px/1.3 "Noto Serif SC","Songti SC",serif}
  .sheet ul{margin:0;padding:0;list-style:none;font-size:14px;line-height:1.9}
  .sheet p{margin:0;max-width:30em;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .sheet .row{display:flex;gap:10px}
  .sheet .main{appearance:none;border:0;background:var(--ink);color:var(--on);font:700 15px/1 inherit;font-family:inherit;padding:13px 22px;border-radius:12px;cursor:pointer}
  .dev{position:fixed;left:8px;top:110px;font:11px/1.4 "IBM Plex Mono",monospace;color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:4px;pointer-events:none;white-space:pre}
  .nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
  @media (max-width:420px){.bar h1 small{display:none}.mini{font-size:13px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="进门样机：别人的书房"></canvas>
<header class="bar">
  <h1>进门样机<small>灰盒：只看手感，不看外观</small></h1>
  <a class="go" href="./">拆包</a>
  <a class="go" href="./shelf.html">书架</a>
  <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="声音">声音</button>
  <button type="button" class="go" id="look" aria-haspopup="menu">外观</button>
</header>
<div class="owner" id="owner" aria-live="polite"><b></b><span></span></div>
<div id="labs"></div>
<div class="tip" id="tip" aria-hidden="true"><b></b><span></span></div>
<footer class="foot" id="foot">
  <p class="hint" id="hint" aria-live="polite">到了…</p>
  <button type="button" class="bag" id="bag">邮包<small id="bag-n">空的</small></button>
  <div class="ctl">
    <button type="button" class="mini" id="b-again">再进一次</button>
  </div>
</footer>
<section class="sheet" id="sheet">
  <h2>邮包里</h2>
  <ul id="bag-list"></ul>
  <p>正式版里，带走的一排会作为新的一层放进你自己的书架，到你手里都是没读的样子。带走的是书单和顺序，不是书的文件。</p>
  <div class="row">
    <button type="button" class="mini" id="b-reset">倒回去重来</button>
    <button type="button" class="main" id="b-close">关上</button>
  </div>
</section>
<script type="module">import("./door.js");</script>
</body>
</html>
