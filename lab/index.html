<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2A221C">
<title>拆包样机 · 邮差</title>
<!-- 服务器上这页的地址是 /lab（没有尾斜杠，带斜杠会被转回来），相对路径会解析到根上去；补一个 base，让 pack.js、../vendor 都按 /lab/ 算。
     GitHub Pages 上地址以 / 结尾，这段什么也不做。 -->
<script>(function(){var p=location.pathname;if(!/\/$/.test(p)&&!/\.html?$/.test(p))document.write('<base href="'+p.replace(/[^\w\-\/.~%]/g,'')+'/">');})();</script>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  :root{color-scheme:dark;--ink:#F3E7D3;--ink-2:rgba(243,231,211,.72);--pane:rgba(30,23,18,.72);--line:rgba(243,231,211,.28)}
  html,body{height:100%;margin:0;background:#2A221C;overflow:hidden;overscroll-behavior:none}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;pointer-events:none}
  .bar>*{pointer-events:auto}
  .bar h1{margin:0;font:700 15px/1 "Noto Serif SC",serif;letter-spacing:.08em;white-space:nowrap}
  .bar h1 small{display:block;margin-top:5px;font:400 11px/1 "Noto Sans SC",sans-serif;letter-spacing:0;color:var(--ink-2)}
  .go,.snd{appearance:none;color:var(--ink-2);font:500 14px/1 inherit;font-family:inherit;padding:9px 12px;border-radius:999px;cursor:pointer;background:var(--pane);border:1px solid var(--line);white-space:nowrap;text-decoration:none}
  .go{margin-left:auto}
  .snd[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;text-align:center}
  .hint{margin:0;font-size:14px;line-height:1.5;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.7);min-height:21px;transition:opacity .25s}
  .acts{display:flex;gap:10px;min-height:44px}
  .acts button{pointer-events:auto;appearance:none;border:1px solid var(--line);background:var(--pane);color:var(--ink);font:700 15px/1 inherit;font-family:inherit;padding:14px 22px;border-radius:12px;cursor:pointer}
  .acts button.main{background:var(--ink);color:#2A221C;border-color:transparent}
  .acts button[hidden]{display:none}
  .dev{position:fixed;left:8px;bottom:8px;font:11px/1.4 "IBM Plex Mono",monospace;color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:4px;pointer-events:none;white-space:pre}
  .nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
  @media (max-width:420px){.bar h1 small{display:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="拆包样机：一包没拆的牌"></canvas>
<header class="bar">
  <h1>拆包样机<small>灰盒：只看手感，不看外观</small></h1>
  <a class="go" href="./shelf.html">书架样机</a>
  <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="声音">声音</button>
</header>
<footer class="foot">
  <p class="hint" id="hint" aria-live="polite">正在送来…</p>
  <div class="acts">
    <button type="button" id="b-all" hidden>全部翻开</button>
    <button type="button" id="b-take" class="main" hidden>收下</button>
  </div>
</footer>
<!-- 用 import() 而不是 src：浏览器的预读不会抢在上面那个 base 之前去根上找 pack.js -->
<script type="module">import("./pack.js");</script>
</body>
</html>
